<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health declaration &amp; release</title>
<meta name="theme-color" content="#faf7f4">
<meta name="robots" content="noindex">
<style>/*__STYLE__*/
.head{ position:relative; text-align:center; padding:24px 12px 6px; }
.head h1{ font-size:1.22rem; margin-bottom:4px; }
.q{ padding:13px 0; border-bottom:1px solid var(--line); }
.q:last-child{ border-bottom:none; }
.q .qt{ font-size:.93rem; margin-bottom:9px; }
.yn{ display:flex; gap:8px; }
.yn label{
  flex:1; text-align:center; padding:11px; border:1px solid var(--line);
  border-radius:11px; font-weight:600; margin:0; color:var(--ink); font-size:.92rem;
}
.yn input{ position:absolute; opacity:0; width:0; height:0; }
.yn label.on-yes{ background:var(--warn-soft); border-color:#e0b98f; color:var(--warn); }
.yn label.on-no{ background:var(--ok-soft); border-color:#a9cbba; color:var(--ok); }
.q.err .yn label{ border-color:var(--bad); }
.legal{ font-size:.86rem; line-height:1.62; color:#453b36; }
.legal ol,.legal ul{ padding-inline-start:20px; margin:6px 0; }
.legal li{ margin-bottom:7px; }
.agree{ display:flex; gap:10px; align-items:flex-start; margin-top:12px;
        padding:12px; border-radius:12px; background:#faf7f4; }
.agree.err{ background:var(--bad-soft); }
.agree input{ margin-top:2px; flex:0 0 auto; }
/* התיבה היא label, ולייבל כאן מודגש. הטקסט המשפטי לידה לא אמור להיות */
.agree span{ font-size:.87rem; line-height:1.5; font-weight:500; }
.sigwrap{ position:relative; }
.sighint{ position:absolute; inset:0; display:flex; align-items:center;
          justify-content:center; color:#c2b2aa; pointer-events:none; font-size:.9rem; }
.doc table{ width:100%; border-collapse:collapse; font-size:.84rem; }
.doc td{ padding:6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
.doc td:first-child{ width:68%; padding-inline-end:8px; }
.yesmark{ color:var(--warn); font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head noprint">
    <button class="langbtn" id="lang"></button>
    <h1 id="bizname"></h1>
    <div class="muted small" id="bizsub"></div>
  </div>
  <div id="stage"></div>
</div>
<div id="toast" class="hidden"><div></div></div>
<script>

</body>
</html>
