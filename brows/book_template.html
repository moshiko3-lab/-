<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book an appointment</title>
<meta name="theme-color" content="#faf7f4">
/*__HEAD__*/
<meta name="robots" content="noindex">
<style>/*__STYLE__*/
.hero{ position:relative; text-align:center; padding:26px 12px 8px; }
.hero .mark{
  width:54px; height:54px; margin:0 auto 10px; border-radius:50%;
  background:linear-gradient(140deg,#e7cfc9,#b0736f); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; font-weight:700;
}
.hero h1{ font-size:1.3rem; margin-bottom:2px; }
.steps{ display:flex; gap:6px; justify-content:center; margin:12px 0 16px; }
.steps i{ width:26px; height:4px; border-radius:2px; background:var(--line); display:block; }
.steps i.on{ background:var(--rose); }
.svc{ display:flex; gap:10px; align-items:baseline; }
.svc b{ flex:1; }
.dur{ color:var(--muted); font-size:.82rem; }
.back{ background:none; border:none; color:var(--muted); padding:6px 0;
       min-height:38px; font-size:.85rem; }
.recap{ background:var(--rose-soft); border-radius:14px; padding:12px 14px; margin-bottom:14px; }
.recap div + div{ margin-top:3px; }
.done{ text-align:center; padding:12px 4px; }
.done .tick{
  width:60px; height:60px; margin:0 auto 12px; border-radius:50%;
  background:var(--ok-soft); color:var(--ok); display:flex; align-items:center;
  justify-content:center; font-size:1.9rem;
}
.policy{ font-size:.8rem; color:var(--muted); line-height:1.6; }
footer{ text-align:center; padding:20px 16px 40px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div id="lang"></div>
    <div class="mark" id="mark">✦</div>
    <h1 id="bizname"></h1>
    <div class="muted small" id="bizsub"></div>
  </div>
  <div class="steps"><i class="on" id="s1"></i><i id="s2"></i><i id="s3"></i></div>
  <div id="note-box"></div>
  <div id="stage"></div>
  <footer id="foot"></footer>
</div>
<div id="toast" class="hidden"><div></div></div>

</body>
</html>
