<!doctype html>
<html lang="en">
<head>
<!-- Without this the browser guesses, and opened from a file:// path it
     guesses Latin-1 once the page is big enough: every "·" between an
     instructor and a spot becomes "Â·", and the tide arrows turn to rubble. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHOKOGI Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f7f5f6; --panel:#fff; --panel-2:#faf7f8; --panel-3:#f2ecee;
  --line:#e6dfe2; --line-soft:#efe9eb;
  --text:#121011; --text-2:#5c5257; --text-3:#8d8288;
  --accent:#e04b78; --accent-hot:#f46e95; --accent-soft:#fdeaf0; --accent-ink:#fff;
  --good:#1f7a4d; --good-soft:#e4f4eb; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --crit:#b23a2c; --crit-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(18,16,17,.05),0 10px 26px -14px rgba(18,16,17,.22);
  --shadow-lg:0 20px 60px -20px rgba(18,16,17,.35);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
    --line:#332c30; --line-soft:#282225;
    --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
    --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
    --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
    --crit:#f0705c; --crit-soft:#3a1d18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
  --line:#332c30; --line-soft:#282225;
  --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
  --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
  --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
  --crit:#f0705c; --crit-soft:#3a1d18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Figtree,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}

/* shell: a fixed icon rail and a brand bar, the shape their dashboard uses */
:root{--rail:56px; --topbar:55px; --slate:#394654; --slate-2:#2f3a46;}
aside.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--slate);
  z-index:40;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:2px;
  overflow-y:auto;scrollbar-width:none}
aside.rail::-webkit-scrollbar{display:none}
aside.rail .mark{width:34px;height:34px;flex:none;margin-bottom:9px;border-radius:8px;
  background:#fff;display:grid;place-items:center;overflow:hidden}
aside.rail .mark img{width:28px;height:28px;display:block}
aside.rail button{appearance:none;border:0;background:none;cursor:pointer;color:#9fb0c0;
  width:44px;height:42px;border-radius:9px;display:grid;place-items:center;position:relative;
  transition:background .14s,color .14s}
aside.rail button svg{width:21px;height:21px;display:block;fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside.rail button:hover{background:var(--slate-2);color:#fff}
aside.rail button[aria-selected="true"]{color:#fff;background:var(--slate-2)}
aside.rail button[aria-selected="true"]::before{content:"";position:absolute;left:-9px;top:9px;
  bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-hot)}
aside.rail button:focus-visible{outline:2px solid var(--accent-hot);outline-offset:-2px}
aside.rail .tip{position:absolute;left:52px;background:var(--slate);color:#fff;font-size:11.5px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:7px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50}
aside.rail button:hover .tip{opacity:1}

header.top{position:fixed;left:var(--rail);right:0;top:0;height:var(--topbar);
  background:var(--accent-hot);z-index:35;display:flex;align-items:center;
  padding:0 18px;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
header.top .title{color:#fff;font-weight:800;font-size:15px;letter-spacing:.09em;
  text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
header.top .title small{font-weight:600;font-size:10.5px;letter-spacing:.14em;opacity:.82}
header.top .spacer{margin-left:auto}
header.top .tbtn{appearance:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);
  color:#fff;font:inherit;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:background .14s}
header.top .tbtn:hover{background:rgba(255,255,255,.24)}
header.top .tbtn.solid{background:#fff;color:var(--accent);border-color:#fff}
header.top .tbtn.solid:hover{background:rgba(255,255,255,.88)}
header.top .tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Every screen takes the whole window.
   A measure that keeps running prose readable is the wrong instrument here:
   there is no prose. These are tables -- bookings, clients, the catalogue --
   and capping them left half a laptop screen empty while the columns they
   were holding back sat squeezed against each other. The board was made an
   exception to that cap first; the exception turned out to be the rule. */
.wrap{margin-left:var(--rail);padding:calc(var(--topbar) + 18px) 22px 90px}
section[hidden]{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:26px 0 13px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.sec-h .sub{font-size:13px;color:var(--text-3)}
.sec-h .spacer{margin-left:auto}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:inherit;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 15px;border-radius:9px;cursor:pointer;transition:background .14s,border-color .14s}
.btn:hover{background:var(--panel-2);border-color:var(--text-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hot);border-color:var(--accent-hot)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:6px 11px;font-size:11px}
.btn.icon{padding:7px 10px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-top:22px}
.kpi{padding:15px 16px 16px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.03em;display:block;margin-top:7px}
.kpi .meta{font-size:12.5px;color:var(--text-2);margin-top:3px}

/* tables */
/* A scrolling box still claims its content's width when it is a grid or flex
   item, and one wide table then pushes the whole page sideways -- which on a
   phone dragged the fixed header off with it and made its buttons unpressable.
   min-width:0 is what lets the box be narrower than the table inside it. */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);min-width:0;max-width:100%}
.wrap section{min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;white-space:nowrap}
th.r,td.r{text-align:right}
thead th{background:var(--panel-2);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.strong{font-weight:700}
.muted{color:var(--text-3)}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}

/* chips */
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;line-height:1.45;white-space:nowrap}
.chip.pink{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warnc{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--crit-soft);color:var(--crit)}
/* the till: tiles on the left, the booking building up on the right */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.pos-tabs{display:flex;gap:2px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  margin-bottom:12px}
.pos-tabs button{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:10px 14px 11px;border-bottom:2px solid transparent;white-space:nowrap;
  color:var(--text-3)}
.pos-tabs button:hover{color:var(--text-2)}
.pos-tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pos-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.pos-tile{appearance:none;border:0;background:none;padding:0;cursor:pointer;font:inherit;
  text-align:left;border-radius:4px;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .08s}
.pos-tile:hover{transform:translateY(-1px)}
.pos-tile:active{transform:translateY(1px)}
.pos-tile .face{height:96px;position:relative}
.pos-tile .px{position:absolute;right:7px;top:9px;background:var(--panel);
  color:var(--text);font-size:12px;font-weight:600;padding:2px 7px;border-radius:3px;
  font-variant-numeric:tabular-nums}
.pos-tile .nm{background:var(--panel);padding:9px 10px;font-size:12.5px;font-weight:700;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cfg-head{display:flex;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:8px 8px 0 0;padding:13px 16px;
  font-size:14px;box-shadow:var(--shadow)}
.cfg-bar{background:var(--panel-3);border-left:1px solid var(--line);
  border-right:1px solid var(--line);padding:7px 16px;font-size:12px;font-weight:700;
  letter-spacing:.05em;color:var(--text-2)}
.cfg-body{background:var(--panel);border:1px solid var(--line);border-top:0;
  padding:18px 16px}
.cfg-foot{background:var(--panel);border:1px solid var(--line);border-top:0;
  border-radius:0 0 8px 8px;padding:12px 16px}
/* the client list panel: a row per client, opening onto a row per session */
.cl-row{border-bottom:1px solid var(--line-soft);padding:9px 12px 10px}
.cl-head{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:8px;
  align-items:start}
.cl-caret{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:11px;color:var(--text-3);padding:2px 0;line-height:1.2}
.cl-who{min-width:0}
.cl-name{appearance:none;border:0;background:none;padding:0;font:inherit;
  font-weight:700;font-size:13px;color:var(--text);cursor:pointer;text-align:left;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cl-name:hover{color:var(--accent)}
.cl-sub{font-size:11.5px;color:var(--text-3)}
.cl-side{display:flex;align-items:center;gap:6px}
.cl-dots{display:flex;gap:3px}
.cl-dots span{width:8px;height:8px;border-radius:50%;display:block}
.cl-date{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}
.cl-mark{font-size:11px;font-weight:800}
.cl-mark.done{color:var(--good)}
.cl-mark.open{color:var(--crit)}
.cl-count{display:flex;align-items:center;gap:4px;font-size:11.5px;
  color:var(--text-3);margin:3px 0 0 28px}
.cl-prod{display:flex;align-items:center;gap:6px;margin:9px 0 5px 28px;
  font-size:11.5px;font-weight:700;color:var(--text-2)}
.cl-prod .dot{width:9px;height:9px;border-radius:50%;flex:none}
.cl-prod .cl-when{font-weight:600;color:var(--text-3);font-size:10.5px}
.cl-slot{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto auto;
  gap:7px;align-items:center;margin:0 0 5px 28px;padding:5px 8px;
  border:1px solid var(--line-soft);border-left:3px solid var(--text-3);
  border-radius:6px;background:var(--panel-2);font-size:11.5px}
.cl-slot .tick{width:13px;height:13px;border-radius:3px;border:1px solid var(--line);
  background:var(--panel);display:flex;align-items:center;justify-content:center;
  font-size:9px;line-height:1;color:transparent}
.cl-slot .tick.on{background:var(--good);border-color:var(--good);color:#fff}
.cl-done{margin-left:auto;font-weight:600;color:var(--text-3);
  font-variant-numeric:tabular-nums}

/* the card that opens on a session block */
.sess-pop{position:fixed;z-index:70;min-width:250px;max-width:330px;
  background:var(--panel);border:1px solid var(--line);border-radius:11px;
  box-shadow:0 14px 38px rgba(0,0,0,.22);padding:10px 12px 11px;font-size:12px}
.sess-pop .sp-head{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.sess-pop .sp-title{appearance:none;border:0;background:none;padding:0;
  font:inherit;font-weight:800;font-size:12.5px;letter-spacing:.04em;
  text-transform:uppercase;color:var(--text);cursor:pointer;text-align:left;
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess-pop .sp-title:hover{color:var(--accent)}
.sess-pop .sp-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  padding-bottom:9px;border-bottom:1px solid var(--line-soft)}
.sess-pop .sp-time{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.sess-pop .sp-eye{appearance:none;border:0;background:none;padding:2px;
  color:var(--text-3);cursor:pointer;display:flex;line-height:0}
.sess-pop .sp-eye:hover{color:var(--text)}
.sess-pop .sp-eye.off{color:var(--text-3);opacity:.55}
.sess-pop .sp-cap{display:flex;align-items:center;gap:3px;color:var(--text-2);
  font-size:11.5px;font-variant-numeric:tabular-nums}
.sess-pop .sp-cap.full{color:var(--warn);font-weight:700}
.sess-pop .sp-who{width:auto;max-width:150px;margin-left:auto;padding:5px 8px;
  font:inherit;font-size:11.5px;font-weight:700;border-radius:8px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text)}
.sess-pop .sp-warn{color:var(--crit);font-size:11px;margin-top:7px}
.sess-pop .sp-none{color:var(--text-3);font-size:11.5px;margin-top:9px}
.sess-pop .sp-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;
  gap:8px;align-items:center;margin-top:7px}
.sess-pop .sp-row .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-2)}
.sess-pop .sp-row .when{color:var(--text-3);font-variant-numeric:tabular-nums}
.sess-pop .sp-row .idx{font-weight:700;font-variant-numeric:tabular-nums}
.cl-slot .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-2)}
.cl-slot .when{color:var(--text-3);font-variant-numeric:tabular-nums}
.cl-slot .idx{font-weight:700;font-variant-numeric:tabular-nums}
.cl-slot.on{opacity:.75}
.cl-x{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  font-size:14px;line-height:1;padding:0 2px}
.cl-x:hover{color:var(--crit)}
.pt-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;
  align-items:center;margin-bottom:8px}
.pt-extra{background:var(--panel-2);border-radius:9px;padding:12px 13px 2px;
  margin:-2px 0 10px}
.cfg-days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px}
.cfg-day .h{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--text-3);
  padding:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cfg-day .none{font-size:12px;color:var(--text-3);padding:6px 0}
.cfg-ses{appearance:none;width:100%;border:1px solid var(--line);background:var(--panel-2);
  border-radius:6px;padding:6px 7px;margin-bottom:6px;cursor:pointer;font:inherit;
  text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px}
.cfg-ses:hover{border-color:var(--accent)}
.cfg-ses.on{background:var(--accent-soft);border-color:var(--accent)}
.cfg-ses .who{font-size:10.5px;color:var(--text-3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;grid-column:1/3}
.cfg-ses .t{font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
.cfg-ses .n{font-size:10.5px;color:var(--text-3);text-align:right}
@media (max-width:900px){ .cfg-days{grid-template-columns:repeat(3,minmax(0,1fr))} }
.pos-side{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
  position:sticky;top:calc(var(--topbar) + 14px);max-height:calc(100vh - var(--topbar) - 40px)}
.pos-sh{display:flex;align-items:center;gap:8px;padding:13px 15px;
  border-bottom:1px solid var(--line);font-size:14px}
.pos-cust{appearance:none;width:100%;border:0;border-bottom:1px solid var(--line);
  background:none;cursor:pointer;font:inherit;padding:15px;text-align:center;
  color:var(--accent);font-weight:700;font-size:14px;display:flex;flex-direction:column;
  gap:2px;align-items:center}
.pos-cust:hover{background:var(--panel-2)}
.pos-cust .sub{font-size:12px;font-weight:500;color:var(--text-3)}
.pos-lines{flex:1;overflow-y:auto;min-height:120px}
.pos-empty{padding:40px 16px;text-align:center;color:var(--text-3);font-size:13.5px}
.pos-line{display:grid;grid-template-columns:minmax(0,1fr) auto auto 26px;gap:9px;
  align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-soft)}
.pos-line .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.pos-line .sub{font-size:11.5px;color:var(--text-3)}
.pos-line .amt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.pos-line .qty{display:inline-flex;align-items:center;border:1px solid var(--line);
  border-radius:7px;overflow:hidden}
.pos-line .qty button{appearance:none;border:0;background:var(--panel-2);cursor:pointer;
  font:inherit;font-size:14px;line-height:1;padding:4px 8px;color:var(--text-2)}
.pos-line .qty button:hover{background:var(--panel-3);color:var(--text)}
.pos-line .qty span{padding:0 9px;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums}
.pos-line .del{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:17px;line-height:1;color:var(--text-3);padding:2px 4px;border-radius:5px}
.pos-line .del:hover{color:var(--crit);background:var(--crit-soft)}
.pos-foot{border-top:1px solid var(--line);padding:13px 15px}
.pos-tot{display:flex;justify-content:space-between;font-size:13px;color:var(--text-2);
  padding:3px 0}
.pos-tot.grand{font-size:15px;font-weight:800;color:var(--text);
  border-top:1px solid var(--line-soft);margin-top:6px;padding-top:8px}
.pick-row{appearance:none;width:100%;border:1px solid var(--line-soft);background:var(--panel-2);
  border-radius:9px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font:inherit;
  text-align:left;display:flex;flex-direction:column;gap:2px}
.pick-row:hover{border-color:var(--accent)}
.pick-row .t{font-weight:600;font-size:13.5px}
.pick-row .s{font-size:12px;color:var(--text-3)}
@media (max-width:900px){
  .pos{grid-template-columns:1fr}
  .pos-side{position:static;max-height:none}
}
/* the revenue bars under the sales report: label, value, then the bar */
.panel > .row{display:grid;grid-template-columns:minmax(0,1fr) auto;
  gap:4px 14px;align-items:baseline;margin-bottom:11px}
.panel > .row .nm{font-size:13.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.panel > .row .vl{font-size:13.5px;font-weight:700;text-align:right;
  font-variant-numeric:tabular-nums}
.panel > .row .vl small{margin-left:8px;font-size:11.5px;font-weight:600;
  color:var(--text-3)}
.panel > .row .bar{grid-column:1/3;height:6px;border-radius:4px;
  background:var(--panel-3);overflow:hidden}
.panel > .row .bar i{display:block;height:100%;border-radius:4px}
.lanebtn{appearance:none;border:0;background:var(--panel);cursor:pointer;color:var(--text-3);
  padding:2px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:2px;
  font:inherit;box-shadow:0 0 0 1px var(--line-soft)}
.lanebtn:hover{color:var(--text);background:var(--panel-2)}
.btn.block{width:100%;display:block;text-align:center}
.btn.big{padding:12px 18px;font-size:13px;letter-spacing:.07em;text-transform:uppercase;
  font-weight:800}
.kebab{appearance:none;border:0;background:none;cursor:pointer;color:var(--text-3);
  padding:4px 6px;border-radius:7px;line-height:0;display:inline-flex}
.kebab:hover{background:var(--panel-3);color:var(--text)}
.rowmenu{position:fixed;z-index:70;min-width:172px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-lg);
  padding:5px;display:flex;flex-direction:column}
.rowmenu button{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:13px;text-align:left;padding:8px 11px;border-radius:7px;color:var(--text)}
.rowmenu button:hover{background:var(--panel-2)}
.rowmenu button.danger{color:var(--crit)}
.chip.critc{background:var(--crit-soft);color:var(--crit)}
.chip.neutral{background:var(--line-soft);color:var(--text-2)}

/* empty state */
.empty{padding:48px 26px;text-align:center}
.empty .ico{font-size:34px;line-height:1;margin-bottom:12px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--text-2);font-size:13.5px;max-width:430px;margin:0 auto 18px}

/* schedule */
.daybar{display:flex;gap:7px;overflow-x:auto;padding:3px 0 6px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybar button{appearance:none;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font:inherit;border-radius:10px;padding:8px 12px;min-width:60px;text-align:center;flex:none;
  transition:background .14s}
.daybar button:hover{background:var(--panel-2)}
.daybar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daybar .d{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.daybar .n{font-size:16px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.daybar .c{font-size:9.5px;opacity:.7}
/* segmented control: the view and grouping switches on the planning and the
   board. It was in the markup long before it had a look. */
.range{display:inline-flex;flex:none;border:1px solid var(--line);border-radius:9px;
  overflow:hidden;background:var(--panel)}
.range button{appearance:none;border:0;background:none;cursor:pointer;font:inherit;
  font-size:12px;font-weight:600;padding:7px 11px;color:var(--text-2);white-space:nowrap;
  border-right:1px solid var(--line);transition:background .14s,color .14s}
.range button:last-child{border-right:0}
.range button:hover{background:var(--panel-2)}
.range button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.slot{display:grid;grid-template-columns:66px 1fr auto auto;gap:13px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--text-2)}
.slot .nm{display:flex;align-items:center;gap:10px;min-width:0}
.slot .dot{width:7px;height:26px;border-radius:3px;flex:none;background:var(--accent-hot)}
.slot .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm em{font-style:normal;font-size:12px;color:var(--text-3);display:block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.card{padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.card .nm{font-weight:700;font-size:14px;line-height:1.35}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .foot{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:6px}
.card .pr{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-right:auto}
.card .pr small{font-size:11px;color:var(--text-3);font-weight:400}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,16,17,.5);z-index:50;display:grid;
  place-items:center;padding:18px;overflow-y:auto}
.scrim[hidden]{display:none}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);
  max-height:92vh;overflow-y:auto;border:1px solid var(--line-soft)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:1}
.modal-h h3{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px 18px;display:flex;gap:9px;justify-content:flex-end;
  border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--panel)}

/* forms */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:transparent}
.fld textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12px;color:var(--text-3);margin-top:4px}
.lines-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.lines-h h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin:0}
.line{display:grid;grid-template-columns:1fr 62px 92px auto;gap:8px;align-items:center;margin-bottom:8px}
.line select,.line input{font-size:13.5px;padding:8px 9px}
.tot{display:flex;align-items:baseline;gap:10px;padding:11px 13px;background:var(--panel-2);
  border-radius:9px;margin-top:10px}
.tot .lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.tot .v{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700}

.note{font-size:13px;color:var(--text-2);background:var(--panel-2);border-left:3px solid var(--accent);
  padding:12px 15px;border-radius:0 9px 9px 0;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--panel);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  z-index:70;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
/* A row of filters that will not wrap is a row that widens the page, and a
   page wider than the phone takes the fixed header off the screen with it --
   which is how the corner buttons became unpressable. */
.searchbar{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.searchbar input{flex:1 1 150px;min-width:0;max-width:100%;font:inherit;
  font-size:14px;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.searchbar select{max-width:100%}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}

@media (max-width:1000px){
  #p-board > div[style*="grid-template-columns: 1fr 230px"],
  #p-board > div[style*="1fr 230px"]{grid-template-columns:1fr!important}
}
@media (max-width:760px){
  aside.rail{left:0;right:0;top:auto;bottom:0;width:auto;height:52px;flex-direction:row;
    justify-content:flex-start;padding:0 6px;gap:0;overflow-x:auto}
  aside.rail .mark{display:none}
  aside.rail nav{flex-direction:row!important}
  aside.rail button[aria-selected="true"]::before{left:9px;right:9px;top:auto;bottom:-1px;
    width:auto;height:3px;border-radius:3px 3px 0 0}
  aside.rail .tip{display:none}
  header.top{left:0}
  .wrap{margin-left:0;padding-bottom:70px}
}
/* the day, and the hires, as rows a thumb can hit */
.dayrow{appearance:none;width:100%;border:0;border-left:4px solid var(--accent);
  background:none;font:inherit;text-align:left;cursor:pointer;
  display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;
  align-items:center;padding:11px 13px;
  border-bottom:1px solid var(--line-soft)}
.dayrow:last-child{border-bottom:0}
.dayrow:hover,.dayrow:active{background:var(--panel-2)}
.dayrow .w{display:flex;flex-direction:column;line-height:1.25}
.dayrow .w strong{font-size:14px;font-family:'IBM Plex Mono',monospace}
.dayrow .w span{font-size:10.5px;color:var(--text-3)}
.dayrow .m{min-width:0}
.dayrow .m .t{font-weight:700;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dayrow .m .s{font-size:11.5px;color:var(--text-3);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dayrow .m .p{font-size:11.5px;color:var(--text-2);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dayrow .n{flex:none}

/* the way in */
.gate{position:fixed;inset:0;z-index:200;background:var(--accent-hot);
  display:flex;align-items:center;justify-content:center;padding:22px}
/* a class that sets display beats the browser's own rule for [hidden], and an
   invisible sheet of glass over the whole app is worse than a visible one */
.gate[hidden]{display:none}
.gate-card{width:100%;max-width:340px;background:var(--panel);
  border-radius:16px;padding:26px 24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.28);
  display:flex;flex-direction:column}
.gate-mark{width:56px;height:56px;object-fit:contain;align-self:center;
  margin-bottom:10px}
.gate-card h1{font-size:17px;font-weight:800;letter-spacing:.14em;
  text-align:center;margin:0}
.gate-sub{font-size:13px;color:var(--text-3);text-align:center;margin:6px 0 18px}
.gate-card label{font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3);margin-bottom:5px}
.gate-card input{font:inherit;font-size:16px;padding:11px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  margin-bottom:14px;width:100%;box-sizing:border-box}
.gate-card input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.gate-go{appearance:none;border:0;background:var(--accent);color:var(--accent-ink);
  font:inherit;font-size:14px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:12px;border-radius:9px;cursor:pointer;
  margin-top:4px}
.gate-go:hover{filter:brightness(1.06)}
.gate-go[disabled]{opacity:.6;cursor:default}
.gate-err{font-size:12.5px;color:var(--crit);margin-top:10px;min-height:16px;
  text-align:center}
body.locked > .wrap,body.locked > header.top,body.locked > aside.rail{display:none}

@media (max-width:820px){
  /* the header has to fit, or its own buttons end up under it and nothing
     in the corner can be pressed at all */
  header.top{gap:6px;padding:0 11px}
  header.top .title{font-size:0}           /* the school's name is on the tab */
  header.top .title small{font-size:13px;margin:0;opacity:1}
  header.top .tbtn{padding:6px 10px;font-size:12px;white-space:nowrap}
  #btn-backup{display:none}                /* back office, not a counter job */
  #btn-cloud{max-width:110px;overflow:hidden;text-overflow:ellipsis}
  /* nothing may move the page sideways on a phone: a wide table scrolls
     inside its own panel, and the header stays where a thumb expects it */
  body{overflow-x:hidden}
  .sec-h{margin:18px 0 10px}
  .sec-h h2{font-size:15px}
  .kpis{grid-template-columns:1fr 1fr}
  .daybar{overflow-x:auto}
  /* the panels that were columns stack */
  .cl-row{border-radius:0}
}
@media (max-width:640px){
  .wrap{padding-left:13px;padding-right:13px}
  .top-in{padding:12px 13px 0}
  .grid2{grid-template-columns:1fr}
  .slot{grid-template-columns:58px 1fr;gap:9px}
  .slot .cap,.slot .rowbtns{grid-column:2;justify-self:start}
  .line{grid-template-columns:1fr 54px 80px auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<!-- The way in. Everything behind it stays hidden until somebody signs in,
     and once a device has signed in the session is kept, so the counter opens
     straight into the day -- including with no signal, which is the whole
     point of a till in Playa Venao. -->
<div class="gate" id="gate" hidden>
  <form class="gate-card" id="gate-form">
    <img class="gate-mark" src="data:image/png;base64,/*__LOGO__*/" alt="Shokogi">
    <h1>SHOKOGI</h1>
    <p class="gate-sub">Sign in to the school's book.</p>
    <label for="gate-email">Email</label>
    <input id="gate-email" type="email" autocomplete="username" required>
    <label for="gate-pass">Password</label>
    <input id="gate-pass" type="password" autocomplete="current-password" required>
    <button class="gate-go" id="gate-go" type="submit">Sign in</button>
    <div class="gate-err" id="gate-err" role="alert"></div>
  </form>
</div>

<aside class="rail">
  <span class="mark"><img src="data:image/png;base64,/*__LOGO__*/" alt="Shokogi"></span>
  <nav role="tablist" id="tabs" style="display:flex;flex-direction:column;gap:2px"></nav>
</aside>
<header class="top">
  <span class="title">Shokogi <small id="screen-name">Today</small></span>
  <span class="spacer"></span>
  <button class="tbtn" id="btn-cloud" title="The shared book">Offline</button>
  <button class="tbtn" id="btn-backup">Backup</button>
  <button class="tbtn solid" id="btn-newbooking">+ Booking</button>
</header>

<div class="wrap">
  <section id="p-today" role="tabpanel"></section>
  <section id="p-schedule" role="tabpanel" hidden></section>
  <section id="p-board" role="tabpanel" hidden></section>
  <section id="p-trips" role="tabpanel" hidden></section>
  <section id="p-bookings" role="tabpanel" hidden></section>
  <section id="p-clients" role="tabpanel" hidden></section>
  <section id="p-catalog" role="tabpanel" hidden></section>
  <section id="p-gear" role="tabpanel" hidden></section>
  <section id="p-crew" role="tabpanel" hidden></section>
  <section id="p-register" role="tabpanel" hidden></section>
  <section id="p-invoices" role="tabpanel" hidden></section>
  <section id="p-fees" role="tabpanel" hidden></section>
  <section id="p-reports" role="tabpanel" hidden></section>
  <section id="p-settings" role="tabpanel" hidden></section>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script id="seed" type="application/json">/*__SEED__*/</script>
<script id="people" type="application/json">/*__PEOPLE__*/</script>

<script>
(function(){
"use strict";

/* ============================ store ============================
   Everything lives in this one object, persisted to localStorage.
   When a server exists, only save()/load() change -- nothing else. */
var KEY="shokogi.manager.v1";
var BLANK={v:1,clients:[],staff:[],products:[],sessions:[],bookings:[],
  spots:[{id:"sp1",name:"Playa Venao",lat:7.4283,lon:-80.1897}],
  gear:[],gearBlocks:[],timeOff:[],feeGroups:[],promos:[],partners:[],accommodations:[],
  invoices:[],invoiceSeq:1,tides:[],docs:[],cash:[],trips:[],staffFees:{},
  pos:[],tickets:[],ticketSeq:1,archives:[],commissionGroups:[],icalFeeds:[],
  settings:{
    business:{name:"Shokogi Surf School",taxId:"",address:"",phone:"",email:"",currency:"USD"},
    methods:["Card","Cash","Online","Transfer","Other"],
    roles:["Instructor","Assistant","Photographer","Manager","Owner"],
    kinds:[{k:"lesson",l:"Lesson"},{k:"course",l:"Course / pack"},{k:"rental",l:"Rental"},
           {k:"photo",l:"Photography"},{k:"other",l:"Other"}],
    customFields:[],boardFrom:6,boardTo:20
  },
  boardCollapsed:{},
  seq:1};
var DB=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&d.v===1){
        /* a database saved before these existed must not arrive with holes */
        ["gear","gearBlocks","timeOff","feeGroups","promos","partners","accommodations",
         "clients","staff","products","sessions","bookings","spots","invoices",
         "tides","docs","cash","trips","pos","tickets","archives",
         "commissionGroups","icalFeeds"].forEach(function(k){
          if(!Array.isArray(d[k])) d[k]=[];
        });
        if(typeof d.invoiceSeq!=="number") d.invoiceSeq=1;
        if(typeof d.ticketSeq!=="number") d.ticketSeq=1;
        if(!d.staffFees || typeof d.staffFees!=="object") d.staffFees={};
        if(!d.boardCollapsed || typeof d.boardCollapsed!=="object") d.boardCollapsed={};
        return d;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(BLANK));
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ toast("Could not save. Browser storage may be full or blocked."); }
  /* this browser is still the working copy; the shared book is told after */
  try{ cloudMark(); cloudSoon(); }catch(e){}
}
function uid(p){ return p+(DB.seq++); }

/* ============================ helpers ============================ */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* These used to be constants. They now live in DB.settings so the school can
   rename or extend them without touching the code. */
function cfg(){ 
  if(!DB.settings) DB.settings=JSON.parse(JSON.stringify(BLANK.settings));
  return DB.settings;
}
function METHODS(){ return cfg().methods; }
function KINDS(){ return cfg().kinds; }
function ROLES(){ return cfg().roles; }
function CUR(){ return cfg().business.currency||"USD"; }

function iso(d){
  var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);
  return z.toISOString().slice(0,10);
}
function todayISO(){ return iso(new Date()); }
function dm(s){ var p=String(s).split("-"); return MON[+p[1]-1]+" "+(+p[2]); }
/* 28/08 -- what the client list and the slots under it are dated with */
function dmy(s){ var p=String(s).split("-"); return p[2]+"/"+p[1]; }
function dowOf(s){ return DOW[new Date(s+"T12:00:00").getDay()]; }
function money(n,d){ return (Number(n)||0).toLocaleString("en-US",
  {minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

var toastEl=document.getElementById("toast"),toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);
}

function by(id,list){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function clientName(id){ var c=by(id,DB.clients); return c?c.name:"—"; }
function staffName(id){ var s=by(id,DB.staff); return s?s.name:"Unassigned"; }
function product(id){ return by(id,DB.products); }

/* booking money */
function bookingTotal(b){
  return (b.lines||[]).reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
}
function bookingPaid(b){
  return (b.payments||[]).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
}
function bookingDue(b){ return bookingTotal(b)-bookingPaid(b); }

/* ============================ modal ============================ */
var scrim=document.getElementById("scrim"),modal=document.getElementById("modal");
/* Modals stack. A booking form opens a product picker on top of itself, and
   closing the picker has to give the booking back rather than throw it away. */
var modalStack=[];
function paintModal(entry){
  modal.textContent="";
  var h=el("div","modal-h"); h.appendChild(el("h3",null,entry.title));
  var x=el("button","btn sm icon x","Close");
  x.addEventListener("click",closeModal); h.appendChild(x);
  modal.appendChild(h);
  var b=el("div","modal-b"); b.appendChild(entry.body); modal.appendChild(b);
  var f=el("div","modal-f");
  (entry.actions||[]).forEach(function(a){
    var btn=el("button","btn "+(a.cls||""),a.label);
    btn.addEventListener("click",a.on); f.appendChild(btn);
  });
  modal.appendChild(f);
  scrim.hidden=false;
  var first=modal.querySelector("input,select,textarea,button");
  if(first) first.focus();
}
function openModal(title,bodyEl,actions){
  modalStack.push({title:title,body:bodyEl,actions:actions,
    focus:document.activeElement});
  paintModal(modalStack[modalStack.length-1]);
}
function closeModal(){
  var gone=modalStack.pop();
  if(modalStack.length){
    /* hand the one underneath back, exactly as it was */

/* Drop a menu under any element. A second click on the same anchor closes it,
   which is what a menu button is expected to do. */
function rowMenuAt(anchor,items){
  var wasMine=openMenu && openMenu.dataset.owner===String(anchor.dataset.mid);
  closeRowMenu();
  if(wasMine) return;
  anchor.dataset.mid=anchor.dataset.mid||String(Math.random());
  var m=el("div","rowmenu");
  m.dataset.owner=anchor.dataset.mid;
  items.forEach(function(it){
    if(!it) return;
    var mb=el("button",it.danger?"danger":null,it.l);
    mb.type="button";
    mb.addEventListener("click",function(ev2){
      ev2.stopPropagation(); closeRowMenu(); it.on();
    });
    m.appendChild(mb);
  });
  document.body.appendChild(m);
  var r=anchor.getBoundingClientRect();
  var top=r.bottom+4, left=r.right-172;
  if(top+m.offsetHeight>window.innerHeight-8) top=r.top-m.offsetHeight-4;
  if(left+m.offsetWidth>window.innerWidth-8) left=window.innerWidth-m.offsetWidth-8;
  m.style.top=Math.max(8,top)+"px";
  m.style.left=Math.max(8,left)+"px";
  openMenu=m;
}

/* ============================ custom fields on forms ============================
   The back office defines these; every form that can carry them renders them
   here, so a field added in settings actually shows up where it was aimed. */
function fieldsFor(scope){
  return (cfg().customFields||[]).filter(function(f){return f.applies===scope;});
}
function customInputs(scope,values){
  /* returns {nodes:[…], read:fn} so callers stay short */
  var defs=fieldsFor(scope), made=[];
  var wrap=el("div");
  defs.forEach(function(f,i){
    var key="cf"+i+"_"+f.label;
    var cur=(values||{})[f.label];
    var node;
    if(f.type==="checkbox"){
      node=input("checkbox"); node.checked=!!cur; node.style.width="auto";
    } else if(f.type==="select"){
      var opts=(f.options||"").split(",").map(function(x){return x.trim();})
        .filter(Boolean).map(function(x){return {v:x,l:x};});
      node=select([{v:"",l:"—"}].concat(opts),cur||"");
    } else {
      node=input(f.type==="number"?"number":(f.type==="date"?"date":"text"),cur||"");
    }
    wrap.appendChild(field(f.label+(f.required?" *":""),node));
    made.push({def:f,node:node});
  });
  return {
    node:wrap,
    any:defs.length>0,
    missing:function(){
      for(var i=0;i<made.length;i++){
        var m=made[i];
        if(!m.def.required) continue;
        var v=m.def.type==="checkbox"?m.node.checked:m.node.value;
        if(!v) return m.def.label;
      }
      return null;
    },
    read:function(){
      var out={};
      made.forEach(function(m){
        out[m.def.label]=m.def.type==="checkbox"?m.node.checked:m.node.value;
      });
      return out;
    }
  };
}

/* ============================ csv export ============================ */
function csvCell(v){
  var s=v==null?"":String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvText(headers,rows){
  return [headers.map(csvCell).join(",")]
    .concat(rows.map(function(r){return r.map(csvCell).join(",");})).join("\n");
}
/* ---------------------------- Excel ----------------------------
   An .xlsx is a zip of XML parts, and writing one by hand is worth it: a
   report that opens in Excel with its numbers as numbers is a report somebody
   can sum, sort and send to the accountant, and it needs no library, no
   network and no server -- all three of which this app does without.
   Entries are stored rather than deflated: a few hundred rows of a day's
   takings are small, and stored entries keep this to arithmetic. */
var CRC_T=null;
function crc32(bytes){
  if(!CRC_T){
    CRC_T=new Int32Array(256);
    for(var n=0;n<256;n++){
      var c=n;
      for(var k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      CRC_T[n]=c;
    }
  }
  var crc=-1;
  for(var i=0;i<bytes.length;i++) crc=(crc>>>8)^CRC_T[(crc^bytes[i])&0xFF];
  return (crc^-1)>>>0;
}
function utf8(str){
  var out=[],s=unescape(encodeURIComponent(String(str)));
  for(var i=0;i<s.length;i++) out.push(s.charCodeAt(i)&0xFF);
  return out;
}
function zipStore(files){
  /* files: [{name, bytes}] -> one Uint8Array holding the archive */
  var parts=[],central=[],offset=0;
  function u16(n){ return [n&0xFF,(n>>8)&0xFF]; }
  function u32(n){ return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>>24)&0xFF]; }
  files.forEach(function(f){
    var nm=utf8(f.name), crc=crc32(f.bytes), len=f.bytes.length;
    var head=[].concat([0x50,0x4B,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(len),u32(len),u16(nm.length),u16(0),nm);
    parts.push(head,f.bytes);
    central.push([].concat([0x50,0x4B,0x01,0x02],u16(20),u16(20),u16(0),u16(0),
      u16(0),u16(0),u32(crc),u32(len),u32(len),u16(nm.length),u16(0),u16(0),
      u16(0),u16(0),u32(0),u32(offset),nm));
    offset+=head.length+len;
  });
  var dir=[].concat.apply([],central);
  var end=[].concat([0x50,0x4B,0x05,0x06],u16(0),u16(0),u16(files.length),
    u16(files.length),u32(dir.length),u32(offset),u16(0));
  var all=[].concat.apply([],parts).concat(dir,end);
  return new Uint8Array(all);
}
function xmlEsc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    /* Excel refuses a file carrying control characters */
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
}
function colRef(i){
  var s="";
  i=i+1;
  while(i>0){ var m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-m)/26); }
  return s;
}
function sheetXml(headers,rows){
  var out='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetData>';
  function row(cells,r){
    var s='<row r="'+r+'">';
    cells.forEach(function(v,i){
      var ref=colRef(i)+r;
      var num = v!=null && v!=="" && typeof v!=="boolean" &&
                isFinite(v) && String(v).trim()!=="" && !/^0\d/.test(String(v));
      if(num) s+='<c r="'+ref+'"><v>'+Number(v)+'</v></c>';
      else s+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+
        xmlEsc(v)+'</t></is></c>';
    });
    return s+'</row>';
  }
  out+=row(headers,1);
  rows.forEach(function(r,i){ out+=row(r,i+2); });
  return out+'</sheetData></worksheet>';
}
function xlsxBytes(sheets){
  var names=sheets.map(function(s,i){
    /* Excel's own limits on a tab name */
    var n=String(s.name||("Sheet"+(i+1))).replace(/[\\\/\?\*\[\]:]/g,"-").slice(0,31);
    return n||("Sheet"+(i+1));
  });
  var files=[];
  files.push({name:"[Content_Types].xml",bytes:utf8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    sheets.map(function(s,i){
      return '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>';
    }).join("")+'</Types>')});
  files.push({name:"_rels/.rels",bytes:utf8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '</Relationships>')});
  files.push({name:"xl/workbook.xml",bytes:utf8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
    'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+
    names.map(function(n,i){
      return '<sheet name="'+xmlEsc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>';
    }).join("")+'</sheets></workbook>')});
  files.push({name:"xl/_rels/workbook.xml.rels",bytes:utf8(
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    sheets.map(function(s,i){
      return '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>';
    }).join("")+'</Relationships>')});
  sheets.forEach(function(s,i){
    files.push({name:"xl/worksheets/sheet"+(i+1)+".xml",
                bytes:utf8(sheetXml(s.headers||[],s.rows||[]))});
  });
  return zipStore(files);
}
/* Hand a file to the browser. On the published site this saves; inside a
   sandboxed preview the download is blocked with no error, which is why the
   text is always offered beside it rather than instead of it. */
function saveFile(name,mime,data){
  try{
    var blob=new Blob([data],{type:mime});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=name; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },800);
    return true;
  }catch(e){ return false; }
}
function exportBook(name,sheets){
  saveFile(name+".xlsx",
    "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
    xlsxBytes(sheets));
  toast(name+".xlsx");
}
function exportCsv(name,headers,rows){
  if(!rows.length){ toast("Nothing to export."); return; }
  var text=csvText(headers,rows);
  var b=el("div");
  b.appendChild(el("p",null,rows.length+" row"+(rows.length===1?"":"s")+
    " and "+headers.length+" columns."));
  var note=el("div","hint",
    "The spreadsheet opens straight in Excel or Numbers. The CSV is the same "+
    "data as text, with the mark Excel needs to read accents properly.");
  b.appendChild(note);
  /* the text stays available: a preview that blocks downloads gives no error,
     it simply does nothing, and then there has to be another way out */
  var ta=el("textarea"); ta.value=text; ta.setAttribute("aria-label","CSV data");
  ta.style.minHeight="190px"; ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11.5px"; ta.style.whiteSpace="pre";
  var more=el("details");
  var sum=el("summary",null,"…or copy it as text");
  sum.style.cssText="cursor:pointer;font-size:12.5px;color:var(--text-3);margin:10px 0 6px";
  more.appendChild(sum);
  more.appendChild(ta);
  b.appendChild(more);
  openModal("Export "+name,b,[
    {label:"Close",on:closeModal},
    {label:"CSV",on:function(){
      /* the BOM is what makes Excel read it as UTF-8 rather than guessing */
      saveFile(name+".csv","text/csv;charset=utf-8",
               new Uint8Array([0xEF,0xBB,0xBF].concat(utf8(text))));
      toast(name+".csv");
    }},
    {label:"Excel",cls:"primary",on:function(){
      exportBook(name,[{name:name.slice(0,31),headers:headers,rows:rows}]);
    }}
  ]);
}

/* ============================ the client card ============================
   Everything about one customer in one place: what they have bought, what is
   still owed, which sessions they are in, and what is on file for them. The
   edit form asks for their details; this answers "who is this person". */
function clientCard(c){
  var mine=DB.bookings.filter(function(b){return b.clientId===c.id;})
    .sort(function(a,b){return a.date<b.date?1:-1;});
  var spend=mine.reduce(function(a,b){
    return a+(b.status==="cancelled"?0:bookingTotal(b));},0);
  var owed=mine.reduce(function(a,b){return a+Math.max(0,bookingDue(b));},0);

  var b=el("div");
  var head=el("div","tot"); head.style.marginBottom="12px";
  head.appendChild(el("span","lab",[c.phone,c.email,c.country]
    .filter(Boolean).join(" · ")||"no contact details"));
  b.appendChild(head);

  var k=el("div","kpis"); k.style.marginBottom="14px";
  [{l:"Bookings",v:String(mine.length),m:mine.length?dm(mine[0].date)+" last":"none yet"},
   {l:"Lifetime spend",v:sym0()+money(spend,0),m:"cancellations excluded"},
   {l:"Outstanding",v:sym0()+money(owed,0),m:owed>0.004?"still to collect":"nothing owed"}]
  .forEach(function(it){
    var p=el("div","panel kpi");
    p.appendChild(el("div","eyebrow",it.l));
    p.appendChild(el("span","val mono",it.v));
    p.appendChild(el("div","meta",it.m));
    k.appendChild(p);
  });
  b.appendChild(k);

  /* ---- everything they have bought, line by line ---- */
  var lh=el("div","lines-h"); lh.appendChild(el("h4",null,"Products bought"));
  b.appendChild(lh);
  var lines=[];
  mine.forEach(function(bk){
    (bk.lines||[]).forEach(function(l){ lines.push({bk:bk,l:l}); });
  });
  if(!lines.length){
    b.appendChild(el("div","note","Nothing bought yet."));
  } else {
    var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
    ["Date","Product","Qty","Amount","Sessions","Booking"].forEach(function(h,i){
      tr.appendChild(el("th",(i===2||i===3)?"r":null,h));});
    th.appendChild(tr); t.appendChild(th);
    var tb=el("tbody");
    lines.forEach(function(x){
      var p=product(x.l.productId);
      var r=el("tr");
      if(x.bk.status==="cancelled") r.style.opacity=".55";
      r.appendChild(el("td",null,dm(x.bk.date)));
      var nm=el("td","strong",p?p.name:"(deleted product)");
      if(x.l.unitName){
        nm.appendChild(document.createTextNode(" "));
        nm.appendChild(el("span","chip neutral",x.l.unitName));
      }
      r.appendChild(nm);
      r.appendChild(el("td","n r",String(x.l.qty||1)));
      r.appendChild(el("td","n r strong",
        sym0()+money((Number(x.l.price)||0)*(Number(x.l.qty)||0),2)));
      var owedN=sessionsOwed(x.l);
      var sc=el("td");
      if(!owedN) sc.appendChild(el("span","muted","—"));
      else{
        var got=assignedCount(x.bk,x.l);
        sc.appendChild(el("span","chip "+(got>=owedN?"ok":"warnc"),got+" / "+owedN));
      }
      r.appendChild(sc);
      var bc=el("td");
      var link=el("button","btn sm",bookingCode(x.bk));
      link.addEventListener("click",function(){
        closeModal(); show("bookings"); posStart(x.bk);});
      bc.appendChild(link); r.appendChild(bc);
      tb.appendChild(r);
    });
    t.appendChild(tb); w.appendChild(t); b.appendChild(w);
  }

  /* ---- the sessions they are actually in ---- */
  var refs=[seatRef("client",c.id)];
  mine.forEach(function(bk){
    (bk.participants||[]).forEach(function(pp){
      if(pp.pid) refs.push(seatRef("participant",bk.id,pp.pid));
    });
  });
  var inSessions=DB.sessions.filter(function(se){
    return se.participants.some(function(r){return refs.indexOf(r)>=0;});
  }).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;});
  var sh=el("div","lines-h"); sh.appendChild(el("h4",null,"Sessions"));
  b.appendChild(sh);
  if(!inSessions.length){
    b.appendChild(el("div","note",
      "Not in any session yet. Assign them from the planning, or from the "+
      "booking that bought the lessons."));
  } else {
    var chips=el("div");
    chips.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
    inSessions.forEach(function(se){
      var ch=el("span","chip "+(se.date<todayISO()?"neutral":"pink"),
        dm(se.date)+" "+se.time+" · "+se.title+
        (staffIdsOf(se).length?(" · "+instructorNames(se)):""));
      ch.style.cursor="pointer";
      ch.addEventListener("click",function(){ closeModal(); sessionForm(se); });
      chips.appendChild(ch);
    });
    b.appendChild(chips);
  }

  /* ---- what is on file ---- */
  var docs=docsFor(c.id);
  var dh=el("div","lines-h"); dh.appendChild(el("h4",null,"Documents"));
  b.appendChild(dh);
  if(!docs.length){
    var warn=el("div","note","Nothing on file — no waiver.");
    warn.style.borderLeftColor="var(--crit)";
    b.appendChild(warn);
  } else {
    docs.forEach(function(d){
      var r=el("div","tot"); r.style.marginTop="4px";
      r.appendChild(el("span","lab",d.kind||"Document"));
      var v=el("span","v",d.expires?("expires "+dm(d.expires)):"no expiry");
      if(d.expires && d.expires<todayISO()) v.style.color="var(--crit)";
      r.appendChild(v);
      b.appendChild(r);
    });
  }
  if(c.notes) b.appendChild(el("div","note",c.notes));

  openModal(c.name,b,[
    {label:"Close",on:closeModal},
    {label:"Edit details",on:function(){ closeModal(); clientForm(c); }},
    {label:"New booking",cls:"primary",on:function(){
      closeModal();
      posStart(null);
      posBooking.clientId=c.id;
      renderBookings();
    }}
  ]);
}

    function(){clientForm(null);});
  if(!DB.clients.length){
    host.appendChild(emptyState("👤","No clients yet",
      "Add the people who book with you. Bookings and sessions link back to a client, so this is usually the first thing to fill in.",
      "Add the first client",function(){clientForm(null);}));

  }
  var sb=el("div","searchbar");

  q.addEventListener("input",function(){clientQ=q.value;renderClients();
    var n=document.querySelector("#p-clients .searchbar input"); if(n){n.focus();
      n.setSelectionRange(n.value.length,n.value.length);}});
  sb.appendChild(q);
  var xc=el("button","btn sm","Export CSV");
  xc.addEventListener("click",function(){
    exportCsv("clients",["Name","Email","Phone","Country","Bookings","Spent","Notes"],
      DB.clients.map(function(c){
        var bk=DB.bookings.filter(function(b){return b.clientId===c.id;});
        return [c.name,c.email,c.phone,c.country,bk.length,
                bk.reduce(function(a,b){return a+bookingPaid(b);},0).toFixed(2),c.notes];
      }));
  });
  sb.appendChild(xc);
  host.appendChild(sb);

  var term=clientQ.trim().toLowerCase();
  var rows=DB.clients.filter(function(c){
    if(!term) return true;
    return [c.name,c.email,c.phone,c.country].join(" ").toLowerCase().indexOf(term)>=0;
  }).sort(function(a,b){return a.name.localeCompare(b.name);});

  var w=el("div","panel tbl-wrap"),t=el("table");
  var th=el("thead"),tr=el("tr");
  ["Name","Contact","Country","Docs","Bookings","Spent",""].forEach(function(h,i){
    tr.appendChild(el("th",i>=4&&i<6?"r":null,h));
  });
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  rows.forEach(function(c){
    var bk=DB.bookings.filter(function(b){return b.clientId===c.id;});
    var spent=bk.reduce(function(a,b){return a+bookingPaid(b);},0);
    var r=el("tr");
    var nc=el("td","strong");
    var nb=el("button",null,c.name);
    nb.style.cssText="appearance:none;border:0;background:none;font:inherit;"+
      "font-weight:700;color:var(--accent);cursor:pointer;padding:0;text-align:left";
    nb.addEventListener("click",function(){clientCard(c);});
    nc.appendChild(nb);
    r.appendChild(nc);
    var contact=el("td","muted",[c.email,c.phone].filter(Boolean).join(" · ")||"—");
    r.appendChild(contact);
    r.appendChild(el("td","muted",c.country||"—"));
    var dcell=el("td");
    var ds=docsFor(c.id);
    if(!ds.length){ dcell.appendChild(el("span","chip neutral","none")); }
    else {
      var worst=ds.map(docStatus).reduce(function(a,x){
        var rank={ok:0,warnc:1,critc:2};
        return rank[x.k]>rank[a.k]?x:a;});
      dcell.appendChild(el("span","chip "+worst.k,
        ds.length+(worst.k==="ok"?"":" · "+worst.l)));
    }
    r.appendChild(dcell);
    r.appendChild(el("td","n r",String(bk.length)));

      confirmDelete("client "+c.name,function(){
        DB.clients=DB.clients.filter(function(x){return x.id!==c.id;});
        DB.docs=DB.docs.filter(function(x){return x.clientId!==c.id;});
        save(); render(); toast("Client deleted");
      });
    });
    box.appendChild(e); box.appendChild(dv); box.appendChild(d);
    act.appendChild(box); r.appendChild(act);
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t); host.appendChild(w);
  if(!rows.length) host.appendChild(el("div","note","No client matches “"+clientQ+"”."));
}


/* ============================ client documents ============================
   Waivers, insurance, medical forms. The file itself is not stored — browser
   storage is the wrong place for scans — but what matters operationally is
   whether a valid one exists and when it lapses, and that is tracked. */
var DOC_TYPES=["Waiver","Insurance","Medical","ID / passport","Licence","Other"];
function docsFor(clientId){
  return DB.docs.filter(function(d){return d.clientId===clientId;});
}
function docStatus(d){
  if(!d.expires) return {k:"ok",l:"valid"};
  var t=todayISO();
  if(d.expires<t) return {k:"critc",l:"expired"};
  var soon=iso(new Date(new Date(t+"T12:00:00").getTime()+30*864e5));
  if(d.expires<=soon) return {k:"warnc",l:"expires soon"};
  return {k:"ok",l:"valid"};
}
function docForm(clientId,existing){
  var d=existing||{clientId:clientId,type:DOC_TYPES[0],name:"",issued:todayISO(),
    expires:"",note:"",onFile:true};
  var b=el("div");
  var type=select(DOC_TYPES.map(function(x){return {v:x,l:x};}),d.type);
  var name=input("text",d.name,{placeholder:"Reference or file name"});
  var iss=input("date",d.issued), exp=input("date",d.expires);
  var onFile=input("checkbox"); onFile.checked=d.onFile!==false; onFile.style.width="auto";
  var note=input("text",d.note,{placeholder:"Optional note"});
  b.appendChild(field("Type",type));
  b.appendChild(field("Reference",name));
  var g=el("div","grid2");
  g.appendChild(field("Issued",iss)); g.appendChild(field("Expires",exp,"Blank never expires."));
  b.appendChild(g);
  b.appendChild(field("Signed copy held",onFile));
  b.appendChild(field("Note",note));
  b.appendChild(el("div","hint",
    "The document itself stays wherever you keep it. This records that it exists and when it runs out, so an expired waiver shows up before the client does."));
  openModal(existing?"Edit document":"Add document",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      if(iss.value&&exp.value&&exp.value<iss.value){
        toast("The expiry is before the issue date."); return; }
      var rec=existing||{id:uid("doc"),clientId:clientId};
      rec.type=type.value; rec.name=name.value.trim(); rec.issued=iss.value;
      rec.expires=exp.value; rec.onFile=onFile.checked; rec.note=note.value.trim();
      if(!existing) DB.docs.push(rec);
      save(); closeModal(); render(); toast("Saved");
    }}
  ]);
}
function clientDocsView(c){
  var b=el("div");
  var list=docsFor(c.id);
  var add=el("button","btn sm primary","Add document");
  add.addEventListener("click",function(){docForm(c.id,null);});
  b.appendChild(el("p","hint",list.length?(list.length+" on record for "+c.name):
    ("Nothing on record for "+c.name+".")));
  b.appendChild(add);
  if(list.length){
    var w=el("div","panel tbl-wrap"); w.style.marginTop="12px";
    var t=el("table"),th=el("thead"),tr=el("tr");
    ["Type","Reference","Issued","Expires","Status",""].forEach(function(h){
      tr.appendChild(el("th",null,h));});
    th.appendChild(tr); t.appendChild(th);
    var tb=el("tbody");
    list.slice().sort(function(a,b2){return (a.expires||"9999")<(b2.expires||"9999")?-1:1;})
      .forEach(function(d){
      var st=docStatus(d), r=el("tr");
      r.appendChild(el("td","strong",d.type));
      r.appendChild(el("td","muted",d.name||"—"));
      r.appendChild(el("td",null,d.issued?dm(d.issued):"—"));
      r.appendChild(el("td",null,d.expires?dm(d.expires):"never"));
      var sc=el("td"); sc.appendChild(el("span","chip "+st.k,st.l));
      if(!d.onFile){ sc.appendChild(document.createTextNode(" "));
        sc.appendChild(el("span","chip warnc","not held")); }
      r.appendChild(sc);
      var act=el("td"),box=el("div","rowbtns");
      var e=el("button","btn sm","Edit");
      e.addEventListener("click",function(){docForm(c.id,d);});
      var del=el("button","btn sm danger","Del");
      del.addEventListener("click",function(){
        confirmDelete(d.type+" for "+c.name,function(){
          DB.docs=DB.docs.filter(function(x){return x.id!==d.id;});
          save();render();toast("Deleted");});
      });
      box.appendChild(e); box.appendChild(del); act.appendChild(box); r.appendChild(act);
      tb.appendChild(r);
    });
    t.appendChild(tb); w.appendChild(t); b.appendChild(w);
  }
  openModal("Documents · "+c.name,b,[{label:"Close",on:closeModal}]);
}

/* ============================ crew ============================ */
/* The languages their profile offers. A school in Panama that takes Israeli
   and European guests needs to know who can teach in what. */
var LANGS=["English","Spanish","Hebrew","French","Portuguese","German","Italian"];
/* Every box on a crew member's card, ticked. */
function chipChecks(host,options,chosen,onChange){
  host.textContent="";
  if(!options.length){ host.appendChild(el("div","hint","Nothing to choose from yet.")); return; }
  options.forEach(function(o){
    var lab=el("label");
    lab.style.cssText="display:inline-flex;align-items:center;gap:6px;margin:0 12px 6px 0;"+
      "font-size:13.5px;cursor:pointer";
    var cb=input("checkbox"); cb.style.width="auto";
    cb.checked=chosen.indexOf(o)>=0;
    cb.addEventListener("change",function(){
      if(cb.checked){ if(chosen.indexOf(o)<0) chosen.push(o); }
      else { var i=chosen.indexOf(o); if(i>=0) chosen.splice(i,1); }
      if(onChange) onChange();
    });
    lab.appendChild(cb); lab.appendChild(el("span",null,o));
    host.appendChild(lab);
  });
}
/* Which activity calendars a person is cleared for. Bloowatch words the rule
   plainly: only staff carrying the activity are proposed for the session. */
function staffActivities(s){
  return Array.isArray(s&&s.activities)?s.activities:[];
}
function staffDoes(s,category){
  if(!category) return true;
  var a=staffActivities(s);
  return !a.length || a.indexOf(category)>=0;   /* nobody set = everybody */
}
/* Their staff list is hand-ordered: a position on the card puts the people you
   roster every day at the top, and everyone else falls back to alphabetical. */
function crewOrder(a,b){
  var pa=(a.pos==null||a.pos==="")?Infinity:Number(a.pos),
      pb=(b.pos==null||b.pos==="")?Infinity:Number(b.pos);
  if(pa!==pb) return pa-pb;
  return String(a.name||"").localeCompare(String(b.name||""));
}
/* Hours rostered this calendar month, the figure their staff list carries. */
function staffHoursThisMonth(id){
  var now=new Date(), pre=iso(now).slice(0,7);
  var mins=0;
  DB.sessions.forEach(function(se){
    if(se.date.slice(0,7)!==pre) return;
    if(staffIdsOf(se).indexOf(id)<0) return;
    mins+=Math.max(0,Number(se.duration)||0);
  });
  return mins;
}

      rec.birthday=bday.value||""; rec.legal=legal.value.trim();
      rec.seasonFrom=sFrom.value||""; rec.seasonTo=sTo.value||"";
      rec.pos=pos.value===""?null:Number(pos.value);
      rec.activities=acts.slice(); rec.langs=langs.slice();
      rec.onPlanning=!!onPlan.checked;
      if(!existing) DB.staff.push(rec);

}

  {v:"from_pickup",l:"From pickup"},{v:"hourly",l:"Per hour"}];

];

function productForm(existing){
  var p=existing||{name:"",kind:(KINDS()[0]?KINDS()[0].k:"lesson"),price:"",sessions:1,

    limitedStock:false,stock:"",limitedAvail:false,availMax:"",
    gearId:"",accomId:"",nights:"",nightsAtBooking:false};

  /* keep the pricing unit: it decides which tiers form the ladder, and
     dropping it here would silently re-price the rentals on the next save */
  var tiers=(p.prices||[]).map(function(x){
    return {minPax:x.minPax||1,hours:x.hours||null,price:x.price||0,
            unit:x.unit||""};});
  var weekDays=(p.weekDays||[]).slice();
  var startHours=(p.startHours||[]).slice();

  var b=el("div");

  /* --- tab strip, as their product form has --- */
  var TABS3=[{k:"info",l:"Information"},{k:"price",l:"Price"},{k:"cal",l:"Calendar"},
             {k:"online",l:"Online sale"}];
  var strip=el("div");
  strip.style.cssText="display:flex;gap:2px;border-bottom:1px solid var(--line);"+
    "margin:-4px 0 16px;overflow-x:auto";
  var panes={};
  TABS3.forEach(function(t){ panes[t.k]=el("div"); });
  function showTab(k){
    TABS3.forEach(function(t){ panes[t.k].hidden = t.k!==k; });
    [].forEach.call(strip.children,function(btn){
      var on=btn.dataset.k===k;
      btn.style.color=on?"var(--accent)":"var(--text-3)";
      btn.style.borderBottomColor=on?"var(--accent)":"transparent";
    });
  }
  TABS3.forEach(function(t){
    var btn=el("button",null,t.l);
    btn.dataset.k=t.k; btn.type="button";
    btn.style.cssText="appearance:none;border:0;background:none;cursor:pointer;font:inherit;"+
      "font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;"+
      "padding:9px 13px 11px;border-bottom:2px solid transparent;white-space:nowrap";
    btn.addEventListener("click",function(){showTab(t.k);});
    strip.appendChild(btn);
  });
  b.appendChild(strip);
  TABS3.forEach(function(t){ b.appendChild(panes[t.k]); });

  /* ---------------- information ---------------- */

  var name=input("text",p.name,{placeholder:"e.g. 3 Lesson Surf Course"});
  var ptype=select(PRODUCT_TYPES,p.ptype||"class");
  var kind=select(KINDS().map(function(k){return {v:k.k,l:k.l};}),p.kind);
  var code=input("text",p.code,{placeholder:"Product code"});
  var account=input("text",p.account,{placeholder:"Account number"});
  var position=input("number",p.position,{min:"1",step:"1",placeholder:"order in the list"});
  var desc=el("textarea"); desc.value=p.description||"";
  var shortD=input("text",p.shortDesc,{placeholder:"One line for the catalogue"});
  var longD=el("textarea"); longD.value=p.longDesc||"";

function kindLabel(k){ var L=KINDS(); for(var i=0;i<L.length;i++) if(L[i].k===k) return L[i].l; return k; }
var catFilter={q:"",type:"",kind:"",show:"active"};
function ptypeLabel(v){
  for(var i=0;i<PRODUCT_TYPES.length;i++) if(PRODUCT_TYPES[i].v===v) return PRODUCT_TYPES[i].l;
  return v||"—";
}
function renderCatalog(){
  var host=document.getElementById("p-catalog"); host.textContent="";
  var active=DB.products.filter(function(x){return !x.archived;}).length;
  var archived=DB.products.length-active;

  var ch=el("div","sec-h");
  ch.appendChild(el("h2",null,"Catalog"));
  if(DB.products.length) ch.appendChild(el("span","sub",
    active+" active"+(archived?" · "+archived+" archived":"")));
  ch.appendChild(el("span","spacer"));
  if(seedData()){
    var ib=el("button","btn","Import catalog");
    ib.addEventListener("click",importPrompt); ch.appendChild(ib);
  }
  var xb=el("button","btn","Export CSV");
  xb.addEventListener("click",function(){
    exportCsv("products",
      ["Name","Type","Activity","Code","Price","Public price","Tax","Sessions",
       "Deposit","Tiers","Online","Archived"],
      DB.products.map(function(x){
        return [x.name,ptypeLabel(x.ptype),kindLabel(x.kind),x.code||"",
          x.price,x.publicPrice===""||x.publicPrice==null?"":x.publicPrice,x.tax||0,
          x.sessionsAtBooking?"at booking":x.sessions,
          x.depositType?(x.depositType==="percent"?x.depositValue+"%":"$"+x.depositValue):"",
          (x.prices||[]).length, x.onlineSale===false?"no":"yes",
          x.archived?"yes":""];
      }));
  });
  ch.appendChild(xb);
  var nb=el("button","btn primary","New product");
  nb.addEventListener("click",function(){productForm(null);});
  ch.appendChild(nb); host.appendChild(ch);

  if(!DB.products.length){
    var e=emptyState("🗂","Nothing in the catalog yet",
      "Add the lessons, courses, rentals and extras you sell. Bookings pick from this list, and prices flow through to the day closing.",
      "Add the first product",function(){productForm(null);});
    if(seedData()){
      var imp=el("button","btn primary","Import the Shokogi catalog");
      imp.style.marginLeft="8px";
      imp.addEventListener("click",importPrompt);
      e.appendChild(imp);
    }
    host.appendChild(e);
    return;
  }

  /* filters */
  function styled(n){
    n.style.cssText="width:auto;padding:8px 10px;border-radius:9px;font:inherit;font-size:13px;"+
      "border:1px solid var(--line);background:var(--panel);color:var(--text)";
    return n;
  }
  var sb=el("div","searchbar");
  var q=input("search",catFilter.q,{placeholder:"Search name, code or description"});
  q.addEventListener("input",function(){
    catFilter.q=q.value; renderCatalog();
    var n=document.querySelector("#p-catalog .searchbar input");
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
  });
  sb.appendChild(q);
  var fType=styled(select([{v:"",l:"Any type"}].concat(
    PRODUCT_TYPES.map(function(t){return {v:t.v,l:t.l};})),catFilter.type));
  fType.addEventListener("change",function(){catFilter.type=fType.value;renderCatalog();});
  sb.appendChild(fType);
  var fKind=styled(select([{v:"",l:"Any activity"}].concat(
    KINDS().map(function(k){return {v:k.k,l:k.l};})),catFilter.kind));
  fKind.addEventListener("change",function(){catFilter.kind=fKind.value;renderCatalog();});
  sb.appendChild(fKind);
  var fShow=styled(select([{v:"active",l:"Active"},{v:"archived",l:"Archived"},
    {v:"all",l:"All"}],catFilter.show));
  fShow.addEventListener("change",function(){catFilter.show=fShow.value;renderCatalog();});
  sb.appendChild(fShow);
  host.appendChild(sb);

  var term=catFilter.q.trim().toLowerCase();
  var rows=DB.products.filter(function(x){
    if(catFilter.show==="active" && x.archived) return false;
    if(catFilter.show==="archived" && !x.archived) return false;
    if(catFilter.type && (x.ptype||"class")!==catFilter.type) return false;
    if(catFilter.kind && x.kind!==catFilter.kind) return false;
    if(!term) return true;
    return [x.name,x.code,x.description,x.shortDesc].join(" ").toLowerCase().indexOf(term)>=0;
  }).sort(function(a,b){
    var pa=a.position===""||a.position==null?9999:a.position;
    var pb=b.position===""||b.position==null?9999:b.position;
    if(pa!==pb) return pa-pb;
    return (b.price||0)-(a.price||0);
  });

  if(!rows.length){
    host.appendChild(el("div","note","Nothing matches those filters."));
    return;
  }
  if(rows.length!==DB.products.length){
    host.appendChild(el("div","note",rows.length+" of "+DB.products.length+" products."));
  }

  var grid=el("div","cards");
  rows.forEach(function(x){
    var c=el("div","panel card");
    if(x.archived) c.style.opacity=".6";
    c.appendChild(el("div","nm",x.name));

    var tags=el("div","tags");
    tags.appendChild(el("span","chip neutral",ptypeLabel(x.ptype)));
    if(x.kind) tags.appendChild(el("span","chip pink",kindLabel(x.kind)));
    /* the shop's own grouping, which their list keeps beside the calendar */
    if(x.shopCategory) tags.appendChild(el("span","chip neutral",x.shopCategory));
    if(x.sessionsAtBooking) tags.appendChild(el("span","chip neutral","sessions at booking"));
    else if(x.sessions>1) tags.appendChild(el("span","chip neutral",x.sessions+" sessions"));
    if(x.privateSession) tags.appendChild(el("span","chip neutral","private"));
    if(x.archived) tags.appendChild(el("span","chip warnc","archived"));
    if(x.onlineSale===false) tags.appendChild(el("span","chip neutral","not online"));
    c.appendChild(tags);

    var facts=[];
    var sum=priceSummary(x);
    if(sum) facts.push(sum);
    if(x.depositType&&x.depositValue) facts.push("Deposit "+(x.depositType==="percent"
      ? x.depositValue+"%" : "$"+money(x.depositValue,0)));
    if(x.tax) facts.push("Tax "+x.tax+"%");
    if(x.limitedStock&&x.stock!=="") facts.push(x.stock+" in stock");
    if((x.weekDays||[]).length) facts.push("Runs "+x.weekDays.map(function(d){
      return DOW[d];}).join(" "));
    if((x.startHours||[]).length) facts.push("Starts "+x.startHours.join(", "));
    if(x.availFrom||x.availTo) facts.push("Available "+(x.availFrom?dm(x.availFrom):"…")+
      " – "+(x.availTo?dm(x.availTo):"…"));
    if(x.meetingSpot) facts.push("Meets at "+x.meetingSpot);
    if(x.code) facts.push("Code "+x.code);
    facts.forEach(function(f){ c.appendChild(el("div","hint",f)); });

    var f=el("div","foot");
    var pr=el("div","pr","$"+money(x.price,0));
    if(x.sessions>1&&x.price&&!x.sessionsAtBooking)
      pr.appendChild(el("small"," · $"+money(x.price/x.sessions,0)+"/session"));
    f.appendChild(pr);
    var e=el("button","btn sm","Edit"); e.addEventListener("click",function(){productForm(x);});
    var d=el("button","btn sm danger","Del");
    d.addEventListener("click",function(){
      confirmDelete(x.name,function(){
        DB.products=DB.products.filter(function(y){return y.id!==x.id;});
        save(); render(); toast("Product deleted");
      });
    });
    f.appendChild(e); f.appendChild(d);
    c.appendChild(f); grid.appendChild(c);
  });
  host.appendChild(grid);
}

var schedDate=todayISO();
function staffIdsOf(s){
  /* sessions used to carry a single instructor; keep old rows working */
  if(Array.isArray(s.staffIds)) return s.staffIds;
  return s.staffId?[s.staffId]:[];
}
function instructorNames(s){
  var ids=staffIdsOf(s);
  if(!ids.length) return "Unassigned";
  return ids.map(staffName).join(", ");
}
function catColor(name){
  var k=(cfg().kinds||[]).filter(function(x){return x.l===name;})[0];
  return (k&&k.color)||"";
}
/* The second argument is either the day, as it always was, or everything an
   empty cell on the board already knows: its day, its hour and its lane. */
function sessionForm(existing,preset){
  var pre=(typeof preset==="string")?{date:preset}:(preset||{});
