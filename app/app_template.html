function bookingCode(b){
  if(b.code) return b.code;
  var A="ABCDEFGHJKLMNPQRSTUVWXYZ", n=0, src=String(b.id||"");
  for(var i=0;i<src.length;i++) n=(n*31+src.charCodeAt(i))>>>0;
  var out="";
  for(var j=0;j<5;j++){ out+=A[n%A.length]; n=Math.floor(n/A.length)+7*j+13; }
  b.code=out;
  return out;
}
/* who took it: online, or a person at the counter */

  return b.source==="online" ? "Online" : "Internal";

function bookingPax(b){
  return (b.lines||[]).reduce(function(a,l){
    var p=product(l.productId);
    var per=(p&&hasPaxTiers(p))?(Number(l.pax)||1):1;
    return a+per*(Number(l.qty)||1);
  },0);
}
function bookingStatus(b){
  if(b.status==="cancelled") return "cancelled";
  var d=bookingDue(b), paid=bookingPaid(b);
  return d<=0.004?"paid":(paid>0?"partial":"unpaid");
}

/* ============================ cancelling and refunding ============================
   A cancelled booking is not a deleted one: the money already taken has to
   stay visible, and the day it was refunded is its own event. */
function bookingRefunded(b){
  return (b.refunds||[]).reduce(function(a,r){return a+(Number(r.amount)||0);},0);
}
function bookingNet(b){ return bookingPaid(b)-bookingRefunded(b); }
function cancelBookingForm(bk){
  var paid=bookingPaid(bk), already=bookingRefunded(bk);
  var open=Math.max(0,paid-already);
  var b=el("div");
  b.appendChild(el("p",null,
    "Cancelling keeps the booking and its history. It stops counting as revenue from the day you refund."));
  var line=el("div","tot");
  line.appendChild(el("span","lab","Taken"));
  line.appendChild(el("span","v mono","$"+money(paid)));
  b.appendChild(line);
  if(already){
    var l2=el("div","tot"); l2.style.marginTop="6px";
    l2.appendChild(el("span","lab","Already refunded"));
    l2.appendChild(el("span","v mono","$"+money(already)));
    b.appendChild(l2);
  }
  var amt=input("number",open.toFixed(2),{min:"0",step:"0.01"});
  var mth=select(METHODS().map(function(m){return {v:m,l:m};}),
    (bk.payments&&bk.payments[0]&&bk.payments[0].method)||METHODS()[0]);
  var when=input("date",todayISO());
  var why=input("text","",{placeholder:"Reason (optional)"});
  b.appendChild(field("Refund amount",amt,
    open?("Up to $"+money(open)+" is still refundable."):"Nothing left to refund."));
  var g=el("div","grid2");
  g.appendChild(field("Refunded by",mth)); g.appendChild(field("Date",when));
  b.appendChild(g);
  b.appendChild(field("Reason",why));
  openModal("Cancel booking",b,[
    {label:"Back",on:closeModal},
    {label:"Cancel without refund",on:function(){
      bk.status="cancelled"; bk.cancelledOn=todayISO(); bk.cancelReason=why.value.trim();
      save(); closeModal(); render(); toast("Booking cancelled, nothing refunded");
    }},
    {label:"Refund and cancel",cls:"danger",on:function(){
      var v=Number(amt.value)||0;
      if(v>open+0.004){ toast("That is more than was taken."); return; }
      if(v>0){
        bk.refunds=bk.refunds||[];
        bk.refunds.push({amount:v,method:mth.value,date:when.value||todayISO(),
          reason:why.value.trim()});
      }
      bk.status="cancelled"; bk.cancelledOn=todayISO(); bk.cancelReason=why.value.trim();
      syncTickets();
      save(); closeModal(); render();
      toast(v>0?("Cancelled, $"+money(v,0)+" refunded"):"Booking cancelled");
    }}
  ]);
}
function reopenBooking(bk){
  delete bk.status; delete bk.cancelledOn; delete bk.cancelReason;
  save(); render(); toast("Booking reopened");
}

/* ============================ register (day closing) ============================
   A payment is money against a booking, and a booking's items each belong to a
   category. A payment is therefore split across categories in proportion to the
   booking's item values -- the same way the day report is built elsewhere. */
var regDate=todayISO();
/* ============================ the register ============================
   A till that is opened with a float in the morning and counted at night.
   Until it is opened, cash cannot move: that is the whole point of a register,
   and it is why "expected" and "counted" can be compared at all. */
var CASH_OPS=[
  {v:"payin",l:"Pay-In",dir:"in",hint:"money put into the till"},
  {v:"payout",l:"Pay-Out",dir:"out",hint:"money taken out for an expense"},
  {v:"bank2cash",l:"Bank → Cash",dir:"in",hint:"a withdrawal brought to the till"},
  {v:"cash2bank",l:"Cash → Bank",dir:"out",hint:"a deposit taken to the bank"}
];
function opOf(v){ for(var i=0;i<CASH_OPS.length;i++) if(CASH_OPS[i].v===v) return CASH_OPS[i];
                  return null; }
/* movements recorded before operation types existed only knew in/out */
function moveOp(m){ return m.op || (m.direction==="in"?"payin":"payout"); }
function moveDir(m){ var o=opOf(moveOp(m)); return o?o.dir:(m.direction||"out"); }

function posFor(dateStr){
  for(var i=0;i<DB.pos.length;i++) if(DB.pos[i].date===dateStr) return DB.pos[i];
  return null;
}
function posState(dateStr){
  var s=posFor(dateStr);
  if(!s) return "never";
  return s.closedAt?"closed":"open";
}
function posOpen(dateStr){ return posState(dateStr)==="open"; }
/* Refuse a till operation on a day whose register was never opened. Their
   wording, because it says exactly what to do about it. */
function requirePos(dateStr){
  if(posOpen(dateStr)) return true;
  toast(posState(dateStr)==="closed"
    ? "The register for "+dm(dateStr)+" is already closed."
    : "POS is closed. Please open the register to perform this action.");
  return false;
}

}

function reopenRegister(dateStr){

    function(){

      s.expected=null; s.difference=null;
      save(); render(); toast("Register reopened");
    });
}

/* ============================ tickets ============================
   Every payment and every refund leaves a numbered ticket. The tickets form a
   chain: each one carries a fingerprint of itself and of the one before it, so
   a row that is edited or removed later stops matching and the check says so.
   This is tamper-evident bookkeeping, not a certified fiscal signature -- if a
   tax office asks for certified software, this is not that. */
function fnv1a(s){
  var h=0x811c9dc5;
  for(var i=0;i<s.length;i++){
    h^=s.charCodeAt(i);
    h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0;
  }
  return ("00000000"+h.toString(16)).slice(-8);
}
function ticketBody(t){
  return [t.seq,t.date,t.time||"",t.type,(Number(t.total)||0).toFixed(2),
          (Number(t.tax)||0).toFixed(2),
          (t.methods||[]).map(function(m){return m.method+":"+(Number(m.amount)||0).toFixed(2);}).join("|"),
          t.clientName||"",t.voided?"VOID":""].join(";");
}
function ticketHash(t,prev){ return fnv1a(prev+"~"+ticketBody(t)); }
/* Prices are stored tax-inclusive, so tax is taken out of the amount rather
   than added to it, and split across the payment in proportion to the sale. */
function taxOn(bk,amount){
  var gross=0,tax=0;
  (bk.lines||[]).forEach(function(l){
    var p=product(l.productId);
    var v=(Number(l.price)||0)*(Number(l.qty)||0);
    var r=(p&&Number(p.tax))||0;
    gross+=v; tax+=v-v/(1+r/100);
  });
  if(gross<=0.004) return 0;
  return Math.round(tax*(amount/gross)*100)/100;
}
function ticketFor(id){ return by(id,DB.tickets); }
function mkTicket(bk,rec,kind){
  var amt=Math.abs(Number(rec.amount)||0);
  var date=rec.date||bk.date||todayISO();
  var paidBefore=(bk.payments||[]).reduce(function(a,p){
    return a+(p===rec?0:(Number(p.amount)||0));},0);
  var type=kind==="refund"?"refund"
    :((paidBefore+amt)<bookingTotal(bk)-0.004?"deposit":"sale");
  var s=posFor(date);
  var t={id:uid("tk"),seq:DB.ticketSeq++,date:date,
    time:rec.time||new Date().toTimeString().slice(0,5),
    registerId:s?("R"+String(s.id).replace(/\D/g,"")):"—",
    staffId:rec.staffId||(s&&s.openedBy)||"",
    type:type, bookingId:bk.id, clientName:clientName(bk.clientId),
    total:kind==="refund"?-amt:amt, tax:(kind==="refund"?-1:1)*taxOn(bk,amt),
    methods:[{method:rec.method||"Cash",amount:kind==="refund"?-amt:amt}],
    reprints:0, voided:false};
  var prev=DB.tickets.length?DB.tickets[DB.tickets.length-1].hash:"00000000";
  t.prev=prev; t.hash=ticketHash(t,prev);
  DB.tickets.push(t);
  return t.id;
}
/* A payment that is edited after the fact does not rewrite its ticket: the old
   one is voided and a fresh one issued, the way a till does it. Rewriting the
   ticket would defeat the point of keeping one. */
function syncTickets(){
  var made=0;
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      if(!(Number(p.amount)>0)) return;
      var t=p.tid?ticketFor(p.tid):null;
      if(t&&!t.voided){
        var same=Math.abs(t.total-(Number(p.amount)||0))<0.005 &&
                 (t.methods[0]||{}).method===p.method &&
                 t.date===(p.date||bk.date);
        if(same) return;
        t.voided=true; t.voidedAt=new Date().toISOString();
      }
      p.tid=mkTicket(bk,p,"pay"); made++;
    });
    (bk.refunds||[]).forEach(function(r){
      if(!(Number(r.amount)>0)) return;
      var t=r.tid?ticketFor(r.tid):null;
      if(t&&!t.voided){
        if(Math.abs(-t.total-(Number(r.amount)||0))<0.005 &&
           (t.methods[0]||{}).method===r.method && t.date===(r.date||bk.date)) return;
        t.voided=true; t.voidedAt=new Date().toISOString();
      }
      r.tid=mkTicket(bk,r,"refund"); made++;
    });
  });
  return made;
}
function ticketsBetween(from,to){
  return DB.tickets.filter(function(t){
    return (!from||t.date>=from)&&(!to||t.date<=to);
  }).sort(function(a,b){return a.seq-b.seq;});
}
/* Recompute the chain and report the first row that stopped matching. A gap in
   the numbering is reported too: a missing ticket is as telling as a changed one. */
function checkTickets(from,to){
  var rows=ticketsBetween(from,to);
  if(!rows.length) return {ok:true,checked:0,notes:["No tickets in that range."]};
  var notes=[],bad=0,prevSeq=null;
  var all=DB.tickets.slice().sort(function(a,b){return a.seq-b.seq;});
  var chain={},prev="00000000";
  all.forEach(function(t){ chain[t.id]=prev; prev=t.hash; });
  rows.forEach(function(t){
    if(ticketHash(t,chain[t.id])!==t.hash){
      bad++;
      if(notes.length<8) notes.push("Ticket #"+t.seq+" ("+dm(t.date)+") no longer matches its fingerprint.");
    }
    if(prevSeq!==null&&t.seq!==prevSeq+1&&notes.length<8)
      notes.push("Numbers jump from #"+prevSeq+" to #"+t.seq+" — "+(t.seq-prevSeq-1)+" missing.");
    prevSeq=t.seq;
  });
  return {ok:bad===0,checked:rows.length,bad:bad,notes:notes};
}
/* Two tickets for the same client, the same amount and the same method within
   a few minutes are usually one sale rung up twice. */
function checkDuplicates(dateStr){
  var rows=ticketsBetween(dateStr,dateStr).filter(function(t){return !t.voided;});
  var seen={},dups=[];
  rows.forEach(function(t){
    var k=[t.clientName,(Number(t.total)||0).toFixed(2),
           (t.methods[0]||{}).method,(t.time||"").slice(0,4)].join("|");
    if(seen[k]) dups.push([seen[k],t]); else seen[k]=t;
  });
  return {checked:rows.length,dups:dups};
}
function ticketTypeLabel(t){
  return t==="sale"?"Sale":t==="deposit"?"Deposit":t==="refund"?"Refund":t;
}

function reprintTicket(x){
  x.reprints=(x.reprints||0)+1;
  /* the reprint count is part of the ticket, so the chain has to be resealed
     from here on -- otherwise every reprint would read as tampering */
  resealFrom(x);
  save(); render();
  showTicket(x);
}
function resealFrom(x){
  var all=DB.tickets.slice().sort(function(a,b){return a.seq-b.seq;});
  var prev="00000000",hit=false;
  all.forEach(function(t){
    if(t.id===x.id) hit=true;
    if(hit){ t.prev=prev; t.hash=ticketHash(t,prev); }
    prev=t.hash;
  });
}

function closingFor(dateStr){
  var byMethod={},byKind={},total=0,count=0;
  DB.bookings.forEach(function(bk){
    var weights={},wtot=0;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId); if(!p) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ weights[p.kind]=(weights[p.kind]||0)+v; wtot+=v; }
    });
    (bk.payments||[]).forEach(function(pay){
      if((pay.date||bk.date)!==dateStr) return;
      var amt=Number(pay.amount)||0; if(!amt) return;
      total+=amt; count++;
      byMethod[pay.method]=(byMethod[pay.method]||0)+amt;
      if(wtot>0){
        for(var k in weights) byKind[k]=(byKind[k]||0)+amt*weights[k]/wtot;
      } else {
        byKind.other=(byKind.other||0)+amt;
      }
    });
    /* a refund lands on the day it was given, not the day of the sale */
    (bk.refunds||[]).forEach(function(rf){
      if((rf.date||bk.date)!==dateStr) return;
      var amt=Number(rf.amount)||0; if(!amt) return;
      total-=amt; count++;
      byMethod[rf.method]=(byMethod[rf.method]||0)-amt;
      if(wtot>0){ for(var k in weights) byKind[k]=(byKind[k]||0)-amt*weights[k]/wtot; }
      else byKind.other=(byKind.other||0)-amt;
    });
  });
  return {date:dateStr,total:total,count:count,byMethod:byMethod,byKind:byKind};
}
/* The whole day in one workbook, a sheet at a time: what it came to, how it
   was paid, what was sold, who was in the water, what went out on hire and
   what moved through the drawer. One file is what gets sent to an accountant;
   five downloads is what gets half sent. */
function dayBook(dateStr){
  var c=closingFor(dateStr);
  var L=(typeof registerLine==="function")?registerLine(dateStr):null;
  var sheets=[];

  var sum=[["Date",dateStr],["Day",dowOf(dateStr)],
           ["Takings",round2(c.total)],["Payments recorded",c.count]];
  if(L){
    sum.push(["Register",L.status],["Opened by",L.staff||""],
      ["Starting cash",round2(L.starting)],["Cash payments",round2(L.cashPayments)],
      ["Cash refunds",round2(L.cashRefunds)],["Paid in",round2(L.paidIn)],
      ["Paid out",round2(L.paidOut)],["Expected in the drawer",round2(L.expected)],
      ["Counted",L.actual==null?"":round2(L.actual)],
      ["Difference",L.difference==null?"":round2(L.difference)]);
  }
  Object.keys(c.byMethod).forEach(function(m){
    sum.push(["By method · "+m,round2(c.byMethod[m])]);});
  Object.keys(c.byKind).forEach(function(k){
    sum.push(["By activity · "+kindLabel(k),round2(c.byKind[k])]);});
  sheets.push({name:"Summary",headers:["Item","Value"],rows:sum});

  var pays=[];
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      if((p.date||bk.date)!==dateStr) return;
      pays.push([bk.ref||bk.id,clientName(bk.clientId),"Payment",p.method||"",
                 round2(p.amount),p.note||""]);
    });
    (bk.refunds||[]).forEach(function(r){
      if((r.date||bk.date)!==dateStr) return;
      pays.push([bk.ref||bk.id,clientName(bk.clientId),"Refund",r.method||"",
                 -round2(r.amount),r.reason||r.note||""]);
    });
  });
  sheets.push({name:"Payments",
    headers:["Booking","Client","Kind","Method","Amount","Note"],rows:pays});

  var sold=[];
  DB.bookings.forEach(function(bk){
    if(bk.date!==dateStr || bk.status==="cancelled") return;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId);
      sold.push([bk.ref||bk.id,clientName(bk.clientId),p?p.name:"Item",
                 p?(p.category||""):"",Number(l.qty)||0,Number(l.pax)||1,
                 round2(l.price),round2((Number(l.price)||0)*(Number(l.qty)||0))]);
    });
  });
  sheets.push({name:"Sold",headers:["Booking","Client","Product","Activity",
    "Qty","People","Unit price","Line total"],rows:sold});

  var ses=[];
  DB.sessions.filter(function(x){return x.date===dateStr;})
    .sort(function(a,b){return a.time<b.time?-1:1;})
    .forEach(function(x){
      ses.push([x.time,x.title,x.category||"",instructorNames(x),x.spot||"",
                x.duration||0,x.participants.length,x.capacity||0,
                x.participants.map(seatName).join(", ")]);
    });
  sheets.push({name:"Sessions",headers:["Time","Session","Activity","Instructor",
    "Spot","Minutes","People","Capacity","Who"],rows:ses});

  var hires=[];
  DB.bookings.forEach(function(bk){
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId);
      if(!p||!(p.gearId||p.ptype==="rental")) return;
      if((l.wanted||bk.date)!==dateStr) return;
      var d=hireDue(l,bk);
      hires.push([clientName(bk.clientId),p.name,l.unitName||"",
                  l.time||"",Number(l.hours)||0,
                  d.due.toTimeString().slice(0,5),l.returnedAt?"back":"out",
                  round2(l.price)]);
    });
  });
  sheets.push({name:"Hires",headers:["Client","Product","Board","Out at",
    "Hours","Due back","State","Price"],rows:hires});

  var moves=[];
  (DB.cash||[]).filter(function(m){return m.date===dateStr;}).forEach(function(m){
    var o=opOf(moveOp(m));
    moves.push([m.time||"",o?o.l:moveOp(m),moveDir(m)==="in"?"in":"out",
                round2(m.amount),m.reason||m.note||"",staffName(m.staffId)]);
  });
  sheets.push({name:"Drawer",headers:["Time","Operation","Direction","Amount",
    "Reason","Staff"],rows:moves});

  return sheets;
}
function round2(n){ return Math.round((Number(n)||0)*100)/100; }

/* The register's own state, above the day's numbers: opened with what, and at
   closing, counted against what the books expect. */
function registerStrip(host,dateStr,c){
  var s=posFor(dateStr), st=posState(dateStr);
  var d=drawerFor(dateStr,c.byMethod["Cash"]||0);
  var expected=(s?Number(s.starting)||0:0)+d.expected;
  var p=el("div","panel"); p.style.marginBottom="14px";
  var row=el("div"); row.style.display="flex"; row.style.alignItems="center";
  row.style.gap="14px"; row.style.flexWrap="wrap";
  var lab=el("div");
  lab.appendChild(el("div","eyebrow","Register"));
  var state=el("span","chip "+(st==="open"?"ok":st==="closed"?"":"warnc"),
    st==="open"?"Open":st==="closed"?"Closed":"Not opened");
  lab.appendChild(state);
  row.appendChild(lab);

  function stat(l,v,colour){
    var b=el("div");
    b.appendChild(el("div","eyebrow",l));
    var x=el("div","mono",v);
    x.style.fontSize="16px"; x.style.fontWeight="600";
    if(colour) x.style.color=colour;
    b.appendChild(x);
    row.appendChild(b);
  }
  if(s){
    stat("Starting cash","$"+money(s.starting,2));
    stat("Expected in register","$"+money(expected,2));
    if(st==="closed"){
      stat("Actual in register","$"+money(s.counted,2));
      var diff=Number(s.difference)||0;
      stat("Difference",(diff>0?"+":"")+"$"+money(diff,2),
        Math.abs(diff)<0.005?"var(--good)":(diff<0?"var(--crit)":"var(--warn)"));
    }
  }
  row.appendChild(el("span","spacer"));
  if(st==="never"){
    var ob=el("button","btn primary","Open register");
    ob.addEventListener("click",function(){openRegisterForm(dateStr);});
    row.appendChild(ob);
  } else if(st==="open"){
    var cb=el("button","btn primary","Close register");
    cb.addEventListener("click",function(){closeRegisterForm(dateStr,expected);});
    row.appendChild(cb);
  } else {
    var rb=el("button","btn","Reopen");
    rb.addEventListener("click",function(){reopenRegister(dateStr);});
    row.appendChild(rb);
  }
  p.appendChild(row);
  if(s&&s.openedAt){
    var meta=[];
    meta.push("Opened "+s.openedAt.slice(11,16)+(s.openedBy?" by "+staffName(s.openedBy):""));
    if(s.closedAt) meta.push("closed "+s.closedAt.slice(11,16)+(s.closedBy?" by "+staffName(s.closedBy):""));
    p.appendChild(el("div","hint",meta.join(" · ")));
  }
  if(s&&s.note) p.appendChild(el("div","hint",s.note));
  if(st==="never")
    p.appendChild(el("div","hint",
      "Cash cannot move in or out until the register is opened with its float."));
  host.appendChild(p);
}

/* ============================ invoices ============================
   An invoice is a frozen copy of a booking, not a live view of it: editing the
   booking afterwards must not silently rewrite a document already given to a
   customer. */
function invoiceFor(bookingId){
  for(var i=0;i<DB.invoices.length;i++)
    if(DB.invoices[i].bookingId===bookingId) return DB.invoices[i];
  return null;
}
function issueInvoice(bk){
  var existing=invoiceFor(bk.id);
  if(existing) return existing;
  var bz=cfg().business;
  var inv={
    id:uid("inv"),
    number:String(new Date().getFullYear())+"-"+String(DB.invoiceSeq++).padStart(4,"0"),
    bookingId:bk.id, date:todayISO(), clientId:bk.clientId,
    clientName:clientName(bk.clientId),
    business:{name:bz.name,taxId:bz.taxId,address:bz.address,phone:bz.phone,
              email:bz.email,currency:bz.currency},
    lines:(bk.lines||[]).map(function(l){
      var p=product(l.productId);
      return {name:p?p.name:"Item",qty:Number(l.qty)||0,price:Number(l.price)||0,
              tax:p&&p.tax?Number(p.tax):0};
    }),
    payments:(bk.payments||[]).map(function(x){
      return {method:x.method,amount:Number(x.amount)||0,date:x.date};}),
    notes:bk.notes||""
  };
  inv.total=inv.lines.reduce(function(a,l){return a+l.qty*l.price;},0);
  inv.paid=inv.payments.reduce(function(a,p){return a+p.amount;},0);
  DB.invoices.push(inv);
  save();
  return inv;
}

function tripForm(existing){
  var t=existing||{title:"",date:todayISO(),start:"08:00",end:"12:00",capacity:8,
    pilotId:"",spot:(DB.spots[0]||{}).name||"",notes:"",participants:[]};

  var cap=input("number",t.capacity,{min:"1",step:"1"});
  var pilot=select([{v:"",l:"Unassigned"}].concat(DB.staff.map(function(x){
    return {v:x.id,l:x.name+" · "+x.role};})),t.pilotId||"");
  var spotOpts=DB.spots.map(function(x){return {v:x.name,l:x.name};});
  var spot=select(spotOpts.length?spotOpts:[{v:"",l:"—"}],t.spot);
  var notes=el("textarea"); notes.value=t.notes||"";
  b.appendChild(field("Title",title));
  var g=el("div","grid2");

  b.appendChild(g);

  g2.appendChild(field("Departs",st)); g2.appendChild(field("Returns",en));
  b.appendChild(g2);
  b.appendChild(field("Skipper",pilot));
  b.appendChild(field("Destination",spot));
  b.appendChild(field("Notes",notes));
  openModal(existing?"Edit trip":"New trip",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      if(!title.value.trim()){toast("A title is required.");title.focus();return;}
      if(st.value&&en.value&&en.value<=st.value){
        toast("The return time is not after the departure."); return; }
      var rec=existing||{id:uid("tr"),participants:[]};
      rec.title=title.value.trim(); rec.date=date.value||todayISO();

  var when=input("date",c.date);
  var why=input("text",c.reason,{placeholder:"Float, supplier, wages, bank run…"});
  var who=select([{v:"",l:"—"}].concat(DB.staff.map(function(x){
    return {v:x.id,l:x.name};})),c.staffId||"");
  var g=el("div","grid2");

function cashOn(dateStr){
  return DB.cash.filter(function(c){return c.date===dateStr;});
}
function drawerFor(dateStr,cashTakings){
  var moves=cashOn(dateStr);
  var inn=moves.filter(function(m){return moveDir(m)==="in";})
    .reduce(function(a,m){return a+m.amount;},0);
  var out=moves.filter(function(m){return moveDir(m)==="out";})
    .reduce(function(a,m){return a+m.amount;},0);
  return {in:inn,out:out,expected:(cashTakings||0)+inn-out,moves:moves};
}


/* ============================ what the crew are owed ============================
   Fee groups say what an activity pays: by the hour, by the session, or as a
   cut of what that session sold for. This works that out from the sessions
   actually taught, so a pay run is a calculation and not a memory. */
function feeGroupFor(staffId,dateStr){
  var gid=(DB.staffFees||{})[staffId];
  if(!gid) return null;
  var g=by(gid,DB.feeGroups);
  if(!g) return null;
  if(g.from && dateStr<g.from) return null;
  if(g.to && dateStr>g.to) return null;
  return g;
}
function rateFor(group,kindCode){
  if(!group) return null;
  var rs=(group.rates||[]).filter(function(r){return r.kind===kindCode;});
  return rs.length?rs[0]:null;
}
/* what one session sold for, so a percentage rate has something to bite on */
function sessionRevenue(se){
  var refs=se.participants||[];
  if(!refs.length) return 0;
  var total=0;
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    var paid=bookingPaid(bk)-bookingRefunded(bk);
    if(paid<=0) return;
    var seats=seatsOfBooking(bk).map(function(x){return x.ref;});
    var mine=refs.filter(function(r){return seats.indexOf(r)>=0;}).length;
    if(!mine) return;
    /* spread what the booking paid across the sessions its people sit in */
    var sittings=0;
    DB.sessions.forEach(function(o){
      o.participants.forEach(function(r){ if(seats.indexOf(r)>=0) sittings++; });
    });
    if(sittings>0) total += paid*mine/sittings;
  });
  return total;
}
function feesFor(staffId,from,to){
  var rows=[],total=0;
  DB.sessions.filter(function(se){
    return se.date>=from && se.date<=to && staffIdsOf(se).indexOf(staffId)>=0;
  }).sort(function(a,b){return a.date===b.date?(a.time<b.time?-1:1):(a.date<b.date?-1:1);})
  .forEach(function(se){
    var g=feeGroupFor(staffId,se.date);
    var kindCode=(cfg().kinds.filter(function(k){return k.l===se.category;})[0]||{}).k||"";
    var r=rateFor(g,kindCode);
    var hours=(se.duration||0)/60;
    var share=staffIdsOf(se).length||1;      /* two instructors, half each */
    var byHour=r?(Number(r.perHour)||0)*hours:0;
    var bySession=r?(Number(r.perSession)||0):0;
    var rev=r&&Number(r.pct)?sessionRevenue(se):0;
    var byPct=r?rev*(Number(r.pct)||0)/100:0;
    var pay=(byHour+bySession+byPct)/share;
    total+=pay;
    rows.push({session:se,group:g,rate:r,hours:hours,share:share,
      byHour:byHour/share,bySession:bySession/share,byPct:byPct/share,pay:pay});
  });
  return {rows:rows,total:total};
}

var repMode="month", repAnchor=todayISO().slice(0,7);
function periodOf(dateStr){
  return repMode==="month" ? dateStr.slice(0,7) : dateStr.slice(0,4);
}
function repRange(){
  return repMode==="month" ? repAnchor : repAnchor.slice(0,4);
}
function paymentsIn(prefix){
  /* every payment whose date starts with the period, with its booking alongside */
  var out=[];
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      var d=p.date||bk.date;
      if(d && d.indexOf(prefix)===0) out.push({pay:p,amount:Number(p.amount)||0,date:d,bk:bk});
    });
    (bk.refunds||[]).forEach(function(r){
      var d=r.date||bk.date;
      if(d && d.indexOf(prefix)===0)
        out.push({pay:{method:r.method},amount:-(Number(r.amount)||0),date:d,bk:bk});
    });
  });
  return out;
}
function splitByKind(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.kind]=(w[pr.kind]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
    else out.other=(out.other||0)+r.amount;
  });
  return out;
}
function splitByProduct(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.name]=(w[pr.name]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
  });
  return out;
}
function shiftPeriod(step){
  if(repMode==="month"){
    var y=+repAnchor.slice(0,4), m=+repAnchor.slice(5,7)+step;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    repAnchor=y+"-"+String(m).padStart(2,"0");
  } else {
    repAnchor=String(+repAnchor.slice(0,4)+step)+"-01";
  }
  renderReports();
}

/* ============================ reports ============================
   Their report is four reports behind one date picker: what was sold, what
   was collected, what the till did, and the ticket journal. They answer
   different questions and are routinely different numbers -- a course paid
   for in March and taught in June is March's payment and June's sale -- so
   keeping them on one screen and one period is the point. */
var repTab="sales";
var REP_TABS=[{v:"sales",l:"Sales"},{v:"payments",l:"Payments"},
              {v:"register",l:"Register"},{v:"tickets",l:"Tickets"}];

/* Every line sold in the period, at its list price, its discount and its tax.
   Sales are counted on the booking's date, not the payment's. */
function salesIn(prefix){
  var rows=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    var d=bk.date||"";
    if(!d || d.indexOf(prefix)!==0) return;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId);
      var qty=Number(l.qty)||0;
      var net=(Number(l.price)||0)*qty;
      /* A deleted product must not make its sales disappear: the money was
         taken and the payments report still counts it, so this has to too. */
      if(!p) p={name:"(deleted product)",category:"",kind:"other",tax:0,gone:true};
      /* the list price is what the tier matrix says; the difference is the
         discount, however it was entered */
      var list=p.gone?net:priceFor(p,l.pax,l.hours)*qty;
      var rate=Number(p.tax)||0;
      rows.push({booking:bk,line:l,product:p,qty:qty,
        list:list, net:net,
        /* a price raised by hand is not a negative discount: it lifts the
           list side, so gross never comes out under net */
        discount:Math.max(0,list-net), uplift:Math.max(0,net-list),
        rate:rate, tax:net-net/(1+rate/100), date:d});
    });
  });
  return rows;
}

  var rows=paymentsIn(repRange());

/* ---- what was sold ---- */
/* ============================ the income chart ============================
   Their sales report leads with the month's shape: one line across the days,
   filled underneath. One series, so no legend -- the heading names it -- and
   no number on every point; the hover says the day you are on.

   Drawn by hand in SVG. A charting library would be a megabyte of dependency
   inside a page that has to stay one self-contained file. */
function lineChart(host,points,opts){
  opts=opts||{};
  var W=1000, H=260, L=52, R=14, T=14, B=28;   /* a viewBox, scaled by CSS */
  var box=el("div","panel");
  box.style.cssText="padding:14px 16px 10px;overflow:hidden";
  if(opts.title){
    var h=el("div","eyebrow",opts.title);
    h.style.marginBottom="6px";
    box.appendChild(h);
  }
  if(!points.length){
    box.appendChild(el("div","hint","Nothing in this period."));
    host.appendChild(box);
    return box;
  }
  var NS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 "+W+" "+H);
  svg.setAttribute("width","100%");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label",(opts.title||"Chart")+", "+points.length+" points");
  /* let the width drive the height, or the viewBox letterboxes and the plot
     floats in the middle of an empty panel */
  svg.setAttribute("preserveAspectRatio","none");
  svg.style.cssText="display:block;width:100%;height:"+(opts.height||230)+"px;"+
    "overflow:visible";

  var max=points.reduce(function(a,p){return Math.max(a,p.v);},0);
  /* a round ceiling, so the gridline labels are numbers a person recognises */
  var step=Math.pow(10,Math.floor(Math.log(Math.max(1,max))/Math.LN10));
  var top=Math.ceil(max/step)*step || 1;
  if(top/step<2) { step=step/2; top=Math.ceil(max/step)*step || 1; }

  function X(i){ return L + (points.length<2?0:(i/(points.length-1))*(W-L-R)); }
  function Y(v){ return T + (1-(v/top))*(H-T-B); }

  function add(tag,attrs){
    var n=document.createElementNS(NS,tag);
    for(var k in attrs) n.setAttribute(k,attrs[k]);
    svg.appendChild(n);
    return n;
  }
  /* recessive grid: four lines, labelled at the axis */
  for(var g=0;g<=4;g++){
    var v=top*g/4;
    add("line",{x1:L,x2:W-R,y1:Y(v),y2:Y(v),stroke:"var(--line-soft)",
      "stroke-width":1,"vector-effect":"non-scaling-stroke"});
    var lab=add("text",{x:L-8,y:Y(v)+4,"text-anchor":"end",
      "font-size":11,fill:"var(--text-3)"});
    lab.textContent=(opts.money?(sym0()+money(v,0)):String(Math.round(v)));
  }
  var d="",area="";
  points.forEach(function(p,i){
    d+=(i?" L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1);
  });
  area="M"+X(0).toFixed(1)+" "+Y(0).toFixed(1)+" L"+d.slice(1)+
       " L"+X(points.length-1).toFixed(1)+" "+Y(0).toFixed(1)+" Z";
  add("path",{d:area,fill:"var(--accent)","fill-opacity":.16,stroke:"none"});
  add("path",{d:d,fill:"none",stroke:"var(--accent)","stroke-width":2,
              "stroke-linejoin":"round","stroke-linecap":"round",
              "vector-effect":"non-scaling-stroke"});

  /* x labels, thinned so they never collide */
  var every=Math.max(1,Math.ceil(points.length/16));
  points.forEach(function(p,i){
    if(i%every && i!==points.length-1) return;
    var t=add("text",{x:X(i),y:H-8,"text-anchor":"middle",
      "font-size":11,fill:"var(--text-3)"});
    t.textContent=p.l;
  });

  /* the hover layer: a crosshair and one readout, rather than a number on
     every point */
  var cross=add("line",{x1:0,x2:0,y1:T,y2:H-B,stroke:"var(--text-3)",
    "stroke-width":1,"stroke-dasharray":"3 3",opacity:0,
    "vector-effect":"non-scaling-stroke"});
  var dot=add("circle",{r:4.5,fill:"var(--accent)",stroke:"var(--panel)",
    "stroke-width":2,opacity:0});
  var hit=add("rect",{x:L,y:T,width:W-L-R,height:H-T-B,fill:"transparent"});
  var tip=el("div");
  tip.style.cssText="position:absolute;pointer-events:none;opacity:0;z-index:5;"+
    "background:var(--slate);color:#fff;padding:6px 9px;border-radius:8px;"+
    "font-size:12px;white-space:nowrap;transform:translate(-50%,-130%);"+
    "box-shadow:0 6px 18px rgba(0,0,0,.28)";
  var wrap=el("div");
  wrap.style.cssText="position:relative";
  wrap.appendChild(svg);
  wrap.appendChild(tip);
  box.appendChild(wrap);

  function at(ev){
    var r=svg.getBoundingClientRect();
    var px=(ev.clientX-r.left)/r.width*W;
    var i=Math.round((px-L)/Math.max(1,(W-L-R))*(points.length-1));
    i=Math.max(0,Math.min(points.length-1,i));
    var p=points[i];
    cross.setAttribute("x1",X(i)); cross.setAttribute("x2",X(i));
    cross.setAttribute("opacity",1);
    dot.setAttribute("cx",X(i)); dot.setAttribute("cy",Y(p.v));
    dot.setAttribute("opacity",1);
    tip.textContent=p.full||(p.l+" · "+(opts.money?(sym0()+money(p.v,2)):p.v));
    tip.style.left=(X(i)/W*r.width)+"px";
    tip.style.top=(Y(p.v)/H*r.height)+"px";
    tip.style.opacity=1;
  }
  hit.addEventListener("pointermove",at);
  hit.addEventListener("pointerdown",at);
  hit.addEventListener("pointerleave",function(){
    cross.setAttribute("opacity",0);
    dot.setAttribute("opacity",0);
    tip.style.opacity=0;
  });
  host.appendChild(box);
  return box;
}

/* ---- what the till did, by day, month and year ---- */
var regNav="days";
function registerRows(prefix){
  return DB.pos.filter(function(x){return (x.date||"").indexOf(prefix)===0;})
    .sort(function(a,b){return a.date<b.date?-1:1;});
}
/* Everything one register day is judged on, in one object. */
function registerLine(dateStr){
  var s=posFor(dateStr);
  var c=closingFor(dateStr);
  var cashIn=0,cashOut=0;
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      if((p.date||bk.date)===dateStr && p.method==="Cash") cashIn+=Number(p.amount)||0;});
    (bk.refunds||[]).forEach(function(r){
      if((r.date||bk.date)===dateStr && r.method==="Cash") cashOut+=Number(r.amount)||0;});
  });
  var d=drawerFor(dateStr,cashIn-cashOut);
  var start=s?Number(s.starting)||0:0;
  return {date:dateStr,pos:s,
    status:s?(s.closedAt?"Closed":"Open"):"Not opened",
    staff:s&&s.openedBy?staffName(s.openedBy):"—",
    starting:start, cashPayments:cashIn, cashRefunds:cashOut,
    paidIn:d.in, paidOut:d.out,
    expected:start+cashIn-cashOut+d.in-d.out,
    actual:s&&s.counted!=null?Number(s.counted):null,
    difference:s&&s.counted!=null?(Number(s.counted)-(start+cashIn-cashOut+d.in-d.out)):null,
    takings:c.total, count:c.count};
}
function registerReport(host){
  var nav=el("div","range"); nav.style.marginBottom="10px";
  [{v:"days",l:"Days"},{v:"months",l:"Months"},{v:"years",l:"Years"}].forEach(function(x){
    var b=el("button",null,x.l);
    b.setAttribute("aria-pressed",regNav===x.v?"true":"false");
    b.addEventListener("click",function(){regNav=x.v;renderReports();});
    nav.appendChild(b);
  });
  var nw=el("div"); nw.appendChild(nav); host.appendChild(nw);

  if(regNav==="days"){ registerDays(host); return; }
  registerRollup(host, regNav==="months");
}

    r.appendChild(el("td","n r",(L.paidIn||L.paidOut)

          L.cashPayments.toFixed(2),L.cashRefunds.toFixed(2),

/* Months within the year, or years across everything. A period with an
   unclosed register in it is flagged: its numbers are still moving. */
function registerRollup(host,byMonth){
  var buckets={};
  DB.pos.forEach(function(p){
    var key=byMonth?(p.date||"").slice(0,7):(p.date||"").slice(0,4);
    if(byMonth && key.slice(0,4)!==repAnchor.slice(0,4)) return;
    (buckets[key]=buckets[key]||[]).push(p);
  });
  var keys=Object.keys(buckets).sort();
  if(!keys.length){
    host.appendChild(el("div","note",
      byMonth?("No register days recorded in "+repAnchor.slice(0,4)+".")
             :"No register days recorded yet."));
    return;
  }
  var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
  [byMonth?"Month":"Year","Days","Cash payments","Cash refunds","Paid in/out",
   "Total payments","Total refunds","Balance",""].forEach(function(x,i){
    tr.appendChild(el("th",(i>=1&&i<=7)?"r":null,x));});
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  var gTot=0;
  keys.forEach(function(key){
    var lines=buckets[key].map(function(p){return registerLine(p.date);});
    var open=lines.filter(function(L){return L.status!=="Closed";}).length;
    var cashIn=lines.reduce(function(a,L){return a+L.cashPayments;},0);
    var cashOut=lines.reduce(function(a,L){return a+L.cashRefunds;},0);
    var pin=lines.reduce(function(a,L){return a+L.paidIn;},0);
    var pout=lines.reduce(function(a,L){return a+L.paidOut;},0);
    var pay=0,ref=0;
    buckets[key].forEach(function(p){
      var c=closingFor(p.date);
      Object.keys(c.byMethod).forEach(function(m){
        var v=c.byMethod[m]; if(v>0) pay+=v; else ref-=v;});
    });
    gTot+=pay-ref;
    var r=el("tr");

/* ---- the ticket journal for the period ---- */
function ticketReport(host){
  var prefix=repRange();
  var rows=DB.tickets.filter(function(t){return (t.date||"").indexOf(prefix)===0;})
    .sort(function(a,b){return a.seq-b.seq;});
  if(!rows.length){
    host.appendChild(el("div","note","No tickets in "+periodLabel()+"."));
    return;
  }
  var sales=rows.filter(function(t){return !t.voided && t.total>0;});
  var refs=rows.filter(function(t){return !t.voided && t.total<0;});
  var k=el("div","kpis");
  [{l:"Tickets",v:String(rows.length),m:rows.filter(function(t){return t.voided;}).length+" voided"},
   {l:"Sales",v:"$"+money(sales.reduce(function(a,t){return a+t.total;},0),0),
    m:sales.length+" tickets"},
   {l:"Refunds",v:"−$"+money(-refs.reduce(function(a,t){return a+t.total;},0),0),
    m:refs.length+" tickets"},
   {l:"Tax",v:"$"+money(rows.filter(function(t){return !t.voided;})
     .reduce(function(a,t){return a+(Number(t.tax)||0);},0),0),m:"included in the totals"}]
  .forEach(function(it){
    var p=el("div","panel kpi");
    p.appendChild(el("div","eyebrow",it.l));
    p.appendChild(el("span","val mono",it.v));
    p.appendChild(el("div","meta",it.m));
    k.appendChild(p);
  });
  host.appendChild(k);
  host.appendChild(ticketsTable(rows,showTicket));

  var bar=el("div","searchbar"); bar.style.marginTop="12px";
  var ci=el("button","btn sm","Check integrity");
  ci.addEventListener("click",function(){
    integrityReport(prefix+(repMode==="month"?"-01":"-01-01"),
      prefix+(repMode==="month"?"-31":"-12-31"));});
  bar.appendChild(ci);
  var es=el("button","btn sm","Export sales (ticket)");
  es.addEventListener("click",function(){
    exportCsv("tickets-sales-"+prefix,
      ["Ticket number","Ticket date","Ticket type","Client","Staff","Amount","Tax","Status"],
      rows.filter(function(t){return t.total>=0;}).map(function(t){
        return [t.seq,t.date,ticketTypeLabel(t.type),t.clientName||"",
          t.staffId?staffName(t.staffId):"",t.total.toFixed(2),
          (Number(t.tax)||0).toFixed(2),t.voided?"Voided":"Valid"];}));
  });
  bar.appendChild(es);
  var ep=el("button","btn sm","Export payments (ticket)");
  ep.addEventListener("click",function(){
    exportCsv("tickets-payments-"+prefix,
      ["Ticket number","Ticket date","Payment method","Amount","Client","Staff"],
      rows.reduce(function(acc,t){
        (t.methods||[]).forEach(function(m){
          acc.push([t.seq,t.date,m.method,(Number(m.amount)||0).toFixed(2),
                    t.clientName||"",t.staffId?staffName(t.staffId):""]);});
        return acc;},[]));
  });
  bar.appendChild(ep);
  host.appendChild(bar);
  host.appendChild(el("div","note",
    "An export over a long period can take a moment. If it stalls, pick a shorter one."));
}

function unitCount(g){ return (g.units||[]).length; }

  var g=existing||{name:"",units:[],description:""};

  var host=el("div");
  function draw(){
    host.textContent="";
    if(!working.length){ host.appendChild(el("div","hint","No items yet.")); return; }
    working.forEach(function(u,i){
      var wrapU=el("div");
      wrapU.style.cssText="border:1px solid var(--line-soft);border-radius:9px;"+
        "padding:8px 9px;margin-bottom:7px";
      var row=el("div","line"); row.style.gridTemplateColumns="1fr 62px auto";

      mp.addEventListener("input",function(){u.maxPax=Number(mp.value)||1;});
      var rm=el("button","btn sm danger","×");
      rm.addEventListener("click",function(){working.splice(i,1);draw();});
      row.appendChild(n); row.appendChild(mp); row.appendChild(rm);
      wrapU.appendChild(row);
      /* their gear list keeps these three against every unit: when it was
         bought, when it was last checked and when it is due again */
      var row2=el("div","line");
      row2.style.cssText="grid-template-columns:repeat(3,1fr);margin-top:6px";
      [["purchased","Purchased"],["lastCheck","Last check"],["nextCheck","Next check"]]
      .forEach(function(f){
        var w2=el("div");
        var lb=el("div","hint",f[1]); lb.style.marginBottom="2px";
        var d=input("date",u[f[0]]||"");
        d.addEventListener("input",function(){u[f[0]]=d.value;});
        w2.appendChild(lb); w2.appendChild(d);
        row2.appendChild(w2);
      });
      wrapU.appendChild(row2);
      var nt=input("text",u.note||"",{placeholder:"Note — ding, repair, whose board it is"});
      nt.style.marginTop="6px";
      nt.addEventListener("input",function(){u.note=nt.value;});
      wrapU.appendChild(nt);

        var due=el("div","hint","Check overdue since "+dm(u.nextCheck)+".");
        due.style.color="var(--crit)"; due.style.marginTop="5px";
        wrapU.appendChild(due);
      }
      host.appendChild(wrapU);
    });
  }
  var lh=el("div","lines-h");
  lh.appendChild(el("h4",null,"Individual items — name, max pax and service dates"));
  var add=el("button","btn sm","Add item");

    "Each board or suit is tracked on its own, so availability is a real count and a specific item can be pulled from service."));

  openModal(existing?"Edit gear":"Add gear",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      if(!name.value.trim()){toast("A name is required.");name.focus();return;}
      var rec=existing||{id:uid("g")};
      rec.name=name.value.trim(); rec.description=desc.value.trim();
      rec.units=working.filter(function(u){return (u.name||"").trim();});
      if(!existing) DB.gear.push(rec);
      save(); closeModal(); render(); toast(existing?"Gear updated":"Gear added");
    }}
  ]);

/* A freelancer with a season on their card is simply not here outside it, and
   the school should be told before the session is saved, not after they call.
   No season set means always available -- most of the crew are. */
function outOfSeason(staffId,dateStr){
  var s=by(staffId,DB.staff);
  if(!s||!dateStr) return false;

/* What each partner earned in a period: their rate against the value of the
   lines they are entitled to, on bookings actually booked through them. */
function commissionsFor(from,to){
  var out=[];
  DB.partners.forEach(function(pa){
    var rows=[],total=0;
    DB.bookings.forEach(function(bk){
      if(bk.partnerId!==pa.id) return;
      if(bk.status==="cancelled") return;
      var d=bk.date||"";
      if((from&&d<from)||(to&&d>to)) return;
      var g=pa.groupId?by(pa.groupId,DB.commissionGroups):null;
      var base=0;
      (bk.lines||[]).forEach(function(l){
        if(g&&(g.productIds||[]).indexOf(l.productId)<0) return;
        base+=(Number(l.price)||0)*(Number(l.qty)||0);
      });
      if(base<=0.004) return;
      var pay=Math.round(base*(Number(pa.commission)||0))/100;
      rows.push({booking:bk,base:base,pay:pay});
      total+=pay;
    });
    out.push({partner:pa,rows:rows,total:total});
  });
  return out.sort(function(a,b){return b.total-a.total;});
}

  var wrap=el("div","panel");

  if(!items.length){
    var e=el("div","hint","Nothing here yet.");
    e.style.padding="14px 16px"; wrap.appendChild(e);
    return wrap;
  }
  items.forEach(function(it,i){
    var r=el("div","slot"); r.style.gridTemplateColumns="1fr auto";
    var nm=el("div","nm");
    var txt=el("div");
    var read=opts.read(it);
    txt.appendChild(el("b",null,read.title));
    if(read.sub) txt.appendChild(el("em",null,read.sub));
    nm.appendChild(txt); r.appendChild(nm);
    var box=el("div","rowbtns");
    var e2=el("button","btn sm","Edit");
    e2.addEventListener("click",function(){opts.form(it,i);});
    box.appendChild(e2);
    if(opts.del){
      var d=el("button","btn sm danger","Del");
      d.addEventListener("click",function(){
        confirmDelete(read.title,function(){opts.del(it,i);save();render();toast("Deleted");});
      });
      box.appendChild(d);
    }
    r.appendChild(box);
    wrap.appendChild(r);
  });
  return wrap;
}

/* ============================ fiscal archive ============================
   A sealed copy of a stretch of the ticket journal, with a fingerprint over
   the whole run. Keep it somewhere safe; checking it later says whether the
   tickets it holds are still the ones that were issued. */
var arcFrom="",arcTo="";
function archiveBody(rows){
  return rows.map(function(t){return ticketBody(t)+"#"+t.hash;}).join("\n");
}
function fiscalSection(host){
  var h=el("div","sec-h");
  h.appendChild(el("h2",null,"Fiscal archive"));
  h.appendChild(el("span","spacer"));
  var ci=el("button","btn sm","Check ticket integrity");
  ci.addEventListener("click",function(){ integrityRangeForm(); });
  h.appendChild(ci);
  var ex=el("button","btn sm primary","Export archive file");
  ex.addEventListener("click",archiveForm);
  h.appendChild(ex);
  host.appendChild(h);

  var p=el("div","panel");
  var total=DB.tickets.length;
  var voided=DB.tickets.filter(function(t){return t.voided;}).length;
  var span=total?(dm(DB.tickets[0].date)+" – "+dm(DB.tickets[total-1].date)):"—";
  [["Tickets issued",String(total)],["Of those, voided",String(voided)],
   ["Covering",span],["Archives made",String(DB.archives.length)]].forEach(function(x){
    var r=el("div","slot"); r.style.gridTemplateColumns="190px 1fr";
    r.appendChild(el("div","t",x[0]));
    r.appendChild(el("div","mono",x[1]));
    p.appendChild(r);
  });
  host.appendChild(p);

  if(DB.archives.length){
    var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
    ["Made","Covers","Tickets","Total","Fingerprint",""].forEach(function(x,i){
      tr.appendChild(el("th",(i===2||i===3)?"r":null,x));});
    th.appendChild(tr); t.appendChild(th);
    var tb=el("tbody");
    DB.archives.slice().reverse().forEach(function(a){
      var r=el("tr");
      r.appendChild(el("td","muted",dm(a.made)));
      r.appendChild(el("td","strong",dm(a.from)+" – "+dm(a.to)));
      r.appendChild(el("td","n r",String(a.count)));
      r.appendChild(el("td","n r","$"+money(a.total,2)));
      r.appendChild(el("td","mono muted",a.hash));
      var act=el("td"),box=el("div","rowbtns");
      var open=el("button","btn sm","Open");
      open.addEventListener("click",function(){showArchive(a);});
      var chk=el("button","btn sm","Check");
      chk.addEventListener("click",function(){checkArchive(a);});
      box.appendChild(open); box.appendChild(chk);
      act.appendChild(box); r.appendChild(act);
      tb.appendChild(r);
    });
    t.appendChild(tb); w.appendChild(t); host.appendChild(w);
  }
  host.appendChild(el("div","note",
    "The tickets carry fingerprints so a later edit shows up. That is tamper-evident bookkeeping, not certified fiscal software — if your tax authority requires certified software, this is not it."));
}
function integrityRangeForm(){
  var b=el("div");
  var f=input("date",arcFrom||todayISO()), t=input("date",arcTo||todayISO());
  var g=el("div","grid2");
  g.appendChild(field("Tickets from",f)); g.appendChild(field("To",t));
  b.appendChild(g);
  b.appendChild(el("div","hint","Tickets date — one month at most."));
  openModal("Check ticket integrity",b,[
    {label:"Cancel",on:closeModal},
    {label:"Check",cls:"primary",on:function(){
      if(t.value<f.value){ toast("End date cannot be before start date."); return; }
      if((new Date(t.value)-new Date(f.value))/864e5>31){
        toast("Date range cannot exceed 1 month. Please update dates."); return; }
      arcFrom=f.value; arcTo=t.value;
      closeModal(); integrityReport(f.value,t.value);
    }}
  ]);
}
function archiveForm(){
  var b=el("div");
  b.appendChild(el("p","hint","Please select the period for the archive file — one year at most."));
  var f=input("date",""), t=input("date",todayISO());
  var g=el("div","grid2");
  g.appendChild(field("Archive data from",f)); g.appendChild(field("Archive data to",t));
  b.appendChild(g);
  openModal("Export archive file",b,[
    {label:"Cancel",on:closeModal},
    {label:"Export file",cls:"primary",on:function(){
      if(!f.value||!t.value){ toast("Select both dates."); return; }
      if(t.value<f.value){ toast("Date to must be after date from."); return; }
      if(t.value>todayISO()){ toast("Date to must be today or before."); return; }
      if((new Date(t.value)-new Date(f.value))/864e5>366){
        toast("Archive date range must be one year maximum."); return; }
      var rows=ticketsBetween(f.value,t.value);
      if(!rows.length){ toast("No tickets in that period."); return; }
      var a={id:uid("arc"),made:todayISO(),from:f.value,to:t.value,
             count:rows.length,
             total:Math.round(rows.reduce(function(x,r){return x+(Number(r.total)||0);},0)*100)/100,
             tax:Math.round(rows.reduce(function(x,r){return x+(Number(r.tax)||0);},0)*100)/100,
             ticketIds:rows.map(function(r){return r.id;})};
      a.hash=fnv1a(archiveBody(rows));
      DB.archives.push(a); save(); closeModal(); render();
      showArchive(a);
    }}
  ]);
}
function showArchive(a){
  var rows=a.ticketIds.map(ticketFor).filter(Boolean);
  var b=el("div");
  [["Covers",dm(a.from)+" – "+dm(a.to)],["Tickets",String(a.count)],
   ["Total tax incl.","$"+money(a.total,2)],["Of which tax","$"+money(a.tax,2)],
   ["Fingerprint",a.hash]].forEach(function(x){
    var r=el("div","tot"); r.style.marginTop="4px";
    r.appendChild(el("span","lab",x[0]));
    r.appendChild(el("span","v mono",x[1]));
    b.appendChild(r);
  });
  var ta=el("textarea");
  ta.value=JSON.stringify({shokogi_archive:1,made:a.made,from:a.from,to:a.to,
    business:cfg().business,hash:a.hash,tickets:rows});
  ta.style.minHeight="150px"; ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11px";
  b.appendChild(field("Archive file — copy this somewhere safe",ta,
    "Keep it outside this browser. It is the only copy."));
  openModal("Archive "+dm(a.from)+" – "+dm(a.to),b,[
    {label:"Close",on:closeModal},
    {label:"Check integrity",on:function(){checkArchive(a);}},
    {label:"Select file",cls:"primary",on:function(){ta.focus();ta.select();toast("Now copy it");}}
  ]);
}
function checkArchive(a){
  var rows=a.ticketIds.map(ticketFor).filter(Boolean);
  var b=el("div");
  var missing=a.ticketIds.length-rows.length;
  var now=fnv1a(archiveBody(rows));
  var ok=!missing&&now===a.hash;
  var line=el("div","tot");
  line.appendChild(el("span","lab",a.count+" ticket"+(a.count===1?"":"s")+" checked"));
  var v=el("span","v",ok?"Validated":"Failed");
  v.style.color=ok?"var(--good)":"var(--crit)";
  line.appendChild(v); b.appendChild(line);
  if(missing) b.appendChild(el("div","note",
    missing+" ticket"+(missing===1?" is":"s are")+" no longer in the journal."));
  else if(!ok) b.appendChild(el("div","note",
    "The tickets are all still there, but at least one has changed since the archive was made."));
  else b.appendChild(el("div","note",
    "The archive's fingerprint still matches the tickets it covers."));
  openModal("Archive integrity",b,[{label:"Close",cls:"primary",on:closeModal}]);
}

   A read-only view of the schedule for Google or Apple Calendar. The link is
   generated here; it only means anything once the app sits on a server that
   can answer it, and the form says so rather than pretending otherwise. */
var ICAL_FIELDS=[
  {v:"title",l:"Title",grp:"Session"},
  {v:"date",l:"Date",grp:"Session"},
  {v:"starting_time",l:"Starting time",grp:"Session"},
  {v:"duration",l:"Duration",grp:"Session"},
  {v:"instructors",l:"Assigned staff",grp:"Session"},
  {v:"note",l:"Note",grp:"Session"},
  {v:"host_name",l:"Customer name",grp:"Client"},
  {v:"phone",l:"Telephone",grp:"Client"},
  {v:"guest_name",l:"Participants' names",grp:"Client"},
  {v:"due_balance",l:"Due balance",grp:"Client"},
  {v:"order_total",l:"Booking total",grp:"Client"}
];
function icalForm(existing){
  var f=existing||{name:"",staffIds:[],kinds:[],
    fields:["title","date","starting_time","duration","instructors"],
    token:Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,10)};

      fields=(f.fields||[]).slice();

    var lh=el("div","lines-h"); lh.appendChild(el("h4",null,title));

    var box=el("div","panel"); box.style.padding="6px";
    box.style.maxHeight="200px"; box.style.overflow="auto";
    items.forEach(function(it){

      row.style.cursor="pointer"; row.style.alignItems="center";

      cb.addEventListener("change",function(){
        if(cb.checked){ if(picked.indexOf(it.v)<0) picked.push(it.v); }
        else{ var i=picked.indexOf(it.v); if(i>=0) picked.splice(i,1); }
      });
      row.appendChild(cb);
      row.appendChild(el("div","t",it.l));
      if(it.grp) row.appendChild(el("div","muted",it.grp));
      box.appendChild(row);
    });
    if(!items.length) box.appendChild(el("div","hint","Nothing to choose from yet."));

  checkList("Staff to share",
    DB.staff.map(function(s){return {v:s.id,l:s.name,grp:s.role};}),staffIds,
    "Leave everything unticked to share the whole school's schedule.");
  checkList("Activities to share",
    KINDS().map(function(k){return {v:k.k,l:k.l};}),kinds,
    "Leave unticked to share every activity.");
  checkList("Fields to include",ICAL_FIELDS,fields,

  var url=el("input"); url.type="text"; url.readOnly=true;

  b.appendChild(field("Feed URL",url,

  openModal(existing?"Edit URL settings":"Add new URL",b,[

      rec.name=name.value.trim()||"Calendar feed";
      rec.staffIds=staffIds; rec.kinds=kinds; rec.fields=fields;
      if(!existing) DB.icalFeeds.push(rec);
      save(); closeModal(); render(); toast("iCal feed saved successfully");
    }}
  ]);
}

/* ============================ starter catalog ============================
   The school's real product list, exported from Bloowatch. It is offered, not
   forced: the app still starts empty and this only lands when asked for. */
function seedData(){
  try{
    var n=document.getElementById("seed");
    if(!n) return null;
    var d=JSON.parse(n.textContent||"null");
    return (d&&d.products&&d.products.length)?d:null;
  }catch(e){ return null; }
}
function importCatalog(){
  var d=seedData();
  if(!d){ toast("No catalog is bundled with this build."); return; }
  var added={products:0,gear:0,units:0,spots:0,kinds:0,crew:0,sessions:0,cats:0,tides:0};

  /* gear first: a product carries the id of the gear its hire goes out with */
  var gearBySrc={};
  (d.gear||[]).forEach(function(g){
    var already=DB.gear.filter(function(x){return x.name===g.name;})[0];
    if(already){ if(g.id!=null) gearBySrc[g.id]=already.id; return; }
    var units=(g.units||[]).map(function(u){
      return {id:uid("u"),name:u.name||"",maxPax:u.maxPax||1,
              lastCheck:u.lastCheck||"",nextCheck:u.nextCheck||"",notes:u.notes||""};
    });
    var rec={id:uid("g"),name:g.name,units:units,description:g.description||""};
    DB.gear.push(rec);
    if(g.id!=null) gearBySrc[g.id]=rec.id;   /* so products can point at it */
    added.gear++; added.units+=units.length;
  });

  d.products.forEach(function(p){
    if(DB.products.some(function(x){return x.name===p.name;})) return;
    DB.products.push({id:uid("p"),name:p.name,kind:p.kind,price:p.price||0,
      sessions:p.sessions||1,category:p.category||"",tax:p.tax||0,color:p.color||"",
      nights:p.nights||null,description:p.description||"",prices:p.prices||[],
      ptype:p.ptype||"class",
      priceMode:(p.prices&&p.prices.some(function(t){return t.hours;}))?"item":
                ((p.prices&&p.prices.some(function(t){return (t.minPax||1)>1;}))?"person":"fixed"),
      gearId:(p.rental!=null&&gearBySrc[p.rental])||"",
      shopCategory:p.shopCategory||"",
      pos:(p.pos==null?null:Number(p.pos)),
      limitedStock:p.stock!=null,
      stock:(p.stock==null?"":Number(p.stock)),
      clientPicksInstructor:!!p.clientPicksInstructor,
      subProducts:!!p.subProducts,
      code:"",maxAttendants:"",depositType:"",depositValue:"",
      /* SOLD ONLINE is their column, and only two of the thirty-five carry it.
         A booking page that lists the lot is not the school's shop. */
      onlineSale:(p.soldOnline==null?true:!!p.soldOnline),
      onlinePay:"full",sessionChoice:"full",
      weekDays:[],startHours:(p.startHours||[]),archived:false});
    added.products++;
  });

  /* activity calendars become activity types, keeping their colour */
  (d.categories||[]).forEach(function(c){
    if(!c.name) return;
    var code=c.name.toLowerCase().replace(/[^a-z0-9]+/g,"_");
    if(cfg().kinds.some(function(k){return k.k===code||k.l===c.name;})) return;
    /* their calendar carries how long a session on it runs -- SURF PACK an
       hour, FOIL FREE TOW an hour and a half. Dropping it left every new
       session on a hardcoded 90 minutes whatever it was for. */
    cfg().kinds.push({k:code,l:c.name,color:c.color||"",
                      mins:hhmmMins(c.duration)});
    added.cats++;
  });
  (d.staff||[]).forEach(function(st){
    if(DB.staff.some(function(x){return x.name===st.name;})) return;
    DB.staff.push({id:uid("s"),name:st.name,role:st.role||"Instructor",
      phone:"",email:"",
      activities:(st.activities||[]),langs:(st.langs||[]),
      pos:(st.pos==null?null:Number(st.pos)),
      seasonFrom:st.seasonFrom||"",seasonTo:st.seasonTo||"",
      onPlanning:st.onPlanning!==false});
    added.crew++;
    if(cfg().roles.indexOf(st.role)<0 && st.role) cfg().roles.push(st.role);
  });
  /* The tide table, straight from their spot. The app is a static page and
     cannot call anything at runtime, so the year travels with the catalog. */
  (d.tides||[]).forEach(function(t){
    if(DB.tides.some(function(x){return x.date===t.date;})) return;
    DB.tides.push({date:t.date,
      highs:(t.highs||[]).map(function(x){return x.t;}),
      lows:(t.lows||[]).map(function(x){return x.t;}),
      heights:{high:(t.highs||[]).map(function(x){return x.m;}),
               low:(t.lows||[]).map(function(x){return x.m;})},
      spot:t.spot||""});
    added.tides=(added.tides||0)+1;
  });
  (d.spots||[]).forEach(function(sp){
    if(DB.spots.some(function(x){return x.name===sp.name;})) return;
    DB.spots.push({id:uid("sp"),name:sp.name,lat:sp.lat,lon:sp.lon,notes:sp.notes||""});
    added.spots++;
  });
  /* every kind the imported products use must exist, or they group as "other" */
  d.products.forEach(function(p){
    if(!cfg().kinds.some(function(k){return k.k===p.kind;})){
      cfg().kinds.push({k:p.kind,l:p.kind.charAt(0).toUpperCase()+p.kind.slice(1)});
      added.kinds++;
    }
  });
  /* the schedule, without participants -- those point at clients, which stay put */
  /* the crew are imported above, so a session's instructors can be matched by
     name now -- without this the board's staff view arrives empty, and that is
     the view the school rosters from */
  var staffByName={};
  DB.staff.forEach(function(st){ staffByName[(st.name||"").toUpperCase()]=st.id; });
  (d.sessions||[]).forEach(function(x){
    if(DB.sessions.some(function(y){
      return y.date===x.date && y.time===x.time && y.title===x.title;})) return;

      return staffByName[(n||"").toUpperCase()];}).filter(Boolean);
    DB.sessions.push({id:uid("se"),title:x.title,date:x.date,time:x.time,
      duration:x.duration||60,capacity:x.capacity||1,
      minCapacity:x.minCapacity||0,
      spot:x.spot||(DB.spots[0]||{}).name||"",
      tideRef:"",tidePos:"before",tideHours:0,
      level:"",allDay:!!x.allDay,isPublic:x.isPublic!==false,
      participants:[],category:x.category||"",note:x.note||"",staffIds:ids});
    added.sessions++;
  });

  save();
  if(typeof cur!=="undefined" && cur) render();
  toast("Loaded "+added.products+" products, "+added.crew+" crew, "+
        added.units+" gear items, "+added.sessions+" sessions and "+
        added.tides+" days of tide");
}

/* ============================ people ============================
   Real clients and what they actually bought, if this build was made with a
   clients file beside the catalog. Not everybody has one: the catalog carries
   no personal data on purpose, and this does, so it travels separately.

   A booking here is rebuilt from one of their orders -- the products by name,
   the board that went out by its unit name, the dates and what was paid -- so
   the lines behave like lines the counter made, not like a frozen receipt. */
function peopleData(){
  try{
    var n=document.getElementById("people");
    if(!n) return null;
    var d=JSON.parse(n.textContent||"null");
    return (d&&d.clients&&d.clients.length)?d:null;
  }catch(e){ return null; }
}
function importPeople(){
  var d=peopleData();
  if(!d){ toast("No clients are bundled with this build."); return null; }
  var byName={}, unitByName={};
  DB.products.forEach(function(p){ byName[(p.name||"").toUpperCase()]=p; });
  DB.gear.forEach(function(g){
    (g.units||[]).forEach(function(u){
      unitByName[(u.name||"").toUpperCase()]={gear:g,unit:u};});
  });

  var idBySrc={}, added={clients:0,bookings:0,lines:0,people:0,unmatched:0};
  d.clients.forEach(function(c){
    var exists=DB.clients.filter(function(x){
      return x.name===c.name && (x.phone||"")===(c.phone||"");})[0];
    if(exists){ idBySrc[c.srcId]=exists.id; return; }
    var rec={id:uid("c"),name:c.name,email:c.email||"",phone:c.phone||"",
      country:c.country||"",notes:c.notes||"",custom:{},
      language:c.language||"",city:c.city||"",created:todayISO()};
    DB.clients.push(rec);
    idBySrc[c.srcId]=rec.id;
    added.clients++;
  });

  (d.bookings||[]).forEach(function(b){
    var cid=idBySrc[b.srcClient];
    if(!cid) return;
    if(DB.bookings.some(function(x){return x.ref===b.number;})) return;
    var lines=[], people=[];
    (b.lines||[]).forEach(function(l){
      var p=byName[(l.product||"").toUpperCase()];
      if(!p){ added.unmatched++; return; }
      var hit=(l.units||[]).map(function(u){return unitByName[(u||"").toUpperCase()];})
        .filter(Boolean)[0];
      /* The people are hung off the line, which is how they bought them: four
         names on the course, a fifth on a single lesson, a sixth on the photo
         shoot. Seating them all on every line would put someone in a course
         they never paid for. */
      var pids=[];
      (l.people||[]).forEach(function(nm){
        var pid=uid("pp");
        people.push({pid:pid,name:nm,custom:{}});
        pids.push(pid);
      });
      lines.push({lid:uid("ln"),productId:p.id,
        qty:Number(l.qty)||1,pax:Number(l.pax)||1,
        hours:(l.hours==null?null:Number(l.hours)),
        price:Number(l.price)||0,
        discount:(Number(l.discount)||0)||null,
        wanted:l.date||b.date,time:l.time||"",
        unitId:hit?hit.unit.id:"",
        pids:pids,
        sessionIds:[]});
      added.lines++;
      added.people+=pids.length;
    });
    if(!lines.length) return;
    var rec={id:uid("bk"),ref:b.number||"",date:b.date||todayISO(),
      clientId:cid,lines:lines,
      payments:(b.payments||[]).map(function(p){
        return {id:uid("pay"),date:p.date||b.date,amount:Number(p.amount)||0,
                method:(p.method||"Cash").toLowerCase().indexOf("card")>=0
                  ? "card" : "cash",
                note:p.status||""};
      }),
      refunds:[],participants:people,partnerId:"",
      notes:b.note||"",custom:{},
      source:(b.origin==="minisite"?"online":"counter"),
      status:(String(b.status||"").toLowerCase()==="cancelled")?"cancelled":""};
    DB.bookings.push(rec);
    added.bookings++;
  });
  save();
  if(typeof cur!=="undefined" && cur) render();
  toast(added.clients+" clients, "+added.bookings+" bookings and "+
        added.people+" people on the water"+
        (added.unmatched?(", "+added.unmatched+" lines skipped — no such product"):""));
  return added;
}

/* ============================ the shared book ============================
   cloud.js speaks to Supabase; this is the part that knows about the app:
   what changed since the last save, when to hand it over, and what the button
   in the corner says about it. */
var cloudShadow=null, cloudTimer=null, cloudBusy=false, cloudLast=null,
    cloudError=null, cloudNudgeTimer=null, cloudAgain=false;
/* What changed, worked out by comparing this save with the last one. Doing it
   here rather than at every one of the hundreds of places that write a record
   means no write can quietly escape the outbox. */
function cloudMark(){
  if(!cloudConfigured()) return;
  var next={};
  CLOUD_TABLES.forEach(function(spec){
    var now={}, id;
    (DB[spec.k]||[]).forEach(function(r){
      if(r&&r.id) now[r.id]=JSON.stringify(r); });
    if(cloudShadow){
      var was=cloudShadow[spec.k]||{};
      for(id in now) if(was[id]!==now[id]) cloudDirty(spec.k,id);
      for(id in was) if(!(id in now)) cloudDirty(spec.k,id);   /* deleted */
    }
    next[spec.k]=now;
  });
  cloudShadow=next;
}
/* Everything, on purpose: the first hand-over of a book that was kept in one
   browser until now. */
function cloudMarkEverything(){
  CLOUD_TABLES.forEach(function(spec){ cloudDirtyAll(spec.k,DB[spec.k]); });
}
function cloudPaint(){
  var b=document.getElementById("btn-cloud");
  if(!b) return;
  var n=cloudConfigured()?outboxCount():0;
  var txt,title;
  if(!cloudConfigured()){ txt="Offline"; title="No shared book is set up."; }
  else if(!cloudSignedIn()){ txt="Sign in"; title="This browser is not signed in to the shared book."; }
  else if(cloudBusy){ txt="Syncing…"; title="Handing over what changed."; }
  else if(cloudError){ txt="Sync error"; title=cloudError; }
  else if(n){ txt=n+" to send"; title=n+" change"+(n===1?"":"s")+" waiting for a network."; }
  else if(cloudLiveUp()){
    txt="Live";
    title="Connected. What anyone changes shows up here as they do it."+
          (cloudLast?(" Last synced "+cloudLast+"."):"");
  }
  else {
    txt="Synced";
    title=(cloudLast?("Last synced "+cloudLast+". "):"")+
          "Checking every few seconds -- the live connection is not open.";
  }
  b.textContent=txt;
  b.style.opacity=(cloudError||(!cloudSignedIn()&&cloudConfigured()))?"1":".9";
}
function cloudRun(loud){
  if(!cloudConfigured()||!cloudSignedIn()) { cloudPaint(); return; }
  /* Asked while one is already in the air: remember it and go again after.
     Dropping it was the reason a change sometimes sat there until somebody
     pressed the button -- at a counter taking bookings, a save landing during
     a sync is the normal case, not the rare one. */
  if(cloudBusy){ cloudAgain=true; cloudPaint(); return; }
  cloudBusy=true; cloudError=null; cloudPaint();
  cloudSync(DB,function(err,info){
    cloudBusy=false;
    if(err){
      cloudError=err.message||"Sync failed";
      if(loud) toast("Sync: "+cloudError);
      /* the session is gone, not the network: ask for it again rather than
         letting the day pile up in a browser nobody is watching */
      if(err.gone){
        cloudLiveStop(false); cloudAgain=false;
        cloudPaint();
        if(gateNeeded()) showGate();
        return;
      }
    } else {
      cloudLast=new Date().toTimeString().slice(0,5);
      if(info && info.got){
        /* somebody else's work arrived: keep it and show it */
        try{ localStorage.setItem(KEY,JSON.stringify(DB)); }catch(e){}
        cloudShadow=null; cloudMark();
        render();
      }
      if(loud) toast(info&&info.skipped?"Not signed in":
        ("Sent "+((info&&info.sent)||0)+", received "+((info&&info.got)||0)));
    }
    cloudPaint();
    /* a full page means the server had more than one turn could carry: come
       straight back for the rest instead of waiting for the next poll */
    if(info && info.more) cloudAgain=true;
    if(cloudAgain){ cloudAgain=false; setTimeout(function(){ cloudRun(false); },60); }
  });
}
/* a burst of edits is one hand-over, not twenty -- but short enough that the
   other end hears about it while the person who typed it is still standing
   there, because the other end is now told rather than asked */
function cloudSoon(){
  cloudPaint();
  if(!cloudConfigured()||!cloudSignedIn()) return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){ cloudRun(false); },900);
}
function cloudSignInForm(){

/* The server's own words are written for whoever wrote the server. This is
   the same fact said to somebody standing at a counter, with what to do about
   it -- because "Sync error" on its own is a thing you can only stare at. */
function cloudWhy(msg){
  var m=String(msg||"");
  if(!m) return "";
  if(/does not exist|schema cache|PGRST205|42P01/i.test(m))
    return "The tables have not been made yet. Open Supabase → SQL Editor and "+
           "run supabase/schema.sql once.";
  if(/row-level security|violates row-level|PGRST301|permission denied|42501/i.test(m))
    return "This user is signed in but is not a member of the school yet, so "+
           "the book will not take their writes. In Supabase → SQL Editor:  "+
           "insert into public.members (user_id, school, name) select id, "+
           "'"+CLOUD.school+"', 'name' from auth.users where email = '"+
           (cloudWho()||"the email")+"' on conflict (user_id) do update set "+
           "school = excluded.school;";
  if(/JWT|token is expired|invalid claim|401/i.test(m))
    return "The sign-in on this device has expired. Sign out and back in.";
  if(/Failed to fetch|NetworkError|network/i.test(m))
    return "No connection to the book. Everything typed here is kept and goes "+
           "over when there is one.";
  return "";
}

/* ============================ the way in ============================
   A school's book is not something a passer-by should be able to open, so the
   app does not draw until somebody has signed in. The session is kept on the
   device, so this is asked once and then never again -- and a device that has
   already signed in opens with no network at all, which matters more here than
   anywhere: the till cannot wait for the wifi to come back.

   Being honest about what this is: the page itself is public, and anyone can
   read its source. What the sign-in protects is the school's data, which lives
   behind Supabase's row policies and never travels without a real login. The
   gate is what stops the wrong person using the app; the policies are what stop
   them reading the book. */
var gateEl=document.getElementById("gate");
function gateNeeded(){ return cloudConfigured() && !cloudSignedIn(); }
function showGate(){
  if(!gateEl) return;
  gateEl.hidden=false;
  document.body.classList.add("locked");
  var em=document.getElementById("gate-email");
  if(em) setTimeout(function(){ em.focus(); },50);
}
function hideGate(){
  if(!gateEl) return;
  gateEl.hidden=true;
  document.body.classList.remove("locked");
}
if(gateEl){
  document.getElementById("gate-form").addEventListener("submit",function(e){
    e.preventDefault();
    var em=document.getElementById("gate-email").value.trim();
    var pw=document.getElementById("gate-pass").value;
    var go=document.getElementById("gate-go");
    var err=document.getElementById("gate-err");
    if(!em||!pw){ err.textContent="Both, please."; return; }
    go.disabled=true; go.textContent="Signing in…"; err.textContent="";
    cloudSignIn(em,pw).then(function(){
      document.getElementById("gate-pass").value="";
      hideGate();
      render(); cloudPaint(); cloudRun(false);
      cloudLiveStart(cloudNudge);
      toast("Signed in as "+cloudWho());
    }).catch(function(e2){
      go.disabled=false; go.textContent="Sign in";
      var m=(e2&&e2.message)||"Sign-in failed";
      /* their wording is for developers; this is for a counter at 7am */
      if(/Invalid login/i.test(m)) m="That email and password do not match.";
      else if(/Email not confirmed/i.test(m))
        m="That user has not been confirmed yet.";
      else if(/Failed to fetch|NetworkError/i.test(m))
        m="No connection. The first sign-in on a device needs one.";
      err.textContent=m;
    });
  });
  if(gateNeeded()) showGate();
}

/* Being told, rather than asking. The socket says a row changed and the page

  cloudNudgeTimer=setTimeout(function(){ cloudRun(false); },350);

     missed; while it is not, it is the whole mechanism */

  {id:"bookings",l:"Bookings",icon:"receipt",r:renderBookings},
  {id:"clients",l:"Clients",icon:"people",r:renderClients},
  {id:"catalog",l:"Catalog",icon:"tag",r:renderCatalog},
  {id:"gear",l:"Gear",icon:"surf",r:renderGear},
  {id:"crew",l:"Crew",icon:"badge",r:renderCrew},
  {id:"register",l:"Day closing",icon:"register",r:renderRegister},
  {id:"invoices",l:"Invoices",icon:"doc",r:renderInvoices},
  {id:"fees",l:"Crew pay",icon:"money",r:renderFees},
  {id:"reports",l:"Reports",icon:"chart",r:renderReports},
  {id:"settings",l:"Back office",icon:"cog",r:renderSettings}
];
var cur="today";
var tabsBox=document.getElementById("tabs");
TABS.forEach(function(t){
  var b=el("button");
  b.dataset.id=t.id; b.setAttribute("role","tab");
  b.setAttribute("aria-label",t.l); b.title=t.l;
  b.appendChild(icon(t.icon));
  b.appendChild(el("span","tip",t.l));
  b.addEventListener("click",function(){show(t.id);});
  tabsBox.appendChild(b);
});
var screenName=document.getElementById("screen-name");
function show(id){
  cur=id;
  TABS.forEach(function(t){
    document.getElementById("p-"+t.id).hidden = t.id!==id;
    if(t.id===id && screenName) screenName.textContent=t.l;
  });
  [].forEach.call(tabsBox.children,function(b){
    b.setAttribute("aria-selected",b.dataset.id===id?"true":"false");});
  try{ localStorage.setItem("shokogi.manager.tab",id); }catch(e){}
  render(false);
  scrollTo(0,0);
}
/* A screen redrawn under somebody's hands must not move.
   Every save redraws the whole panel, and now that the book is shared, so does
   every change arriving from another device -- so a counter scrolled to four
   in the afternoon was being thrown back to the top of the day each time the
   phone saved a hire. The panel is rebuilt from scratch, so the scroll cannot
   survive on its own: it is measured before and put back after, sideways as
   well as down, because the board is scrolled across far more than it is
   scrolled down. Switching screens still starts at the top -- show() resets
   after this, which is the one time moving is what you want. */
function scrollKey(n){
  var k=n.tagName+"."+(n.className||""), i=0, p=n.parentNode;
  if(p) for(var c=p.firstElementChild;c&&c!==n;c=c.nextElementSibling)
    if(c.tagName+"."+(c.className||"")===k) i++;
  return k+"#"+i;
}
function scrollPath(n,root){
  var out=[];
  for(var c=n;c&&c!==root;c=c.parentNode) out.unshift(scrollKey(c));
  return out.join(">");
}
function scrollSnap(){
  var sec=document.getElementById("p-"+cur);
  if(!sec) return null;
  var st={win:window.pageYOffset||0,box:[]};
  [].forEach.call(sec.querySelectorAll("*"),function(n){
    if(n.scrollLeft||n.scrollTop)
      st.box.push([scrollPath(n,sec),n.scrollLeft,n.scrollTop]);
  });
  return st;
}
function scrollBack(st){
  if(!st) return;
  var sec=document.getElementById("p-"+cur);
  if(!sec) return;
  var seen={};
  [].forEach.call(sec.querySelectorAll("*"),function(n){
    seen[scrollPath(n,sec)]=n;
  });
  st.box.forEach(function(r){
    var n=seen[r[0]];
    if(!n) return;
    if(r[1]) n.scrollLeft=r[1];
    if(r[2]) n.scrollTop=r[2];
  });
  if(st.win) window.scrollTo(0,st.win);
}
/* keep===false is a deliberate move to another screen, which should start
   where a screen starts. Everything else is a redraw of the screen somebody
   is already looking at, and must leave it where they left it. */
function render(keep){
  var st=(keep===false)?null:scrollSnap();
  for(var i=0;i<TABS.length;i++) if(TABS[i].id===cur){ TABS[i].r(); break; }
  scrollBack(st);
}

/* The catalog was asked for, so it should simply be there. It loads once, on a
   database nobody has put anything into yet; after a deliberate wipe the flag
   stays set and it does not come back uninvited. */
if(!DB.seeded && !DB.products.length && !DB.staff.length && seedData()){
  DB.seeded=true;
  importCatalog();
  /* clients come after the catalog, because their order lines are matched to
     products by name and to boards by unit name */
  if(peopleData() && !DB.clients.length) importPeople();
}
/* A database seeded before the tide table existed has none. It is a forecast,
   not something anyone typed, so filling it in is a refresh rather than an
   import -- and it leaves any day the school entered by hand alone. */
(function(){
  var d=seedData();
  if(!d || !(d.tides||[]).length) return;
  var have={}, added=0;
  DB.tides.forEach(function(t){ have[t.date]=true; });
  d.tides.forEach(function(t){
    if(have[t.date]) return;
    DB.tides.push({date:t.date,
      highs:(t.highs||[]).map(function(x){return x.t;}),
      lows:(t.lows||[]).map(function(x){return x.t;}),
      heights:{high:(t.highs||[]).map(function(x){return x.m;}),
               low:(t.lows||[]).map(function(x){return x.m;})},
      spot:t.spot||""});
    added++;
  });
  if(added) save();
})();

/* the agenda hours are a setting, so the board must start where it was left */
if(cfg().boardFrom!=null) BOARD_FROM=Number(cfg().boardFrom);
if(cfg().boardTo!=null) BOARD_TO=Number(cfg().boardTo);

var saved=null; try{ saved=localStorage.getItem("shokogi.manager.tab"); }catch(e){}
show(TABS.some(function(t){return t.id===saved;})?saved:"today");
})();
</script>
