<title>SHOKOGI Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f7f5f6; --panel:#fff; --panel-2:#faf7f8; --panel-3:#f2ecee;
  --line:#e6dfe2; --line-soft:#efe9eb;
  --text:#121011; --text-2:#5c5257; --text-3:#8d8288;
  --accent:#e04b78; --accent-hot:#f46e95; --accent-soft:#fdeaf0; --accent-ink:#fff;
  --good:#1f7a4d; --good-soft:#e4f4eb; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --crit:#b23a2c; --crit-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(18,16,17,.05),0 10px 26px -14px rgba(18,16,17,.22);
  --shadow-lg:0 20px 60px -20px rgba(18,16,17,.35);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
    --line:#332c30; --line-soft:#282225;
    --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
    --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
    --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
    --crit:#f0705c; --crit-soft:#3a1d18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
  --line:#332c30; --line-soft:#282225;
  --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
  --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
  --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
  --crit:#f0705c; --crit-soft:#3a1d18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Figtree,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}

/* header */
header.top{background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.top-in{max-width:1240px;margin:0 auto;padding:13px 22px 0;display:flex;align-items:center;
  gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto}
.brand img{width:34px;height:34px;display:block;flex:none}
.brand .txt{display:flex;flex-direction:column;line-height:1.15}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.brand .tag{font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3)}
nav.tabs{display:flex;gap:1px;overflow-x:auto;width:100%;margin-top:12px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:none;cursor:pointer;font:inherit;white-space:nowrap;
  font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);
  padding:10px 14px 12px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:4px}

.wrap{max-width:1240px;margin:0 auto;padding:0 22px 90px}
section[hidden]{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:26px 0 13px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.sec-h .sub{font-size:13px;color:var(--text-3)}
.sec-h .spacer{margin-left:auto}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:inherit;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 15px;border-radius:9px;cursor:pointer;transition:background .14s,border-color .14s}
.btn:hover{background:var(--panel-2);border-color:var(--text-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hot);border-color:var(--accent-hot)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:6px 11px;font-size:11px}
.btn.icon{padding:7px 10px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-top:22px}
.kpi{padding:15px 16px 16px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.03em;display:block;margin-top:7px}
.kpi .meta{font-size:12.5px;color:var(--text-2);margin-top:3px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 13px;text-align:left;white-space:nowrap}
th.r,td.r{text-align:right}
thead th{background:var(--panel-2);font-size:10.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.strong{font-weight:700}
.muted{color:var(--text-3)}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}

/* chips */
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;line-height:1.45;white-space:nowrap}
.chip.pink{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warnc{background:var(--warn-soft);color:var(--warn)}
.chip.critc{background:var(--crit-soft);color:var(--crit)}
.chip.neutral{background:var(--line-soft);color:var(--text-2)}

/* empty state */
.empty{padding:48px 26px;text-align:center}
.empty .ico{font-size:34px;line-height:1;margin-bottom:12px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--text-2);font-size:13.5px;max-width:430px;margin:0 auto 18px}

/* schedule */
.daybar{display:flex;gap:7px;overflow-x:auto;padding:3px 0 6px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybar button{appearance:none;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font:inherit;border-radius:10px;padding:8px 12px;min-width:60px;text-align:center;flex:none;
  transition:background .14s}
.daybar button:hover{background:var(--panel-2)}
.daybar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daybar .d{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.daybar .n{font-size:16px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.daybar .c{font-size:9.5px;opacity:.7}
.slot{display:grid;grid-template-columns:66px 1fr auto auto;gap:13px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--text-2)}
.slot .nm{display:flex;align-items:center;gap:10px;min-width:0}
.slot .dot{width:7px;height:26px;border-radius:3px;flex:none;background:var(--accent-hot)}
.slot .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm em{font-style:normal;font-size:12px;color:var(--text-3);display:block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.card{padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.card .nm{font-weight:700;font-size:14px;line-height:1.35}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .foot{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:6px}
.card .pr{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-right:auto}
.card .pr small{font-size:11px;color:var(--text-3);font-weight:400}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,16,17,.5);z-index:50;display:grid;
  place-items:center;padding:18px;overflow-y:auto}
.scrim[hidden]{display:none}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);
  max-height:92vh;overflow-y:auto;border:1px solid var(--line-soft)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:1}
.modal-h h3{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px 18px;display:flex;gap:9px;justify-content:flex-end;
  border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--panel)}

/* forms */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:transparent}
.fld textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12px;color:var(--text-3);margin-top:4px}
.lines-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.lines-h h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin:0}
.line{display:grid;grid-template-columns:1fr 62px 92px auto;gap:8px;align-items:center;margin-bottom:8px}
.line select,.line input{font-size:13.5px;padding:8px 9px}
.tot{display:flex;align-items:baseline;gap:10px;padding:11px 13px;background:var(--panel-2);
  border-radius:9px;margin-top:10px}
.tot .lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.tot .v{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700}

.note{font-size:13px;color:var(--text-2);background:var(--panel-2);border-left:3px solid var(--accent);
  padding:12px 15px;border-radius:0 9px 9px 0;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--panel);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  z-index:70;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.searchbar{display:flex;gap:9px;align-items:center;margin-bottom:12px}
.searchbar input{flex:1;font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}

@media (max-width:640px){
  .wrap{padding:0 13px 70px}
  .top-in{padding:12px 13px 0}
  .grid2{grid-template-columns:1fr}
  .slot{grid-template-columns:58px 1fr;gap:9px}
  .slot .cap,.slot .rowbtns{grid-column:2;justify-self:start}
  .line{grid-template-columns:1fr 54px 80px auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <img src="data:image/png;base64,/*__LOGO__*/" alt="Shokogi">
      <span class="txt"><h1>Shokogi</h1><span class="tag">Manager</span></span>
    </div>
    <button class="btn sm" id="btn-backup">Backup</button>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<div class="wrap">
  <section id="p-today" role="tabpanel"></section>
  <section id="p-schedule" role="tabpanel" hidden></section>
  <section id="p-board" role="tabpanel" hidden></section>
  <section id="p-bookings" role="tabpanel" hidden></section>
  <section id="p-clients" role="tabpanel" hidden></section>
  <section id="p-catalog" role="tabpanel" hidden></section>
  <section id="p-gear" role="tabpanel" hidden></section>
  <section id="p-crew" role="tabpanel" hidden></section>
  <section id="p-register" role="tabpanel" hidden></section>
  <section id="p-invoices" role="tabpanel" hidden></section>
  <section id="p-reports" role="tabpanel" hidden></section>
  <section id="p-settings" role="tabpanel" hidden></section>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script id="seed" type="application/json">/*__SEED__*/</script>

<script>
(function(){
"use strict";

/* ============================ store ============================
   Everything lives in this one object, persisted to localStorage.
   When a server exists, only save()/load() change -- nothing else. */
var KEY="shokogi.manager.v1";
var BLANK={v:1,clients:[],staff:[],products:[],sessions:[],bookings:[],
  spots:[{id:"sp1",name:"Playa Venao",lat:7.4283,lon:-80.1897}],
  gear:[],gearBlocks:[],timeOff:[],feeGroups:[],promos:[],partners:[],accommodations:[],
  invoices:[],invoiceSeq:1,tides:[],
  settings:{
    business:{name:"Shokogi Surf School",taxId:"",address:"",phone:"",email:"",currency:"USD"},
    methods:["Card","Cash","Online","Transfer","Other"],
    roles:["Instructor","Assistant","Photographer","Manager","Owner"],
    kinds:[{k:"lesson",l:"Lesson"},{k:"course",l:"Course / pack"},{k:"rental",l:"Rental"},
           {k:"photo",l:"Photography"},{k:"other",l:"Other"}],
    customFields:[]
  },
  seq:1};
var DB=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&d.v===1){
        /* a database saved before these existed must not arrive with holes */
        ["gear","gearBlocks","timeOff","feeGroups","promos","partners","accommodations",
         "clients","staff","products","sessions","bookings","spots","invoices",
         "tides"].forEach(function(k){
          if(!Array.isArray(d[k])) d[k]=[];
        });
        if(typeof d.invoiceSeq!=="number") d.invoiceSeq=1;
        return d;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(BLANK));
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ toast("Could not save. Browser storage may be full or blocked."); }
}
function uid(p){ return p+(DB.seq++); }

/* ============================ helpers ============================ */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* These used to be constants. They now live in DB.settings so the school can
   rename or extend them without touching the code. */
function cfg(){ 
  if(!DB.settings) DB.settings=JSON.parse(JSON.stringify(BLANK.settings));
  return DB.settings;
}
function METHODS(){ return cfg().methods; }
function KINDS(){ return cfg().kinds; }
function ROLES(){ return cfg().roles; }
function CUR(){ return cfg().business.currency||"USD"; }

function iso(d){
  var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);
  return z.toISOString().slice(0,10);
}
function todayISO(){ return iso(new Date()); }
function dm(s){ var p=String(s).split("-"); return MON[+p[1]-1]+" "+(+p[2]); }
function dowOf(s){ return DOW[new Date(s+"T12:00:00").getDay()]; }
function money(n,d){ return (Number(n)||0).toLocaleString("en-US",
  {minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

var toastEl=document.getElementById("toast"),toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);
}

function by(id,list){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function clientName(id){ var c=by(id,DB.clients); return c?c.name:"—"; }
function staffName(id){ var s=by(id,DB.staff); return s?s.name:"Unassigned"; }
function product(id){ return by(id,DB.products); }

/* booking money */
function bookingTotal(b){
  return (b.lines||[]).reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
}
function bookingPaid(b){
  return (b.payments||[]).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
}
function bookingDue(b){ return bookingTotal(b)-bookingPaid(b); }

/* ============================ modal ============================ */
var scrim=document.getElementById("scrim"),modal=document.getElementById("modal");
var lastFocus=null;
function openModal(title,bodyEl,actions){
  lastFocus=document.activeElement;
  modal.textContent="";
  var h=el("div","modal-h"); h.appendChild(el("h3",null,title));
  var x=el("button","btn sm icon x","Close");
  x.addEventListener("click",closeModal); h.appendChild(x);
  modal.appendChild(h);
  var b=el("div","modal-b"); b.appendChild(bodyEl); modal.appendChild(b);
  var f=el("div","modal-f");
  (actions||[]).forEach(function(a){
    var btn=el("button","btn "+(a.cls||""),a.label);
    btn.addEventListener("click",a.on); f.appendChild(btn);
  });
  modal.appendChild(f);
  scrim.hidden=false;
  var first=modal.querySelector("input,select,textarea,button");
  if(first) first.focus();
}
function closeModal(){
  scrim.hidden=true; modal.textContent="";
  if(lastFocus&&lastFocus.focus) lastFocus.focus();
}
scrim.addEventListener("click",function(e){ if(e.target===scrim) closeModal(); });
addEventListener("keydown",function(e){ if(e.key==="Escape"&&!scrim.hidden) closeModal(); });

function field(label,node,hint){
  var f=el("div","fld");
  var l=el("label",null,label); f.appendChild(l); f.appendChild(node);
  if(hint) f.appendChild(el("div","hint",hint));
  return f;
}
function input(type,val,attrs){
  var i=el("input"); i.type=type||"text"; if(val!=null) i.value=val;
  for(var k in (attrs||{})) i.setAttribute(k,attrs[k]);
  return i;
}
function select(options,val){
  var s=el("select");
  options.forEach(function(o){
    var op=el("option",null,o.l); op.value=o.v;
    if(String(o.v)===String(val)) op.selected=true;
    s.appendChild(op);
  });
  return s;
}
function confirmDelete(what,then){
  var b=el("div"); b.appendChild(el("p",null,"Delete "+what+"? This cannot be undone."));
  openModal("Confirm",b,[
    {label:"Cancel",on:closeModal},
    {label:"Delete",cls:"danger",on:function(){ closeModal(); then(); }}
  ]);
}

function emptyState(icon,title,text,btnLabel,onClick){
  var e=el("div","panel empty");
  e.appendChild(el("div","ico",icon));
  e.appendChild(el("h3",null,title));
  e.appendChild(el("p",null,text));
  if(btnLabel){
    var b=el("button","btn primary",btnLabel);
    b.addEventListener("click",onClick); e.appendChild(b);
  }
  return e;
}
function secHeader(host,title,sub,actionLabel,onAction){
  var h=el("div","sec-h");
  h.appendChild(el("h2",null,title));
  if(sub) h.appendChild(el("span","sub",sub));
  if(actionLabel){
    var sp=el("span","spacer"); h.appendChild(sp);
    var b=el("button","btn primary",actionLabel);
    b.addEventListener("click",onAction); h.appendChild(b);
  }
  host.appendChild(h);
}


/* ============================ custom fields on forms ============================
   The back office defines these; every form that can carry them renders them
   here, so a field added in settings actually shows up where it was aimed. */
function fieldsFor(scope){
  return (cfg().customFields||[]).filter(function(f){return f.applies===scope;});
}
function customInputs(scope,values){
  /* returns {nodes:[…], read:fn} so callers stay short */
  var defs=fieldsFor(scope), made=[];
  var wrap=el("div");
  defs.forEach(function(f,i){
    var key="cf"+i+"_"+f.label;
    var cur=(values||{})[f.label];
    var node;
    if(f.type==="checkbox"){
      node=input("checkbox"); node.checked=!!cur; node.style.width="auto";
    } else if(f.type==="select"){
      var opts=(f.options||"").split(",").map(function(x){return x.trim();})
        .filter(Boolean).map(function(x){return {v:x,l:x};});
      node=select([{v:"",l:"—"}].concat(opts),cur||"");
    } else {
      node=input(f.type==="number"?"number":(f.type==="date"?"date":"text"),cur||"");
    }
    wrap.appendChild(field(f.label+(f.required?" *":""),node));
    made.push({def:f,node:node});
  });
  return {
    node:wrap,
    any:defs.length>0,
    missing:function(){
      for(var i=0;i<made.length;i++){
        var m=made[i];
        if(!m.def.required) continue;
        var v=m.def.type==="checkbox"?m.node.checked:m.node.value;
        if(!v) return m.def.label;
      }
      return null;
    },
    read:function(){
      var out={};
      made.forEach(function(m){
        out[m.def.label]=m.def.type==="checkbox"?m.node.checked:m.node.value;
      });
      return out;
    }
  };
}

/* ============================ csv export ============================ */
function csvCell(v){
  var s=v==null?"":String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvText(headers,rows){
  return [headers.map(csvCell).join(",")]
    .concat(rows.map(function(r){return r.map(csvCell).join(",");})).join("\n");
}
function exportCsv(name,headers,rows){
  if(!rows.length){ toast("Nothing to export."); return; }
  var text=csvText(headers,rows);
  /* The viewer sandbox blocks downloads a page starts itself, so the file is
     handed over as selectable text rather than a link that silently does
     nothing. */
  var b=el("div");
  b.appendChild(el("p",null,rows.length+" rows. Copy this and save it as "+name+".csv"));
  var ta=el("textarea"); ta.value=text; ta.setAttribute("aria-label","CSV data");
  ta.style.minHeight="230px"; ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11.5px"; ta.style.whiteSpace="pre";
  b.appendChild(field("CSV",ta));
  openModal("Export "+name,b,[
    {label:"Close",on:closeModal},
    {label:"Select all",cls:"primary",on:function(){ta.focus();ta.select();toast("Now copy it");}}
  ]);
}

function cloneSessionForm(src){
  var b=el("div");
  b.appendChild(el("p",null,"Copy “"+src.title+"” to other days. Participants are not copied."));
  var from=input("date",src.date);
  var count=input("number",1,{min:"1",max:"60",step:"1"});
  var every=select([{v:"1",l:"Every day"},{v:"7",l:"Same weekday, every week"}],"1");
  var g=el("div","grid2");
  g.appendChild(field("Starting on",from)); g.appendChild(field("How many copies",count));
  b.appendChild(g);
  b.appendChild(field("Repeat",every));
  openModal("Clone session",b,[
    {label:"Cancel",on:closeModal},
    {label:"Clone",cls:"primary",on:function(){
      var n=Math.max(1,Math.min(60,Number(count.value)||1));
      var step=Number(every.value)||1;
      var start=new Date((from.value||src.date)+"T12:00:00");
      var made=0;
      for(var i=0;i<n;i++){
        var d=iso(new Date(start.getTime()+i*step*864e5));
        if(d===src.date && i===0 && from.value===src.date){ /* keep the original */ }
        DB.sessions.push({id:uid("se"),title:src.title,date:d,time:src.time,
          duration:src.duration,capacity:src.capacity,staffIds:staffIdsOf(src).slice(),
          spot:src.spot,category:src.category||"",note:src.note||"",
          tideRef:src.tideRef||"",tidePos:src.tidePos||"before",tideHours:src.tideHours||0,
          participants:[]});
        made++;
      }
      save(); closeModal(); render(); toast(made+" session"+(made===1?"":"s")+" created");
    }}
  ]);
}


/* ============================ tides ============================
   Tide times are entered, never guessed. An empty day simply says so rather
   than drawing a curve that would be fiction. */
function tideFor(dateStr){
  for(var i=0;i<DB.tides.length;i++) if(DB.tides[i].date===dateStr) return DB.tides[i];
  return null;
}
function parseTimes(str){
  return String(str||"").split(/[,\s]+/).map(function(x){return x.trim();})
    .filter(function(x){return /^\d{1,2}:\d{2}$/.test(x);})
    .map(function(x){var p=x.split(":");
      return String(+p[0]).padStart(2,"0")+":"+p[1];});
}
function tideForm(dateStr){
  var t=tideFor(dateStr)||{date:dateStr,highs:[],lows:[]};
  var b=el("div");
  b.appendChild(el("p","hint",
    "Tide times for "+dowOf(dateStr)+", "+dm(dateStr)+". Enter them as 24-hour times separated by commas, for example 09:52, 22:14."));
  var hi=input("text",(t.highs||[]).join(", "),{placeholder:"09:52, 22:14"});
  var lo=input("text",(t.lows||[]).join(", "),{placeholder:"03:40, 16:08"});
  b.appendChild(field("High tide",hi));
  b.appendChild(field("Low tide",lo));
  openModal("Tides",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      var rec=tideFor(dateStr);
      if(!rec){ rec={date:dateStr}; DB.tides.push(rec); }
      rec.highs=parseTimes(hi.value); rec.lows=parseTimes(lo.value);
      save(); closeModal(); render(); toast("Tides saved");
    }}
  ]);
}

/* ============================ board ============================
   The timeline: rows are activity calendars or instructors, columns are hours,
   and a session is a block you can drag onto another row or another time. */
var boardDate=todayISO(), boardGroup="category";
var BOARD_FROM=5, BOARD_TO=20;
function minsOf(hhmmStr){
  var p=String(hhmmStr||"09:00").split(":");
  return (+p[0])*60+(+p[1]||0);
}
function toHHMM(mins){
  mins=Math.max(0,Math.min(24*60-1,Math.round(mins)));
  return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}
function boardRows(){
  if(boardGroup==="staff"){
    /* unassigned sits at the top: it is the pile you are trying to clear */
    var rows=[{key:"",label:"Unassigned",color:""}];
    return rows.concat(DB.staff.slice()
      .sort(function(a,b){return a.name.localeCompare(b.name);})
      .map(function(x){return {key:x.id,label:x.name,color:""};}));
  }
  var seen={},out=[];
  (cfg().kinds||[]).forEach(function(k){
    if(seen[k.l]) return; seen[k.l]=1;
    out.push({key:k.l,label:k.l,color:k.color||""});
  });
  out.push({key:"",label:"No calendar",color:""});
  return out;
}
function sessionInRow(x,row){
  if(boardGroup==="staff"){
    var ids=staffIdsOf(x);
    return row.key ? ids.indexOf(row.key)>=0 : ids.length===0;
  }
  return (x.category||"")===row.key;
}
function renderBoard(){
  var host=document.getElementById("p-board"); host.textContent="";
  var top=el("div","sec-h");

  top.appendChild(ns);
  host.appendChild(top);

  var nav=el("div","daybar");
  var pv=el("button"); pv.appendChild(el("div","n","‹"));
  pv.addEventListener("click",function(){
    boardDate=iso(new Date(new Date(boardDate+"T12:00:00").getTime()-864e5));renderBoard();});
  nav.appendChild(pv);
  var base=new Date(boardDate+"T12:00:00");
  for(var i=-2;i<=4;i++){
    (function(off){
      var d=new Date(base.getTime()+off*864e5),k=iso(d);
      var n=DB.sessions.filter(function(x){return x.date===k;}).length;
      var b=el("button");
      b.setAttribute("aria-pressed",k===boardDate?"true":"false");
      b.appendChild(el("div","d",DOW[d.getDay()]+" "+MON[d.getMonth()]));
      b.appendChild(el("div","n",String(d.getDate())));
      b.appendChild(el("div","c",n?n+" act":"—"));
      b.addEventListener("click",function(){boardDate=k;renderBoard();});
      nav.appendChild(b);
    })(i);
  }
  var nx=el("button"); nx.appendChild(el("div","n","›"));
  nx.addEventListener("click",function(){
    boardDate=iso(new Date(new Date(boardDate+"T12:00:00").getTime()+864e5));renderBoard();});
  nav.appendChild(nx);
  host.appendChild(nav);

  /* tide strip */
  var tide=tideFor(boardDate);
  var tideBar=el("div","panel"); tideBar.style.cssText=
    "margin-top:12px;padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap";
  tideBar.appendChild(el("span","eyebrow","Tide"));
  if(tide&&((tide.highs||[]).length||(tide.lows||[]).length)){
    (tide.highs||[]).forEach(function(h){
      var c=el("span","chip pink","High "+h); tideBar.appendChild(c);});
    (tide.lows||[]).forEach(function(l){
      var c=el("span","chip neutral","Low "+l); tideBar.appendChild(c);});
  } else {
    tideBar.appendChild(el("span","hint","Not set for this day"));
  }
  var te=el("button","btn sm","Edit tides"); te.style.marginLeft="auto";
  te.addEventListener("click",function(){tideForm(boardDate);});
  tideBar.appendChild(te);
  host.appendChild(tideBar);

  /* the grid */
  var span=(BOARD_TO-BOARD_FROM)*60;
  var wrap=el("div","panel"); wrap.style.cssText="margin-top:12px;overflow-x:auto";
  var grid=el("div"); grid.style.cssText="min-width:940px;position:relative";

  var head=el("div");
  head.style.cssText="display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--line);"+
    "position:sticky;top:0;background:var(--panel-2);z-index:2";
  head.appendChild(el("div"));
  var hours=el("div"); hours.style.cssText="position:relative;height:30px";
  for(var h=BOARD_FROM;h<=BOARD_TO;h++){
    (function(hh){
      var x=((hh-BOARD_FROM)*60)/span*100;
      var l=el("div",null,String(hh).padStart(2,"0")+":00");
      l.style.cssText="position:absolute;left:"+x+"%;top:8px;font-size:10.5px;"+
        "font-family:'IBM Plex Mono',monospace;color:var(--text-3);transform:translateX(-50%)";
      hours.appendChild(l);
    })(h);
  }
  /* tide markers ride the same scale as the hours */
  if(tide){
    (tide.highs||[]).concat(tide.lows||[]).forEach(function(t,i){
      var isHigh=(tide.highs||[]).indexOf(t)>=0;
      var m=minsOf(t);
      if(m<BOARD_FROM*60||m>BOARD_TO*60) return;
      var x=(m-BOARD_FROM*60)/span*100;
      var mk=el("div");
      mk.style.cssText="position:absolute;left:"+x+"%;top:0;bottom:0;width:2px;"+

      mk.title=(isHigh?"High":"Low")+" tide "+t;
      hours.appendChild(mk);
    });
  }
  head.appendChild(hours); grid.appendChild(head);

  var rows=boardRows();
  var byRow=0;
  rows.forEach(function(row){
    var items=DB.sessions.filter(function(x){

    lane.dataset.rowKey=row.key;
    lane.addEventListener("dragover",function(e){e.preventDefault();
      lane.style.background="var(--accent-soft)";});
    lane.addEventListener("dragleave",function(){lane.style.background="";});

      e.preventDefault(); lane.style.background="";

      var rect=lane.getBoundingClientRect();

      ses.time=toHHMM(Math.round(mins/15)*15);
      if(boardGroup==="staff"){
        ses.staffIds=row.key?[row.key]:[];
        delete ses.staffId;
      } else {
        ses.category=row.key;
      }
      save(); renderBoard();
      toast(ses.title+" → "+(row.label)+" at "+ses.time);
    });

    items.forEach(function(x){
      var st=minsOf(x.time)-BOARD_FROM*60;
      var dur=Math.max(15,x.duration||60);

/* ============================ register (day closing) ============================
   A payment is money against a booking, and a booking's items each belong to a
   category. A payment is therefore split across categories in proportion to the
   booking's item values -- the same way the day report is built elsewhere. */
var regDate=todayISO();
function closingFor(dateStr){
  var byMethod={},byKind={},total=0,count=0;
  DB.bookings.forEach(function(bk){
    var weights={},wtot=0;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId); if(!p) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ weights[p.kind]=(weights[p.kind]||0)+v; wtot+=v; }
    });
    (bk.payments||[]).forEach(function(pay){
      if((pay.date||bk.date)!==dateStr) return;
      var amt=Number(pay.amount)||0; if(!amt) return;
      total+=amt; count++;
      byMethod[pay.method]=(byMethod[pay.method]||0)+amt;
      if(wtot>0){
        for(var k in weights) byKind[k]=(byKind[k]||0)+amt*weights[k]/wtot;
      } else {
        byKind.other=(byKind.other||0)+amt;
      }
    });
  });
  return {date:dateStr,total:total,count:count,byMethod:byMethod,byKind:byKind};
}
function renderRegister(){
  var host=document.getElementById("p-register"); host.textContent="";
  secHeader(host,"Day closing",null,null,null);

  var bar=el("div","daybar");
  var base=new Date(regDate+"T12:00:00");
  for(var i=-6;i<=1;i++){
    (function(off){
      var d=new Date(base.getTime()+off*864e5),k=iso(d);
      var c=closingFor(k);
      var b=el("button");
      b.setAttribute("aria-pressed",k===regDate?"true":"false");
      b.appendChild(el("div","d",DOW[d.getDay()]));
      b.appendChild(el("div","n",String(d.getDate())));
      b.appendChild(el("div","c",c.total?"$"+money(c.total,0):"—"));
      b.addEventListener("click",function(){regDate=k;renderRegister();});
      bar.appendChild(b);
    })(i);
  }
  host.appendChild(bar);

  var c=closingFor(regDate);
  var k=el("div","kpis");
  [{l:"Takings",v:"$"+money(c.total,2),m:dowOf(regDate)+", "+dm(regDate)},
   {l:"Payments",v:String(c.count),m:c.count?("$"+money(c.total/c.count,2)+" average"):"nothing recorded"}]
  .forEach(function(it){
    var p=el("div","panel kpi");
    p.appendChild(el("div","eyebrow",it.l));
    p.appendChild(el("span","val mono",it.v));
    p.appendChild(el("div","meta",it.m));
    k.appendChild(p);
  });
  host.appendChild(k);

  if(!c.count){
    host.appendChild(el("div","note",
      "No payments recorded on "+dm(regDate)+". Takings appear here as soon as a booking is paid."));
    return;
  }
  function tableOf(title,obj,labelFn){
    var wrap=el("div");
    var h=el("div","sec-h"); h.appendChild(el("h2",null,title)); wrap.appendChild(h);
    var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
    tr.appendChild(el("th",null,"")); tr.appendChild(el("th","r","Amount"));
    tr.appendChild(el("th","r","Share"));
    th.appendChild(tr); t.appendChild(th);
    var tb=el("tbody");
    Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];}).forEach(function(key){
      var r=el("tr");
      r.appendChild(el("td","strong",labelFn?labelFn(key):key));
      r.appendChild(el("td","n r","$"+money(obj[key],2)));
      r.appendChild(el("td","n r muted",Math.round(obj[key]/c.total*100)+"%"));
      tb.appendChild(r);
    });
    var tr2=el("tr");
    tr2.appendChild(el("td","strong","Total"));
    tr2.appendChild(el("td","n r strong","$"+money(c.total,2)));
    tr2.appendChild(el("td","n r muted","100%"));
    tb.appendChild(tr2);
    t.appendChild(tb); w.appendChild(t); wrap.appendChild(w);
    return wrap;
  }
  host.appendChild(tableOf("By payment method",c.byMethod));
  host.appendChild(tableOf("By activity",c.byKind,kindLabel));
  host.appendChild(el("div","note",
    "A payment that covers several items is split across activities in proportion to what those items cost."));
}



/* ============================ invoices ============================
   An invoice is a frozen copy of a booking, not a live view of it: editing the
   booking afterwards must not silently rewrite a document already given to a
   customer. */
function invoiceFor(bookingId){
  for(var i=0;i<DB.invoices.length;i++)
    if(DB.invoices[i].bookingId===bookingId) return DB.invoices[i];
  return null;
}
function issueInvoice(bk){
  var existing=invoiceFor(bk.id);
  if(existing) return existing;
  var bz=cfg().business;
  var inv={
    id:uid("inv"),
    number:String(new Date().getFullYear())+"-"+String(DB.invoiceSeq++).padStart(4,"0"),
    bookingId:bk.id, date:todayISO(), clientId:bk.clientId,
    clientName:clientName(bk.clientId),
    business:{name:bz.name,taxId:bz.taxId,address:bz.address,phone:bz.phone,
              email:bz.email,currency:bz.currency},
    lines:(bk.lines||[]).map(function(l){
      var p=product(l.productId);
      return {name:p?p.name:"Item",qty:Number(l.qty)||0,price:Number(l.price)||0,
              tax:p&&p.tax?Number(p.tax):0};
    }),
    payments:(bk.payments||[]).map(function(x){
      return {method:x.method,amount:Number(x.amount)||0,date:x.date};}),
    notes:bk.notes||""
  };
  inv.total=inv.lines.reduce(function(a,l){return a+l.qty*l.price;},0);
  inv.paid=inv.payments.reduce(function(a,p){return a+p.amount;},0);
  DB.invoices.push(inv);
  save();
  return inv;
}

var repMode="month", repAnchor=todayISO().slice(0,7);
function periodOf(dateStr){
  return repMode==="month" ? dateStr.slice(0,7) : dateStr.slice(0,4);
}
function repRange(){
  return repMode==="month" ? repAnchor : repAnchor.slice(0,4);
}
function paymentsIn(prefix){
  /* every payment whose date starts with the period, with its booking alongside */
  var out=[];
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      var d=p.date||bk.date;
      if(d && d.indexOf(prefix)===0) out.push({pay:p,amount:Number(p.amount)||0,date:d,bk:bk});
    });
  });
  return out;
}
function splitByKind(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.kind]=(w[pr.kind]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
    else out.other=(out.other||0)+r.amount;
  });
  return out;
}
function splitByProduct(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.name]=(w[pr.name]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
  });
  return out;
}
function shiftPeriod(step){
  if(repMode==="month"){
    var y=+repAnchor.slice(0,4), m=+repAnchor.slice(5,7)+step;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    repAnchor=y+"-"+String(m).padStart(2,"0");
  } else {
    repAnchor=String(+repAnchor.slice(0,4)+step)+"-01";
  }
  renderReports();
}
function periodLabel(){
  if(repMode==="month"){
    return MON[+repAnchor.slice(5,7)-1]+" "+repAnchor.slice(0,4);
  }
  return repAnchor.slice(0,4);
}
function barTable(host,title,obj,total,labelFn){
  var h=el("div","sec-h"); h.appendChild(el("h2",null,title)); host.appendChild(h);
  var keys=Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];});
  if(!keys.length){ host.appendChild(el("div","note","Nothing in this period.")); return; }
  var box=el("div","panel"); box.style.padding="17px 18px 8px";
  var mx=Math.max.apply(null,keys.map(function(k){return obj[k];}).concat([1]));
  keys.forEach(function(k){
    var row=el("div","row");
    row.appendChild(el("span","nm",labelFn?labelFn(k):k));
    var v=el("span","vl mono","$"+money(obj[k],2));
    if(total) v.appendChild(el("small",null,Math.round(obj[k]/total*100)+"%"));
    row.appendChild(v);
    var b=el("div","bar"),i=el("i");
    i.style.width=(obj[k]/mx*100)+"%"; i.style.background="var(--accent-hot)";
    b.appendChild(i); row.appendChild(b); box.appendChild(row);
  });
  host.appendChild(box);
}

function listEditor(title,hint,items,opts){
  /* opts: {read(item)->label, form(item|null, done), del(item), addLabel} */
  var wrap=el("div","panel");
  var h=el("div","day-h");
  h.appendChild(el("h3",null,title));
  var add=el("button","btn sm primary",opts.addLabel||"Add");
  add.style.marginLeft="auto";
  add.addEventListener("click",function(){opts.form(null);});
  h.appendChild(add);
  wrap.appendChild(h);
  if(hint) { var hn=el("div","hint",hint); hn.style.padding="10px 16px 0"; wrap.appendChild(hn); }
  if(!items.length){
    var e=el("div","hint","Nothing here yet.");
    e.style.padding="14px 16px"; wrap.appendChild(e);
    return wrap;
  }
  items.forEach(function(it,i){
    var r=el("div","slot"); r.style.gridTemplateColumns="1fr auto";
    var nm=el("div","nm");
    var txt=el("div");
    var read=opts.read(it);
    txt.appendChild(el("b",null,read.title));
    if(read.sub) txt.appendChild(el("em",null,read.sub));
    nm.appendChild(txt); r.appendChild(nm);
    var box=el("div","rowbtns");
    var e2=el("button","btn sm","Edit");
    e2.addEventListener("click",function(){opts.form(it,i);});
    box.appendChild(e2);
    if(opts.del){
      var d=el("button","btn sm danger","Del");
      d.addEventListener("click",function(){
        confirmDelete(read.title,function(){opts.del(it,i);save();render();toast("Deleted");});
      });
      box.appendChild(d);
    }
    r.appendChild(box);
    wrap.appendChild(r);
  });
  return wrap;
}

/* ============================ starter catalog ============================
   The school's real product list, exported from Bloowatch. It is offered, not
   forced: the app still starts empty and this only lands when asked for. */
function seedData(){
  try{
    var n=document.getElementById("seed");
    if(!n) return null;
    var d=JSON.parse(n.textContent||"null");
    return (d&&d.products&&d.products.length)?d:null;
  }catch(e){ return null; }
}
function importCatalog(){
  var d=seedData();
  if(!d){ toast("No catalog is bundled with this build."); return; }
  var added={products:0,gear:0,units:0,spots:0,kinds:0,crew:0,sessions:0,cats:0};

  d.products.forEach(function(p){
    if(DB.products.some(function(x){return x.name===p.name;})) return;
    DB.products.push({id:uid("p"),name:p.name,kind:p.kind,price:p.price||0,
      sessions:p.sessions||1,category:p.category||"",tax:p.tax||0,color:p.color||"",
      nights:p.nights||null,description:p.description||""});
    added.products++;
  });
  (d.gear||[]).forEach(function(g){
    if(DB.gear.some(function(x){return x.name===g.name;})) return;
    var units=(g.units||[]).map(function(u){
      return {id:uid("u"),name:u.name||"",maxPax:u.maxPax||1,
              lastCheck:u.lastCheck||"",nextCheck:u.nextCheck||"",notes:u.notes||""};
    });
    DB.gear.push({id:uid("g"),name:g.name,units:units,description:g.description||""});
    added.gear++; added.units+=units.length;
  });

  /* activity calendars become activity types, keeping their colour */
  (d.categories||[]).forEach(function(c){
    if(!c.name) return;
    var code=c.name.toLowerCase().replace(/[^a-z0-9]+/g,"_");
    if(cfg().kinds.some(function(k){return k.k===code||k.l===c.name;})) return;
    cfg().kinds.push({k:code,l:c.name,color:c.color||""});
    added.cats++;
  });
  (d.staff||[]).forEach(function(st){
    if(DB.staff.some(function(x){return x.name===st.name;})) return;
    DB.staff.push({id:uid("s"),name:st.name,role:st.role||"Instructor",phone:"",email:""});
    added.crew++;
    if(cfg().roles.indexOf(st.role)<0 && st.role) cfg().roles.push(st.role);
  });
  (d.spots||[]).forEach(function(sp){
    if(DB.spots.some(function(x){return x.name===sp.name;})) return;
    DB.spots.push({id:uid("sp"),name:sp.name,lat:sp.lat,lon:sp.lon,notes:sp.notes||""});
    added.spots++;
  });
  /* every kind the imported products use must exist, or they group as "other" */
  d.products.forEach(function(p){
    if(!cfg().kinds.some(function(k){return k.k===p.kind;})){
      cfg().kinds.push({k:p.kind,l:p.kind.charAt(0).toUpperCase()+p.kind.slice(1)});
      added.kinds++;
    }
  });
  /* the schedule, without participants -- those point at clients, which stay put */
  (d.sessions||[]).forEach(function(x){
    if(DB.sessions.some(function(y){
      return y.date===x.date && y.time===x.time && y.title===x.title;})) return;
    DB.sessions.push({id:uid("se"),title:x.title,date:x.date,time:x.time,
      duration:x.duration||60,capacity:x.capacity||1,
      spot:(DB.spots[0]||{}).name||"",tideRef:"",tidePos:"before",tideHours:0,
      participants:[],category:x.category||"",note:"",staffIds:[]});
    added.sessions++;
  });

  save();
  if(typeof cur!=="undefined" && cur) render();
  toast("Loaded "+added.products+" products, "+added.crew+" crew, "+
        added.units+" gear items and "+added.sessions+" sessions");
}
function importPrompt(){
  var d=seedData();
  var b=el("div");
  if(!d){
    b.appendChild(el("p",null,"This build does not carry a catalog."));
    openModal("Import catalog",b,[{label:"Close",on:closeModal}]);
    return;
  }
  b.appendChild(el("p",null,
    "Brings in "+d.products.length+" products, "+(d.staff||[]).length+" crew, "+
    (d.gear||[]).reduce(function(a,g){return a+(g.units||[]).length;},0)+
    " individual gear items, "+(d.sessions||[]).length+" scheduled sessions and "+
    (d.spots||[]).length+" spots — with prices, session counts, categories, colours and roles."));
  b.appendChild(el("p","hint",
    "Nothing is overwritten — anything already here under the same name is skipped, so running this twice is harmless. No clients, bookings or history come across, and crew arrive as names and roles only, without phone numbers or email addresses."));
  var list=el("div","panel"); list.style.maxHeight="230px"; list.style.overflowY="auto";
  d.products.slice().sort(function(a,b2){return (b2.price||0)-(a.price||0);}).forEach(function(p){
    var r=el("div","slot"); r.style.gridTemplateColumns="1fr auto"; r.style.padding="8px 14px";
    var nm=el("div"); nm.appendChild(el("b",null,p.name));
    nm.appendChild(el("em",null,kindLabel(p.kind)+(p.category?" · "+p.category:"")));
    r.appendChild(nm);
    r.appendChild(el("div","mono","$"+money(p.price,0)));
    list.appendChild(r);
  });
  b.appendChild(list);
  openModal("Import catalog",b,[
    {label:"Cancel",on:closeModal},
    {label:"Import",cls:"primary",on:function(){closeModal();importCatalog();}}
  ]);
}

/* ============================ backup ============================ */
function backupForm(){
  var b=el("div");
  b.appendChild(el("p",null,
    "Your data lives in this browser only. It is not on a server and does not follow you to another device, so keep a copy."));
  var ta=el("textarea");
  ta.value=JSON.stringify(DB);
  ta.setAttribute("aria-label","Backup data");
  ta.style.minHeight="150px";
  ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11px";
  b.appendChild(field("Backup — copy this somewhere safe",ta));

  var imp=el("textarea"); imp.placeholder="Paste a backup here to restore it";
  b.appendChild(field("Restore",imp,"Restoring replaces everything currently in the system."));

  openModal("Backup & restore",b,[
    {label:"Close",on:closeModal},
    {label:"Select backup",on:function(){ta.focus();ta.select();toast("Now copy it");}},
    {label:"Restore",cls:"danger",on:function(){
      var raw=imp.value.trim();
      if(!raw){ toast("Paste a backup into the restore box first."); return; }
      var parsed;
      try{ parsed=JSON.parse(raw); }
      catch(e){ toast("That is not a valid backup — the text is not readable JSON."); return; }
      if(!parsed||parsed.v!==1||!Array.isArray(parsed.clients)){
        toast("That backup is not from this system."); return;
      }
      DB=parsed; save(); closeModal(); render(); toast("Backup restored");
    }}
  ]);
}
document.getElementById("btn-backup").addEventListener("click",backupForm);

/* ============================ tabs ============================ */
var TABS=[{id:"today",l:"Today",r:renderToday},
  {id:"schedule",l:"Planning",r:renderSchedule},
  {id:"board",l:"Board",r:renderBoard},
  {id:"bookings",l:"Bookings",r:renderBookings},
  {id:"clients",l:"Clients",r:renderClients},
  {id:"catalog",l:"Catalog",r:renderCatalog},
  {id:"gear",l:"Gear",r:renderGear},
  {id:"crew",l:"Crew",r:renderCrew},
  {id:"register",l:"Day closing",r:renderRegister},
  {id:"invoices",l:"Invoices",r:renderInvoices},
  {id:"reports",l:"Reports",r:renderReports},
  {id:"settings",l:"Back office",r:renderSettings}];
var cur="today";
var tabsBox=document.getElementById("tabs");
TABS.forEach(function(t){
  var b=el("button",null,t.l);
  b.dataset.id=t.id; b.setAttribute("role","tab");
  b.addEventListener("click",function(){show(t.id);});
  tabsBox.appendChild(b);
});
function show(id){
  cur=id;
  TABS.forEach(function(t){ document.getElementById("p-"+t.id).hidden = t.id!==id; });
  [].forEach.call(tabsBox.children,function(b){
    b.setAttribute("aria-selected",b.dataset.id===id?"true":"false");});
  try{ localStorage.setItem("shokogi.manager.tab",id); }catch(e){}
  render();
  scrollTo(0,0);
}
function render(){
  for(var i=0;i<TABS.length;i++) if(TABS[i].id===cur){ TABS[i].r(); return; }
}

/* The catalog was asked for, so it should simply be there. It loads once, on a
   database nobody has put anything into yet; after a deliberate wipe the flag
   stays set and it does not come back uninvited. */
if(!DB.seeded && !DB.products.length && !DB.staff.length && seedData()){
  DB.seeded=true;
  importCatalog();
}

var saved=null; try{ saved=localStorage.getItem("shokogi.manager.tab"); }catch(e){}
show(TABS.some(function(t){return t.id===saved;})?saved:"today");
})();
</script>
