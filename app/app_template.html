/* ---- discount, kept apart from simply overriding the price ---- */
function priceEditForm(line,onDone){
  var pr=product(line.productId);
  var base=priceFor(pr,line.pax,line.hours);
  var b=el("div");
  b.appendChild(el("p","hint",(pr?pr.name:"Item")+" — tier price $"+money(base)));
  /* their form leads with the discount, and that is the common case */
  var mode=select([{v:"discount",l:"Register a discount"},
                   {v:"adjust",l:"Update the price"}],
    (line.manual?"adjust":"discount"));
  var val=input("number",line.discount!=null?line.discount:(line.manual?line.price:""),
    {min:"0",step:"0.01",placeholder:"0"});
  var kind=select([{v:"amount",l:"Amount off"},{v:"percent",l:"Percent off"}],
    line.discountType||"amount");
  b.appendChild(field("What are you doing?",mode));
  var kindBox=field("Discount type",kind);
  b.appendChild(kindBox);
  var valBox=field("Value",val);
  b.appendChild(valBox);
  var preview=el("div","tot");
  preview.appendChild(el("span","lab","Charged"));
  var pv=el("span","v mono"); preview.appendChild(pv);
  b.appendChild(preview);
  function calc(){
    var v=Number(val.value)||0;
    if(mode.value==="adjust") return v;
    return kind.value==="percent" ? Math.max(0,base*(1-v/100)) : Math.max(0,base-v);
  }
  function sync(){
    kindBox.hidden = mode.value!=="discount";
    pv.textContent="$"+money(calc());
    var over = mode.value==="discount" && calc()>base+0.004;
    pv.style.color = over ? "var(--crit)" : "";
  }
  [mode,kind,val].forEach(function(n){
    n.addEventListener("input",sync); n.addEventListener("change",sync);});
  sync();
  openModal("Edit price",b,[
    {label:"Cancel",on:closeModal},
    {label:"Clear",on:function(){
      delete line.discount; delete line.discountType; delete line.manual;
      line.price=base; closeModal(); onDone(); toast("Back to the tier price");
    }},
    {label:"Apply",cls:"primary",on:function(){
      var v=Number(val.value)||0;
      if(mode.value==="discount"){
        if(calc()>base+0.004){
          toast("That raises the price — use Update the price instead."); return; }
        line.discount=v; line.discountType=kind.value; delete line.manual;
        line.price=Math.round(calc()*100)/100;
      } else {
        delete line.discount; delete line.discountType;
        line.manual=true; line.price=v;
      }
      closeModal(); onDone(); toast("Price updated");
    }}
  ]);
}

/* ============================ session assignment ============================
   A three-lesson course is three seats, not one. This is where a booking's
   people are put into the sessions they bought, and where the app can say how
   many are still owed. */
function sessionsOwed(line){
  var pr=product(line.productId);
  if(!pr) return 0;
  if(pr.sessionsAtBooking) return Number(line.sessions)||0;
  var per=Number(pr.sessions)||1;
  if(per<=1) return 0;                       /* a single session needs no picking */
  return per*(Number(line.qty)||1);
}
function seatsOfBooking(bk){
  var named=(bk.participants||[]).filter(function(p){return p.pid;});
  if(named.length) return named.map(function(p){
    return {ref:seatRef("participant",bk.id,p.pid),name:p.name};});
  if(bk.clientId) return [{ref:seatRef("client",bk.clientId),name:clientName(bk.clientId)}];
  return [];
}
function assignedCount(bk,line){
  var refs=seatsOfBooking(bk).map(function(x){return x.ref;});
  if(!refs.length) return 0;
  var n=0;
  DB.sessions.forEach(function(se){
    if((se.fromLines||[]).indexOf(line.lid)<0) return;
    se.participants.forEach(function(r){ if(refs.indexOf(r)>=0) n++; });
  });
  return n;
}
function assignSessionsForm(bk,line,onDone){
  var pr=product(line.productId);
  var owed=sessionsOwed(line);
  var seats=seatsOfBooking(bk);
  var b=el("div");
  if(!seats.length){
    b.appendChild(el("p",null,"Name at least one participant on the booking first."));
    openModal("Assign sessions",b,[{label:"Close",on:closeModal}]);
    return;
  }
  var head=el("p","hint");
  b.appendChild(head);
  var from=input("date",bk.date);
  var days=input("number",30,{min:"1",max:"180",step:"1"});
  var g=el("div","grid2");
  g.appendChild(field("Look from",from)); g.appendChild(field("Days ahead",days));
  b.appendChild(g);
  var listHost=el("div");
  listHost.style.cssText="max-height:44vh;overflow-y:auto;margin-top:6px";
  b.appendChild(listHost);

  function refreshHead(){
    var n=assignedCount(bk,line);
    head.textContent=(pr?pr.name:"Product")+" — "+n+" of "+owed+
      " session"+(owed===1?"":"s")+" assigned"+
      (seats.length>1?(" across "+seats.length+" people"):"")+".";
    head.style.color = n>=owed ? "var(--good)" : "var(--warn)";
  }
  function draw(){
    refreshHead();
    listHost.textContent="";
    var start=from.value||bk.date;
    var end=iso(new Date(new Date(start+"T12:00:00").getTime()+
      (Number(days.value)||30)*864e5));
    var rows=DB.sessions.filter(function(se){
      return se.date>=start && se.date<=end;
    }).sort(function(a,b2){
      return a.date===b2.date ? (a.time<b2.time?-1:1) : (a.date<b2.date?-1:1);});
    if(!rows.length){
      listHost.appendChild(el("div","note","No sessions scheduled in that window."));
      return;
    }
    var lastDate="";
    rows.forEach(function(se){
      if(se.date!==lastDate){
        lastDate=se.date;
        var h=el("div","eyebrow",dowOf(se.date)+" · "+dm(se.date));
        h.style.cssText="padding:11px 2px 6px;font-size:10.5px;font-weight:700;"+
          "letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)";
        listHost.appendChild(h);
      }
      var here=seats.filter(function(x){return se.participants.indexOf(x.ref)>=0;});
      var row=el("div");
      row.style.cssText="display:flex;align-items:center;gap:10px;padding:9px 11px;"+
        "border:1px solid "+(here.length?"var(--accent)":"var(--line-soft)")+
        ";border-radius:9px;margin-bottom:6px;background:"+
        (here.length?"var(--accent-soft)":"var(--panel-2)");
      var mid=el("div"); mid.style.flex="1";
      var t=el("div",null,se.time+" · "+se.title);
      t.style.cssText="font-weight:600;font-size:13.5px";
      mid.appendChild(t);
      var bits=[instructorNames(se)];
      if(se.spot) bits.push(se.spot);
      bits.push(se.participants.length+"/"+se.capacity);
      mid.appendChild(el("div","hint",bits.join(" · ")));
      row.appendChild(mid);
      if(here.length) row.appendChild(el("span","chip ok",here.length+" seated"));
      var btn=el("button","btn sm"+(here.length?" danger":" primary"),
        here.length?"Remove":"Add all");
      btn.type="button";
      btn.addEventListener("click",function(){
        if(here.length){
          se.participants=se.participants.filter(function(r){
            return !seats.some(function(x){return x.ref===r;});});
          se.fromLines=(se.fromLines||[]).filter(function(x){return x!==line.lid;});
        } else {
          var room=se.capacity-se.participants.length;
          if(room<=0){ toast(se.title+" is full."); return; }
          var take=seats.filter(function(x){
            return se.participants.indexOf(x.ref)<0;}).slice(0,room);
          if(take.length<seats.length)
            toast("Only "+take.length+" of "+seats.length+" fitted.");
          take.forEach(function(x){ se.participants.push(x.ref); });
          se.fromLines=(se.fromLines||[]).concat([line.lid]);
        }
        save(); draw(); render();
      });
      row.appendChild(btn);
      listHost.appendChild(row);
    });
  }
  from.addEventListener("change",draw);
  days.addEventListener("input",draw);
  draw();
  openModal("Assign sessions",b,[{label:"Done",cls:"primary",on:function(){
    closeModal(); onDone(); }}]);
}

/* ============================ bookings ============================ */
function bookingForm(existing){
  if(!DB.products.length){ toast("Add a product to the catalog first."); return; }
  var bk=existing||{date:todayISO(),clientId:DB.clients[0]?DB.clients[0].id:null,
    lines:[],payments:[],notes:""};
  var working={lines:(bk.lines||[]).map(function(l){
                 var c=JSON.parse(JSON.stringify(l));
                 if(!c.lid) c.lid=uid("ln");
                 return c;
               }),
               payments:JSON.parse(JSON.stringify(bk.payments||[])),
               participants:JSON.parse(JSON.stringify(bk.participants||[]))};


  var b=el("div");
  var date=input("date",bk.date);
  var clientOpts=DB.clients.map(function(c){return {v:c.id,l:c.name};});
  var client=select(clientOpts.length?clientOpts:[{v:"",l:"— no clients yet —"}],bk.clientId||"");
  var g=el("div","grid2");
  g.appendChild(field("Date",date)); g.appendChild(field("Client",client));
  b.appendChild(g);

  var linesHost=el("div"), payHost=el("div");
  var totBox=el("div","tot");
  var totLab=el("span","lab","Total"), totV=el("span","v mono","$0.00");
  var dueLab=el("span","lab"), dueV=el("span","v mono");
  totBox.appendChild(totLab); totBox.appendChild(totV);
  var dueBox=el("div","tot");
  dueBox.appendChild(dueLab); dueBox.appendChild(dueV);

  function recalc(){
    if(typeof pblock!=="undefined" && pblock) pblock.redraw();
    var t=working.lines.reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
    var p=working.payments.reduce(function(a,x){return a+(Number(x.amount)||0);},0);
    totV.textContent="$"+money(t);
    dueLab.textContent = p>=t ? "Paid in full" : "Outstanding";
    dueV.textContent="$"+money(Math.max(0,t-p));
    dueV.style.color = p>=t ? "var(--good)" : "var(--crit)";
  }
  function drawLines(){
    linesHost.textContent="";
    if(!working.lines.length){
      var e=el("div","hint","No products on this booking yet.");
      e.style.padding="10px 2px";
      linesHost.appendChild(e);
      return;
    }
    working.lines.forEach(function(l,idx){
      var pr0=product(l.productId);
      var wantPax=hasPaxTiers(pr0), wantHours=hasHourTiers(pr0);

      var card=el("div");
      card.style.cssText="border:1px solid var(--line-soft);border-radius:10px;"+
        "padding:11px 12px;margin-bottom:9px;background:var(--panel-2)";

      var top=el("div");
      top.style.cssText="display:flex;align-items:baseline;gap:9px;margin-bottom:8px";
      var nm=el("div",null,pr0?pr0.name:"—");
      nm.style.cssText="font-weight:600;font-size:13.5px;flex:1";
      top.appendChild(nm);
      var swap=el("button","btn sm","Change"); swap.type="button";
      swap.addEventListener("click",function(){
        productPicker(function(p2){
          l.productId=p2.id; l.pax=l.pax||1;
          l.hours=hasHourTiers(p2)?(l.hours||1):null;
          delete l.discount; delete l.discountType; delete l.manual;
          l.price=priceFor(p2,l.pax,l.hours);
          drawLines(); recalc();
        });
      });
      top.appendChild(swap);
      var rm=el("button","btn sm danger","Remove"); rm.type="button";
      rm.addEventListener("click",function(){
        working.lines.splice(idx,1); drawLines(); recalc();});
      top.appendChild(rm);
      card.appendChild(top);

      if(pr0){
        var meta=[ptypeLabel(pr0.ptype)];
        if(pr0.sessions>1&&!pr0.sessionsAtBooking) meta.push(pr0.sessions+" sessions");
        var sum=priceSummary(pr0);
        if(sum) meta.push(sum);
        var ml=el("div","hint",meta.join(" · "));
        ml.style.marginBottom="8px";
        card.appendChild(ml);
      }

      var row=el("div");
      row.style.cssText="display:grid;gap:8px;align-items:end;grid-template-columns:"+
        (wantPax?"minmax(0,1fr) ":"")+(wantHours?"minmax(0,1fr) ":"")+
        "minmax(0,1fr) minmax(0,1.2fr) auto";
      function lab(t,node){
        var w=el("div");
        var l2=el("div","hint",t); l2.style.marginBottom="3px";
        w.appendChild(l2); w.appendChild(node); return w;
      }
      function reprice(){
        var p2=product(l.productId);
        if(!p2) return;
        if(l.manual) return;                       /* an overridden price stands */
        var base=priceFor(p2,l.pax,l.hours);
        if(l.discount!=null){
          l.price=Math.round(Math.max(0, l.discountType==="percent"
            ? base*(1-l.discount/100) : base-l.discount)*100)/100;
        } else l.price=base;
        if(priceIn) priceIn.value=l.price;
        recalc();
      }
      var priceIn=null;
      if(wantPax){
        var px=input("number",l.pax||1,{min:"1",step:"1"});
        px.addEventListener("input",function(){l.pax=Number(px.value)||1;reprice();});
        row.appendChild(lab("People",px));
      }
      if(wantHours){
        var hrs=input("number",l.hours||1,{min:"1",step:"1"});
        hrs.addEventListener("input",function(){l.hours=Number(hrs.value)||1;reprice();});
        row.appendChild(lab("Hours",hrs));
      }
      var qty=input("number",l.qty,{min:"1",step:"1"});
      qty.addEventListener("input",function(){l.qty=Number(qty.value)||1;recalc();});
      row.appendChild(lab("Qty",qty));
      priceIn=input("number",l.price,{min:"0",step:"0.01"});
      priceIn.addEventListener("input",function(){
        l.price=Number(priceIn.value)||0; l.manual=true;
        delete l.discount; delete l.discountType; recalc();});
      row.appendChild(lab("Unit price",priceIn));
      var ed=el("button","btn sm","Price"); ed.type="button";
      ed.addEventListener("click",function(){
        priceEditForm(l,function(){drawLines();recalc();});});
      row.appendChild(ed);
      card.appendChild(row);

      var owed=sessionsOwed(l);
      if(owed>0){
        var done=existing?assignedCount(existing,l):0;
        var arow=el("div");
        arow.style.cssText="display:flex;align-items:center;gap:9px;margin-top:9px";
        var st=el("span","chip "+(done>=owed?"ok":"warnc"),
          done+" / "+owed+" sessions assigned");
        arow.appendChild(st);
        var ab=el("button","btn sm","Assign sessions"); ab.type="button";
        if(!existing){
          ab.disabled=true;
          ab.title="Save the booking first, then assign its sessions.";
          ab.style.opacity=".5";
        } else {
          ab.addEventListener("click",function(){
            assignSessionsForm(existing,l,function(){drawLines();recalc();});});
        }
        arow.appendChild(ab);
        card.appendChild(arow);
      }

      if(l.discount!=null || l.manual){
        var p2=product(l.productId);
        var base=p2?priceFor(p2,l.pax,l.hours):0;
        var tag=el("div");
        tag.style.marginTop="8px";
        if(l.discount!=null){
          tag.appendChild(el("span","chip warnc","discount "+(l.discountType==="percent"
            ? l.discount+"%" : "$"+money(l.discount,2))));
        } else {
          tag.appendChild(el("span","chip neutral","price overridden"));
        }
        var was=el("span","hint"," was $"+money(base));
        was.style.marginLeft="7px";
        tag.appendChild(was);
        card.appendChild(tag);
      }
      linesHost.appendChild(card);
    });
  }
  function drawPays(){
    payHost.textContent="";
    working.payments.forEach(function(p,idx){
      var row=el("div","line");
      var m=select(METHODS().map(function(x){return {v:x,l:x};}),p.method);
      m.addEventListener("change",function(){p.method=m.value;});
      var amt=input("number",p.amount,{min:"0",step:"0.01"});
      amt.addEventListener("input",function(){p.amount=Number(amt.value)||0;recalc();});
      var pd=input("date",p.date||date.value);
      pd.addEventListener("input",function(){p.date=pd.value;});
      var rm=el("button","btn sm danger","×");
      rm.addEventListener("click",function(){working.payments.splice(idx,1);drawPays();recalc();});
      row.style.gridTemplateColumns="1fr 92px 1fr auto";
      row.appendChild(m); row.appendChild(amt); row.appendChild(pd); row.appendChild(rm);
      payHost.appendChild(row);
    });
  }

  var lh=el("div","lines-h");
  lh.appendChild(el("h4",null,"Products"));
  var addLine=el("button","btn sm primary","Add product");
  addLine.addEventListener("click",function(){
    productPicker(function(p2){
      working.lines.push({lid:uid("ln"),productId:p2.id,qty:1,pax:1,
        hours:hasHourTiers(p2)?1:null,price:priceFor(p2,1,hasHourTiers(p2)?1:null)});
      drawLines(); recalc();
    });
  });
  lh.appendChild(addLine);
  b.appendChild(lh); b.appendChild(linesHost); b.appendChild(totBox);

  var ph=el("div","lines-h"); ph.appendChild(el("h4",null,"Payments"));
  var addPay=el("button","btn sm","Add payment");
  addPay.addEventListener("click",function(){
    var t=working.lines.reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
    var p=working.payments.reduce(function(a,x){return a+(Number(x.amount)||0);},0);
    /* if everything on the booking asks for a deposit, offer that rather than
       the full balance -- typing over it is one keystroke either way */
    var dep=0, all=working.lines.length>0;
    working.lines.forEach(function(l){
      var pr=product(l.productId);
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(pr&&pr.depositType&&pr.depositValue){
        dep += pr.depositType==="percent" ? v*pr.depositValue/100 : Number(pr.depositValue);
      } else all=false;
    });
    var suggest=(all&&dep>0&&p===0)?Math.min(dep,t):Math.max(0,t-p);
    working.payments.push({method:(METHODS()[0]||"Cash"),
      amount:Math.round(suggest*100)/100,date:date.value});
    drawPays(); recalc();
  });
  ph.appendChild(addPay);
  b.appendChild(ph); b.appendChild(payHost); b.appendChild(dueBox);

  /* how many people the products actually cover */
  function seatsWanted(){
    return working.lines.reduce(function(a,l){
      var pr=product(l.productId);
      var per=(pr&&hasPaxTiers(pr))?(Number(l.pax)||1):1;
      return a+per*(Number(l.qty)||1);
    },0);
  }
  var pblock=participantsBlock(working,seatsWanted,function(){});
  b.appendChild(pblock.node);

  var notes=el("textarea"); notes.value=bk.notes||"";
  b.appendChild(field("Notes",notes));
  var bcf=customInputs("booking",bk.custom);
  if(bcf.any) b.appendChild(bcf.node);

  drawLines(); drawPays(); recalc();

  openModal(existing?"Edit booking":"New booking",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      if(!client.value){ toast("Add a client first."); return; }
      if(!working.lines.length){ toast("Add at least one product."); return; }
      var rec=existing||{id:uid("b")};
      rec.date=date.value||todayISO(); rec.clientId=client.value;
      rec.lines=working.lines.filter(function(l){return l.productId;});
      rec.payments=working.payments.filter(function(p){return Number(p.amount)>0;});
      rec.participants=working.participants;
      rec.notes=notes.value.trim();
      var bmiss=bcf.missing();
      if(bmiss){ toast(bmiss+" is required."); return; }
      rec.custom=bcf.read();
      if(!existing) DB.bookings.push(rec);
      save(); closeModal(); render(); toast(existing?"Booking updated":"Booking saved");
    }}
  ]);
}
var bkFilter={q:"",status:"all",from:"",to:""};
var box2Invoice=null, box2Cancel=null;
function bookingStatus(b){
  if(b.status==="cancelled") return "cancelled";

  return d<=0.004?"paid":(paid>0?"partial":"unpaid");
}
function renderBookings(){

      DB.products.length?"Record a booking":"Go to the catalog",

  /* filter bar */

  sb.appendChild(q);

/* ============================ cancelling and refunding ============================
   A cancelled booking is not a deleted one: the money already taken has to
   stay visible, and the day it was refunded is its own event. */
function bookingRefunded(b){
  return (b.refunds||[]).reduce(function(a,r){return a+(Number(r.amount)||0);},0);
}
function bookingNet(b){ return bookingPaid(b)-bookingRefunded(b); }
function cancelBookingForm(bk){
  var paid=bookingPaid(bk), already=bookingRefunded(bk);
  var open=Math.max(0,paid-already);
  var b=el("div");
  b.appendChild(el("p",null,
    "Cancelling keeps the booking and its history. It stops counting as revenue from the day you refund."));
  var line=el("div","tot");
  line.appendChild(el("span","lab","Taken"));
  line.appendChild(el("span","v mono","$"+money(paid)));
  b.appendChild(line);
  if(already){
    var l2=el("div","tot"); l2.style.marginTop="6px";
    l2.appendChild(el("span","lab","Already refunded"));
    l2.appendChild(el("span","v mono","$"+money(already)));
    b.appendChild(l2);
  }
  var amt=input("number",open.toFixed(2),{min:"0",step:"0.01"});
  var mth=select(METHODS().map(function(m){return {v:m,l:m};}),
    (bk.payments&&bk.payments[0]&&bk.payments[0].method)||METHODS()[0]);
  var when=input("date",todayISO());
  var why=input("text","",{placeholder:"Reason (optional)"});
  b.appendChild(field("Refund amount",amt,
    open?("Up to $"+money(open)+" is still refundable."):"Nothing left to refund."));
  var g=el("div","grid2");
  g.appendChild(field("Refunded by",mth)); g.appendChild(field("Date",when));
  b.appendChild(g);
  b.appendChild(field("Reason",why));
  openModal("Cancel booking",b,[
    {label:"Back",on:closeModal},
    {label:"Cancel without refund",on:function(){
      bk.status="cancelled"; bk.cancelledOn=todayISO(); bk.cancelReason=why.value.trim();
      save(); closeModal(); render(); toast("Booking cancelled, nothing refunded");
    }},
    {label:"Refund and cancel",cls:"danger",on:function(){
      var v=Number(amt.value)||0;
      if(v>open+0.004){ toast("That is more than was taken."); return; }
      if(v>0){
        bk.refunds=bk.refunds||[];
        bk.refunds.push({amount:v,method:mth.value,date:when.value||todayISO(),
          reason:why.value.trim()});
      }
      bk.status="cancelled"; bk.cancelledOn=todayISO(); bk.cancelReason=why.value.trim();
      save(); closeModal(); render();
      toast(v>0?("Cancelled, $"+money(v,0)+" refunded"):"Booking cancelled");
    }}
  ]);
}
function reopenBooking(bk){
  delete bk.status; delete bk.cancelledOn; delete bk.cancelReason;
  save(); render(); toast("Booking reopened");
}

/* ============================ register (day closing) ============================
   A payment is money against a booking, and a booking's items each belong to a
   category. A payment is therefore split across categories in proportion to the
   booking's item values -- the same way the day report is built elsewhere. */
var regDate=todayISO();
function closingFor(dateStr){
  var byMethod={},byKind={},total=0,count=0;
  DB.bookings.forEach(function(bk){
    var weights={},wtot=0;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId); if(!p) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ weights[p.kind]=(weights[p.kind]||0)+v; wtot+=v; }
    });
    (bk.payments||[]).forEach(function(pay){
      if((pay.date||bk.date)!==dateStr) return;
      var amt=Number(pay.amount)||0; if(!amt) return;
      total+=amt; count++;
      byMethod[pay.method]=(byMethod[pay.method]||0)+amt;
      if(wtot>0){
        for(var k in weights) byKind[k]=(byKind[k]||0)+amt*weights[k]/wtot;
      } else {
        byKind.other=(byKind.other||0)+amt;
      }
    });
    /* a refund lands on the day it was given, not the day of the sale */
    (bk.refunds||[]).forEach(function(rf){
      if((rf.date||bk.date)!==dateStr) return;
      var amt=Number(rf.amount)||0; if(!amt) return;
      total-=amt; count++;
      byMethod[rf.method]=(byMethod[rf.method]||0)-amt;
      if(wtot>0){ for(var k in weights) byKind[k]=(byKind[k]||0)-amt*weights[k]/wtot; }
      else byKind.other=(byKind.other||0)-amt;
    });
  });
  return {date:dateStr,total:total,count:count,byMethod:byMethod,byKind:byKind};
}
function renderRegister(){
  var host=document.getElementById("p-register"); host.textContent="";
  secHeader(host,"Day closing",null,null,null);

  var bar=el("div","daybar");
  var base=new Date(regDate+"T12:00:00");
  for(var i=-6;i<=1;i++){
    (function(off){
      var d=new Date(base.getTime()+off*864e5),k=iso(d);
      var c=closingFor(k);
      var b=el("button");
      b.setAttribute("aria-pressed",k===regDate?"true":"false");
      b.appendChild(el("div","d",DOW[d.getDay()]));
      b.appendChild(el("div","n",String(d.getDate())));
      b.appendChild(el("div","c",c.total?"$"+money(c.total,0):"—"));
      b.addEventListener("click",function(){regDate=k;renderRegister();});
      bar.appendChild(b);
    })(i);
  }
  host.appendChild(bar);

  var c=closingFor(regDate);
  var k=el("div","kpis");
  [{l:"Takings",v:"$"+money(c.total,2),m:dowOf(regDate)+", "+dm(regDate)},
   {l:"Payments",v:String(c.count),m:c.count?("$"+money(c.total/c.count,2)+" average"):"nothing recorded"}]
  .forEach(function(it){

    p.appendChild(el("div","eyebrow",it.l));
    p.appendChild(el("span","val mono",it.v));
    p.appendChild(el("div","meta",it.m));
    k.appendChild(p);
  });
  host.appendChild(k);

  if(!c.count){
    host.appendChild(el("div","note",
      "No payments recorded on "+dm(regDate)+". Takings appear here as soon as a booking is paid."));
    drawerSection(host,regDate,0);
    return;
  }
  function tableOf(title,obj,labelFn){
    var wrap=el("div");
    var h=el("div","sec-h"); h.appendChild(el("h2",null,title)); wrap.appendChild(h);
    var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
    tr.appendChild(el("th",null,"")); tr.appendChild(el("th","r","Amount"));
    tr.appendChild(el("th","r","Share"));

    var tb=el("tbody");

      r.appendChild(el("td","n r","$"+money(obj[key],2)));
      r.appendChild(el("td","n r muted",Math.round(obj[key]/c.total*100)+"%"));
      tb.appendChild(r);
    });
    var tr2=el("tr");
    tr2.appendChild(el("td","strong","Total"));
    tr2.appendChild(el("td","n r strong","$"+money(c.total,2)));
    tr2.appendChild(el("td","n r muted","100%"));
    tb.appendChild(tr2);
    t.appendChild(tb); w.appendChild(t); wrap.appendChild(w);
    return wrap;
  }
  host.appendChild(tableOf("By payment method",c.byMethod));
  host.appendChild(tableOf("By activity",c.byKind,kindLabel));
  host.appendChild(el("div","note",

/* ============================ invoices ============================
   An invoice is a frozen copy of a booking, not a live view of it: editing the
   booking afterwards must not silently rewrite a document already given to a
   customer. */
function invoiceFor(bookingId){
  for(var i=0;i<DB.invoices.length;i++)
    if(DB.invoices[i].bookingId===bookingId) return DB.invoices[i];
  return null;
}
function issueInvoice(bk){
  var existing=invoiceFor(bk.id);
  if(existing) return existing;
  var bz=cfg().business;
  var inv={
    id:uid("inv"),
    number:String(new Date().getFullYear())+"-"+String(DB.invoiceSeq++).padStart(4,"0"),
    bookingId:bk.id, date:todayISO(), clientId:bk.clientId,
    clientName:clientName(bk.clientId),
    business:{name:bz.name,taxId:bz.taxId,address:bz.address,phone:bz.phone,
              email:bz.email,currency:bz.currency},
    lines:(bk.lines||[]).map(function(l){
      var p=product(l.productId);
      return {name:p?p.name:"Item",qty:Number(l.qty)||0,price:Number(l.price)||0,
              tax:p&&p.tax?Number(p.tax):0};
    }),
    payments:(bk.payments||[]).map(function(x){
      return {method:x.method,amount:Number(x.amount)||0,date:x.date};}),
    notes:bk.notes||""
  };
  inv.total=inv.lines.reduce(function(a,l){return a+l.qty*l.price;},0);
  inv.paid=inv.payments.reduce(function(a,p){return a+p.amount;},0);
  DB.invoices.push(inv);
  save();
  return inv;
}

/* ============================ cash in and out ============================
   Money that moves through the drawer without being a sale: a float at open,
   a supplier paid in cash, wages handed over. It never touches revenue, but
   it decides what should physically be in the till at close. */
function cashForm(existing,dateStr){
  var c=existing||{date:dateStr||todayISO(),direction:"out",amount:"",reason:"",staffId:""};
  var b=el("div");
  var dir=select([{v:"in",l:"Money in"},{v:"out",l:"Money out"}],c.direction);
  var amt=input("number",c.amount,{min:"0",step:"0.01"});
  var when=input("date",c.date);
  var why=input("text",c.reason,{placeholder:"Float, supplier, wages, bank run…"});
  var who=select([{v:"",l:"—"}].concat(DB.staff.map(function(x){
    return {v:x.id,l:x.name};})),c.staffId||"");
  var g=el("div","grid2");
  g.appendChild(field("Direction",dir)); g.appendChild(field("Amount",amt));
  b.appendChild(g);
  var g2=el("div","grid2");
  g2.appendChild(field("Date",when)); g2.appendChild(field("Handled by",who));
  b.appendChild(g2);
  b.appendChild(field("Reason",why));
  b.appendChild(el("div","hint",
    "This is not a sale. It stays out of takings and out of the reports, and only affects what should be in the drawer."));
  openModal(existing?"Edit drawer movement":"Cash in / out",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      var v=Number(amt.value)||0;
      if(v<=0){ toast("Enter an amount."); amt.focus(); return; }
      if(!why.value.trim()){ toast("A reason is required."); why.focus(); return; }
      var rec=existing||{id:uid("cash")};
      rec.date=when.value||todayISO(); rec.direction=dir.value; rec.amount=v;
      rec.reason=why.value.trim(); rec.staffId=who.value;
      if(!existing) DB.cash.push(rec);
      save(); closeModal(); render(); toast("Saved");
    }}
  ]);
}
function cashOn(dateStr){
  return DB.cash.filter(function(c){return c.date===dateStr;});
}
function drawerFor(dateStr,cashTakings){
  var moves=cashOn(dateStr);
  var inn=moves.filter(function(m){return m.direction==="in";})
    .reduce(function(a,m){return a+m.amount;},0);
  var out=moves.filter(function(m){return m.direction==="out";})
    .reduce(function(a,m){return a+m.amount;},0);
  return {in:inn,out:out,expected:(cashTakings||0)+inn-out,moves:moves};
}


/* ============================ what the crew are owed ============================
   Fee groups say what an activity pays: by the hour, by the session, or as a
   cut of what that session sold for. This works that out from the sessions
   actually taught, so a pay run is a calculation and not a memory. */
function feeGroupFor(staffId,dateStr){
  var gid=(DB.staffFees||{})[staffId];
  if(!gid) return null;
  var g=by(gid,DB.feeGroups);
  if(!g) return null;
  if(g.from && dateStr<g.from) return null;
  if(g.to && dateStr>g.to) return null;
  return g;
}
function rateFor(group,kindCode){
  if(!group) return null;
  var rs=(group.rates||[]).filter(function(r){return r.kind===kindCode;});
  return rs.length?rs[0]:null;
}
/* what one session sold for, so a percentage rate has something to bite on */
function sessionRevenue(se){
  var refs=se.participants||[];
  if(!refs.length) return 0;
  var total=0;
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    var paid=bookingPaid(bk)-bookingRefunded(bk);
    if(paid<=0) return;
    var seats=seatsOfBooking(bk).map(function(x){return x.ref;});
    var mine=refs.filter(function(r){return seats.indexOf(r)>=0;}).length;
    if(!mine) return;
    /* spread what the booking paid across the sessions its people sit in */
    var sittings=0;
    DB.sessions.forEach(function(o){
      o.participants.forEach(function(r){ if(seats.indexOf(r)>=0) sittings++; });
    });
    if(sittings>0) total += paid*mine/sittings;
  });
  return total;
}
function feesFor(staffId,from,to){
  var rows=[],total=0;
  DB.sessions.filter(function(se){
    return se.date>=from && se.date<=to && staffIdsOf(se).indexOf(staffId)>=0;
  }).sort(function(a,b){return a.date===b.date?(a.time<b.time?-1:1):(a.date<b.date?-1:1);})
  .forEach(function(se){
    var g=feeGroupFor(staffId,se.date);
    var kindCode=(cfg().kinds.filter(function(k){return k.l===se.category;})[0]||{}).k||"";
    var r=rateFor(g,kindCode);
    var hours=(se.duration||0)/60;
    var share=staffIdsOf(se).length||1;      /* two instructors, half each */
    var byHour=r?(Number(r.perHour)||0)*hours:0;
    var bySession=r?(Number(r.perSession)||0):0;
    var rev=r&&Number(r.pct)?sessionRevenue(se):0;
    var byPct=r?rev*(Number(r.pct)||0)/100:0;
    var pay=(byHour+bySession+byPct)/share;
    total+=pay;
    rows.push({session:se,group:g,rate:r,hours:hours,share:share,
      byHour:byHour/share,bySession:bySession/share,byPct:byPct/share,pay:pay});
  });
  return {rows:rows,total:total};
}

var repMode="month", repAnchor=todayISO().slice(0,7);
function periodOf(dateStr){
  return repMode==="month" ? dateStr.slice(0,7) : dateStr.slice(0,4);
}
function repRange(){
  return repMode==="month" ? repAnchor : repAnchor.slice(0,4);
}
function paymentsIn(prefix){
  /* every payment whose date starts with the period, with its booking alongside */
  var out=[];
  DB.bookings.forEach(function(bk){
    (bk.payments||[]).forEach(function(p){
      var d=p.date||bk.date;
      if(d && d.indexOf(prefix)===0) out.push({pay:p,amount:Number(p.amount)||0,date:d,bk:bk});
    });
    (bk.refunds||[]).forEach(function(r){
      var d=r.date||bk.date;
      if(d && d.indexOf(prefix)===0)
        out.push({pay:{method:r.method},amount:-(Number(r.amount)||0),date:d,bk:bk});
    });
  });
  return out;
}
function splitByKind(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.kind]=(w[pr.kind]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
    else out.other=(out.other||0)+r.amount;
  });
  return out;
}
function splitByProduct(rows){
  var out={};
  rows.forEach(function(r){
    var w={},wt=0;
    (r.bk.lines||[]).forEach(function(l){
      var pr=product(l.productId); if(!pr) return;
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(v>0){ w[pr.name]=(w[pr.name]||0)+v; wt+=v; }
    });
    if(wt>0){ for(var k in w) out[k]=(out[k]||0)+r.amount*w[k]/wt; }
  });
  return out;
}
function shiftPeriod(step){
  if(repMode==="month"){
    var y=+repAnchor.slice(0,4), m=+repAnchor.slice(5,7)+step;
    while(m<1){m+=12;y--;} while(m>12){m-=12;y++;}
    repAnchor=y+"-"+String(m).padStart(2,"0");
  } else {
    repAnchor=String(+repAnchor.slice(0,4)+step)+"-01";
  }
  renderReports();
}
function periodLabel(){
  if(repMode==="month"){
    return MON[+repAnchor.slice(5,7)-1]+" "+repAnchor.slice(0,4);
  }
  return repAnchor.slice(0,4);
}

function listEditor(title,hint,items,opts){
  /* opts: {read(item)->label, form(item|null, done), del(item), addLabel} */
  var wrap=el("div","panel");
  var h=el("div","day-h");
  h.appendChild(el("h3",null,title));
  var add=el("button","btn sm primary",opts.addLabel||"Add");
  add.style.marginLeft="auto";
  add.addEventListener("click",function(){opts.form(null);});
  h.appendChild(add);
  wrap.appendChild(h);
  if(hint) { var hn=el("div","hint",hint); hn.style.padding="10px 16px 0"; wrap.appendChild(hn); }
  if(!items.length){
    var e=el("div","hint","Nothing here yet.");
    e.style.padding="14px 16px"; wrap.appendChild(e);
    return wrap;
  }
  items.forEach(function(it,i){
    var r=el("div","slot"); r.style.gridTemplateColumns="1fr auto";
    var nm=el("div","nm");
    var txt=el("div");
    var read=opts.read(it);
    txt.appendChild(el("b",null,read.title));
    if(read.sub) txt.appendChild(el("em",null,read.sub));
    nm.appendChild(txt); r.appendChild(nm);
    var box=el("div","rowbtns");
    var e2=el("button","btn sm","Edit");
    e2.addEventListener("click",function(){opts.form(it,i);});
    box.appendChild(e2);
    if(opts.del){
      var d=el("button","btn sm danger","Del");
      d.addEventListener("click",function(){
        confirmDelete(read.title,function(){opts.del(it,i);save();render();toast("Deleted");});
      });
      box.appendChild(d);
    }
    r.appendChild(box);
    wrap.appendChild(r);
  });
  return wrap;
}

/* ============================ starter catalog ============================
   The school's real product list, exported from Bloowatch. It is offered, not
   forced: the app still starts empty and this only lands when asked for. */
function seedData(){
  try{
    var n=document.getElementById("seed");
    if(!n) return null;
    var d=JSON.parse(n.textContent||"null");
    return (d&&d.products&&d.products.length)?d:null;
  }catch(e){ return null; }
}
function importCatalog(){
  var d=seedData();
  if(!d){ toast("No catalog is bundled with this build."); return; }
  var added={products:0,gear:0,units:0,spots:0,kinds:0,crew:0,sessions:0,cats:0};

  d.products.forEach(function(p){
    if(DB.products.some(function(x){return x.name===p.name;})) return;
    DB.products.push({id:uid("p"),name:p.name,kind:p.kind,price:p.price||0,
      sessions:p.sessions||1,category:p.category||"",tax:p.tax||0,color:p.color||"",
      nights:p.nights||null,description:p.description||"",prices:p.prices||[],
      ptype:p.ptype||"class",
      priceMode:(p.prices&&p.prices.some(function(t){return t.hours;}))?"item":
                ((p.prices&&p.prices.some(function(t){return (t.minPax||1)>1;}))?"person":"fixed"),
      code:"",maxAttendants:"",depositType:"",depositValue:"",
      onlineSale:true,onlinePay:"full",sessionChoice:"full",
      weekDays:[],startHours:[],archived:false});
    added.products++;
  });
  (d.gear||[]).forEach(function(g){
    if(DB.gear.some(function(x){return x.name===g.name;})) return;
    var units=(g.units||[]).map(function(u){
      return {id:uid("u"),name:u.name||"",maxPax:u.maxPax||1,
              lastCheck:u.lastCheck||"",nextCheck:u.nextCheck||"",notes:u.notes||""};
    });
    DB.gear.push({id:uid("g"),name:g.name,units:units,description:g.description||""});
    added.gear++; added.units+=units.length;
  });

  /* activity calendars become activity types, keeping their colour */
  (d.categories||[]).forEach(function(c){
    if(!c.name) return;
    var code=c.name.toLowerCase().replace(/[^a-z0-9]+/g,"_");
    if(cfg().kinds.some(function(k){return k.k===code||k.l===c.name;})) return;
    cfg().kinds.push({k:code,l:c.name,color:c.color||""});
    added.cats++;
  });
  (d.staff||[]).forEach(function(st){
    if(DB.staff.some(function(x){return x.name===st.name;})) return;
    DB.staff.push({id:uid("s"),name:st.name,role:st.role||"Instructor",phone:"",email:""});
    added.crew++;
    if(cfg().roles.indexOf(st.role)<0 && st.role) cfg().roles.push(st.role);
  });
  (d.spots||[]).forEach(function(sp){
    if(DB.spots.some(function(x){return x.name===sp.name;})) return;
    DB.spots.push({id:uid("sp"),name:sp.name,lat:sp.lat,lon:sp.lon,notes:sp.notes||""});
    added.spots++;
  });
  /* every kind the imported products use must exist, or they group as "other" */
  d.products.forEach(function(p){
    if(!cfg().kinds.some(function(k){return k.k===p.kind;})){
      cfg().kinds.push({k:p.kind,l:p.kind.charAt(0).toUpperCase()+p.kind.slice(1)});
      added.kinds++;
    }
  });
  /* the schedule, without participants -- those point at clients, which stay put */
  (d.sessions||[]).forEach(function(x){
    if(DB.sessions.some(function(y){
      return y.date===x.date && y.time===x.time && y.title===x.title;})) return;
    DB.sessions.push({id:uid("se"),title:x.title,date:x.date,time:x.time,
      duration:x.duration||60,capacity:x.capacity||1,
      spot:(DB.spots[0]||{}).name||"",tideRef:"",tidePos:"before",tideHours:0,
      participants:[],category:x.category||"",note:"",staffIds:[]});
    added.sessions++;
  });

  save();
  if(typeof cur!=="undefined" && cur) render();
  toast("Loaded "+added.products+" products, "+added.crew+" crew, "+
        added.units+" gear items and "+added.sessions+" sessions");
}

    return;

  b.appendChild(el("p",null,

}

function backupForm(){
  var b=el("div");
  b.appendChild(el("p",null,
    "Your data lives in this browser only. It is not on a server and does not follow you to another device, so keep a copy."));
  var ta=el("textarea");
  ta.value=JSON.stringify(DB);
  ta.setAttribute("aria-label","Backup data");
  ta.style.minHeight="150px";
  ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11px";
  b.appendChild(field("Backup — copy this somewhere safe",ta));

  var imp=el("textarea"); imp.placeholder="Paste a backup here to restore it";
  b.appendChild(field("Restore",imp,"Restoring replaces everything currently in the system."));

  openModal("Backup & restore",b,[
    {label:"Close",on:closeModal},
    {label:"Select backup",on:function(){ta.focus();ta.select();toast("Now copy it");}},
    {label:"Restore",cls:"danger",on:function(){
      var raw=imp.value.trim();
      if(!raw){ toast("Paste a backup into the restore box first."); return; }
      var parsed;
      try{ parsed=JSON.parse(raw); }
      catch(e){ toast("That is not a valid backup — the text is not readable JSON."); return; }
      if(!parsed||parsed.v!==1||!Array.isArray(parsed.clients)){
        toast("That backup is not from this system."); return;
      }
      DB=parsed; save(); closeModal(); render(); toast("Backup restored");
    }}
  ]);
}
document.getElementById("btn-backup").addEventListener("click",backupForm);
document.getElementById("btn-newbooking").addEventListener("click",function(){
  if(!DB.products.length){ show("catalog"); toast("Add a product first."); return; }
  show("bookings"); bookingForm(null);
});

/* ============================ tabs ============================ */
/* Inline icons rather than an icon font: the font is one network request away
   from a rail full of spilled ligature text, and this cannot fail. */
var ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/>'+
       '<circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/>',
  board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/>'+
        '<path d="M9 9v11M15 9v11"/>',
  boat:'<path d="M4 17h16l-2 4H6z"/><path d="M6 17V8l6-4 6 4v9"/><path d="M12 4v13"/>',
  receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/>'+
         '<path d="M16 6.5a3 3 0 0 1 0 6"/><path d="M18 20c0-2.4-1-4.2-2.5-5.2"/>',
  tag:'<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="7.5" r="1.4"/>',
  surf:'<path d="M4 20c4-1 6-4 8-8s4-8 6-9c1 4 0 10-3 14s-7 5-11 3z"/>',
  badge:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M9 6V4h6v2"/>'+
        '<circle cx="12" cy="12" r="2.2"/><path d="M8.5 17.5c.8-1.4 2-2.1 3.5-2.1s2.7.7 3.5 2.1"/>',
  register:'<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V5h10v4"/>'+
           '<path d="M7 14h4M7 17.5h7"/>',
  doc:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
  money:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/>'+
        '<path d="M6 12h.01M18 12h.01"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3'+
      'M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>'
};
function icon(name){
  var NS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox","0 0 24 24");
  svg.setAttribute("aria-hidden","true");
  svg.innerHTML=ICONS[name]||ICONS.list;
  return svg;
}
var TABS=[
  {id:"today",l:"Today",icon:"home",r:renderToday},
  {id:"schedule",l:"Planning",icon:"list",r:renderSchedule},
  {id:"board",l:"Board",icon:"board",r:renderBoard},
  {id:"trips",l:"Trips",icon:"boat",r:renderTrips},
  {id:"bookings",l:"Bookings",icon:"receipt",r:renderBookings},
  {id:"clients",l:"Clients",icon:"people",r:renderClients},
  {id:"catalog",l:"Catalog",icon:"tag",r:renderCatalog},
  {id:"gear",l:"Gear",icon:"surf",r:renderGear},
  {id:"crew",l:"Crew",icon:"badge",r:renderCrew},
  {id:"register",l:"Day closing",icon:"register",r:renderRegister},
  {id:"invoices",l:"Invoices",icon:"doc",r:renderInvoices},
  {id:"fees",l:"Crew pay",icon:"money",r:renderFees},
  {id:"reports",l:"Reports",icon:"chart",r:renderReports},
  {id:"settings",l:"Back office",icon:"cog",r:renderSettings}
];
var cur="today";
var tabsBox=document.getElementById("tabs");
TABS.forEach(function(t){
  var b=el("button");
  b.dataset.id=t.id; b.setAttribute("role","tab");
  b.setAttribute("aria-label",t.l); b.title=t.l;
  b.appendChild(icon(t.icon));
  b.appendChild(el("span","tip",t.l));
  b.addEventListener("click",function(){show(t.id);});
  tabsBox.appendChild(b);
});
var screenName=document.getElementById("screen-name");
function show(id){
  cur=id;
  TABS.forEach(function(t){
    document.getElementById("p-"+t.id).hidden = t.id!==id;
    if(t.id===id && screenName) screenName.textContent=t.l;
  });
  [].forEach.call(tabsBox.children,function(b){
    b.setAttribute("aria-selected",b.dataset.id===id?"true":"false");});
  try{ localStorage.setItem("shokogi.manager.tab",id); }catch(e){}
  render();
  scrollTo(0,0);
}
function render(){
  for(var i=0;i<TABS.length;i++) if(TABS[i].id===cur){ TABS[i].r(); return; }
}

/* The catalog was asked for, so it should simply be there. It loads once, on a
   database nobody has put anything into yet; after a deliberate wipe the flag
   stays set and it does not come back uninvited. */
if(!DB.seeded && !DB.products.length && !DB.staff.length && seedData()){
  DB.seeded=true;
  importCatalog();
}

var saved=null; try{ saved=localStorage.getItem("shokogi.manager.tab"); }catch(e){}
show(TABS.some(function(t){return t.id===saved;})?saved:"today");
})();
</script>
