/* One day of the scheduler: a header, an hour axis with the tide drawn over
   it, and a lane per session. Dragging moves a block within its own day --
   each day has its own axis, so there is nothing to drop onto in another. */
function boardDay(dayISO){
  /* the name column costs half a phone screen at its full width */
  var LABEL=narrow()?116:205;
  var span=(BOARD_TO-BOARD_FROM)*60;
  var box=el("div");
  box.style.cssText="border-bottom:2px solid var(--line)";

  var collapsed=(DB.boardCollapsed||{})[dayISO];
  var head=el("div");
  head.style.cssText="display:grid;grid-template-columns:"+LABEL+"px minmax(0,1fr);"+
    "border-bottom:1px solid var(--line);background:var(--panel-2);"+
    "position:sticky;top:0;z-index:3";
  var dayLab=el("div");
  dayLab.style.cssText="display:flex;align-items:center;gap:6px;padding:9px 12px;"+
    "font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;"+
    "border-right:1px solid var(--line);cursor:pointer;color:var(--text-2)";
  dayLab.appendChild(el("span",null,dowOf(dayISO).toUpperCase()+" "+
    dm(dayISO).toUpperCase()));
  var caret=el("span",null,collapsed?"▸":"▾");
  caret.style.cssText="margin-left:auto;font-size:11px;color:var(--text-3)";
  dayLab.appendChild(caret);
  dayLab.addEventListener("click",function(){
    DB.boardCollapsed=DB.boardCollapsed||{};
    if(collapsed) delete DB.boardCollapsed[dayISO];
    else DB.boardCollapsed[dayISO]=true;
    save(); renderBoard();
  });
  head.appendChild(dayLab);

  var hoursCell=el("div");
  hoursCell.style.cssText="position:relative;height:58px";
  var NS="http://www.w3.org/2000/svg";
  var svg=document.createElementNS(NS,"svg");
  svg.setAttribute("width","100%"); svg.setAttribute("height","58");
  /* clipped, not visible: the curve runs on past both edges of the day so the
     shape is right at 06:00, and without this it paints over the day above */
  svg.style.cssText="position:absolute;inset:0;overflow:hidden";
  hoursCell.appendChild(svg);
  for(var h=BOARD_FROM;h<=BOARD_TO;h++){
    (function(hh){
      var x=((hh-BOARD_FROM)*60)/span*100;
      var l=el("div",null,String(hh).padStart(2,"0")+":00");
      l.style.cssText="position:absolute;left:"+x+"%;bottom:2px;font-size:11.5px;"+
        "font-family:'IBM Plex Mono',monospace;color:var(--text-3);transform:translateX(-50%)";
      hoursCell.appendChild(l);
    })(h);
  }
  head.appendChild(hoursCell);
  box.appendChild(head);

  var tide=tideFor(dayISO);
  requestAnimationFrame(function(){
    var w=hoursCell.clientWidth||900;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    var nowM=null;
    if(dayISO===todayISO()){
      var n=new Date(); nowM=n.getHours()*60+n.getMinutes();
    }
    svg.appendChild(tideCurve(w,58,tide,nowM));
  });
  /* the tide is edited where it is read, rather than on another screen */
  hoursCell.title=tide ? "Tide for "+dm(dayISO)+" — click to edit"
                       : "No tide for this day — click to enter it";
  hoursCell.style.cursor="pointer";
  hoursCell.addEventListener("click",function(){ tideForm(dayISO); });
  if(!tide){
    var none=el("div",null,"tide not set");
    none.style.cssText="position:absolute;left:10px;top:8px;font-size:10.5px;"+
      "color:var(--text-3);font-style:italic";
    hoursCell.appendChild(none);
  }

  if(collapsed) return box;

  var lanesHost=el("div");
  box.appendChild(lanesHost);
  var rows=laneRows(dayISO);
  var dragging=null;
  function laneAt(clientY){
    var kids=lanesHost.children;
    for(var i=0;i<kids.length;i++){
      var r=kids[i].getBoundingClientRect();
      if(clientY>=r.top && clientY<=r.bottom) return {el:kids[i],index:i};
    }
    return null;
  }

  rows.forEach(function(rec,ri){
    /* On a seven-day board empty activity lanes are noise -- but an empty
       instructor lane is the whole point: it is where you drop the session. */
    if(boardSpan>1 && !rec.items.length && boardGroup!=="staff") return;
    /* a second lane for a double-booked person only when they are */
    if(boardGroup==="staff" && !rec.first && !rec.items.length) return;
    var r=el("div");
    r.style.cssText="display:grid;grid-template-columns:"+LABEL+"px minmax(0,1fr);"+
      "border-bottom:1px solid var(--line-soft);min-height:36px";
    r.dataset.rowKey=rec.row.key;
    r.dataset.ri=String(ri);

    var lab=el("div");
    lab.style.cssText="display:flex;align-items:center;gap:7px;padding:6px 12px;"+
      "font-size:12.5px;font-weight:600;border-right:1px solid var(--line);"+
      "overflow:hidden;white-space:nowrap";
    var dot=el("span");
    dot.style.cssText="width:9px;height:9px;border-radius:3px;flex:none;background:"+
      (rec.row.color||"var(--text-3)");
    lab.appendChild(dot);
    /* the title names the session, but a drag rewrites the group -- so the
       group has to stay legible or you cannot see what you are dropping into */
    var title = boardGroup==="staff" ? rec.row.label
      : (rec.items.length?(rec.items[0].title||rec.row.label):rec.row.label);
    var box=el("div");
    box.style.cssText="overflow:hidden;min-width:0";
    var lt=el("div",null,title);
    lt.style.cssText="overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
    box.appendChild(lt);
    if(boardGroup!=="staff" && rec.items.length && rec.row.label &&
       rec.row.label!==title){
      var gl=el("div",null,rec.row.label);
      gl.style.cssText="font-size:10px;font-weight:500;color:var(--text-3);"+
        "overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
      box.appendChild(gl);
    }
    lab.appendChild(box);
    lab.title=title+(rec.row.label?(" · "+rec.row.label):"");
    r.appendChild(lab);

    var lane=el("div");
    lane.style.cssText="position:relative;min-height:36px;background-image:"+
      "repeating-linear-gradient(to right,var(--line-soft) 0 1px,transparent 1px "+
      (100/(BOARD_TO-BOARD_FROM))+"%)";
    r.appendChild(lane);
    lanesHost.appendChild(r);

    /* An empty stretch of a lane is where a session goes: click the hour and
       the form opens on it, already in this lane -- the activity when the
       board is grouped by activity, the instructor when it is grouped by
       staff. Clicking a block, the time-off bar or the lane's buttons is not
       clicking the lane, so those still do what they did. */
    lane.style.cursor="cell";
    lane.title="Click an empty hour to put a session here";
    lane.addEventListener("click",function(e){
      if(e.target!==lane) return;
      var rect=lane.getBoundingClientRect();
      var frac=Math.max(0,Math.min(0.999,(e.clientX-rect.left)/rect.width));
      var hour=BOARD_FROM+Math.floor(frac*(BOARD_TO-BOARD_FROM));
      var pre={date:dayISO,time:toHHMM(hour*60)};
      if(boardGroup==="staff"){
        if(rec.row.key) pre.staffIds=[rec.row.key];
      } else if(rec.row.key){
        pre.category=rec.row.key;
        pre.title=rec.row.label||rec.row.key;
      }
      sessionForm(null,pre);
    });

    /* time off shows as a hatched bar across the lane, the way theirs does */
    if(boardGroup==="staff" && rec.row.key && rec.first && isOff(rec.row.key,dayISO)){
      var off=el("div");
      off.style.cssText="position:absolute;inset:2px 0;border-radius:3px;"+
        "background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);"+
        "display:flex;align-items:center;justify-content:center;font-size:11px;"+
        "color:var(--text-3);font-weight:600";
      off.appendChild(el("span",null,"Time Off"));
      lane.appendChild(off);
    }

    rec.items.forEach(function(x){
      var st=minsOf(x.time)-BOARD_FROM*60;
      var dur=Math.max(15,x.duration||60);
      var left=Math.max(0,Math.min(97,st/span*100));
      /* a session outside the hours the board is drawn between still has to be
         visible and draggable: pin it to the edge rather than off the lane */
      var width=Math.max(3,Math.min(100-left,dur/span*100));
      var outside=(st<0)||(st/span*100>100);
      var colour=catColor(x.category)||"var(--accent-hot)";
      var blk=el("div");
      blk.style.cssText="position:absolute;left:"+left+"%;width:"+width+"%;top:3px;bottom:3px;"+
        "background:"+softColour(colour)+";border-left:3px solid "+colour+";"+
        "border-radius:4px;padding:3px 8px;overflow:hidden;cursor:grab;"+
        "color:var(--text);font-size:12.5px;font-weight:600;line-height:1.25;"+
        "display:flex;align-items:center;gap:7px;touch-action:none;min-width:30px";
      blk.dataset.sessionId=x.id;
      blk.title=x.time+" · "+x.title+" · "+instructorNames(x)+
        " · "+x.participants.length+"/"+x.capacity+
        (outside?" (outside the hours the board is drawn between)":"");
      if(outside) blk.style.outline="2px dashed "+colour;
      var t=el("span",null,x.title);
      t.style.cssText="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1";
      blk.appendChild(t);
      var c=el("span",null,String(x.participants.length));
      c.style.cssText="margin-left:auto;font-size:11.5px;font-weight:700;flex:none;"+
        "color:var(--text-2)";
      blk.appendChild(c);

      /* Pointer dragging: HTML5 drag-and-drop was unreliable here, and gave no
         feedback while moving. This follows the finger or cursor and shows the
         landing time as it goes. */
      blk.addEventListener("pointerdown",function(e){
        if(e.button && e.button!==0) return;
        e.preventDefault();
        var laneRect=lane.getBoundingClientRect();
        var blkRect=blk.getBoundingClientRect();
        dragging={ses:x,grabDX:e.clientX-blkRect.left,laneW:laneRect.width,
                  moved:false,startX:e.clientX,startY:e.clientY};
        blk.setPointerCapture(e.pointerId);
        blk.style.cursor="grabbing";
        blk.style.zIndex="5";
        blk.style.boxShadow="0 8px 22px rgba(0,0,0,.28)";
      });
      blk.addEventListener("pointermove",function(e){
        if(!dragging || dragging.ses!==x) return;
        if(!dragging.moved){
          if(Math.abs(e.clientX-dragging.startX)<3 &&
             Math.abs(e.clientY-dragging.startY)<3) return;
          dragging.moved=true;
        }
        var over=laneAt(e.clientY);
        var target=over?over.el.children[1]:lane;
        var rect=(target||lane).getBoundingClientRect();
        var px=e.clientX-dragging.grabDX-rect.left;
        var frac=Math.max(0,Math.min(1,px/rect.width));
        var mins=BOARD_FROM*60+frac*span;
        dragging.time=toHHMM(Math.round(mins/15)*15);
        dragging.targetRi=over?Number(over.el.dataset.ri):null;
        blk.style.left=(frac*100)+"%";
        t.textContent=dragging.time+" "+x.title;
        if(over){
          [].forEach.call(lanesHost.children,function(k){k.style.background="";});
          over.el.style.background="var(--accent-soft)";
        }
      });
      function endDrag(){
        if(!dragging || dragging.ses!==x) return;
        [].forEach.call(lanesHost.children,function(k){k.style.background="";});
        blk.style.cursor="grab"; blk.style.zIndex=""; blk.style.boxShadow="";
        var d=dragging; dragging=null;
        /* A click opens the card on the block, the way theirs does -- who is
           in it, which lesson of their course this is, and the instructor
           changed on the spot. The full form is one click further in. */
        if(!d.moved){ sessionPop(blk,x); return; }
        var destRow=null;
        if(d.targetRi!=null){
          for(var i=0;i<rows.length;i++)
            if(rows[i] && String(i)===String(d.targetRi)) destRow=rows[i].row;
        }
        if(!destRow) destRow=rec.row;
        /* dropping a session on somebody's row is assigning it to them, so
           the same rule the form keeps applies here: a foil tow does not land
           on an instructor whose card does not carry foil */
        if(boardGroup==="staff" && destRow.key &&
           !staffDoes(by(destRow.key,DB.staff),x.category)){
          renderBoard();
          toast(destRow.label+" is not set up for "+
                (x.category||"this activity")+".");
          return;
        }
        x.time=d.time||x.time;
        if(boardGroup==="staff"){
          x.staffIds=destRow.key?[destRow.key]:[]; delete x.staffId;
        } else x.category=destRow.key;
        save(); renderBoard();
        toast(x.title+" → "+destRow.label+" at "+x.time);
      }
      blk.addEventListener("pointerup",endDrag);
      blk.addEventListener("pointercancel",endDrag);
      lane.appendChild(blk);
    });

    /* the controls their scheduler parks at the right of an occupied lane */
    if(rec.items.length){
      var x0=rec.items[rec.items.length-1];
      var ctl=el("div");
      ctl.style.cssText="position:absolute;right:6px;top:0;bottom:0;display:flex;"+
        "align-items:center;gap:6px;pointer-events:auto";
      var eye=el("button","lanebtn");
      eye.type="button";
      eye.title=x0.isPublic!==false?"Visible on eCommerce":"Hidden from eCommerce";
      eye.innerHTML=x0.isPublic!==false
        ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>'
        : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-6.5 10-6.5c2 0 3.7.6 5.1 1.4"/><path d="M22 12s-3.6 6.5-10 6.5c-2 0-3.7-.6-5.1-1.4"/><path d="M3 3l18 18"/></svg>';
      eye.addEventListener("click",function(ev){
        ev.stopPropagation();
        x0.isPublic=!(x0.isPublic!==false);
        save(); renderBoard();
        toast(x0.isPublic ? "Session is now visible to clients booking online."
                          : "The session is now hidden from clients booking online.");
      });
      ctl.appendChild(eye);
      var pc=el("button","lanebtn");
      pc.type="button"; pc.title="Participants";
      pc.innerHTML='<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">'+
        '<circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 21c0-4.1 3.4-6.8 7.5-6.8s7.5 2.7 7.5 6.8z"/></svg>';
      var pn=el("span",null," "+x0.participants.length);
      pn.style.cssText="font-size:11px;font-weight:700";
      var pcap=el("span",null," /"+x0.capacity);
      pcap.style.cssText="font-size:10px;color:var(--text-3)";
      pc.appendChild(pn); pc.appendChild(pcap);
      pc.addEventListener("click",function(ev){ev.stopPropagation();participantsForm(x0);});
      ctl.appendChild(pc);
      ctl.appendChild(rowMenu([
        {l:"Edit session",on:function(){sessionForm(x0);}},
        {l:"Open participants list",on:function(){participantsForm(x0);}},
        {l:"Duplicate session",on:function(){cloneSessionForm(x0);}},
        {l:"Delete session",danger:true,on:function(){
          confirmDelete("this session",function(){
            DB.sessions=DB.sessions.filter(function(y){return y.id!==x0.id;});
            save();render();toast("Session deleted");});}}
      ]));
      lane.appendChild(ctl);
    }
  });
  return box;
}

/* A pale wash of the activity colour: their blocks are tinted, not filled, so
   the title stays readable against it whatever colour the school picked. */
function softColour(c){
  if(/^#[0-9a-f]{6}$/i.test(c)){
    var r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
    return "rgba("+r+","+g+","+b+",.22)";
  }
  return "var(--accent-soft)";
}

/* the board's rental tab: what is out of service across the shown days */
/* ============================ boards out on hire ============================
   A hire is a booking line with a board attached to it, a start and a duration.
   What the shop actually needs to know is when it comes back -- a board that is
   an hour late is a board somebody else is waiting for, and until now nothing
   anywhere in the app could answer that. */
function hireDue(l,bk){
  var d=l.wanted||bk.date;
  var t=l.time||"09:00";
  var start=new Date(d+"T"+(t.length===5?t:"09:00")+":00");
  var hours=Number(l.hours)||1;
  return {start:start,due:new Date(start.getTime()+hours*36e5),hours:hours};
}
/* out / due soon / overdue / back, judged against the clock on today and
   against the end of the day on any other */
function hireState(h,dateStr){
  if(h.returnedAt) return "back";
  var now=new Date();
  var ref=(dateStr===todayISO()) ? now : new Date(dateStr+"T23:59:00");
  var mins=(h.due-ref)/6e4;
  if(mins<0) return "late";
  if(mins<=30) return "soon";
  return "out";
}
function hiresOn(dateStr){
  var out=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    (bk.lines||[]).forEach(function(l){
      if(!l.unitId) return;
      if((l.wanted||bk.date)!==dateStr) return;
      var g=null,u=null;
      DB.gear.forEach(function(x){
        (x.units||[]).forEach(function(y){ if(y.id===l.unitId){ g=x; u=y; } });
      });
      var w=hireDue(l,bk);
      out.push({booking:bk,line:l,gear:g,unit:u,
                start:w.start,due:w.due,hours:w.hours,
                returnedAt:l.returnedAt||""});
    });
  });
  return out.sort(function(a,b){return a.due-b.due;});
}
function hhmmOf(d){
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
/* how late, or how long left, in words a person reads at a glance */
function hireWhen(h,dateStr){
  var ref=(dateStr===todayISO()) ? new Date() : new Date(dateStr+"T23:59:00");
  var mins=Math.round((h.due-ref)/6e4);
  var late=mins<0;
  var m=Math.abs(mins);
  var txt = m<60 ? (m+" min") : (Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":""));
  return late ? (txt+" late") : (txt+" left");
}

function rentalsOutTable(host,dateStr){
  var rows=hiresOn(dateStr);
  var h=el("div","sec-h");
  h.appendChild(el("h2",null,"Out on hire"));
  h.appendChild(el("span","spacer"));
  var late=rows.filter(function(x){return hireState(x,dateStr)==="late";}).length;
  var soon=rows.filter(function(x){return hireState(x,dateStr)==="soon";}).length;
  if(late) h.appendChild(el("span","chip bad",late+" overdue"));
  if(soon) h.appendChild(el("span","chip warnc",soon+" due soon"));
  host.appendChild(h);

  if(!rows.length){
    host.appendChild(el("div","note",
      "No boards are out on "+dm(dateStr)+
      ". A hire appears here as soon as a booking has a board attached to it."));
    return;
  }
  var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
  ["Gear","Board","Client","Out at","Due back","","",""].forEach(function(x,i){
    tr.appendChild(el("th",(i===3||i===4)?"r":null,x));});
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  rows.forEach(function(x){
    var st=hireState(x,dateStr);
    var r=el("tr");
    if(st==="back") r.style.opacity=".55";
    r.appendChild(el("td","strong",x.gear?x.gear.name:"—"));
    r.appendChild(el("td",x.unit?null:"muted",x.unit?x.unit.name:"unit no longer listed"));
    var cl=el("td");
    var link=el("button","btn sm",clientName(x.booking.clientId));
    link.style.cssText+=";border:0;background:none;padding:0;color:var(--accent);font-weight:600";
    link.addEventListener("click",function(){posStart(x.booking);});
    cl.appendChild(link);
    cl.appendChild(el("div","hint",bookingCode(x.booking)));
    r.appendChild(cl);
    r.appendChild(el("td","n r",hhmmOf(x.start)));
    var dc=el("td","n r strong",hhmmOf(x.due));
    if(st==="late") dc.style.color="var(--crit)";
    else if(st==="soon") dc.style.color="var(--warn)";
    r.appendChild(dc);
    var sc=el("td");
    sc.appendChild(el("span","chip "+
      (st==="late"?"bad":st==="soon"?"warnc":st==="back"?"ok":"neutral"),
      st==="late"?"Overdue":st==="soon"?"Due soon":st==="back"?"Back":"Out"));
    r.appendChild(sc);
    r.appendChild(el("td","muted",st==="back"
      ? ("returned "+x.returnedAt.slice(11,16)) : hireWhen(x,dateStr)));
    var act=el("td"),box=el("div","rowbtns");
    if(st==="back"){
      var undo=el("button","btn sm","Undo");
      undo.addEventListener("click",function(){
        delete x.line.returnedAt; save(); render(); toast("Marked back out");
      });
      box.appendChild(undo);
    } else {
      var back=el("button","btn sm primary","Returned");
      back.addEventListener("click",function(){
        x.line.returnedAt=new Date().toISOString();
        save(); render(); toast((x.unit?x.unit.name:"Board")+" is back");
      });
      box.appendChild(back);
    }
    act.appendChild(box); r.appendChild(act);
    tb.appendChild(r);
  });
  t.appendChild(tb); w.appendChild(t); host.appendChild(w);
  host.appendChild(el("div","note",
    "Due back is the hire's starting hour plus the duration it was sold at. "+
    "Marking a board back frees it — the next booking stops seeing it as already out."));
}

/* ===================== the hire board =====================
   The list answers "what is late". It does not answer the question the shop
   actually asks twenty times a day, which is "who has which board, until
   when, and what is free at four o'clock" -- for that you have to see the
   boards down one side and the day across the top.

   So: a lane per board, grouped by its gear; a block per hire, as wide as the
   hire is long; and dragging one moves it -- along its lane to change the
   hour, onto another lane to put that person on another board. A board that
   is already out at that hour refuses, because two people cannot take the
   same board at once, and that is the whole reason for looking at this. */
var rentalView="board", rentalAll=false;
function hireBlocksFor(unitId,dateStr){
  return hiresOn(dateStr).filter(function(h){ return h.line.unitId===unitId; });
}
function unitBusy(unitId,dateStr,startMins,endMins,skipLine){
  var clash=null;
  hireBlocksFor(unitId,dateStr).forEach(function(h){
    if(h.line===skipLine) return;
    var a=h.start.getHours()*60+h.start.getMinutes();
    var b=a+Math.max(15,h.hours*60);
    if(startMins<b && endMins>a) clash=h;
  });
  return clash;
}
function rentalBoard(dateStr){
  var LABEL=narrow()?116:205;
  var span=(BOARD_TO-BOARD_FROM)*60;
  var box=el("div");

  var head=el("div","sec-h");
  head.appendChild(el("h2",null,"The boards"));
  head.appendChild(el("span","sub",dowOf(dateStr)+", "+dm(dateStr)));
  head.appendChild(el("span","spacer"));
  var tog=el("button","btn sm",rentalView==="board"?"See the list":"See the board");
  tog.addEventListener("click",function(){
    rentalView=(rentalView==="board")?"list":"board"; renderBoard();});
  head.appendChild(tog);
  box.appendChild(head);

  /* The school has two hundred and sixty boards. Drawing every one of them
     every day is a page nobody can read: the useful board is the gear that is
     actually out today, with all of its units so somebody can be moved onto a
     free one. The rest is one click away. */
  var all=DB.gear.filter(function(g){return (g.units||[]).length;});
  var busyGear={};
  hiresOn(dateStr).forEach(function(h){ if(h.gear) busyGear[h.gear.id]=1; });
  var gears=rentalAll?all:all.filter(function(g){return busyGear[g.id];});
  if(!gears.length && !rentalAll){ gears=all.slice(0,1); }
  if(all.length>gears.length || rentalAll){
    var more=el("button","btn sm",rentalAll
      ? "Only the gear that is out"
      : ("Show every board ("+all.reduce(function(a,g){
          return a+(g.units||[]).length;},0)+")"));
    more.addEventListener("click",function(){ rentalAll=!rentalAll; renderBoard(); });
    head.insertBefore(more,tog);
  }
  if(!gears.length){
    box.appendChild(el("div","note",
      "No boards are listed yet. Add gear and its units in Gear, and each one "+
      "gets a lane here."));
    return box;
  }

  var wrap=el("div","panel");
  wrap.style.cssText="overflow-x:auto;padding:0";
  var stack=el("div");
  stack.style.cssText="min-width:1100px";

  /* the hour axis, the same one the sessions board is read against */
  var axis=el("div");
  axis.style.cssText="display:grid;grid-template-columns:"+LABEL+"px minmax(0,1fr);"+
    "border-bottom:1px solid var(--line);background:var(--panel-2);"+
    "position:sticky;top:0;z-index:3";
  var al=el("div",null,"BOARD");
  al.style.cssText="padding:8px 12px;font-size:11px;font-weight:800;"+
    "letter-spacing:.07em;color:var(--text-3);border-right:1px solid var(--line)";

function hireBlock(x,dateStr,span,lanesHost){
  var st=hireState(x,dateStr);
  var startM=x.start.getHours()*60+x.start.getMinutes()-BOARD_FROM*60;
  var mins=Math.max(15,x.hours*60);
  var left=Math.max(0,Math.min(97,startM/span*100));
  var width=Math.max(4,Math.min(100-left,mins/span*100));
  var tone = st==="late" ? "#d4183d" : st==="soon" ? "#c88a20"
           : st==="back" ? "#8a8f98" : "#c81e4a";
  var colour = st==="late" ? "var(--crit)"
             : st==="soon" ? "var(--warn)"
             : st==="back" ? "var(--text-3)" : "var(--accent)";
  var blk=el("div");
  blk.style.cssText="position:absolute;left:"+left+"%;width:"+width+"%;top:3px;"+
    "bottom:3px;background:"+softColour(tone)+";"+
    "border-left:3px solid "+colour+";border-radius:4px;padding:3px 8px;"+
    "overflow:hidden;cursor:grab;color:var(--text);font-size:12px;font-weight:600;"+
    "display:flex;align-items:center;gap:7px;touch-action:none;min-width:32px";
  if(st==="back") blk.style.opacity=".55";
  blk.dataset.hireLine=x.line.lid;
  var who=el("span",null,clientName(x.booking.clientId));
  who.style.cssText="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1";
  blk.appendChild(who);
  var when=el("span",null,hhmmOf(x.start)+"–"+hhmmOf(x.due));
  when.style.cssText="font-size:10.5px;font-weight:700;color:var(--text-2);flex:none";
  blk.appendChild(when);
  blk.title=clientName(x.booking.clientId)+" · "+(x.gear?x.gear.name:"")+" "+
    (x.unit?x.unit.name:"")+" · out "+hhmmOf(x.start)+", back "+hhmmOf(x.due)+
    " · "+(st==="back"?"returned":hireWhen(x,dateStr));

  /* ---- dragging: along the lane changes the hour, across lanes the board ---- */
  var drag=null;
  blk.addEventListener("pointerdown",function(e){
    if(e.button && e.button!==0) return;
    e.preventDefault();
    var r=blk.getBoundingClientRect();
    drag={dx:e.clientX-r.left,moved:false,x0:e.clientX,y0:e.clientY,
          laneW:blk.parentNode.getBoundingClientRect().width};
    blk.setPointerCapture(e.pointerId);
    blk.style.cursor="grabbing"; blk.style.zIndex="5";
    blk.style.boxShadow="0 8px 22px rgba(0,0,0,.28)";
  });
  blk.addEventListener("pointermove",function(e){
    if(!drag) return;
    if(!drag.moved){
      if(Math.abs(e.clientX-drag.x0)<3 && Math.abs(e.clientY-drag.y0)<3) return;
      drag.moved=true;
    }
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var lane=under&&under.closest?under.closest("[data-unit-id]"):null;
    if(lane) drag.unitId=lane.dataset.unitId;
    var rect=(lane||blk.parentNode).getBoundingClientRect();
    var px=e.clientX-drag.dx-rect.left;
    var frac=Math.max(0,Math.min(1,px/rect.width));
    drag.mins=Math.round((BOARD_FROM*60+frac*span)/15)*15;
    blk.style.left=(frac*100)+"%";
    when.textContent=toHHMM(drag.mins)+"–"+toHHMM(drag.mins+Math.max(15,x.hours*60));
    [].forEach.call(lanesHost.querySelectorAll("[data-unit-id]"),function(n){
      n.style.background = (n.dataset.unitId===drag.unitId)?"var(--accent-soft)":"";
    });
  });
  function done(){
    if(!drag) return;
    var d=drag; drag=null;
    blk.style.cursor="grab"; blk.style.zIndex=""; blk.style.boxShadow="";
    [].forEach.call(lanesHost.querySelectorAll("[data-unit-id]"),function(n){
      n.style.background="";});
    if(!d.moved){ hireCard(x,dateStr); return; }
    var unitId=d.unitId||x.line.unitId;
    var mins=(d.mins==null)?(x.start.getHours()*60+x.start.getMinutes()):d.mins;
    var clash=unitBusy(unitId,dateStr,mins,mins+Math.max(15,x.hours*60),x.line);
    if(clash){
      renderBoard();
      toast("That board is already out to "+clientName(clash.booking.clientId)+
            " at "+hhmmOf(clash.start)+".");
      return;
    }
    /* a board only stands in for one of its own kind */
    var newGear=null,newUnit=null;
    DB.gear.forEach(function(gg){
      (gg.units||[]).forEach(function(uu){
        if(uu.id===unitId){ newGear=gg; newUnit=uu; }});
    });
    var pr=product(x.line.productId);
    if(pr && pr.gearId && newGear && newGear.id!==pr.gearId){
      renderBoard();
      toast(pr.name+" goes out on "+((by(pr.gearId,DB.gear)||{}).name||"its own gear")+
            ", not "+newGear.name+".");
      return;
    }
    x.line.unitId=unitId;
    x.line.unitName=(newUnit&&newUnit.name)||"";
    x.line.time=toHHMM(mins);
    save(); renderBoard();
    toast(clientName(x.booking.clientId)+" → "+(newUnit?newUnit.name:"board")+
          " at "+toHHMM(mins));
  }
  blk.addEventListener("pointerup",done);
  blk.addEventListener("pointercancel",done);
  return blk;
}

function seatRef(kind,a,b2){
  return kind==="client" ? ("c:"+a) : ("p:"+a+":"+b2);
}
function seatInfo(ref){
  if(typeof ref!=="string") return {name:"—",missing:true};
  if(ref.indexOf("c:")===0 || ref.indexOf(":")<0){
    var cid=ref.indexOf("c:")===0?ref.slice(2):ref;   /* bare id = old format */
    var c=by(cid,DB.clients);
    return c?{name:c.name,clientId:cid,kind:"client"}
            :{name:"(deleted client)",missing:true,kind:"client"};
  }
  if(ref.indexOf("p:")===0){
    var parts=ref.split(":");
    var bk=by(parts[1],DB.bookings);
    if(bk){
      var pp=(bk.participants||[]).filter(function(x){return x.pid===parts[2];})[0];
      if(pp) return {name:pp.name,kind:"participant",clientId:pp.clientId||"",
                     participant:pp,booking:bk};
    }
    return {name:"(removed from booking)",missing:true,kind:"participant"};
  }
  return {name:"—",missing:true};
}
function seatName(ref){ return seatInfo(ref).name; }
function seatDocs(ref){
  var i=seatInfo(ref);
  return i.clientId?docsFor(i.clientId):[];
}
/* everyone named across the day's bookings, seated or not */
function peopleOn(dateStr){
  var out=[];
  DB.clients.forEach(function(c){
    out.push({ref:seatRef("client",c.id),name:c.name,from:"client",clientId:c.id});
  });
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    (bk.participants||[]).forEach(function(pp){
      if(!pp.pid) return;
      out.push({ref:seatRef("participant",bk.id,pp.pid),name:pp.name,
        from:"booking "+dm(bk.date),clientId:pp.clientId||"",
        level:pp.level,wetsuit:pp.wetsuit,age:pp.age,bookingId:bk.id});
    });
  });
  return out;
}

function participantsBlock(working,seatsWanted,onChange){

    if(need>0){
      var note=el("div","hint",
        have===need ? (have+" of "+need+" named.")
        : (have<need ? (need-have)+" still to name — the products cover "+need+" "+
             (need===1?"person":"people")+"."
           : (have-need)+" more named than the products cover."));

      note.style.marginBottom="8px";

      var e=el("div","hint","Nobody named yet. The client on the booking is assumed.");

    working.participants.forEach(function(pp,i){

      nm.style.cssText="font-weight:600;font-size:13.5px";
      left.appendChild(nm);
      var bits=[];
      if(pp.age!=="") bits.push(pp.age+"y");
      if(pp.level) bits.push(pp.level);
      if(pp.wetsuit) bits.push("wetsuit "+pp.wetsuit);
      if(pp.insurance) bits.push("insured");
      if(bits.length) left.appendChild(el("div","hint",bits.join(" · ")));
      row.appendChild(left);
      if(pp.clientId){
        var ds=docsFor(pp.clientId);
        if(!ds.length) row.appendChild(el("span","chip critc","no waiver"));
        else {
          var worst=ds.map(docStatus).reduce(function(a,x){
            var rank={ok:0,warnc:1,critc:2}; return rank[x.k]>rank[a.k]?x:a;});
          if(worst.k!=="ok") row.appendChild(el("span","chip "+worst.k,worst.l));

      rm.addEventListener("click",function(){
        working.participants.splice(i,1); draw(); onChange();});
      row.appendChild(rm);
      host.appendChild(row);
    });
  }
  draw();
  return {node:host,redraw:draw};
}

/* ============================ product picker ============================
   A dropdown of 35 names tells you nothing about what anything costs. This is
   the catalogue: grouped by activity, searchable, every price option on show
   before you commit to one. */
var pickQ="", pickKind="";
function productPicker(onPick){
  var live=DB.products.filter(function(x){return !x.archived;});
  if(!live.length){ toast("Add a product to the catalogue first."); return; }

  var b=el("div");
  var sb=el("div","searchbar");
  var q=input("search",pickQ,{placeholder:"Search a product"});
  sb.appendChild(q);
  var kSel=select([{v:"",l:"Any activity"}].concat(
    KINDS().map(function(k){return {v:k.k,l:k.l};})),pickKind);
  kSel.style.cssText="width:auto;padding:9px 11px;border-radius:9px;font:inherit;"+
    "border:1px solid var(--line);background:var(--panel);color:var(--text)";
  sb.appendChild(kSel);
  b.appendChild(sb);

  var listHost=el("div");
  listHost.style.cssText="max-height:52vh;overflow-y:auto;margin-top:4px";
  b.appendChild(listHost);

  function draw(){
    listHost.textContent="";
    var term=pickQ.trim().toLowerCase();
    var rows=live.filter(function(x){
      if(pickKind && x.kind!==pickKind) return false;
      if(!term) return true;
      return [x.name,x.code,x.shortDesc].join(" ").toLowerCase().indexOf(term)>=0;
    });
    if(!rows.length){
      listHost.appendChild(el("div","note","Nothing matches."));
      return;
    }
    /* grouped by activity, the way the catalogue reads */
    var groups={};
    rows.forEach(function(x){
      var g=kindLabel(x.kind)||"Other";
      (groups[g]=groups[g]||[]).push(x);
    });
    Object.keys(groups).sort().forEach(function(g){

        "font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;"+
        "color:var(--text-3);z-index:1";
      listHost.appendChild(head);
      groups[g].sort(function(a,b2){return (b2.price||0)-(a.price||0);}).forEach(function(x){
        var row=el("div");

/* ---- discount, kept apart from simply overriding the price ---- */
function priceEditForm(line,onDone){
  var pr=product(line.productId);
  var base=priceFor(pr,line.pax,line.hours);
  var b=el("div");
  b.appendChild(el("p","hint",(pr?pr.name:"Item")+" — tier price $"+money(base)));
  /* their form leads with the discount, and that is the common case */
  var mode=select([{v:"discount",l:"Register a discount"},
                   {v:"adjust",l:"Update the price"}],
    (line.manual?"adjust":"discount"));
  var val=input("number",line.discount!=null?line.discount:(line.manual?line.price:""),
    {min:"0",step:"0.01",placeholder:"0"});
  var kind=select([{v:"amount",l:"Amount off"},{v:"percent",l:"Percent off"}],
    line.discountType||"amount");
  b.appendChild(field("What are you doing?",mode));
  var kindBox=field("Discount type",kind);
  b.appendChild(kindBox);
  var valBox=field("Value",val);
  b.appendChild(valBox);
  var preview=el("div","tot");
  preview.appendChild(el("span","lab","Charged"));
  var pv=el("span","v mono"); preview.appendChild(pv);
  b.appendChild(preview);
  function calc(){
    var v=Number(val.value)||0;
    if(mode.value==="adjust") return v;
    return kind.value==="percent" ? Math.max(0,base*(1-v/100)) : Math.max(0,base-v);
  }
  function sync(){
    kindBox.hidden = mode.value!=="discount";
    pv.textContent="$"+money(calc());
    var over = mode.value==="discount" && calc()>base+0.004;
    pv.style.color = over ? "var(--crit)" : "";
  }
  [mode,kind,val].forEach(function(n){
    n.addEventListener("input",sync); n.addEventListener("change",sync);});
  sync();
  openModal("Edit price",b,[
    {label:"Cancel",on:closeModal},
    {label:"Clear",on:function(){
      delete line.discount; delete line.discountType; delete line.manual;
      line.price=base; closeModal(); onDone(); toast("Back to the tier price");
    }},
    {label:"Apply",cls:"primary",on:function(){
      var v=Number(val.value)||0;
      if(mode.value==="discount"){
        if(calc()>base+0.004){
          toast("That raises the price — use Update the price instead."); return; }
        line.discount=v; line.discountType=kind.value; delete line.manual;
        line.price=Math.round(calc()*100)/100;
      } else {
        delete line.discount; delete line.discountType;
        line.manual=true; line.price=v;
      }
      closeModal(); onDone(); toast("Price updated");
    }}
  ]);
}

/* ============================ session assignment ============================
   A three-lesson course is three seats, not one. This is where a booking's
   people are put into the sessions they bought, and where the app can say how
   many are still owed. */
function sessionsOwed(line){
  var pr=product(line.productId);
  if(!pr) return 0;
  if(pr.sessionsAtBooking) return Number(line.sessions)||0;
  var per=Number(pr.sessions)||1;
  if(per<=1) return 0;                       /* a single session needs no picking */
  return per*(Number(line.qty)||1);
}
function seatsOfBooking(bk){
  var named=(bk.participants||[]).filter(function(p){return p.pid;});
  if(named.length) return named.map(function(p){
    return {ref:seatRef("participant",bk.id,p.pid),name:p.name};});
  if(bk.clientId) return [{ref:seatRef("client",bk.clientId),name:clientName(bk.clientId)}];
  return [];
}
function assignedCount(bk,line){
  var refs=seatsOfBooking(bk).map(function(x){return x.ref;});
  if(!refs.length) return 0;
  var n=0;
  DB.sessions.forEach(function(se){
    if((se.fromLines||[]).indexOf(line.lid)<0) return;
    se.participants.forEach(function(r){ if(refs.indexOf(r)>=0) n++; });
  });
  return n;
}
function assignSessionsForm(bk,line,onDone){
  var pr=product(line.productId);
  var owed=sessionsOwed(line);
  var seats=seatsOfBooking(bk);
  var b=el("div");
  if(!seats.length){
    b.appendChild(el("p",null,"Name at least one participant on the booking first."));
    openModal("Assign sessions",b,[{label:"Close",on:closeModal}]);
    return;
  }
  var head=el("p","hint");
  b.appendChild(head);
  var from=input("date",bk.date);
  var days=input("number",30,{min:"1",max:"180",step:"1"});
  var g=el("div","grid2");
  g.appendChild(field("Look from",from)); g.appendChild(field("Days ahead",days));
  b.appendChild(g);
  var listHost=el("div");
  listHost.style.cssText="max-height:44vh;overflow-y:auto;margin-top:6px";
  b.appendChild(listHost);

  function refreshHead(){
    var n=assignedCount(bk,line);
    head.textContent=(pr?pr.name:"Product")+" — "+n+" of "+owed+
      " session"+(owed===1?"":"s")+" assigned"+
      (seats.length>1?(" across "+seats.length+" people"):"")+".";
    head.style.color = n>=owed ? "var(--good)" : "var(--warn)";
  }
  function draw(){
    refreshHead();
    listHost.textContent="";
    var start=from.value||bk.date;
    var end=iso(new Date(new Date(start+"T12:00:00").getTime()+
      (Number(days.value)||30)*864e5));
    var rows=DB.sessions.filter(function(se){
      return se.date>=start && se.date<=end && slotFitsSession(line,se);
    }).sort(function(a,b2){
      return a.date===b2.date ? (a.time<b2.time?-1:1) : (a.date<b2.date?-1:1);});
    if(!rows.length){
      listHost.appendChild(el("div","note",lineActivity(line)
        ? ("No "+lineActivity(line)+" sessions scheduled in that window.")
        : "No sessions scheduled in that window."));
      return;
    }
    var lastDate="";
    rows.forEach(function(se){
      if(se.date!==lastDate){
        lastDate=se.date;
        var h=el("div","eyebrow",dowOf(se.date)+" · "+dm(se.date));
        h.style.cssText="padding:11px 2px 6px;font-size:10.5px;font-weight:700;"+
          "letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)";
        listHost.appendChild(h);
      }
      var here=seats.filter(function(x){return se.participants.indexOf(x.ref)>=0;});
      var row=el("div");
      row.style.cssText="display:flex;align-items:center;gap:10px;padding:9px 11px;"+
        "border:1px solid "+(here.length?"var(--accent)":"var(--line-soft)")+
        ";border-radius:9px;margin-bottom:6px;background:"+
        (here.length?"var(--accent-soft)":"var(--panel-2)");
      var mid=el("div"); mid.style.flex="1";
      var t=el("div",null,se.time+" · "+se.title);
      t.style.cssText="font-weight:600;font-size:13.5px";
      mid.appendChild(t);
      var bits=[instructorNames(se)];
      if(se.spot) bits.push(se.spot);
      bits.push(se.participants.length+"/"+se.capacity);
      mid.appendChild(el("div","hint",bits.join(" · ")));
      row.appendChild(mid);
      if(here.length) row.appendChild(el("span","chip ok",here.length+" seated"));
      var btn=el("button","btn sm"+(here.length?" danger":" primary"),
        here.length?"Remove":"Add all");
      btn.type="button";
      btn.addEventListener("click",function(){
        if(here.length){
          se.participants=se.participants.filter(function(r){
            return !seats.some(function(x){return x.ref===r;});});
          se.fromLines=(se.fromLines||[]).filter(function(x){return x!==line.lid;});
        } else {
          var room=se.capacity-se.participants.length;
          if(room<=0){ toast(se.title+" is full."); return; }
          var take=seats.filter(function(x){
            return se.participants.indexOf(x.ref)<0;}).slice(0,room);
          if(take.length<seats.length)
            toast("Only "+take.length+" of "+seats.length+" fitted.");
          take.forEach(function(x){ se.participants.push(x.ref); });
          se.fromLines=(se.fromLines||[]).concat([line.lid]);
        }
        save(); draw(); render();
      });
      row.appendChild(btn);
      listHost.appendChild(row);
    });
  }
  from.addEventListener("change",draw);
  days.addEventListener("input",draw);
  draw();
  openModal("Assign sessions",b,[{label:"Done",cls:"primary",on:function(){
    closeModal(); onDone(); }}]);
}

/* ============================ bookings ============================ */
function bookingForm(existing){
  if(!DB.products.length){ toast("Add a product to the catalog first."); return; }
  var bk=existing||{date:todayISO(),clientId:DB.clients[0]?DB.clients[0].id:null,
    lines:[],payments:[],notes:""};
  var working={lines:(bk.lines||[]).map(function(l){
                 var c=JSON.parse(JSON.stringify(l));
                 if(!c.lid) c.lid=uid("ln");
                 return c;
               }),
               payments:JSON.parse(JSON.stringify(bk.payments||[])),
               participants:JSON.parse(JSON.stringify(bk.participants||[]))};


  var b=el("div");
  var date=input("date",bk.date);
  var clientOpts=DB.clients.map(function(c){return {v:c.id,l:c.name};});
  var client=select(clientOpts.length?clientOpts:[{v:"",l:"— no clients yet —"}],bk.clientId||"");
  var g=el("div","grid2");
  g.appendChild(field("Date",date)); g.appendChild(field("Client",client));
  b.appendChild(g);

  var linesHost=el("div"), payHost=el("div");
  var totBox=el("div","tot");
  var totLab=el("span","lab","Total"), totV=el("span","v mono","$0.00");
  var dueLab=el("span","lab"), dueV=el("span","v mono");
  totBox.appendChild(totLab); totBox.appendChild(totV);
  var dueBox=el("div","tot");
  dueBox.appendChild(dueLab); dueBox.appendChild(dueV);

  function recalc(){
    if(typeof pblock!=="undefined" && pblock) pblock.redraw();
    var t=working.lines.reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
    var p=working.payments.reduce(function(a,x){return a+(Number(x.amount)||0);},0);
    totV.textContent="$"+money(t);
    dueLab.textContent = p>=t ? "Paid in full" : "Outstanding";
    dueV.textContent="$"+money(Math.max(0,t-p));
    dueV.style.color = p>=t ? "var(--good)" : "var(--crit)";
  }
  function drawLines(){
    linesHost.textContent="";
    if(!working.lines.length){
      var e=el("div","hint","No products on this booking yet.");
      e.style.padding="10px 2px";
      linesHost.appendChild(e);
      return;
    }
    working.lines.forEach(function(l,idx){
      var pr0=product(l.productId);
      var wantPax=hasPaxTiers(pr0), wantHours=hasHourTiers(pr0);

      var card=el("div");
      card.style.cssText="border:1px solid var(--line-soft);border-radius:10px;"+
        "padding:11px 12px;margin-bottom:9px;background:var(--panel-2)";

      var top=el("div");
      top.style.cssText="display:flex;align-items:baseline;gap:9px;margin-bottom:8px";
      var nm=el("div",null,pr0?pr0.name:"—");
      nm.style.cssText="font-weight:600;font-size:13.5px;flex:1";
      top.appendChild(nm);
      var swap=el("button","btn sm","Change"); swap.type="button";
      swap.addEventListener("click",function(){
        productPicker(function(p2){
          l.productId=p2.id; l.pax=l.pax||1;
          l.hours=hasHourTiers(p2)?(l.hours||1):null;
          delete l.discount; delete l.discountType; delete l.manual;
          l.price=priceFor(p2,l.pax,l.hours);
          drawLines(); recalc();
        });
      });
      top.appendChild(swap);
      var rm=el("button","btn sm danger","Remove"); rm.type="button";
      rm.addEventListener("click",function(){
        working.lines.splice(idx,1); drawLines(); recalc();});
      top.appendChild(rm);
      card.appendChild(top);

      if(pr0){
        var meta=[ptypeLabel(pr0.ptype)];
        if(pr0.sessions>1&&!pr0.sessionsAtBooking) meta.push(pr0.sessions+" sessions");
        var sum=priceSummary(pr0);
        if(sum) meta.push(sum);
        var ml=el("div","hint",meta.join(" · "));
        ml.style.marginBottom="8px";
        card.appendChild(ml);
      }

      var row=el("div");
      row.style.cssText="display:grid;gap:8px;align-items:end;grid-template-columns:"+
        (wantPax?"minmax(0,1fr) ":"")+(wantHours?"minmax(0,1fr) ":"")+
        "minmax(0,1fr) minmax(0,1.2fr) auto";
      function lab(t,node){
        var w=el("div");
        var l2=el("div","hint",t); l2.style.marginBottom="3px";
        w.appendChild(l2); w.appendChild(node); return w;
      }
      function reprice(){
        var p2=product(l.productId);
        if(!p2) return;
        if(l.manual) return;                       /* an overridden price stands */
        var base=priceFor(p2,l.pax,l.hours);
        if(l.discount!=null){
          l.price=Math.round(Math.max(0, l.discountType==="percent"
            ? base*(1-l.discount/100) : base-l.discount)*100)/100;
        } else l.price=base;
        if(priceIn) priceIn.value=l.price;
        recalc();
      }
      var priceIn=null;
      if(wantPax){
        var px=input("number",l.pax||1,{min:"1",step:"1"});
        px.addEventListener("input",function(){l.pax=Number(px.value)||1;reprice();});
        row.appendChild(lab("People",px));
      }
      if(wantHours){
        var hrs=input("number",l.hours||1,{min:"1",step:"1"});
        hrs.addEventListener("input",function(){l.hours=Number(hrs.value)||1;reprice();});
        row.appendChild(lab("Hours",hrs));
      }
      var qty=input("number",l.qty,{min:"1",step:"1"});
      qty.addEventListener("input",function(){l.qty=Number(qty.value)||1;recalc();});
      row.appendChild(lab("Qty",qty));
      priceIn=input("number",l.price,{min:"0",step:"0.01"});
      priceIn.addEventListener("input",function(){
        l.price=Number(priceIn.value)||0; l.manual=true;
        delete l.discount; delete l.discountType; recalc();});
      row.appendChild(lab("Unit price",priceIn));
      var ed=el("button","btn sm","Price"); ed.type="button";
      ed.addEventListener("click",function(){
        priceEditForm(l,function(){drawLines();recalc();});});
      row.appendChild(ed);
      card.appendChild(row);

      var owed=sessionsOwed(l);
      if(owed>0){
        var done=existing?assignedCount(existing,l):0;
        var arow=el("div");
        arow.style.cssText="display:flex;align-items:center;gap:9px;margin-top:9px";
        var st=el("span","chip "+(done>=owed?"ok":"warnc"),
          done+" / "+owed+" sessions assigned");
        arow.appendChild(st);
        var ab=el("button","btn sm","Assign sessions"); ab.type="button";
        if(!existing){
          ab.disabled=true;
          ab.title="Save the booking first, then assign its sessions.";
          ab.style.opacity=".5";
        } else {
          ab.addEventListener("click",function(){
            assignSessionsForm(existing,l,function(){drawLines();recalc();});});
        }
        arow.appendChild(ab);
        card.appendChild(arow);
      }

      if(l.discount!=null || l.manual){
        var p2=product(l.productId);
        var base=p2?priceFor(p2,l.pax,l.hours):0;
        var tag=el("div");
        tag.style.marginTop="8px";
        if(l.discount!=null){
          tag.appendChild(el("span","chip warnc","discount "+(l.discountType==="percent"
            ? l.discount+"%" : "$"+money(l.discount,2))));
        } else {
          tag.appendChild(el("span","chip neutral","price overridden"));
        }
        var was=el("span","hint"," was $"+money(base));
        was.style.marginLeft="7px";
        tag.appendChild(was);
        card.appendChild(tag);
      }
      linesHost.appendChild(card);
    });
  }
  function drawPays(){
    payHost.textContent="";
    working.payments.forEach(function(p,idx){
      var row=el("div","line");
      var m=select(METHODS().map(function(x){return {v:x,l:x};}),p.method);
      m.addEventListener("change",function(){p.method=m.value;});
      var amt=input("number",p.amount,{min:"0",step:"0.01"});
      amt.addEventListener("input",function(){p.amount=Number(amt.value)||0;recalc();});
      var pd=input("date",p.date||date.value);
      pd.addEventListener("input",function(){p.date=pd.value;});
      var rm=el("button","btn sm danger","×");
      rm.addEventListener("click",function(){working.payments.splice(idx,1);drawPays();recalc();});
      row.style.gridTemplateColumns="1fr 92px 1fr auto";
      row.appendChild(m); row.appendChild(amt); row.appendChild(pd); row.appendChild(rm);
      payHost.appendChild(row);
    });
  }

  var lh=el("div","lines-h");
  lh.appendChild(el("h4",null,"Products"));
  var addLine=el("button","btn sm primary","Add product");
  addLine.addEventListener("click",function(){
    productPicker(function(p2){
      working.lines.push({lid:uid("ln"),productId:p2.id,qty:1,pax:1,
        hours:hasHourTiers(p2)?1:null,price:priceFor(p2,1,hasHourTiers(p2)?1:null)});
      drawLines(); recalc();
    });
  });
  lh.appendChild(addLine);
  b.appendChild(lh); b.appendChild(linesHost); b.appendChild(totBox);

  var ph=el("div","lines-h"); ph.appendChild(el("h4",null,"Payments"));
  var addPay=el("button","btn sm","Add payment");
  addPay.addEventListener("click",function(){
    var t=working.lines.reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
    var p=working.payments.reduce(function(a,x){return a+(Number(x.amount)||0);},0);
    /* if everything on the booking asks for a deposit, offer that rather than
       the full balance -- typing over it is one keystroke either way */
    var dep=0, all=working.lines.length>0;
    working.lines.forEach(function(l){
      var pr=product(l.productId);
      var v=(Number(l.price)||0)*(Number(l.qty)||0);
      if(pr&&pr.depositType&&pr.depositValue){
        dep += pr.depositType==="percent" ? v*pr.depositValue/100 : Number(pr.depositValue);
      } else all=false;
    });
    var suggest=(all&&dep>0&&p===0)?Math.min(dep,t):Math.max(0,t-p);
    working.payments.push({method:(METHODS()[0]||"Cash"),
      amount:Math.round(suggest*100)/100,date:date.value});
    drawPays(); recalc();
  });
  ph.appendChild(addPay);
  b.appendChild(ph); b.appendChild(payHost); b.appendChild(dueBox);

  /* how many people the products actually cover */
  function seatsWanted(){
    return working.lines.reduce(function(a,l){
      var pr=product(l.productId);
      var per=(pr&&hasPaxTiers(pr))?(Number(l.pax)||1):1;
      return a+per*(Number(l.qty)||1);
    },0);
  }
  var pblock=participantsBlock(working,seatsWanted,function(){});
  b.appendChild(pblock.node);

  /* who sent them, if anyone -- this is what a partner commission is computed from */
  var partner=null;
  if(DB.partners.length){
    partner=select([{v:"",l:"— direct —"}].concat(DB.partners.map(function(p){
      return {v:p.id,l:p.company+(p.commission?" ("+p.commission+"%)":"")};})),bk.partnerId||"");
    b.appendChild(field("Booked through",partner,
      "A hotel or agency that sent this client. Their commission is worked out on Crew pay."));
  }

  var notes=el("textarea"); notes.value=bk.notes||"";
  b.appendChild(field("Notes",notes));
  var bcf=customInputs("booking",bk.custom);
  if(bcf.any) b.appendChild(bcf.node);

  drawLines(); drawPays(); recalc();

  openModal(existing?"Edit booking":"New booking",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      if(!client.value){ toast("Add a client first."); return; }
      if(!working.lines.length){ toast("Add at least one product."); return; }
      var rec=existing||{id:uid("b")};
      rec.date=date.value||todayISO(); rec.clientId=client.value;
      rec.lines=working.lines.filter(function(l){return l.productId;});
      rec.payments=working.payments.filter(function(p){return Number(p.amount)>0;});
      rec.participants=working.participants;
      rec.partnerId=partner?partner.value:(bk.partnerId||"");
      rec.notes=notes.value.trim();
      var bmiss=bcf.missing();
      if(bmiss){ toast(bmiss+" is required."); return; }
      rec.custom=bcf.read();
      if(!existing) DB.bookings.push(rec);
      syncTickets();
      save(); closeModal(); render(); toast(existing?"Booking updated":"Booking saved");
    }}
  ]);
}
/* Taking the money, straight after confirming. Their till goes here next, and
   a booking that is never paid is the one thing a school notices. */
function payForm(bk){

  var b=el("div");

  var when=input("date",todayISO());
  var g=el("div","grid2");
  g.appendChild(field("Amount",amt)); g.appendChild(field("Method",mth));
  b.appendChild(g);
  b.appendChild(field("Date",when));

  /* the deposit their products carry, offered rather than typed out */
  var dep=0,all=(bk.lines||[]).length>0;
  (bk.lines||[]).forEach(function(l){
    var pr=product(l.productId);
    var v=(Number(l.price)||0)*(Number(l.qty)||0);
    if(pr&&pr.depositType&&pr.depositValue){
      dep += pr.depositType==="percent" ? v*pr.depositValue/100 : Number(pr.depositValue);
    } else all=false;
  });
  if(all&&dep>0&&dep<due-0.004){
    var db=el("button","btn sm","Take the deposit, "+sym0()+money(dep,2));
    db.type="button";
    db.addEventListener("click",function(){ amt.value=Math.round(dep*100)/100; });
    b.appendChild(db);
  }

  openModal("Payment",b,[
    {label:"Pay later",on:closeModal},
    {label:"Record payment",cls:"primary",on:function(){
      var v=Number(amt.value)||0;
      if(v<=0){ toast("Enter an amount."); amt.focus(); return; }
      if(v>due+0.004){ toast("That is more than is outstanding."); return; }
      bk.payments=bk.payments||[];
      bk.payments.push({method:mth.value,amount:v,date:when.value||todayISO()});
      syncTickets();
      save(); closeModal(); render();
      toast(bookingDue(bk)<=0.004 ? "Paid in full" : (sym0()+money(v,2)+" taken"));
    }}
  ]);
}

var bkView="list";
var bkFilter={q:"",status:"all",from:"",to:""};
/* assigned from inside renderBookings; under "use strict" an undeclared
   assignment throws rather than quietly making a global */
var box2Invoice=null, box2Cancel=null;
/* ============================ the till ============================
   Their new booking is not a dialog with an "add product" button behind it: it
   is a whole screen laid out like a till. Categories across the top, every
   product a tile you press, and the booking building up in a panel on the
   right with the total at the bottom. Six presses instead of six dialogs, and
   that is the difference the school actually feels on a busy morning. */
var posBooking=null, posCat="", posEditing=null, posConfig=null;

/* The booking this client already has open on that day, if there is one. A
   cancelled booking is not open, and neither is one being edited right now. */
function openBookingFor(clientId,dateStr,skipId){
  if(!clientId) return null;
  for(var i=0;i<DB.bookings.length;i++){
    var b=DB.bookings[i];
    if(b.clientId!==clientId) continue;
    if(b.date!==dateStr) continue;
    if(b.status==="cancelled") continue;
    if(skipId && b.id===skipId) continue;
    return b;
  }
  return null;
}
/* Fold one booking into another: the lines, what was paid, the people and the
   note. Used to tidy up rows made before the till started joining them. */
function mergeBookings(from,into){
  (from.lines||[]).forEach(function(l){ into.lines.push(l); });
  (from.payments||[]).forEach(function(p){ into.payments.push(p); });
  (from.refunds||[]).forEach(function(r){
    into.refunds=into.refunds||[]; into.refunds.push(r); });
  (from.participants||[]).forEach(function(pp){
    into.participants=into.participants||[]; into.participants.push(pp); });
  if(from.notes) into.notes=[into.notes,from.notes].filter(Boolean).join(" · ");
  DB.bookings=DB.bookings.filter(function(x){return x.id!==from.id;});
  syncTickets();
}
function posStart(existing){
  if(!DB.products.length){ show("catalog"); toast("Add a product first."); return; }
  posEditing=existing||null;
  posBooking = existing ? JSON.parse(JSON.stringify(existing)) : {
    date:todayISO(),clientId:"",lines:[],payments:[],refunds:[],
    participants:[],partnerId:"",notes:"",custom:{}};
  posBooking.lines=posBooking.lines||[];
  posCat="";
  bkView="pos";
  show("bookings");
  renderBookings();
}
function posClose(){
  posBooking=null; posEditing=null; posConfig=null; bkView="list"; renderBookings();
}

/* the categories their tabs use: the activity calendars, in their own order */
function posCats(){
  var out=[{v:"",l:"Home"}];
  var seen={};
  (cfg().kinds||[]).forEach(function(k){
    if(seen[k.l]) return; seen[k.l]=1;
    var n=DB.products.filter(function(p){
      return !p.archived && (p.category===k.l || p.kind===k.k);}).length;
    if(n) out.push({v:k.l,l:k.l,color:k.color||""});
  });
  return out;
}
function posProducts(){
  return DB.products.filter(function(p){
    if(p.archived) return false;
    if(!posCat) return true;
    var k=(cfg().kinds||[]).filter(function(x){return x.l===posCat;})[0];
    return p.category===posCat || (k && p.kind===k.k);
  }).sort(function(a,b){
    return (Number(a.position)||999)-(Number(b.position)||999) ||
           a.name.localeCompare(b.name);
  });
}
function posTileColour(p){
  var k=(cfg().kinds||[]).filter(function(x){
    return x.l===p.category || x.k===p.kind;})[0];
  return (p.color||(k&&k.color))||"var(--accent-hot)";
}

function posTotals(){
  var sub=0,tax=0;
  (posBooking.lines||[]).forEach(function(l){
    var p=product(l.productId);
    var v=(Number(l.price)||0)*(Number(l.qty)||0);
    var rate=(p&&Number(p.tax))||0;
    sub+=v; tax+=v-v/(1+rate/100);
  });
  return {gross:sub,tax:tax,net:sub-tax};
}

/* ---- configuring a line ----------------------------------------------
   Pressing a tile does not finish the job. A board hire needs a day, an hour,
   how long, and which board; a course needs how many people and which sessions
   they are coming to. Their till answers those in a pane where the tiles were,
   and refuses to confirm until they are answered -- "Please select unit!",
   "please select session!". Same here. */
function lineNeeds(l){
  var p=product(l.productId);
  if(!p) return null;
  if(p.ptype==="rental"||p.gearId) return "unit";
  if(sessionsOwed(l)>0) return "sessions";
  return null;
}
/* A unit has to be picked -- a hire with no board is not a hire. Sessions do
   not: the school takes the booking at the counter and puts the lessons in the
   diary later, so an unscheduled course is a normal state, not an error. The
   bookings list carries the "N to assign" chip until it is done. */
function lineReady(l){
  var need=lineNeeds(l);
  if(need==="unit") return !!l.unitId;
  return true;
}
function lineSummary(l){
  var need=lineNeeds(l);
  if(need==="unit" && !l.unitId) return "Please select unit!";
  if(need==="sessions"){
    var got=(l.sessionIds||[]).length, want=sessionsOwed(l);
    if(!got) return want+" session"+(want===1?"":"s")+" to schedule";
    if(got<want) return got+" of "+want+" sessions chosen";
    return got+" of "+want+" sessions chosen";
  }
  return "";
}

/* One row per seat: the name inline, the rest a click away but still on this
   page. Typing does not redraw, or the field would lose the cursor mid-word. */
function participantRows(n){
  posBooking.participants=posBooking.participants||[];
  while(posBooking.participants.length<n){
    posBooking.participants.push({pid:uid("pt"),name:"",age:"",level:"",wetsuit:"",
      height:"",weight:"",clientId:"",insurance:false,notes:"",custom:{}});
  }
  var host=el("div");
  host.style.marginBottom="14px";
  for(var i=0;i<n;i++){
    (function(idx){
      var pp=posBooking.participants[idx];
      var row=el("div","pt-row");
      var nm=input("text",pp.name,{placeholder:"Participant "+(idx+1)});
      nm.addEventListener("input",function(){ pp.name=nm.value; });
      row.appendChild(nm);
      var more=el("button","btn sm","▾"); more.type="button";
      more.title="Age, level, wetsuit";
      row.appendChild(more);
      host.appendChild(row);

      var extra=el("div","pt-extra"); extra.hidden=true;
      var g=el("div","grid2");
      var age=input("number",pp.age,{min:"0",max:"120",step:"1",placeholder:"Age"});
      age.addEventListener("input",function(){ pp.age=age.value; });
      var lvl=select(LEVELS,pp.level||"");
      lvl.addEventListener("change",function(){ pp.level=lvl.value; });
      g.appendChild(field("Age",age)); g.appendChild(field("Level",lvl));
      extra.appendChild(g);
      var g2=el("div","grid2");
      var wet=input("text",pp.wetsuit,{placeholder:"e.g. M, L, XL"});
      wet.addEventListener("input",function(){ pp.wetsuit=wet.value; });
      var note=input("text",pp.notes,{placeholder:"Anything the instructor should know"});
      note.addEventListener("input",function(){ pp.notes=note.value; });
      g2.appendChild(field("Wetsuit size",wet)); g2.appendChild(field("Note",note));
      extra.appendChild(g2);
      host.appendChild(extra);
      more.addEventListener("click",function(){
        extra.hidden=!extra.hidden;
        more.textContent=extra.hidden?"▾":"▴";
      });
    })(i);
  }
  return host;
}

function posConfigPane(l){
  var p=product(l.productId);
  var box=el("div");
  var head=el("div","cfg-head");
  head.style.borderLeft="5px solid "+posTileColour(p);
  head.appendChild(el("strong",null,p?p.name:"Item"));
  head.appendChild(el("span","spacer"));
  var del=el("button","kebab"); del.type="button"; del.title="Remove from the booking";
  del.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" '+
    'stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>';
  del.addEventListener("click",function(){
    posBooking.lines=posBooking.lines.filter(function(x){return x!==l;});
    posConfig=null; renderBookings();
  });
  head.appendChild(del);

/* a hire: when it goes out, for how long, and which board */
function rentalFields(body,l,p){
  var g=el("div","grid2");
  var date=input("date",l.wanted||posBooking.date||todayISO());
  date.addEventListener("change",function(){l.wanted=date.value;});
  g.appendChild(field("Date",date));
  var hour=input("time",l.time||"09:00");
  hour.addEventListener("change",function(){l.time=hour.value;});
  g.appendChild(field("Starting hour",hour));
  body.appendChild(g);

  /* the duration ladder, priced -- this is the tier matrix, shown as choices */
  var tiers=ladderTiers(p).filter(function(x){return x.hours;})
    .sort(function(a,b){return a.hours-b.hours;});
  var g2=el("div","grid2");
  if(tiers.length){
    var dur=select(tiers.map(function(t){
      return {v:String(t.hours),l:t.hours+" h — "+sym0()+money(t.price,2)};}),
      String(l.hours||tiers[0].hours));
    dur.addEventListener("change",function(){
      l.hours=Number(dur.value)||1;
      l.price=priceFor(p,l.pax,l.hours);
      renderBookings();
    });
    g2.appendChild(field("Duration",dur));
  } else {
    var h=input("number",l.hours||1,{min:"1",step:"1"});
    h.addEventListener("input",function(){
      l.hours=Number(h.value)||1; l.price=priceFor(p,l.pax,l.hours);});
    g2.appendChild(field("Duration (hours)",h));
  }

  /* which board actually goes out, so two customers cannot take the same one */
  var gear=p.gearId?by(p.gearId,DB.gear):null;
  var units=gear?(gear.units||[]):[];
  var taken=unitsOutOn(l.wanted||posBooking.date,l.lid);
  var opts=[{v:"",l:units.length?"— select a unit —":"— no gear on this product —"}]
    .concat(units.map(function(u){
      return {v:u.id,l:u.name+(taken[u.id]?"  (already out)":"")};}));
  var unit=select(opts,l.unitId||"");
  unit.addEventListener("change",function(){
    l.unitId=unit.value;
    l.unitName=(units.filter(function(u){return u.id===unit.value;})[0]||{}).name||"";
    renderBookings();
  });
  g2.appendChild(field("Gear",unit,gear?null:
    "This product has no gear attached. Set it on the product in the catalog."));
  body.appendChild(g2);
  if(units.length && Object.keys(taken).length)
    body.appendChild(el("div","note",
      "Units marked already out are on another booking that day. Nothing stops you "+
      "picking one — the school knows its own boards — but it is worth a look."));
}

/* which individual boards are already on a booking that day */
function unitsOutOn(dateStr,exceptLid){
  var out={};
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    (bk.lines||[]).forEach(function(x){
      if(!x.unitId || x.lid===exceptLid) return;
      if((x.wanted||bk.date)!==dateStr) return;
      if(x.returnedAt) return;            /* back on the rack, so free again */
      out[x.unitId]=true;
    });
  });
  return out;
}

/* a course: how many are coming, who they are, and which sessions they attend */
function courseFields(body,l,p){
  var want=sessionsOwed(l);
  var g=el("div","grid2");
  var pax=input("number",l.pax||1,{min:"1",step:"1"});
  pax.addEventListener("input",function(){
    l.pax=Math.max(1,Number(pax.value)||1);
    l.price=priceFor(p,l.pax,l.hours);
    renderBookings();
  });
  g.appendChild(field("Participants",pax));
  var from=input("date",l.wanted||posBooking.date||todayISO());
  from.addEventListener("change",function(){l.wanted=from.value;renderBookings();});
  g.appendChild(field("Date from",from));
  body.appendChild(g);

  /* The names belong here, not behind a button that opens a dialog. One less
     place to go, and the field is next to the count that says how many. */
  var ph=el("div","lines-h");
  ph.appendChild(el("h4",null,"Details of participants ("+(Number(l.pax)||1)+")"));
  body.appendChild(ph);
  body.appendChild(participantRows(Number(l.pax)||1));

  var sh=el("div","lines-h");
  sh.appendChild(el("h4",null,"Sessions ("+((l.sessionIds||[]).length)+" of "+want+")"));
  sh.appendChild(el("span","hint",
    lineActivity(l)?(lineActivity(l)+" only · optional now"):"optional now"));
  var clr=el("button","btn sm","Clear all");
  clr.addEventListener("click",function(){l.sessionIds=[];renderBookings();});
  sh.appendChild(clr);
  body.appendChild(sh);

  /* six days of what is on, laid out a column a day, as theirs is */
  var start=l.wanted||posBooking.date||todayISO();
  var nav=el("div","searchbar");
  var pv=el("button","btn sm","‹");
  pv.addEventListener("click",function(){
    l.wanted=addDays(start,-6); renderBookings();});
  var nx=el("button","btn sm","›");
  nx.addEventListener("click",function(){
    l.wanted=addDays(start,6); renderBookings();});
  nav.appendChild(pv);
  nav.appendChild(el("span","eyebrow",dm(start)+" – "+dm(addDays(start,5))));
  nav.appendChild(nx);
  body.appendChild(nav);

  var cols=el("div","cfg-days");
  var any=false;
  for(var i=0;i<6;i++){
    (function(off){
      var d=addDays(start,off);
      var col=el("div","cfg-day");
      col.appendChild(el("div","h",dowOf(d)+" "+dm(d)));
      /* only the sessions this product actually runs under: a foil tow does
         not belong on a surf lesson, so it is not offered one */
      var rows=DB.sessions.filter(function(x){
          return x.date===d && slotFitsSession(l,x);})
        .sort(function(a,b){return a.time<b.time?-1:1;});
      if(!rows.length) col.appendChild(el("div","none","—"));
      rows.forEach(function(se){
        any=true;
        var on=(l.sessionIds||[]).indexOf(se.id)>=0;
        var full=se.participants.length>=se.capacity;
        var card=el("button","cfg-ses"+(on?" on":""));
        card.type="button";
        card.appendChild(el("span","who",instructorNames(se)));
        card.appendChild(el("span","t",se.time));
        card.appendChild(el("span","n",se.participants.length+"/"+se.capacity));
        card.title=se.title+" · "+instructorNames(se)+
          (full?" · full":"")+(on?" · chosen":"");
        if(full&&!on){ card.style.opacity=".55"; }
        card.addEventListener("click",function(){
          l.sessionIds=l.sessionIds||[];
          var at=l.sessionIds.indexOf(se.id);
          if(at>=0) l.sessionIds.splice(at,1);
          else{
            if(l.sessionIds.length>=want){
              toast("You have selected "+want+" of "+want+" sessions.");
              return;
            }
            l.sessionIds.push(se.id);
          }
          renderBookings();
        });
        col.appendChild(card);
      });
      cols.appendChild(col);
    })(i);
  }
  body.appendChild(cols);
  body.appendChild(el("div","note",
    "You can close the booking without picking these and schedule them later — "+
    "the bookings list keeps a \u201cto assign\u201d count until they are done."+
    (any?"":" Nothing is scheduled in these six days; step forward, or put "+
         "sessions on the planning first.")));
}

/* Seat the booking's people into the sessions the line chose. Runs on confirm,
   so the schedule and the booking never disagree about who is coming. */
function seatChosenSessions(bk){
  (bk.lines||[]).forEach(function(l){
    if(!(l.sessionIds||[]).length) return;
    var refs=[];
    (bk.participants||[]).forEach(function(pp){
      if(pp.pid && pp.name) refs.push(seatRef("participant",bk.id,pp.pid));
    });
    if(!refs.length && bk.clientId) refs=[seatRef("client",bk.clientId)];
    l.sessionIds.forEach(function(sid){
      var se=by(sid,DB.sessions);
      if(!se) return;
      se.fromLines=se.fromLines||[];
      if(se.fromLines.indexOf(l.lid)<0) se.fromLines.push(l.lid);
      refs.forEach(function(r){
        if(se.participants.indexOf(r)<0) se.participants.push(r);
      });
    });
  });
}

function renderPos(host){
  var shell=el("div","pos");
  /* ---------------- left: the tiles ---------------- */
  var left=el("div","pos-left");
  /* the tiles give way to the pane that asks what the line still needs; the
     booking panel on the right is the same either way */
  var configuring = posConfig && posBooking.lines.indexOf(posConfig)>=0;
  if(configuring) left.appendChild(posConfigPane(posConfig));
  var tabs=el("div","pos-tabs");
  var cats=configuring?[]:posCats();
  /* their strip shows five and folds the rest into MORE. With a dozen imported
     activity calendars, a strip that wraps to three rows pushes the tiles off
     the screen -- which is the one thing a till must not do. */
  var SHOWN=6;
  var head=cats.slice(0,SHOWN), rest=cats.slice(SHOWN);
  if(posCat && rest.some(function(c){return c.v===posCat;})){
    var pick=rest.filter(function(c){return c.v===posCat;})[0];
    rest=rest.filter(function(c){return c.v!==posCat;});
    rest.unshift(head[head.length-1]);
    head[head.length-1]=pick;
  }
  head.forEach(function(c){
    var b=el("button",null,c.l);
    b.setAttribute("aria-pressed",posCat===c.v?"true":"false");
    b.addEventListener("click",function(){posCat=c.v;renderBookings();});
    tabs.appendChild(b);
  });
  if(rest.length){
    var more=el("button",null,"More ▾");
    more.setAttribute("aria-pressed","false");
    more.addEventListener("click",function(ev){
      ev.stopPropagation();
      rowMenuAt(more,rest.map(function(c){
        return {l:c.l,on:function(){posCat=c.v;renderBookings();}};}));
    });
    tabs.appendChild(more);
  }
  if(!configuring) left.appendChild(tabs);

  var rows=configuring?[]:posProducts();
  if(!rows.length && !configuring){
    left.appendChild(el("div","note","Nothing in this category yet."));
  }
  var grid=el("div","pos-grid");
  rows.forEach(function(p){
    var colour=posTileColour(p);
    var tile=el("button","pos-tile");
    tile.type="button";
    var top=el("div","face");
    top.style.background=softColour(colour);
    top.style.borderTop="5px solid "+colour;
    /* what one press actually adds -- a "from" price on a till is a price the
       customer will not be charged, and the till is where that gets noticed */
    var price=el("span","px",money(priceFor(p,1,hasHourTiers(p)?1:null),2)+sym0());
    top.appendChild(price);
    tile.appendChild(top);
    var nm=el("div","nm",p.name);
    nm.style.borderBottom="2px solid "+colour;
    tile.appendChild(nm);
    tile.title=p.name+(priceSummary(p)?(" · "+priceSummary(p)):"");
    tile.addEventListener("click",function(){ posAdd(p); });
    grid.appendChild(tile);
  });
  if(!configuring) left.appendChild(grid);
  shell.appendChild(left);

  /* ---------------- right: the booking ---------------- */
  var side=el("div","pos-side");
  var sh=el("div","pos-sh");
  sh.appendChild(el("strong",null,posEditing?"Booking":"Booking"));
  sh.appendChild(el("span","spacer"));
  sh.appendChild(rowMenu([
    {l:"Booking date",on:posDateForm},
    {l:"Booked through a partner",on:posPartnerForm},
    {l:"Note",on:posNoteForm},
    {l:"Clear the booking",danger:true,on:function(){
      confirmish("Clear this booking?","Everything on it is discarded.",function(){
        posBooking.lines=[]; posBooking.clientId=""; posBooking.participants=[];
        posBooking.notes=""; renderBookings();
      },"Clear");
    }}
  ]));
  side.appendChild(sh);

  var cust=el("button","pos-cust");
  cust.type="button";
  if(posBooking.clientId){
    var c=by(posBooking.clientId,DB.clients)||{};
    cust.appendChild(el("strong",null,c.name||"—"));
    var sub=[c.phone,c.email].filter(Boolean).join(" · ");
    if(sub) cust.appendChild(el("span","sub",sub));
  } else {
    cust.appendChild(el("span",null,"+ Add customer"));
  }
  cust.addEventListener("click",posCustomerForm);
  side.appendChild(cust);

  var body=el("div","pos-lines");
  if(!posBooking.lines.length){
    var e=el("div","pos-empty","Select a product");
    body.appendChild(e);
  }
  posBooking.lines.forEach(function(l,i){
    var p=product(l.productId);
    var row=el("div","pos-line");
    var main=el("div");
    main.appendChild(el("div","nm",p?p.name:"Item"));
    var bits=[];
    if(hasPaxTiers(p)&&(Number(l.pax)||1)>1) bits.push((Number(l.pax)||1)+" people");
    if(l.hours) bits.push(l.hours+"h");
    if(l.discount!=null) bits.push("discount "+(l.discountType==="percent"
      ? l.discount+"%" : sym0()+money(l.discount,2)));
    if(l.manual) bits.push("price set by hand");
    main.appendChild(el("div","sub",bits.join(" · ")||(sym0()+money(l.price,2)+" each")));
    var warn=lineSummary(l);
    if(warn){
      var wl=el("div","sub",warn);
      var done=(lineNeeds(l)!=="sessions")
        ? lineReady(l)
        : (l.sessionIds||[]).length>=sessionsOwed(l);
      wl.style.color=lineReady(l)?(done?"var(--good)":"var(--warn)"):"var(--crit)";
      wl.style.fontWeight="600";
      main.appendChild(wl);
    }
    main.style.cursor="pointer";
    main.addEventListener("click",function(){
      /* an unanswered line goes back to its pane; a finished one to the price */
      if(lineNeeds(l)) { posConfig=l; renderBookings(); }
      else priceEditForm(l,function(){renderBookings();});
    });
    row.appendChild(main);

    var qty=el("div","qty");
    var minus=el("button",null,"−"); minus.type="button";
    minus.addEventListener("click",function(){
      l.qty=Math.max(1,(Number(l.qty)||1)-1); renderBookings();});

function sym0(){
  var c=CUR(); return c==="EUR"?"€":c==="GBP"?"£":"$";
}

function posAdd(p){
  /* a second press of the same tile is another one of the same thing, which is
     how a till behaves and saves a trip to the quantity stepper */
  var baseHours=hasHourTiers(p)?1:null;
  for(var i=0;i<posBooking.lines.length;i++){
    var l=posBooking.lines[i];
    /* an untouched line for the same product: same one person, same duration,
       no discount and no hand-set price. posAdd sets hours on hour-tier
       products, so comparing against "no hours" never matched them. */
    if(l.productId===p.id && l.discount==null && !l.manual && !lineNeeds(l) &&
       (Number(l.pax)||1)===1 && (l.hours||null)===baseHours){
      l.qty=(Number(l.qty)||1)+1;
      renderBookings();
      return;
    }
  }
  var line={lid:uid("ln"),productId:p.id,qty:1,pax:1,
    hours:hasHourTiers(p)?1:null,
    price:priceFor(p,1,hasHourTiers(p)?1:null),
    wanted:posBooking.date,sessionIds:[]};
  posBooking.lines.push(line);
  if(lineNeeds(line)) posConfig=line;      /* straight into what it still needs */
  renderBookings();
}

function posConfirm(){
  if(!posBooking.lines.length){ toast("Add a product first."); return; }
  for(var i=0;i<posBooking.lines.length;i++){
    if(!lineReady(posBooking.lines[i])){
      posConfig=posBooking.lines[i];
      renderBookings();
      toast(lineSummary(posConfig));
      return;
    }
  }
  if(!posBooking.clientId){ toast("Add a customer to the booking."); posCustomerForm(); return; }
  /* One client, one day, one booking. Somebody who takes a course in the
     morning and hires a board in the afternoon has bought two things, not
     been to the school twice, and a second row for them is a second row to
     chase, invoice and reconcile. The lines join what is already open. */
  var joinTo=!posEditing && openBookingFor(posBooking.clientId,
                                           posBooking.date||todayISO());
  if(joinTo){
    posBooking.lines.forEach(function(l){ joinTo.lines.push(l); });
    (posBooking.payments||[]).forEach(function(p){ joinTo.payments.push(p); });
    (posBooking.participants||[]).forEach(function(pp){
      joinTo.participants=joinTo.participants||[];
      joinTo.participants.push(pp);
    });
    if(posBooking.notes) joinTo.notes=[joinTo.notes,posBooking.notes]
      .filter(Boolean).join(" · ");
    seatChosenSessions(joinTo);
    syncTickets();
    save();
    posClose();
    toast("Added to "+clientName(joinTo.clientId)+"'s booking"+
          (joinTo.ref?(" "+joinTo.ref):""));
    if(bookingDue(joinTo)>0.004) payForm(joinTo);
    return;
  }
  var rec=posEditing||{id:uid("b")};
  rec.date=posBooking.date||todayISO();
  rec.clientId=posBooking.clientId;
  rec.lines=posBooking.lines.slice();
  rec.payments=posBooking.payments||[];
  rec.refunds=posBooking.refunds||[];
  rec.participants=posBooking.participants||[];
  rec.partnerId=posBooking.partnerId||"";
  rec.notes=posBooking.notes||"";
  rec.custom=posBooking.custom||{};
  var wasEdit=!!posEditing;
  if(!wasEdit) DB.bookings.push(rec);
  seatChosenSessions(rec);
  syncTickets();
  save();
  var saved=rec;
  posClose();                       /* this clears posEditing, so read it first */
  toast(wasEdit?"Booking updated":"Booking saved");
  /* straight to taking the money, which is what happens next at a till */
  if(bookingDue(saved)>0.004) payForm(saved);
}
