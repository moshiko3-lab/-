<title>SHOKOGI Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#f7f5f6; --panel:#fff; --panel-2:#faf7f8; --panel-3:#f2ecee;
  --line:#e6dfe2; --line-soft:#efe9eb;
  --text:#121011; --text-2:#5c5257; --text-3:#8d8288;
  --accent:#e04b78; --accent-hot:#f46e95; --accent-soft:#fdeaf0; --accent-ink:#fff;
  --good:#1f7a4d; --good-soft:#e4f4eb; --warn:#9a6a10; --warn-soft:#fbf0d9;
  --crit:#b23a2c; --crit-soft:#fbe7e4;
  --shadow:0 1px 2px rgba(18,16,17,.05),0 10px 26px -14px rgba(18,16,17,.22);
  --shadow-lg:0 20px 60px -20px rgba(18,16,17,.35);
  --r:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
    --line:#332c30; --line-soft:#282225;
    --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
    --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
    --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
    --crit:#f0705c; --crit-soft:#3a1d18;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
    --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --ground:#131012; --panel:#1c181a; --panel-2:#211c1f; --panel-3:#2a2327;
  --line:#332c30; --line-soft:#282225;
  --text:#f4eff1; --text-2:#b3a7ac; --text-3:#867a80;
  --accent:#f46e95; --accent-hot:#ff8dad; --accent-soft:#3a1f29; --accent-ink:#1a1013;
  --good:#5ec98d; --good-soft:#163327; --warn:#e0ae4a; --warn-soft:#33280f;
  --crit:#f0705c; --crit-soft:#3a1d18;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.75);
  --shadow-lg:0 24px 70px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);
  font-family:Figtree,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;letter-spacing:-.02em;font-weight:700;text-wrap:balance}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-3)}

/* shell: a fixed icon rail and a brand bar, the shape their dashboard uses */
:root{--rail:56px; --topbar:55px; --slate:#394654; --slate-2:#2f3a46;}
aside.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);background:var(--slate);
  z-index:40;display:flex;flex-direction:column;align-items:center;padding:9px 0;gap:2px;
  overflow-y:auto;scrollbar-width:none}
aside.rail::-webkit-scrollbar{display:none}
aside.rail .mark{width:34px;height:34px;flex:none;margin-bottom:9px;border-radius:8px;
  background:#fff;display:grid;place-items:center;overflow:hidden}
aside.rail .mark img{width:28px;height:28px;display:block}
aside.rail button{appearance:none;border:0;background:none;cursor:pointer;color:#9fb0c0;
  width:44px;height:42px;border-radius:9px;display:grid;place-items:center;position:relative;
  transition:background .14s,color .14s}
aside.rail button svg{width:21px;height:21px;display:block;fill:none;
  stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
aside.rail button:hover{background:var(--slate-2);color:#fff}
aside.rail button[aria-selected="true"]{color:#fff;background:var(--slate-2)}
aside.rail button[aria-selected="true"]::before{content:"";position:absolute;left:-9px;top:9px;
  bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent-hot)}
aside.rail button:focus-visible{outline:2px solid var(--accent-hot);outline-offset:-2px}
aside.rail .tip{position:absolute;left:52px;background:var(--slate);color:#fff;font-size:11.5px;
  font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:7px;
  white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:50}
aside.rail button:hover .tip{opacity:1}

header.top{position:fixed;left:var(--rail);right:0;top:0;height:var(--topbar);
  background:var(--accent-hot);z-index:35;display:flex;align-items:center;
  padding:0 18px;gap:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
header.top .title{color:#fff;font-weight:800;font-size:15px;letter-spacing:.09em;
  text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
header.top .title small{font-weight:600;font-size:10.5px;letter-spacing:.14em;opacity:.82}
header.top .spacer{margin-left:auto}
header.top .tbtn{appearance:none;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);
  color:#fff;font:inherit;font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:8px;cursor:pointer;transition:background .14s}
header.top .tbtn:hover{background:rgba(255,255,255,.24)}
header.top .tbtn.solid{background:#fff;color:var(--accent);border-color:#fff}
header.top .tbtn.solid:hover{background:rgba(255,255,255,.88)}
header.top .tbtn:focus-visible{outline:2px solid #fff;outline-offset:2px}

.wrap{margin-left:var(--rail);padding:calc(var(--topbar) + 18px) 22px 90px;
  max-width:1400px}
section[hidden]{display:none!important}
.panel{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:26px 0 13px}
.sec-h h2{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.sec-h .sub{font-size:13px;color:var(--text-3)}
.sec-h .spacer{margin-left:auto}

/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:inherit;font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 15px;border-radius:9px;cursor:pointer;transition:background .14s,border-color .14s}
.btn:hover{background:var(--panel-2);border-color:var(--text-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hot);border-color:var(--accent-hot)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.danger:hover{background:var(--crit-soft)}
.btn.sm{padding:6px 11px;font-size:11px}
.btn.icon{padding:7px 10px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-top:22px}
.kpi{padding:15px 16px 16px}
.kpi .val{font-size:27px;font-weight:700;letter-spacing:-.03em;display:block;margin-top:7px}
.kpi .meta{font-size:12.5px;color:var(--text-2);margin-top:3px}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 12px;text-align:left;white-space:nowrap}
th.r,td.r{text-align:right}
thead th{background:var(--panel-2);font-size:10px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-3);border-bottom:1px solid var(--line)}
tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--panel-2)}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
td.strong{font-weight:700}
.muted{color:var(--text-3)}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}

/* chips */
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;line-height:1.45;white-space:nowrap}
.chip.pink{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warnc{background:var(--warn-soft);color:var(--warn)}
.chip.critc{background:var(--crit-soft);color:var(--crit)}
.chip.neutral{background:var(--line-soft);color:var(--text-2)}

/* empty state */
.empty{padding:48px 26px;text-align:center}
.empty .ico{font-size:34px;line-height:1;margin-bottom:12px;opacity:.5}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{color:var(--text-2);font-size:13.5px;max-width:430px;margin:0 auto 18px}

/* schedule */
.daybar{display:flex;gap:7px;overflow-x:auto;padding:3px 0 6px;scrollbar-width:none}
.daybar::-webkit-scrollbar{display:none}
.daybar button{appearance:none;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font:inherit;border-radius:10px;padding:8px 12px;min-width:60px;text-align:center;flex:none;
  transition:background .14s}
.daybar button:hover{background:var(--panel-2)}
.daybar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.daybar .d{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.daybar .n{font-size:16px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.daybar .c{font-size:9.5px;opacity:.7}
.slot{display:grid;grid-template-columns:66px 1fr auto auto;gap:13px;align-items:center;
  padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.slot:last-child{border-bottom:0}
.slot .t{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;color:var(--text-2)}
.slot .nm{display:flex;align-items:center;gap:10px;min-width:0}
.slot .dot{width:7px;height:26px;border-radius:3px;flex:none;background:var(--accent-hot)}
.slot .nm b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .nm em{font-style:normal;font-size:12px;color:var(--text-3);display:block}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:11px}
.card{padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.card .nm{font-weight:700;font-size:14px;line-height:1.35}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
.card .foot{display:flex;align-items:center;gap:9px;margin-top:auto;padding-top:6px}
.card .pr{font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-right:auto}
.card .pr small{font-size:11px;color:var(--text-3);font-weight:400}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(18,16,17,.5);z-index:50;display:grid;
  place-items:center;padding:18px;overflow-y:auto}
.scrim[hidden]{display:none}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-lg);width:min(560px,100%);
  max-height:92vh;overflow-y:auto;border:1px solid var(--line-soft)}
.modal-h{display:flex;align-items:center;gap:12px;padding:18px 20px 14px;
  border-bottom:1px solid var(--line-soft);position:sticky;top:0;background:var(--panel);z-index:1}
.modal-h h3{font-size:15px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.modal-h .x{margin-left:auto}
.modal-b{padding:18px 20px}
.modal-f{padding:14px 20px 18px;display:flex;gap:9px;justify-content:flex-end;
  border-top:1px solid var(--line-soft);position:sticky;bottom:0;background:var(--panel)}

/* forms */
.fld{margin-bottom:14px}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);margin-bottom:5px}
.fld input,.fld select,.fld textarea{
  width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
  border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);
  outline-offset:-1px;border-color:transparent}
.fld textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hint{font-size:12px;color:var(--text-3);margin-top:4px}
.lines-h{display:flex;align-items:center;gap:10px;margin:16px 0 8px}
.lines-h h4{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-3);margin:0}
.line{display:grid;grid-template-columns:1fr 62px 92px auto;gap:8px;align-items:center;margin-bottom:8px}
.line select,.line input{font-size:13.5px;padding:8px 9px}
.tot{display:flex;align-items:baseline;gap:10px;padding:11px 13px;background:var(--panel-2);
  border-radius:9px;margin-top:10px}
.tot .lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.tot .v{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:700}

.note{font-size:13px;color:var(--text-2);background:var(--panel-2);border-left:3px solid var(--accent);
  padding:12px 15px;border-radius:0 9px 9px 0;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);
  color:var(--panel);padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
  z-index:70;box-shadow:var(--shadow-lg);opacity:0;transition:opacity .2s,transform .2s;
  pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.searchbar{display:flex;gap:9px;align-items:center;margin-bottom:12px}
.searchbar input{flex:1;font:inherit;font-size:14px;padding:9px 12px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--text)}
.searchbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}

@media (max-width:1000px){
  #p-board > div[style*="grid-template-columns: 1fr 230px"],
  #p-board > div[style*="1fr 230px"]{grid-template-columns:1fr!important}
}
@media (max-width:760px){
  aside.rail{left:0;right:0;top:auto;bottom:0;width:auto;height:52px;flex-direction:row;
    justify-content:flex-start;padding:0 6px;gap:0;overflow-x:auto}
  aside.rail .mark{display:none}
  aside.rail nav{flex-direction:row!important}
  aside.rail button[aria-selected="true"]::before{left:9px;right:9px;top:auto;bottom:-1px;
    width:auto;height:3px;border-radius:3px 3px 0 0}
  aside.rail .tip{display:none}
  header.top{left:0}
  .wrap{margin-left:0;padding-bottom:70px}
}
@media (max-width:640px){
  .wrap{padding-left:13px;padding-right:13px}
  .top-in{padding:12px 13px 0}
  .grid2{grid-template-columns:1fr}
  .slot{grid-template-columns:58px 1fr;gap:9px}
  .slot .cap,.slot .rowbtns{grid-column:2;justify-self:start}
  .line{grid-template-columns:1fr 54px 80px auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<aside class="rail">
  <span class="mark"><img src="data:image/png;base64,/*__LOGO__*/" alt="Shokogi"></span>
  <nav role="tablist" id="tabs" style="display:flex;flex-direction:column;gap:2px"></nav>
</aside>
<header class="top">
  <span class="title">Shokogi <small id="screen-name">Today</small></span>
  <span class="spacer"></span>
  <button class="tbtn" id="btn-backup">Backup</button>
  <button class="tbtn solid" id="btn-newbooking">+ Booking</button>
</header>

<div class="wrap">
  <section id="p-today" role="tabpanel"></section>
  <section id="p-schedule" role="tabpanel" hidden></section>
  <section id="p-board" role="tabpanel" hidden></section>
  <section id="p-trips" role="tabpanel" hidden></section>
  <section id="p-bookings" role="tabpanel" hidden></section>
  <section id="p-clients" role="tabpanel" hidden></section>
  <section id="p-catalog" role="tabpanel" hidden></section>
  <section id="p-gear" role="tabpanel" hidden></section>
  <section id="p-crew" role="tabpanel" hidden></section>
  <section id="p-register" role="tabpanel" hidden></section>
  <section id="p-invoices" role="tabpanel" hidden></section>
  <section id="p-fees" role="tabpanel" hidden></section>
  <section id="p-reports" role="tabpanel" hidden></section>
  <section id="p-settings" role="tabpanel" hidden></section>
</div>

<div class="scrim" id="scrim" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
"use strict";

/* ============================ store ============================
   Everything lives in this one object, persisted to localStorage.
   When a server exists, only save()/load() change -- nothing else. */
var KEY="shokogi.manager.v1";
var BLANK={v:1,clients:[],staff:[],products:[],sessions:[],bookings:[],
  spots:[{id:"sp1",name:"Playa Venao",lat:7.4283,lon:-80.1897}],
  gear:[],gearBlocks:[],timeOff:[],feeGroups:[],promos:[],partners:[],accommodations:[],
  invoices:[],invoiceSeq:1,tides:[],docs:[],cash:[],trips:[],staffFees:{},
  settings:{
    business:{name:"Shokogi Surf School",taxId:"",address:"",phone:"",email:"",currency:"USD"},
    methods:["Card","Cash","Online","Transfer","Other"],
    roles:["Instructor","Assistant","Photographer","Manager","Owner"],
    kinds:[{k:"lesson",l:"Lesson"},{k:"course",l:"Course / pack"},{k:"rental",l:"Rental"},
           {k:"photo",l:"Photography"},{k:"other",l:"Other"}],
    customFields:[]
  },
  seq:1};
var DB=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){
      var d=JSON.parse(raw);
      if(d&&d.v===1){
        /* a database saved before these existed must not arrive with holes */
        ["gear","gearBlocks","timeOff","feeGroups","promos","partners","accommodations",
         "clients","staff","products","sessions","bookings","spots","invoices",
         "tides","docs","cash","trips"].forEach(function(k){
          if(!Array.isArray(d[k])) d[k]=[];
        });
        if(typeof d.invoiceSeq!=="number") d.invoiceSeq=1;
        if(!d.staffFees || typeof d.staffFees!=="object") d.staffFees={};
        return d;
      }
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(BLANK));
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(DB)); }
  catch(e){ toast("Could not save. Browser storage may be full or blocked."); }
}
function uid(p){ return p+(DB.seq++); }

/* ============================ helpers ============================ */
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
/* These used to be constants. They now live in DB.settings so the school can
   rename or extend them without touching the code. */
function cfg(){ 
  if(!DB.settings) DB.settings=JSON.parse(JSON.stringify(BLANK.settings));
  return DB.settings;
}
function METHODS(){ return cfg().methods; }
function KINDS(){ return cfg().kinds; }
function ROLES(){ return cfg().roles; }
function CUR(){ return cfg().business.currency||"USD"; }

function iso(d){
  var z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);
  return z.toISOString().slice(0,10);
}
function todayISO(){ return iso(new Date()); }
function dm(s){ var p=String(s).split("-"); return MON[+p[1]-1]+" "+(+p[2]); }
function dowOf(s){ return DOW[new Date(s+"T12:00:00").getDay()]; }
function money(n,d){ return (Number(n)||0).toLocaleString("en-US",
  {minimumFractionDigits:d==null?2:d,maximumFractionDigits:d==null?2:d}); }
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML;}

var toastEl=document.getElementById("toast"),toastT;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.classList.remove("on");},2600);
}

function by(id,list){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }
function clientName(id){ var c=by(id,DB.clients); return c?c.name:"—"; }
function staffName(id){ var s=by(id,DB.staff); return s?s.name:"Unassigned"; }
function product(id){ return by(id,DB.products); }

/* booking money */
function bookingTotal(b){
  return (b.lines||[]).reduce(function(a,l){return a+(Number(l.price)||0)*(Number(l.qty)||0);},0);
}
function bookingPaid(b){
  return (b.payments||[]).reduce(function(a,p){return a+(Number(p.amount)||0);},0);
}
function bookingDue(b){ return bookingTotal(b)-bookingPaid(b); }

/* ============================ modal ============================ */
var scrim=document.getElementById("scrim"),modal=document.getElementById("modal");
/* Modals stack. A booking form opens a product picker on top of itself, and
   closing the picker has to give the booking back rather than throw it away. */
var modalStack=[];
function paintModal(entry){
  modal.textContent="";
  var h=el("div","modal-h"); h.appendChild(el("h3",null,entry.title));
  var x=el("button","btn sm icon x","Close");
  x.addEventListener("click",closeModal); h.appendChild(x);
  modal.appendChild(h);
  var b=el("div","modal-b"); b.appendChild(entry.body); modal.appendChild(b);
  var f=el("div","modal-f");
  (entry.actions||[]).forEach(function(a){
    var btn=el("button","btn "+(a.cls||""),a.label);
    btn.addEventListener("click",a.on); f.appendChild(btn);
  });
  modal.appendChild(f);
  scrim.hidden=false;
  var first=modal.querySelector("input,select,textarea,button");
  if(first) first.focus();
}
function openModal(title,bodyEl,actions){
  modalStack.push({title:title,body:bodyEl,actions:actions,
    focus:document.activeElement});
  paintModal(modalStack[modalStack.length-1]);
}
function closeModal(){
  var gone=modalStack.pop();
  if(modalStack.length){
    /* hand the one underneath back, exactly as it was */
    paintModal(modalStack[modalStack.length-1]);
    return;
  }
  scrim.hidden=true; modal.textContent="";
  if(gone && gone.focus && gone.focus.focus) gone.focus.focus();
}
function closeAllModals(){
  modalStack=[];
  scrim.hidden=true; modal.textContent="";
}
scrim.addEventListener("click",function(e){ if(e.target===scrim) closeModal(); });
addEventListener("keydown",function(e){ if(e.key==="Escape"&&!scrim.hidden) closeModal(); });

/* ============================ custom fields on forms ============================
   The back office defines these; every form that can carry them renders them
   here, so a field added in settings actually shows up where it was aimed. */
function fieldsFor(scope){
  return (cfg().customFields||[]).filter(function(f){return f.applies===scope;});
}
function customInputs(scope,values){
  /* returns {nodes:[…], read:fn} so callers stay short */
  var defs=fieldsFor(scope), made=[];
  var wrap=el("div");
  defs.forEach(function(f,i){
    var key="cf"+i+"_"+f.label;
    var cur=(values||{})[f.label];
    var node;
    if(f.type==="checkbox"){
      node=input("checkbox"); node.checked=!!cur; node.style.width="auto";
    } else if(f.type==="select"){
      var opts=(f.options||"").split(",").map(function(x){return x.trim();})
        .filter(Boolean).map(function(x){return {v:x,l:x};});
      node=select([{v:"",l:"—"}].concat(opts),cur||"");
    } else {
      node=input(f.type==="number"?"number":(f.type==="date"?"date":"text"),cur||"");
    }
    wrap.appendChild(field(f.label+(f.required?" *":""),node));
    made.push({def:f,node:node});
  });
  return {
    node:wrap,
    any:defs.length>0,
    missing:function(){
      for(var i=0;i<made.length;i++){
        var m=made[i];
        if(!m.def.required) continue;
        var v=m.def.type==="checkbox"?m.node.checked:m.node.value;
        if(!v) return m.def.label;
      }
      return null;
    },
    read:function(){
      var out={};
      made.forEach(function(m){
        out[m.def.label]=m.def.type==="checkbox"?m.node.checked:m.node.value;
      });
      return out;
    }
  };
}

/* ============================ csv export ============================ */
function csvCell(v){
  var s=v==null?"":String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function csvText(headers,rows){
  return [headers.map(csvCell).join(",")]
    .concat(rows.map(function(r){return r.map(csvCell).join(",");})).join("\n");
}
function exportCsv(name,headers,rows){
  if(!rows.length){ toast("Nothing to export."); return; }
  var text=csvText(headers,rows);
  /* The viewer sandbox blocks downloads a page starts itself, so the file is
     handed over as selectable text rather than a link that silently does
     nothing. */
  var b=el("div");
  b.appendChild(el("p",null,rows.length+" rows. Copy this and save it as "+name+".csv"));
  var ta=el("textarea"); ta.value=text; ta.setAttribute("aria-label","CSV data");
  ta.style.minHeight="230px"; ta.style.fontFamily="'IBM Plex Mono',monospace";
  ta.style.fontSize="11.5px"; ta.style.whiteSpace="pre";
  b.appendChild(field("CSV",ta));
  openModal("Export "+name,b,[
    {label:"Close",on:closeModal},
    {label:"Select all",cls:"primary",on:function(){ta.focus();ta.select();toast("Now copy it");}}
  ]);
}

   Waivers, insurance, medical forms. The file itself is not stored — browser
   storage is the wrong place for scans — but what matters operationally is
   whether a valid one exists and when it lapses, and that is tracked. */
var DOC_TYPES=["Waiver","Insurance","Medical","ID / passport","Licence","Other"];
function docsFor(clientId){
  return DB.docs.filter(function(d){return d.clientId===clientId;});

function docStatus(d){
  if(!d.expires) return {k:"ok",l:"valid"};
  var t=todayISO();
  if(d.expires<t) return {k:"critc",l:"expired"};
  var soon=iso(new Date(new Date(t+"T12:00:00").getTime()+30*864e5));
  if(d.expires<=soon) return {k:"warnc",l:"expires soon"};
  return {k:"ok",l:"valid"};
}

/* ============================ pricing ============================
   A product does not have "a price". A lesson is priced per head by how many
   share it; a rental by how long the board is out. all_prices in Bloowatch is
   that matrix, and this is the same thing: tiers, and the rule for picking one. */
function tiersOf(p){ return (p && p.prices && p.prices.length) ? p.prices : null; }
function hasPaxTiers(p){
  var t=tiersOf(p); if(!t) return false;
  return t.some(function(x){return (x.minPax||1)>1;});
}
function hasHourTiers(p){
  var t=tiersOf(p); if(!t) return false;
  return t.some(function(x){return x.hours;});
}
function priceFor(p,pax,hours){
  /* the applicable tier is the most generous one the request still clears */
  var t=tiersOf(p);
  if(!t) return Number(p&&p.price)||0;
  var cands=t;
  if(hasHourTiers(p)){
    var h=Number(hours)||1;
    var fit=t.filter(function(x){return x.hours && x.hours<=h;});
    /* below the smallest tier, charge the smallest tier */
    cands=fit.length?fit:t.filter(function(x){return x.hours;});
    cands=[cands.reduce(function(a,b){
      if(fit.length) return (a.hours>b.hours)?a:b;
      return (a.hours<b.hours)?a:b;
    })];
  }
  if(hasPaxTiers(p)){
    var n=Math.max(1,Number(pax)||1);
    var ok=cands.filter(function(x){return (x.minPax||1)<=n;});
    if(ok.length) cands=[ok.reduce(function(a,b){
      return ((a.minPax||1)>(b.minPax||1))?a:b;})];
  }
  var chosen=cands[0]||t[0];
  return Number(chosen.price)||0;
}
function priceSummary(p){
  var t=tiersOf(p);
  if(!t||t.length<2) return "";
  if(hasHourTiers(p)){
    var hs=t.filter(function(x){return x.hours;}).sort(function(a,b){return a.hours-b.hours;});
    return hs.length+" duration tiers · "+hs[0].hours+"h $"+money(hs[0].price,0)+
      " … "+hs[hs.length-1].hours+"h $"+money(hs[hs.length-1].price,0);
  }
  if(hasPaxTiers(p)){
    var ps=t.slice().sort(function(a,b){return (a.minPax||1)-(b.minPax||1);});
    return ps.map(function(x){return (x.minPax||1)+"p $"+money(x.price,0);}).join(" · ");
  }
  return "";
}

  {v:"tour",l:"Tour"},{v:"camp",l:"Camp"},{v:"accommodation",l:"Accommodation"},
  {v:"rental",l:"Rental"},{v:"item",l:"Item"},{v:"membership",l:"Membership"}
];
var WEEKDAY_SHORT=["S","M","T","W","T","F","S"];

function productForm(existing){
  var p=existing||{name:"",kind:(KINDS()[0]?KINDS()[0].k:"lesson"),price:"",sessions:1,
    priceMode:"fixed",code:"",maxAttendants:"",depositType:"",depositValue:"",archived:false,
    ptype:"class",description:"",shortDesc:"",longDesc:"",emailDesc:"",showEmailDesc:false,
    account:"",position:"",tax:0,taxNote:"",publicPrice:"",
    onlineSale:true,onlinePay:"full",onlinePayValue:"",sessionChoice:"full",
    clientCreatesSessions:false,filterByInstructor:false,
    sessionsAtBooking:false,privateSession:false,privateCourse:false,
    weekDays:[],startHours:[],availFrom:"",availTo:"",meetingSpot:"",
    limitedStock:false,stock:"",limitedAvail:false,availMax:"",
    gearId:"",accomId:"",nights:"",nightsAtBooking:false};

  var tiers=(p.prices||[]).map(function(x){
    return {minPax:x.minPax||1,hours:x.hours||null,price:x.price||0};});
  var weekDays=(p.weekDays||[]).slice();
  var startHours=(p.startHours||[]).slice();

  var b=el("div");

  /* --- tab strip, as their product form has --- */
  var TABS3=[{k:"info",l:"Information"},{k:"price",l:"Price"},{k:"cal",l:"Calendar"},
             {k:"online",l:"Online sale"}];
  var strip=el("div");
  strip.style.cssText="display:flex;gap:2px;border-bottom:1px solid var(--line);"+
    "margin:-4px 0 16px;overflow-x:auto";
  var panes={};
  TABS3.forEach(function(t){ panes[t.k]=el("div"); });
  function showTab(k){
    TABS3.forEach(function(t){ panes[t.k].hidden = t.k!==k; });
    [].forEach.call(strip.children,function(btn){
      var on=btn.dataset.k===k;
      btn.style.color=on?"var(--accent)":"var(--text-3)";
      btn.style.borderBottomColor=on?"var(--accent)":"transparent";
    });
  }
  TABS3.forEach(function(t){
    var btn=el("button",null,t.l);
    btn.dataset.k=t.k; btn.type="button";
    btn.style.cssText="appearance:none;border:0;background:none;cursor:pointer;font:inherit;"+
      "font-weight:700;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;"+
      "padding:9px 13px 11px;border-bottom:2px solid transparent;white-space:nowrap";
    btn.addEventListener("click",function(){showTab(t.k);});
    strip.appendChild(btn);
  });
  b.appendChild(strip);
  TABS3.forEach(function(t){ b.appendChild(panes[t.k]); });

  /* ---------------- information ---------------- */
  var I=panes.info;
  var name=input("text",p.name,{placeholder:"e.g. 3 Lesson Surf Course"});
  var ptype=select(PRODUCT_TYPES,p.ptype||"class");
  var kind=select(KINDS().map(function(k){return {v:k.k,l:k.l};}),p.kind);
  var code=input("text",p.code,{placeholder:"Product code"});
  var account=input("text",p.account,{placeholder:"Account number"});
  var position=input("number",p.position,{min:"1",step:"1",placeholder:"order in the list"});
  var desc=el("textarea"); desc.value=p.description||"";
  var shortD=input("text",p.shortDesc,{placeholder:"One line for the catalogue"});
  var longD=el("textarea"); longD.value=p.longDesc||"";
  var emailD=el("textarea"); emailD.value=p.emailDesc||"";
  var showEmailD=input("checkbox"); showEmailD.checked=!!p.showEmailDesc; showEmailD.style.width="auto";
  var maxAtt=input("number",p.maxAttendants,{min:"0",step:"1",placeholder:"no limit"});

  I.appendChild(field("Name",name));
  var gi=el("div","grid2");
  gi.appendChild(field("Product type",ptype));
  gi.appendChild(field("Activity calendar",kind,"Groups takings on the day closing."));
  I.appendChild(gi);
  var gi2=el("div","grid2");
  gi2.appendChild(field("Product code",code));
  gi2.appendChild(field("Account number",account));
  I.appendChild(gi2);
  var gi3=el("div","grid2");
  gi3.appendChild(field("Position in list",position));
  gi3.appendChild(field("Maximum attendants",maxAtt));
  I.appendChild(gi3);
  I.appendChild(field("Description",desc));
  I.appendChild(field("Short description",shortD));
  I.appendChild(field("Long description",longD,"Shown on the booking site."));
  I.appendChild(field("Description in email",emailD));
  I.appendChild(field("Show it in emails",showEmailD));

  /* ---------------- price ---------------- */
  var P=panes.price;
  var mode=select([
    {v:"fixed",l:"One fixed price"},
    {v:"person",l:"Per number of people"},
    {v:"item",l:"Per number of items or hours"},
    {v:"sessions",l:"Discount by number of sessions"},
    {v:"group",l:"Group discount"}],p.priceMode||"fixed");
  var price=input("number",p.price,{step:"0.01",min:"0",placeholder:"0.00"});
  var pubPrice=input("number",p.publicPrice,{step:"0.01",min:"0",placeholder:"same as price"});
  var tax=input("number",p.tax,{step:"0.01",min:"0",placeholder:"0"});
  var taxNote=input("text",p.taxNote,{placeholder:"e.g. exempt, reduced rate"});
  P.appendChild(field("How is this priced?",mode));
  var gp=el("div","grid2");
  gp.appendChild(field("Price (tax included)",price));
  gp.appendChild(field("Public price",pubPrice,"Shown in the online catalogue."));
  P.appendChild(gp);
  var gp2=el("div","grid2");
  gp2.appendChild(field("Tax %",tax)); gp2.appendChild(field("Tax note",taxNote));
  P.appendChild(gp2);

  var tHost=el("div");
  function drawTiers(){
    tHost.textContent="";
    if(!tiers.length){
      tHost.appendChild(el("div","hint",
        "No tiers — the price above is charged whatever the group size or duration."));
      return;
    }
    tiers.forEach(function(t,i){
      var row=el("div","line"); row.style.gridTemplateColumns="70px 70px 90px auto";
      var px=input("number",t.minPax,{min:"1",step:"1"});
      px.title="Applies from this many people";
      px.addEventListener("input",function(){t.minPax=Number(px.value)||1;});
      var hr=input("number",t.hours==null?"":t.hours,{min:"0",step:"1",placeholder:"any"});
      hr.title="Applies from this many hours; blank for no duration rule";
      hr.addEventListener("input",function(){t.hours=hr.value===""?null:Number(hr.value);});
      var pr=input("number",t.price,{min:"0",step:"0.01"});
      pr.addEventListener("input",function(){t.price=Number(pr.value)||0;});
      var rm=el("button","btn sm danger","×"); rm.type="button";
      rm.addEventListener("click",function(){tiers.splice(i,1);drawTiers();});
      row.appendChild(px);row.appendChild(hr);row.appendChild(pr);row.appendChild(rm);
      tHost.appendChild(row);
    });
  }
  var th2=el("div","lines-h");
  th2.appendChild(el("h4",null,"Price tiers — from pax / from hours / price"));
  var addT=el("button","btn sm","Add tier"); addT.type="button";
  addT.addEventListener("click",function(){
    tiers.push({minPax:1,hours:null,price:Number(price.value)||0}); drawTiers();});
  th2.appendChild(addT);
  P.appendChild(th2); P.appendChild(tHost); drawTiers();
  P.appendChild(el("div","hint",
    "A lesson priced per head gets a tier per group size: 1 person $60, from 2 people $40 each. A rental gets a tier per duration: 1h $20, 2h $35. The best tier a booking clears is the one charged."));

  var depType=select([{v:"",l:"Pay in full"},{v:"fixed",l:"Deposit — fixed amount"},
    {v:"percent",l:"Deposit — percentage"}],p.depositType||"");
  var depVal=input("number",p.depositValue,{min:"0",step:"0.01"});
  var gd=el("div","grid2");
  gd.appendChild(field("Payment",depType)); gd.appendChild(field("Deposit",depVal));
  P.appendChild(gd);
  function syncDep(){ depVal.disabled=!depType.value; if(!depType.value) depVal.value=""; }
  depType.addEventListener("change",syncDep); syncDep();

  var limStock=input("checkbox"); limStock.checked=!!p.limitedStock; limStock.style.width="auto";
  var stock=input("number",p.stock,{min:"0",step:"1"});
  var gs=el("div","grid2");
  gs.appendChild(field("Limited stock",limStock)); gs.appendChild(field("Units in stock",stock));
  P.appendChild(gs);
  function syncStock(){ stock.disabled=!limStock.checked; }
  limStock.addEventListener("change",syncStock); syncStock();

  /* ---------------- calendar / sessions ---------------- */
  var C=panes.cal;
  var sess=input("number",p.sessions,{step:"1",min:"1"});
  var sessAtBooking=input("checkbox"); sessAtBooking.checked=!!p.sessionsAtBooking;
  sessAtBooking.style.width="auto";
  var priv=input("checkbox"); priv.checked=!!p.privateSession; priv.style.width="auto";
  var privC=input("checkbox"); privC.checked=!!p.privateCourse; privC.style.width="auto";
  var gc=el("div","grid2");
  gc.appendChild(field("Number of sessions",sess));
  gc.appendChild(field("Chosen at booking",sessAtBooking,"Client picks how many."));
  C.appendChild(gc);
  var gc2=el("div","grid2");
  gc2.appendChild(field("Private sessions",priv));
  gc2.appendChild(field("Private course",privC,"Only one booking per course."));
  C.appendChild(gc2);
  function syncSess(){ sess.disabled=sessAtBooking.checked; }
  sessAtBooking.addEventListener("change",syncSess); syncSess();

  var dayRow=el("div");
  dayRow.style.cssText="display:flex;gap:6px;flex-wrap:wrap";
  ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function(dn,di){
    var lab=el("label");
    lab.style.cssText="display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer";
    var cb=input("checkbox"); cb.style.width="auto";
    cb.checked=weekDays.indexOf(di)>=0;
    cb.addEventListener("change",function(){
      if(cb.checked){ if(weekDays.indexOf(di)<0) weekDays.push(di); }
      else weekDays=weekDays.filter(function(x){return x!==di;});
    });
    lab.appendChild(cb); lab.appendChild(el("span",null,dn));
    dayRow.appendChild(lab);
  });
  C.appendChild(field("Runs on these days",dayRow,"Leave all clear for any day."));

  var hHost=el("div");
  function drawHours(){
    hHost.textContent="";
    if(!startHours.length){
      hHost.appendChild(el("div","hint","No fixed start times — any hour."));
      return;
    }
    startHours.forEach(function(h,i){
      var row=el("div","line"); row.style.gridTemplateColumns="1fr auto";
      var t=input("time",h);
      t.addEventListener("input",function(){startHours[i]=t.value;});
      var rm=el("button","btn sm danger","×"); rm.type="button";
      rm.addEventListener("click",function(){startHours.splice(i,1);drawHours();});
      row.appendChild(t); row.appendChild(rm);
      hHost.appendChild(row);
    });
  }
  var hh=el("div","lines-h");
  hh.appendChild(el("h4",null,"Starting hours"));
  var addH=el("button","btn sm","Add hour"); addH.type="button";
  addH.addEventListener("click",function(){startHours.push("09:00");drawHours();});
  hh.appendChild(addH);
  C.appendChild(hh); C.appendChild(hHost); drawHours();

  var avFrom=input("date",p.availFrom), avTo=input("date",p.availTo);
  var ga=el("div","grid2");
  ga.appendChild(field("Available from",avFrom)); ga.appendChild(field("Available until",avTo));
  C.appendChild(ga);
  C.appendChild(el("div","hint","Outside these dates the product is not offered."));

  var spotOpts=[{v:"",l:"—"}].concat(DB.spots.map(function(x){return {v:x.name,l:x.name};}));
  var meet=select(spotOpts,p.meetingSpot||"");
  C.appendChild(field("Meeting spot",meet));

  var gearOpts=[{v:"",l:"—"}].concat(DB.gear.map(function(g){return {v:g.id,l:g.name};}));
  var gearSel=select(gearOpts,p.gearId||"");
  var accomOpts=[{v:"",l:"—"}].concat(DB.accommodations.map(function(a){
    return {v:a.id,l:a.name};}));
  var accomSel=select(accomOpts,p.accomId||"");
  var nights=input("number",p.nights,{min:"1",step:"1"});
  var nightsAtBk=input("checkbox"); nightsAtBk.checked=!!p.nightsAtBooking;
  nightsAtBk.style.width="auto";
  var gearBox=field("Gear used",gearSel,"Required for a rental product.");
  var accomBox=el("div");
  accomBox.appendChild(field("Accommodation",accomSel));
  var gn=el("div","grid2");
  gn.appendChild(field("Nights",nights));
  gn.appendChild(field("Nights chosen at booking",nightsAtBk));
  accomBox.appendChild(gn);
  C.appendChild(gearBox); C.appendChild(accomBox);
  function syncType(){
    gearBox.hidden = ptype.value!=="rental";
    accomBox.hidden = ptype.value!=="accommodation" && ptype.value!=="camp";
    nights.disabled = nightsAtBk.checked;
  }
  ptype.addEventListener("change",syncType);
  nightsAtBk.addEventListener("change",syncType);
  syncType();

  /* ---------------- online sale ---------------- */
  var O=panes.online;
  var onSale=input("checkbox"); onSale.checked=p.onlineSale!==false; onSale.style.width="auto";
  O.appendChild(field("Sell online",onSale,"Offered on the booking site."));
  var onPay=select([
    {v:"full",l:"Customer pays the full amount"},
    {v:"percent",l:"Customer pays a percentage"},
    {v:"fixed",l:"Customer pays a fixed part"},
    {v:"validate",l:"Customer only confirms, pays nothing"}],p.onlinePay||"full");
  var onPayVal=input("number",p.onlinePayValue,{min:"0",step:"0.01"});
  O.appendChild(field("Online payment",onPay));
  var onPayBox=field("Amount",onPayVal);
  O.appendChild(onPayBox);
  function syncOnPay(){
    onPayBox.hidden = (onPay.value==="full"||onPay.value==="validate");
    onPayVal.placeholder = onPay.value==="percent" ? "percent" : "amount";
  }
  onPay.addEventListener("change",syncOnPay); syncOnPay();

  var sesChoice=select([
    {v:"full",l:"Must pick every session in the product"},
    {v:"one",l:"Must pick at least one session"},
    {v:"zero",l:"Need not pick any session"}],p.sessionChoice||"full");
  O.appendChild(field("Session selection",sesChoice));
  var clientCreates=input("checkbox"); clientCreates.checked=!!p.clientCreatesSessions;
  clientCreates.style.width="auto";
  var filtByInstr=input("checkbox"); filtByInstr.checked=!!p.filterByInstructor;
  filtByInstr.style.width="auto";
  O.appendChild(field("Client can create sessions",clientCreates));
  O.appendChild(field("Client can filter by instructor",filtByInstr));
  var limAv=input("checkbox"); limAv.checked=!!p.limitedAvail; limAv.style.width="auto";
  var avMax=input("number",p.availMax,{min:"0",step:"1"});
  var gav=el("div","grid2");
  gav.appendChild(field("Limited availability",limAv));
  gav.appendChild(field("Availability max",avMax));
  O.appendChild(gav);
  function syncAv(){ avMax.disabled=!limAv.checked; }
  limAv.addEventListener("change",syncAv); syncAv();

  showTab("info");

  var acts=[{label:"Cancel",on:closeModal}];
  if(existing){
    acts.push({label:p.archived?"Unarchive":"Archive",on:function(){
      existing.archived=!existing.archived;
      save(); closeModal(); render();
      toast(existing.archived?"Product archived":"Product restored");
    }});
  }
  acts.push({label:"Save",cls:"primary",on:function(){
    if(!name.value.trim()){ toast("A name is required."); showTab("info"); name.focus(); return; }
    if(ptype.value==="rental" && !gearSel.value){
      toast("A rental product needs its gear."); showTab("cal"); return; }
    if(position.value!=="" && Number(position.value)<1){
      toast("Position must be greater than 0."); showTab("info"); return; }
    if(onPay.value==="percent"){
      var pv=Number(onPayVal.value)||0;
      if(pv<=0||pv>100){ toast("The percentage must be between 1 and 100.");
        showTab("online"); return; }
    }
    if(depType.value==="percent"){
      var dv=Number(depVal.value)||0;
      if(dv<=0||dv>100){ toast("The deposit percentage must be between 1 and 100.");
        showTab("price"); return; }
    }
    if(depType.value==="fixed" && Number(depVal.value)>Number(price.value||0)){
      toast("The deposit is more than the price."); showTab("price"); return; }
    if(avFrom.value && avTo.value && avTo.value<avFrom.value){
      toast("Available-until is before available-from."); showTab("cal"); return; }

    var rec=existing||{id:uid("p")};
    rec.name=name.value.trim(); rec.kind=kind.value; rec.ptype=ptype.value;
    rec.price=Number(price.value)||0;
    rec.publicPrice=pubPrice.value===""?"":Number(pubPrice.value);
    rec.tax=Number(tax.value)||0; rec.taxNote=taxNote.value.trim();
    rec.sessions=Math.max(1,Number(sess.value)||1);
    rec.sessionsAtBooking=sessAtBooking.checked;
    rec.prices=tiers.slice().sort(function(a,b){
      return ((a.hours||0)-(b.hours||0))||((a.minPax||1)-(b.minPax||1));});
    rec.priceMode=mode.value; rec.code=code.value.trim();
    rec.account=account.value.trim();
    rec.position=position.value===""?"":Number(position.value);
    rec.maxAttendants=maxAtt.value===""?"":Number(maxAtt.value);
    rec.depositType=depType.value;
    rec.depositValue=depVal.value===""?"":Number(depVal.value);
    rec.description=desc.value.trim(); rec.shortDesc=shortD.value.trim();
    rec.longDesc=longD.value.trim(); rec.emailDesc=emailD.value.trim();
    rec.showEmailDesc=showEmailD.checked;
    rec.privateSession=priv.checked; rec.privateCourse=privC.checked;
    rec.weekDays=weekDays.slice().sort();
    rec.startHours=startHours.filter(Boolean).sort();
    rec.availFrom=avFrom.value; rec.availTo=avTo.value;
    rec.meetingSpot=meet.value; rec.gearId=gearSel.value; rec.accomId=accomSel.value;
    rec.nights=nights.value===""?"":Number(nights.value);
    rec.nightsAtBooking=nightsAtBk.checked;
    rec.limitedStock=limStock.checked;
    rec.stock=stock.value===""?"":Number(stock.value);
    rec.limitedAvail=limAv.checked;
    rec.availMax=avMax.value===""?"":Number(avMax.value);
    rec.onlineSale=onSale.checked; rec.onlinePay=onPay.value;
    rec.onlinePayValue=onPayVal.value===""?"":Number(onPayVal.value);
    rec.sessionChoice=sesChoice.value;
    rec.clientCreatesSessions=clientCreates.checked;
    rec.filterByInstructor=filtByInstr.checked;
    if(!existing) DB.products.push(rec);
    save(); closeModal(); render(); toast(existing?"Product updated":"Product added");
  }});
  openModal(existing?"Edit product":"New product",b,acts);
}
function kindLabel(k){ var L=KINDS(); for(var i=0;i<L.length;i++) if(L[i].k===k) return L[i].l; return k; }
var catFilter={q:"",type:"",kind:"",show:"active"};
function ptypeLabel(v){
  for(var i=0;i<PRODUCT_TYPES.length;i++) if(PRODUCT_TYPES[i].v===v) return PRODUCT_TYPES[i].l;
  return v||"—";
}
function renderCatalog(){
  var host=document.getElementById("p-catalog"); host.textContent="";
  var active=DB.products.filter(function(x){return !x.archived;}).length;
  var archived=DB.products.length-active;

  var ch=el("div","sec-h");
  ch.appendChild(el("h2",null,"Catalog"));
  if(DB.products.length) ch.appendChild(el("span","sub",
    active+" active"+(archived?" · "+archived+" archived":"")));
  ch.appendChild(el("span","spacer"));
  if(seedData()){
    var ib=el("button","btn","Import catalog");
    ib.addEventListener("click",importPrompt); ch.appendChild(ib);
  }
  var xb=el("button","btn","Export CSV");
  xb.addEventListener("click",function(){
    exportCsv("products",
      ["Name","Type","Activity","Code","Price","Public price","Tax","Sessions",
       "Deposit","Tiers","Online","Archived"],
      DB.products.map(function(x){
        return [x.name,ptypeLabel(x.ptype),kindLabel(x.kind),x.code||"",
          x.price,x.publicPrice===""||x.publicPrice==null?"":x.publicPrice,x.tax||0,
          x.sessionsAtBooking?"at booking":x.sessions,
          x.depositType?(x.depositType==="percent"?x.depositValue+"%":"$"+x.depositValue):"",
          (x.prices||[]).length, x.onlineSale===false?"no":"yes",
          x.archived?"yes":""];
      }));
  });
  ch.appendChild(xb);
  var nb=el("button","btn primary","New product");
  nb.addEventListener("click",function(){productForm(null);});
  ch.appendChild(nb); host.appendChild(ch);

  if(!DB.products.length){
    var e=emptyState("🗂","Nothing in the catalog yet",
      "Add the lessons, courses, rentals and extras you sell. Bookings pick from this list, and prices flow through to the day closing.",
      "Add the first product",function(){productForm(null);});
    if(seedData()){
      var imp=el("button","btn primary","Import the Shokogi catalog");
      imp.style.marginLeft="8px";
      imp.addEventListener("click",importPrompt);
      e.appendChild(imp);
    }
    host.appendChild(e);
    return;
  }

  /* filters */
  function styled(n){
    n.style.cssText="width:auto;padding:8px 10px;border-radius:9px;font:inherit;font-size:13px;"+
      "border:1px solid var(--line);background:var(--panel);color:var(--text)";
    return n;
  }
  var sb=el("div","searchbar");
  var q=input("search",catFilter.q,{placeholder:"Search name, code or description"});
  q.addEventListener("input",function(){
    catFilter.q=q.value; renderCatalog();
    var n=document.querySelector("#p-catalog .searchbar input");
    if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
  });
  sb.appendChild(q);
  var fType=styled(select([{v:"",l:"Any type"}].concat(
    PRODUCT_TYPES.map(function(t){return {v:t.v,l:t.l};})),catFilter.type));
  fType.addEventListener("change",function(){catFilter.type=fType.value;renderCatalog();});
  sb.appendChild(fType);
  var fKind=styled(select([{v:"",l:"Any activity"}].concat(
    KINDS().map(function(k){return {v:k.k,l:k.l};})),catFilter.kind));
  fKind.addEventListener("change",function(){catFilter.kind=fKind.value;renderCatalog();});
  sb.appendChild(fKind);
  var fShow=styled(select([{v:"active",l:"Active"},{v:"archived",l:"Archived"},
    {v:"all",l:"All"}],catFilter.show));
  fShow.addEventListener("change",function(){catFilter.show=fShow.value;renderCatalog();});
  sb.appendChild(fShow);
  host.appendChild(sb);

  var term=catFilter.q.trim().toLowerCase();
  var rows=DB.products.filter(function(x){
    if(catFilter.show==="active" && x.archived) return false;
    if(catFilter.show==="archived" && !x.archived) return false;
    if(catFilter.type && (x.ptype||"class")!==catFilter.type) return false;
    if(catFilter.kind && x.kind!==catFilter.kind) return false;
    if(!term) return true;
    return [x.name,x.code,x.description,x.shortDesc].join(" ").toLowerCase().indexOf(term)>=0;
  }).sort(function(a,b){
    var pa=a.position===""||a.position==null?9999:a.position;
    var pb=b.position===""||b.position==null?9999:b.position;
    if(pa!==pb) return pa-pb;
    return (b.price||0)-(a.price||0);
  });

  if(!rows.length){
    host.appendChild(el("div","note","Nothing matches those filters."));
    return;
  }
  if(rows.length!==DB.products.length){
    host.appendChild(el("div","note",rows.length+" of "+DB.products.length+" products."));
  }

  var grid=el("div","cards");
  rows.forEach(function(x){
    var c=el("div","panel card");
    if(x.archived) c.style.opacity=".6";
    c.appendChild(el("div","nm",x.name));

    var tags=el("div","tags");

    if(x.limitedStock&&x.stock!=="") facts.push(x.stock+" in stock");

      return DOW[d];}).join(" "));
    if((x.startHours||[]).length) facts.push("Starts "+x.startHours.join(", "));

}

  b.appendChild(field("Schedule against",tref,
    "Pin the session to the tide instead of the clock. The start time above is used until a tide table is loaded for the spot."));

      if(!title.value.trim()){ toast("A title is required."); title.focus(); return; }
      var rec=existing||{id:uid("se"),participants:[]};
      rec.title=title.value.trim(); rec.date=date.value||todayISO(); rec.time=time.value||"09:00";
      rec.duration=Number(dur.value)||60; rec.capacity=Number(cap.value)||1;
      rec.staffIds=chosen.slice(); delete rec.staffId;
      rec.spot=spot.value; rec.category=cat.value; rec.note=note.value.trim();
      rec.minCapacity=Number(minCap.value)||0; rec.level=lvl.value;

      rec.ageTo=ageT.value===""?"":Number(ageT.value);
      rec.allDay=allDay.checked; rec.isPublic=isPub.checked;
      rec.tideRef=tref.value||""; rec.tidePos=tpos.value;
      rec.tideHours=Number(thrs.value)||0;
      var made=1;
      if(!existing){
        DB.sessions.push(rec);
        /* a recurring session is a set of ordinary sessions, created up front,
           so any one of them can be moved or cancelled on its own */
        if(rep && rep.checked && repDays.length && repUntil.value){
          var cur=new Date(rec.date+"T12:00:00");
          var end=new Date(repUntil.value+"T12:00:00");
          var guard=0;
          while(cur<end && guard++<400){
            cur=new Date(cur.getTime()+864e5);
            if(repDays.indexOf(cur.getDay())<0) continue;
            var k=iso(cur);
            if(k>repUntil.value) break;
            var copy=JSON.parse(JSON.stringify(rec));
            copy.id=uid("se"); copy.date=k; copy.participants=[];

      }
      save(); schedDate=rec.date; closeModal(); render();
      toast(existing?"Session updated":(made>1?(made+" sessions created"):"Session added"));
    }}];
  openModal(existing?"Edit session":"New session",b,acts);

function participantsForm(sess){
  var people=peopleOn(sess.date);

      "Nobody to seat yet. Add a client, or name participants on a booking."));

      (sess.minCapacity?(", minimum "+sess.minCapacity):"")+".";

      : (sess.minCapacity && sess.participants.length<sess.minCapacity ? "var(--crit)" : "");

    var rows=people.filter(function(x){
      return !term || x.name.toLowerCase().indexOf(term)>=0;});
    /* seated first, then everyone else */
    rows.sort(function(a,b2){
      var sa=sess.participants.indexOf(a.ref)>=0?0:1;
      var sb=sess.participants.indexOf(b2.ref)>=0?0:1;

    });
    if(!rows.length){ listHost.appendChild(el("div","note","Nobody matches."));return; }
    rows.forEach(function(x){
      var seated=sess.participants.indexOf(x.ref)>=0;
      var row=el("label");
      row.style.cssText="display:flex;align-items:center;gap:10px;padding:8px 10px;"+
        "border:1px solid "+(seated?"var(--accent)":"var(--line-soft)")+";border-radius:9px;"+
        "margin-bottom:6px;cursor:pointer;background:"+(seated?"var(--accent-soft)":"var(--panel-2)");
      var cb=input("checkbox"); cb.checked=seated; cb.style.width="auto";
      cb.addEventListener("change",function(){
        if(cb.checked){
          if(sess.participants.length>=sess.capacity){
            cb.checked=false; toast("Session is at capacity ("+sess.capacity+")."); return; }
          sess.participants.push(x.ref);
        } else {
          sess.participants=sess.participants.filter(function(r){return r!==x.ref;});
        }
        save(); refreshHead(); draw(); render();
      });
      row.appendChild(cb);
      var mid=el("div"); mid.style.flex="1";
      var nm=el("div",null,x.name); nm.style.cssText="font-weight:600;font-size:13.5px";
      mid.appendChild(nm);
      var bits=[x.from];
      if(x.age!==""&&x.age!=null) bits.push(x.age+"y");
      if(x.level) bits.push(x.level);
      if(x.wetsuit) bits.push("wetsuit "+x.wetsuit);
      mid.appendChild(el("div","hint",bits.filter(Boolean).join(" · ")));
      row.appendChild(mid);
      var ds=x.clientId?docsFor(x.clientId):[];
      if(x.clientId && !ds.length) row.appendChild(el("span","chip critc","no waiver"));
      else if(ds.length){
        var worst=ds.map(docStatus).reduce(function(a,y){
          var rank={ok:0,warnc:1,critc:2}; return rank[y.k]>rank[a.k]?y:a;});
        if(worst.k!=="ok") row.appendChild(el("span","chip "+worst.k,worst.l));
      }
      listHost.appendChild(row);
    });
  }
  q.addEventListener("input",draw);
  draw();
  openModal("Seat people · "+sess.title,b,[{label:"Done",cls:"primary",on:function(){
    closeModal(); render();}}]);

var planTab="sessions";
var planFilter={cat:"",staff:"",level:"",fill:""};
function planFilterActive(){
  return !!(planFilter.cat||planFilter.staff||planFilter.level||planFilter.fill);
}
function applyPlanFilter(list){
  return list.filter(function(x){
    if(planFilter.cat && (x.category||"")!==planFilter.cat) return false;
    if(planFilter.staff){
      if(planFilter.staff==="__none") { if(staffIdsOf(x).length) return false; }
      else if(staffIdsOf(x).indexOf(planFilter.staff)<0) return false;
    }
    if(planFilter.level && (x.level||"")!==planFilter.level) return false;
    if(planFilter.fill){
      var n=x.participants.length, cap=x.capacity||0;
      if(planFilter.fill==="empty" && n>0) return false;
      if(planFilter.fill==="full" && n<cap) return false;
      if(planFilter.fill==="space" && (n===0 || n>=cap)) return false;
      if(planFilter.fill==="under" && n>=(x.minCapacity||0)) return false;
    }
    return true;
  });
}
var PLAN_COLS=[
  {k:"hour",l:"Hour",always:true},

  var allDay=DB.sessions.filter(function(x){return x.date===schedDate;})

  var day=applyPlanFilter(allDay);
  var rentalsOut=DB.gearBlocks.filter(function(b){

  var bookingsToday=DB.bookings.filter(function(b){return b.date===schedDate;}).length;

/* ============================ tides ============================
   Tide times are entered, never guessed. An empty day simply says so rather
   than drawing a curve that would be fiction. */
function tideFor(dateStr){
  for(var i=0;i<DB.tides.length;i++) if(DB.tides[i].date===dateStr) return DB.tides[i];
  return null;
}
function parseTimes(str){
  return String(str||"").split(/[,\s]+/).map(function(x){return x.trim();})
    .filter(function(x){return /^\d{1,2}:\d{2}$/.test(x);})
    .map(function(x){var p=x.split(":");
      return String(+p[0]).padStart(2,"0")+":"+p[1];});
}
function tideForm(dateStr){
  var t=tideFor(dateStr)||{date:dateStr,highs:[],lows:[]};
  var b=el("div");

  var hi=input("text",(t.highs||[]).join(", "),{placeholder:"09:52, 22:14"});
  var lo=input("text",(t.lows||[]).join(", "),{placeholder:"03:40, 16:08"});
  b.appendChild(field("High tide",hi));
  b.appendChild(field("Low tide",lo));
  openModal("Tides",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      var rec=tideFor(dateStr);
      if(!rec){ rec={date:dateStr}; DB.tides.push(rec); }
      rec.highs=parseTimes(hi.value); rec.lows=parseTimes(lo.value);
      save(); closeModal(); render(); toast("Tides saved");

  ]);

/* ============================ board ============================
   The timeline: rows are activity calendars or instructors, columns are hours,
   and a session is a block you can drag onto another row or another time. */
var boardDate=todayISO(), boardGroup="category";
var BOARD_FROM=5, BOARD_TO=20;
function minsOf(hhmmStr){
  var p=String(hhmmStr||"09:00").split(":");
  return (+p[0])*60+(+p[1]||0);
}
function toHHMM(mins){
  mins=Math.max(0,Math.min(24*60-1,Math.round(mins)));
  return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}
function boardRows(){
  if(boardGroup==="staff"){
    /* unassigned sits at the top: it is the pile you are trying to clear */
    var rows=[{key:"",label:"Unassigned",color:""}];
    return rows.concat(DB.staff.slice()
      .sort(function(a,b){return a.name.localeCompare(b.name);})
      .map(function(x){return {key:x.id,label:x.name,color:""};}));
  }
  var seen={},out=[];
  (cfg().kinds||[]).forEach(function(k){
    if(seen[k.l]) return; seen[k.l]=1;
    out.push({key:k.l,label:k.l,color:k.color||""});
  });
  out.push({key:"",label:"No calendar",color:""});
  return out;
}
function sessionInRow(x,row){
  if(boardGroup==="staff"){
    var ids=staffIdsOf(x);
    return row.key ? ids.indexOf(row.key)>=0 : ids.length===0;
  }
  return (x.category||"")===row.key;
}
function unassignedOn(dateStr){
  /* everyone named on a booking for that day who is not yet in a session */
  var seated={};
  DB.sessions.forEach(function(x){
    if(x.date!==dateStr) return;
    x.participants.forEach(function(ref){ seated[ref]=true; });
  });
  var out=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled" || bk.date!==dateStr) return;
    var items=(bk.lines||[]).map(function(l){
      var p=product(l.productId); return p?p.name:"";}).filter(Boolean);
    var named=(bk.participants||[]).filter(function(pp){return pp.pid;});
    if(named.length){
      named.forEach(function(pp){
        var ref=seatRef("participant",bk.id,pp.pid);
        if(seated[ref]) return;
        out.push({ref:ref,name:pp.name,clientId:pp.clientId||"",items:items,
          level:pp.level,wetsuit:pp.wetsuit});
      });
    } else if(bk.clientId){
      /* nobody named, so the booking stands for the client who made it */
      var cref=seatRef("client",bk.clientId);
      if(!seated[cref] && !out.some(function(o){return o.ref===cref;}))
        out.push({ref:cref,name:clientName(bk.clientId),clientId:bk.clientId,items:items});
    }
  });
  return out;
}

      var se=by(blk.dataset.sessionId,DB.sessions);
      if(!se) return;
      if(se.participants.indexOf(x.ref)>=0){ toast("Already in that session."); return; }
      if(se.participants.length>=se.capacity){
        toast(se.title+" is full ("+se.capacity+")."); return; }

      if(ghost){ghost.remove();ghost=null;}
      card.style.opacity="1";});
    rail.appendChild(card);
  });

function laneRows(){
  /* One row per group, then split into lanes so overlapping sessions never sit
     on top of each other -- which is why SURF PACK shows six times on theirs. */
  var out=[];
  boardRows().forEach(function(row){
    var items=DB.sessions.filter(function(x){
      return x.date===boardDate && sessionInRow(x,row);})
      .sort(function(a,b){return a.time<b.time?-1:1;});
    if(!items.length){
      out.push({row:row,lane:0,items:[],first:true});
      return;
    }
    var lanes=[];
    items.forEach(function(x){
      var st=minsOf(x.time), en=st+Math.max(15,x.duration||60);
      var placed=false;
      for(var i=0;i<lanes.length;i++){
        var clash=lanes[i].some(function(y){
          var ys=minsOf(y.time), ye=ys+Math.max(15,y.duration||60);
          return st<ye && ys<en;
        });
        if(!clash){ lanes[i].push(x); placed=true; break; }
      }
      if(!placed) lanes.push([x]);
    });
    lanes.forEach(function(l,i){ out.push({row:row,lane:i,items:l,first:i===0}); });
  });
  return out;
}
function tideCurve(width,height,tide){
  /* the wave their agenda draws: high points peak, low points trough */
  var NS="http://www.w3.org/2000/svg";
  var g=document.createElementNS(NS,"g");
  if(!tide) return g;
  var pts=[];
  (tide.highs||[]).forEach(function(t){pts.push({m:minsOf(t),high:true,t:t});});
  (tide.lows||[]).forEach(function(t){pts.push({m:minsOf(t),high:false,t:t});});
  pts.sort(function(a,b){return a.m-b.m;});
  if(!pts.length) return g;
  var span=(BOARD_TO-BOARD_FROM)*60;
  function X(m){ return ((m-BOARD_FROM*60)/span)*width; }
  var d="", prev=null;
  pts.forEach(function(p,i){
    var x=X(p.m), y=p.high?height*0.25:height*0.8;
    if(i===0){ d="M "+(x-140)+" "+(p.high?height*0.8:height*0.25)+" "; }
    if(prev){
      var mx=(prev.x+x)/2;
      d+="C "+mx+" "+prev.y+" "+mx+" "+y+" "+x+" "+y+" ";
    } else d+="L "+x+" "+y+" ";
    prev={x:x,y:y};
  });
  d+="L "+(prev.x+160)+" "+(pts[pts.length-1].high?height*0.8:height*0.25);
  var path=document.createElementNS(NS,"path");
  path.setAttribute("d",d);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","var(--accent-hot)");
  path.setAttribute("stroke-width","1.6");
  path.setAttribute("opacity",".45");
  g.appendChild(path);
  pts.forEach(function(p){
    var x=X(p.m);
    if(x<0||x>width) return;
    var lab=document.createElementNS(NS,"text");
    lab.setAttribute("x",x); lab.setAttribute("y",p.high?height*0.25-6:height*0.8+13);
    lab.setAttribute("text-anchor","middle");
    lab.setAttribute("font-size","9.5");
    lab.setAttribute("font-family","IBM Plex Mono, monospace");
    lab.setAttribute("fill","var(--text-3)");
    lab.textContent=p.t;
    g.appendChild(lab);
  });
  return g;
}

      /* Pointer dragging: HTML5 drag-and-drop was unreliable here, and gave no
         feedback while moving. This follows the finger or cursor and shows the
         landing time as it goes. */
      blk.addEventListener("pointerdown",function(e){
        if(e.button && e.button!==0) return;
        e.preventDefault();
        var laneRect=lane.getBoundingClientRect();
        var blkRect=blk.getBoundingClientRect();
        dragging={ses:x,grabDX:e.clientX-blkRect.left,laneW:laneRect.width,

          if(Math.abs(e.clientX-dragging.startX)<3 &&
             Math.abs(e.clientY-dragging.startY)<3) return;

        var rect=(target||lane).getBoundingClientRect();

/* ============================ who is in a seat ============================
   A seat holds either a saved client or a person named on a booking who was
   never a client. Older rows stored a bare client id, so those still resolve. */
function seatRef(kind,a,b2){
  return kind==="client" ? ("c:"+a) : ("p:"+a+":"+b2);
}
function seatInfo(ref){
  if(typeof ref!=="string") return {name:"—",missing:true};
  if(ref.indexOf("c:")===0 || ref.indexOf(":")<0){
    var cid=ref.indexOf("c:")===0?ref.slice(2):ref;   /* bare id = old format */
    var c=by(cid,DB.clients);
    return c?{name:c.name,clientId:cid,kind:"client"}
            :{name:"(deleted client)",missing:true,kind:"client"};
  }
  if(ref.indexOf("p:")===0){
    var parts=ref.split(":");
    var bk=by(parts[1],DB.bookings);
    if(bk){
      var pp=(bk.participants||[]).filter(function(x){return x.pid===parts[2];})[0];
      if(pp) return {name:pp.name,kind:"participant",clientId:pp.clientId||"",
                     participant:pp,booking:bk};
    }
    return {name:"(removed from booking)",missing:true,kind:"participant"};
  }
  return {name:"—",missing:true};
}
function seatName(ref){ return seatInfo(ref).name; }
function seatDocs(ref){
  var i=seatInfo(ref);
  return i.clientId?docsFor(i.clientId):[];
}
/* everyone named across the day's bookings, seated or not */
function peopleOn(dateStr){
  var out=[];
  DB.clients.forEach(function(c){
    out.push({ref:seatRef("client",c.id),name:c.name,from:"client",clientId:c.id});
  });
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    (bk.participants||[]).forEach(function(pp){
      if(!pp.pid) return;
      out.push({ref:seatRef("participant",bk.id,pp.pid),name:pp.name,
        from:"booking "+dm(bk.date),clientId:pp.clientId||"",
        level:pp.level,wetsuit:pp.wetsuit,age:pp.age,bookingId:bk.id});
    });
  });
  return out;
}

/* ============================ product picker ============================
   A dropdown of 35 names tells you nothing about what anything costs. This is
   the catalogue: grouped by activity, searchable, every price option on show
   before you commit to one. */
var pickQ="", pickKind="";
function productPicker(onPick){
  var live=DB.products.filter(function(x){return !x.archived;});
  if(!live.length){ toast("Add a product to the catalogue first."); return; }

  var b=el("div");

      if(!term) return true;

    });
    if(!rows.length){
      listHost.appendChild(el("div","note","Nothing matches."));

    /* grouped by activity, the way the catalogue reads */
    var groups={};
    rows.forEach(function(x){

    Object.keys(groups).sort().forEach(function(g){

        "color:var(--text-3);z-index:1";
