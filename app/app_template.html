/* What the tide is doing at the hour a session runs. For a surf school that is
   the column: a 07:30 lesson three hours after a 3.08 m high is a different
   lesson from the same hour on a dropping low. */
function tideEvents(dateStr){
  var t=tideFor(dateStr);
  if(!t) return [];
  var out=[];
  var hh=(t.heights&&t.heights.high)||[], lh=(t.heights&&t.heights.low)||[];
  (t.highs||[]).forEach(function(x,i){
    out.push({m:minsOf(x),t:x,high:true,h:hh[i]||""});});
  (t.lows||[]).forEach(function(x,i){
    out.push({m:minsOf(x),t:x,high:false,h:lh[i]||""});});
  return out.sort(function(a,b){return a.m-b.m;});
}
function tideAt(dateStr,hhmm){
  var ev=tideEvents(dateStr);
  if(!ev.length) return null;
  var m=minsOf(hhmm||"09:00");
  var next=null,prev=null;
  for(var i=0;i<ev.length;i++){
    if(ev[i].m>=m){ next=ev[i]; break; }
    prev=ev[i];
  }
  /* before the first event the run is toward it; after the last, away from it */
  var rising = next ? next.high : !(prev&&prev.high);
  var near = next && prev ? ((next.m-m)<=(m-prev.m) ? next : prev) : (next||prev);
  return {rising:rising,next:next,prev:prev,near:near,
          mins:next?(next.m-m):null};
}
function tideText(dateStr,hhmm){
  var a=tideAt(dateStr,hhmm);
  if(!a) return "";
  var dir=a.rising?"rising":"dropping";
  if(!a.next) return dir;
  var d=a.mins, when = d<60 ? (d+"m") : (Math.floor(d/60)+"h"+(d%60?String(d%60).padStart(2,"0"):""));
  return dir+" · "+(a.next.high?"high":"low")+" "+a.next.t+
         (a.next.h?(" "+a.next.h+"m"):"")+" in "+when;
}
function tideLabel(s){
  if(!s.tideRef) return "";
  return s.tideHours+"h "+s.tidePos+" "+(s.tideRef==="high"?"high":"low")+" tide";
}
function participantsForm(sess){
  var people=peopleOn(sess.date);
  var b=el("div");

      "Nobody to seat yet. Add a client, or name participants on a booking."));

  }

    head.textContent=sess.participants.length+" of "+sess.capacity+" seats taken"+
      (sess.minCapacity?(", minimum "+sess.minCapacity):"")+".";
    head.style.color = sess.participants.length>=sess.capacity ? "var(--warn)"
      : (sess.minCapacity && sess.participants.length<sess.minCapacity ? "var(--crit)" : "");

  refreshHead(); b.appendChild(head);

  var q=input("search","",{placeholder:"Search a name"});
  b.appendChild(field("Find",q));

  b.appendChild(listHost);

  function draw(){
    listHost.textContent="";
    var term=(q.value||"").trim().toLowerCase();
    var rows=people.filter(function(x){
      return !term || x.name.toLowerCase().indexOf(term)>=0;});
    /* seated first, then everyone else */
    rows.sort(function(a,b2){
      var sa=sess.participants.indexOf(a.ref)>=0?0:1;
      var sb=sess.participants.indexOf(b2.ref)>=0?0:1;

    });
    if(!rows.length){ listHost.appendChild(el("div","note","Nobody matches."));return; }
    rows.forEach(function(x){
      var seated=sess.participants.indexOf(x.ref)>=0;
      var row=el("label");
      row.style.cssText="display:flex;align-items:center;gap:10px;padding:8px 10px;"+
        "border:1px solid "+(seated?"var(--accent)":"var(--line-soft)")+";border-radius:9px;"+
        "margin-bottom:6px;cursor:pointer;background:"+(seated?"var(--accent-soft)":"var(--panel-2)");
      var cb=input("checkbox"); cb.checked=seated; cb.style.width="auto";
      cb.addEventListener("change",function(){
        if(cb.checked){
          if(sess.participants.length>=sess.capacity){
            cb.checked=false; toast("Session is at capacity ("+sess.capacity+")."); return; }
          if(!seatFitsSession(x.ref,sess)){
            cb.checked=false;
            toast(x.name+" has "+seatActivities(x.ref).join(", ")+" to place, not "+
              (sess.category||"this")+".");
            return; }
          sess.participants.push(x.ref);
        } else {
          sess.participants=sess.participants.filter(function(r){return r!==x.ref;});
        }
        save(); refreshHead(); draw(); render();
      });
      row.appendChild(cb);
      var mid=el("div"); mid.style.flex="1";
      var nm=el("div",null,x.name); nm.style.cssText="font-weight:600;font-size:13.5px";
      mid.appendChild(nm);
      var bits=[x.from];
      if(x.age!==""&&x.age!=null) bits.push(x.age+"y");
      if(x.level) bits.push(x.level);
      if(x.wetsuit) bits.push("wetsuit "+x.wetsuit);
      mid.appendChild(el("div","hint",bits.filter(Boolean).join(" · ")));
      row.appendChild(mid);
      var ds=x.clientId?docsFor(x.clientId):[];
      if(x.clientId && !ds.length) row.appendChild(el("span","chip critc","no waiver"));
      else if(ds.length){
        var worst=ds.map(docStatus).reduce(function(a,y){
          var rank={ok:0,warnc:1,critc:2}; return rank[y.k]>rank[a.k]?y:a;});
        if(worst.k!=="ok") row.appendChild(el("span","chip "+worst.k,worst.l));
      }
      listHost.appendChild(row);
    });
  }
  q.addEventListener("input",draw);
  draw();
  openModal("Seat people · "+sess.title,b,[{label:"Done",cls:"primary",on:function(){
    closeModal(); render();}}]);

var planView="details", planRange="day";
/* Their sessions list lets you tick rows and change one property across all of
   them -- the instructor called in sick, the whole morning moves an hour. */
var planPicked={};
function planFilterActive(){
  return !!(planFilter.cat||planFilter.staff||planFilter.level||planFilter.fill||
           planFilter.hour);
}
function applyPlanFilter(list){
  return list.filter(function(x){
    if(planFilter.cat && (x.category||"")!==planFilter.cat) return false;
    if(planFilter.staff){
      if(planFilter.staff==="__none") { if(staffIdsOf(x).length) return false; }
      else if(staffIdsOf(x).indexOf(planFilter.staff)<0) return false;
    }
    if(planFilter.level && (x.level||"")!==planFilter.level) return false;
    if(planFilter.hour){
      var pm=(x.time||"00:00")>="13:00";
      if(planFilter.hour==="am" && pm) return false;
      if(planFilter.hour==="pm" && !pm) return false;
    }
    if(planFilter.fill){
      var n=x.participants.length, cap=x.capacity||0;
      if(planFilter.fill==="empty" && n>0) return false;
      if(planFilter.fill==="full" && n<cap) return false;
      if(planFilter.fill==="space" && (n===0 || n>=cap)) return false;
      if(planFilter.fill==="under" && n>=(x.minCapacity||0)) return false;
    }
    return true;
  });
}

function renderSchedule(){
  var host=document.getElementById("p-schedule"); host.textContent="";

  /* day strip: two back, six forward, with Today alongside */
  var top=el("div","sec-h");
  top.appendChild(el("h2",null,"Planning"));
  top.appendChild(el("span","spacer"));
  var jump=input("date",schedDate);
  jump.setAttribute("aria-label","Jump to date");
  jump.style.cssText="width:auto;padding:7px 10px;border-radius:9px;border:1px solid var(--line);"+
    "background:var(--panel);color:var(--text);font:inherit;font-size:13px";
  jump.addEventListener("change",function(){
    if(jump.value){ schedDate=jump.value; renderSchedule(); }});
  top.appendChild(jump);
  var today=el("button","btn sm","Today");
  today.addEventListener("click",function(){schedDate=todayISO();renderSchedule();});
  top.appendChild(today);
  var seg=el("div","range");
  if(planRange==="list") seg.style.display="none";
  PLAN_VIEWS.forEach(function(v){
    var b=el("button",null,v.l);
    b.setAttribute("aria-pressed",planView===v.v?"true":"false");
    b.addEventListener("click",function(){planView=v.v;renderSchedule();});
    seg.appendChild(b);
  });
  top.appendChild(seg);
  var rng=el("div","range");
  [{v:"day",l:"Daily"},{v:"14",l:"14 days"},{v:"list",l:"List"}].forEach(function(v){
    var b=el("button",null,v.l);
    b.setAttribute("aria-pressed",planRange===v.v?"true":"false");
    b.addEventListener("click",function(){planRange=v.v;renderSchedule();});
    rng.appendChild(b);
  });
  top.appendChild(rng);
  var colsBtn=el("button","btn sm","Columns");
  colsBtn.addEventListener("click",columnsPicker);
  top.appendChild(colsBtn);
  var add=el("button","btn primary","New session");
  add.addEventListener("click",function(){sessionForm(null,schedDate);});
  top.appendChild(add);
  host.appendChild(top);

  var listMode=(planRange==="list");
  var bar=el("div","daybar");
  var prev=el("button"); prev.appendChild(el("div","n","‹"));
  prev.addEventListener("click",function(){
    schedDate=iso(new Date(new Date(schedDate+"T12:00:00").getTime()-864e5));renderSchedule();});
  bar.appendChild(prev);
  var base=new Date(schedDate+"T12:00:00");
  for(var i=-2;i<=6;i++){
    (function(off){
      var d=new Date(base.getTime()+off*864e5), k=iso(d);
      var n=DB.sessions.filter(function(x){return x.date===k;}).length;
      var b=el("button");
      b.setAttribute("aria-pressed",k===schedDate?"true":"false");
      b.appendChild(el("div","d",DOW[d.getDay()]+" "+MON[d.getMonth()]));
      b.appendChild(el("div","n",String(d.getDate())));
      b.appendChild(el("div","c",n?n+" act":"—"));
      b.addEventListener("click",function(){schedDate=k;renderSchedule();});
      bar.appendChild(b);
    })(i);
  }
  var next=el("button"); next.appendChild(el("div","n","›"));
  next.addEventListener("click",function(){
    schedDate=iso(new Date(new Date(schedDate+"T12:00:00").getTime()+864e5));renderSchedule();});
  bar.appendChild(next);
  if(!listMode) host.appendChild(bar);

  var tideP=tideFor(schedDate);
  var tb0=el("div","panel");
  tb0.style.cssText="margin-top:12px;padding:10px 14px;display:flex;align-items:center;"+
    "gap:12px;flex-wrap:wrap";
  tb0.appendChild(el("span","eyebrow","Tide"));
  if(tideP&&((tideP.highs||[]).length||(tideP.lows||[]).length)){
    tideChips(tb0,tideP);
    if(tideP.spot){
      var sp=el("span","hint",tideP.spot);
      sp.style.marginLeft="4px";
      tb0.appendChild(sp);
    }
  } else {
    tb0.appendChild(el("span","hint","Not set for this day"));
  }
  var teP=el("button","btn sm","Edit tides"); teP.style.marginLeft="auto";
  teP.addEventListener("click",function(){tideForm(schedDate);});
  tb0.appendChild(teP);
  if(!listMode) host.appendChild(tb0);

  var allDay=DB.sessions.filter(function(x){return x.date===schedDate;})
    .sort(function(a,b){return a.time<b.time?-1:1;});
  var day=applyPlanFilter(allDay);
  var rentalsOut=DB.gearBlocks.filter(function(b){
    return (!b.from||b.from<=schedDate)&&(!b.to||b.to>=schedDate);}).length;
  /* the tab counts what is actually on the tab: boards out on hire as well as
     gear out of service */
  var rentalCount=rentalsOut+hiresOn(schedDate).length;
  var bookingsToday=DB.bookings.filter(function(b){return b.date===schedDate;}).length;
  var accom=DB.accommodations.length;

  /* counter tabs, as on their planning */
  var tabs=el("div"); tabs.style.display="flex"; tabs.style.gap="2px";
  tabs.style.borderBottom="1px solid var(--line)"; tabs.style.marginTop="14px";
  tabs.style.overflowX="auto";
  [["sessions","Sessions",day.length],["rental","Rental",rentalCount],
   ["accom","Accommodations",accom],["bookings","Bookings",bookingsToday]]
  .forEach(function(t){
    var b=el("button"); b.className="";
    b.style.cssText="appearance:none;border:0;background:none;cursor:pointer;font:inherit;"+
      "font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;"+
      "padding:10px 14px 11px;border-bottom:2px solid transparent;white-space:nowrap;"+
      (planTab===t[0]?"color:var(--accent);border-bottom-color:var(--accent);":"color:var(--text-3);");
    b.appendChild(document.createTextNode(t[1]+" "));
    var c=el("span","chip "+(planTab===t[0]?"pink":"neutral"),String(t[2]));
    b.appendChild(c);
    b.addEventListener("click",function(){planTab=t[0];renderSchedule();});
    tabs.appendChild(b);
  });
  if(!listMode) host.appendChild(tabs);

  /* the list is every session, so it is not a view of the day's tabs -- it has
     to come before them or the rental branch swallows it and there is no way back */
  if(listMode){ sessionsList(host); return; }

  if(planTab==="rental"){
    rentalsOutTable(host,schedDate);
    if(!rentalsOut){
      host.appendChild(el("div","note",
        "No gear is out of service on "+dm(schedDate)+"."));
      return;
    }
    host.appendChild(el("div","sec-h").appendChild(el("h2",null,"Out of service")).parentNode);
    var wr=el("div","panel tbl-wrap"),tr0=el("table"),hr=el("thead"),rr=el("tr");
    ["Gear","Units","From","Until","Note"].forEach(function(h,i){
      rr.appendChild(el("th",i===1?"r":null,h));});
    hr.appendChild(rr); tr0.appendChild(hr);
    var br=el("tbody");
    DB.gearBlocks.filter(function(b){
      return (!b.from||b.from<=schedDate)&&(!b.to||b.to>=schedDate);}).forEach(function(x){
      var g=by(x.gearId,DB.gear), r=el("tr");
      r.appendChild(el("td","strong",g?g.name:"—"));
      r.appendChild(el("td","n r",String(x.units)));
      r.appendChild(el("td",null,x.from?dm(x.from):"—"));
      r.appendChild(el("td",null,x.to?dm(x.to):"—"));
      r.appendChild(el("td","muted",x.note||"—"));
      br.appendChild(r);
    });
    tr0.appendChild(br); wr.appendChild(tr0); host.appendChild(wr); return;
  }
  if(planTab==="accom"){
    if(!accom){ host.appendChild(el("div","note","No accommodation is set up. Add it in the back office.")); return; }
    var wa=el("div","panel tbl-wrap"),ta=el("table"),ha=el("thead"),ra=el("tr");
    ["Accommodation","Units","Max per unit"].forEach(function(h,i){
      ra.appendChild(el("th",i?"r":null,h));});
    ha.appendChild(ra); ta.appendChild(ha);
    var ba=el("tbody");
    DB.accommodations.forEach(function(x){
      var r=el("tr");
      r.appendChild(el("td","strong",x.name));
      r.appendChild(el("td","n r",String(x.units)));
      r.appendChild(el("td","n r",String(x.maxPax)));
      ba.appendChild(r);
    });
    ta.appendChild(ba); wa.appendChild(ta); host.appendChild(wa); return;
  }
  if(planTab==="bookings"){
    if(!bookingsToday){ host.appendChild(el("div","note","No bookings taken on "+dm(schedDate)+".")); return; }
    var wb=el("div","panel tbl-wrap"),tbl=el("table"),hb=el("thead"),rb=el("tr");
    ["Client","Items","Total","Paid","Status"].forEach(function(h,i){
      rb.appendChild(el("th",(i===2||i===3)?"r":null,h));});
    hb.appendChild(rb); tbl.appendChild(hb);
    var bb=el("tbody");
    DB.bookings.filter(function(b){return b.date===schedDate;}).forEach(function(bk){
      var r=el("tr");
      r.appendChild(el("td","strong",clientName(bk.clientId)));
      r.appendChild(el("td","muted",(bk.lines||[]).map(function(l){
        var pr=product(l.productId); return pr?pr.name:"";}).join(", ")));
      r.appendChild(el("td","n r","$"+money(bookingTotal(bk),0)));
      r.appendChild(el("td","n r","$"+money(bookingPaid(bk),0)));
      var st=el("td"); var s2=bookingStatus(bk);
      st.appendChild(el("span","chip "+(s2==="paid"?"ok":(s2==="partial"?"warnc":"critc")),s2));
      r.appendChild(st);
      bb.appendChild(r);
    });
    tbl.appendChild(bb); wb.appendChild(tbl); host.appendChild(wb); return;
  }

  /* filters, the ones their agenda offers */
  var fb=el("div","searchbar"); fb.style.marginTop="12px";
  function styled(sel){
    sel.style.cssText="width:auto;padding:8px 10px;border-radius:9px;font:inherit;"+
      "font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text)";
    return sel;
  }
  var cats=[""].concat(Array.from(new Set(allDay.map(function(x){return x.category||"";})
    .filter(Boolean))).sort());
  var fCat=styled(select(cats.map(function(c){
    return {v:c,l:c||"Any activity"};}),planFilter.cat));
  fCat.addEventListener("change",function(){planFilter.cat=fCat.value;renderSchedule();});
  fb.appendChild(fCat);

  var fStaff=styled(select([{v:"",l:"Any instructor"},{v:"__none",l:"Unassigned"}]
    .concat(DB.staff.slice().sort(function(a,b){return a.name.localeCompare(b.name);})
      .map(function(x){return {v:x.id,l:x.name};})),planFilter.staff));
  fStaff.addEventListener("change",function(){planFilter.staff=fStaff.value;renderSchedule();});
  fb.appendChild(fStaff);

  var fLvl=styled(select([{v:"",l:"Any level"},{v:"beginner",l:"Beginner"},
    {v:"intermediate",l:"Intermediate"},{v:"advanced",l:"Advanced"}],planFilter.level));
  fLvl.addEventListener("change",function(){planFilter.level=fLvl.value;renderSchedule();});
  fb.appendChild(fLvl);

  var fFill=styled(select([{v:"",l:"Any occupancy"},{v:"empty",l:"Nobody booked"},
    {v:"space",l:"Has space"},{v:"full",l:"Full"},
    {v:"under",l:"Below minimum"}],planFilter.fill));
  fFill.addEventListener("change",function(){planFilter.fill=fFill.value;renderSchedule();});
  fb.appendChild(fFill);

  /* their day splits at one o'clock -- as a filter, which is where it belongs */
  var fHour=styled(select([{v:"",l:"All day"},{v:"am",l:"Morning (before 13:00)"},
    {v:"pm",l:"Afternoon (after 13:00)"}],planFilter.hour||""));
  fHour.addEventListener("change",function(){planFilter.hour=fHour.value;renderSchedule();});
  fb.appendChild(fHour);

  if(planFilterActive() && !listMode){
    var clr=el("button","btn sm","Clear");
    clr.addEventListener("click",function(){
      planFilter={cat:"",staff:"",level:"",fill:"",hour:""};renderSchedule();});
    fb.appendChild(clr);
  }
  if(!listMode) host.appendChild(fb);

  if(planFilterActive() && allDay.length){
    host.appendChild(el("div","note",
      day.length+" of "+allDay.length+" sessions match."));
  }

  if(!day.length){
    host.appendChild(emptyState("📅",
      planFilterActive()?"Nothing matches those filters":("Nothing on "+dm(schedDate)),
      planFilterActive()?("There are "+allDay.length+" sessions on this day, none of them matching.")
        :"No sessions scheduled for this day yet.",
      planFilterActive()?"Clear filters":"Add a session",
      function(){
        if(planFilterActive()){ planFilter={cat:"",staff:"",level:"",fill:"",hour:""}; renderSchedule(); }
        else sessionForm(null,schedDate);
      }));
    return;
  }

  var picked=day.filter(function(x){return planPicked[x.id];});
  if(picked.length){
    var bulk=el("div","searchbar");
    bulk.style.cssText+=";background:var(--accent-soft);border-radius:10px;padding:9px 12px";
    bulk.appendChild(el("span","eyebrow",
      picked.length+" session"+(picked.length===1?"":"s")+" selected"));
    var be=el("button","btn sm primary","Bulk edit");
    be.addEventListener("click",function(){bulkEditForm(picked);});
    bulk.appendChild(be);
    var bd=el("button","btn sm danger","Delete selected");
    bd.addEventListener("click",function(){
      confirmDelete(picked.length+" session"+(picked.length===1?"":"s"),function(){
        var ids={}; picked.forEach(function(x){ids[x.id]=1;});
        DB.sessions=DB.sessions.filter(function(y){return !ids[y.id];});
        planPicked={}; save(); render(); toast("Sessions deleted");
      });
    });
    bulk.appendChild(bd);
    var bc=el("button","btn sm","Clear selection");
    bc.addEventListener("click",function(){planPicked={};renderSchedule();});
    bulk.appendChild(bc);
    host.appendChild(bulk);
  }

  if(planRange==="14"){
    host.appendChild(fortnight());
  } else {
    host.appendChild(planTable(day));
  }

  var xs=el("div","searchbar"); xs.style.marginTop="12px";
  var clb=el("button","btn sm","Client list");
  clb.addEventListener("click",function(){clientListFor(schedDate);});
  xs.appendChild(clb);
  var pl=el("button","btn sm","Print list");
  pl.addEventListener("click",function(){window.print();});
  xs.appendChild(pl);
  var xb=el("button","btn sm","Export table");
  xb.addEventListener("click",function(){
    exportCsv("planning-"+schedDate,
      ["Hour","Activity Calendar","Instructor","Title","Note","Duration","Participants","Capacity"],
      day.map(function(x){return [x.time,x.category||"",instructorNames(x),x.title,
        x.note||"",hhmm(x.duration||0),x.participants.length,x.capacity];}));
  });
  xs.appendChild(xb); host.appendChild(xs);
}

/* Their agenda offers the same day at four densities. Compact is the glance
   before a shift; details is the one you work from. */
var PLAN_VIEWS=[{v:"compact",l:"Compact"},{v:"simple",l:"Simple"},
                {v:"details",l:"Details"},{v:"accom",l:"Accommodation"}];
/* Compact drops to the four things you read at a glance, whatever columns
   are otherwise switched on. */
var COMPACT_COLS=["hour","title","instructor","participants"];
function planTable(day){
  if(planView==="accom") return accomBoard(schedDate);
  var shown=PLAN_COLS.filter(function(c){
    return planView==="compact" ? COMPACT_COLS.indexOf(c.k)>=0 : planShow[c.k];});
  var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
  var allBox=el("input"); allBox.type="checkbox"; allBox.style.width="auto";
  allBox.title="Select every session shown";
  allBox.checked=day.length>0 && day.every(function(x){return planPicked[x.id];});
  allBox.addEventListener("change",function(){
    day.forEach(function(x){
      if(allBox.checked) planPicked[x.id]=true; else delete planPicked[x.id];});
    renderSchedule();
  });
  var thc=el("th"); thc.style.width="30px"; thc.appendChild(allBox);
  tr.appendChild(thc);
  shown.forEach(function(c){
    tr.appendChild(el("th",(c.k==="duration"||c.k==="participants")?"r":null,c.l));
  });
  tr.appendChild(el("th",null,""));
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  day.forEach(function(x){
    var r=el("tr");
    var pick=el("input"); pick.type="checkbox"; pick.style.width="auto";
    pick.checked=!!planPicked[x.id];
    pick.setAttribute("aria-label","Select "+x.title);
    pick.addEventListener("change",function(){
      if(pick.checked) planPicked[x.id]=true; else delete planPicked[x.id];
      renderSchedule();
    });
    var pc=el("td"); pc.appendChild(pick); r.appendChild(pc);
    var colour=catColor(x.category)||"var(--accent-hot)";
    var cell={};
    cell.hour=function(){
      var c=el("td","n",x.time);
      c.style.borderLeft="4px solid "+colour;
      return c;
    };
    cell.calendar=function(){ return el("td",x.category?null:"muted",x.category||"—"); };
    cell.instructor=function(){
      var c=el("td",staffIdsOf(x).length?null:"muted",instructorNames(x));
      if(staffIdsOf(x).some(function(id){return isOff(id,x.date);})){
        c.appendChild(document.createTextNode(" "));
        c.appendChild(el("span","chip critc","off"));
      }
      return c;
    };
    cell.title=function(){
      var c=el("td","strong",x.title);
      var tl=tideLabel(x);
      if(tl){ c.appendChild(document.createTextNode(" "));
              c.appendChild(el("span","chip pink",tl)); }
      return c;
    };
    cell.note=function(){ return el("td","muted",x.note||"—"); };
    cell.duration=function(){ return el("td","n r",hhmm(x.duration||0)); };
    cell.spot=function(){ return el("td",x.spot?"muted":"muted",x.spot||"—"); };
    cell.tide=function(){
      var c=el("td");
      var live=tideText(x.date,x.time);
      if(live){
        var a=tideAt(x.date,x.time);
        var chip=el("span","chip "+(a&&a.rising?"pink":"neutral"),live);
        c.appendChild(chip);
      } else c.appendChild(el("span","muted","—"));
      var tl=tideLabel(x);
      if(tl){
        var r=el("div","hint",tl);
        r.style.marginTop="2px";
        c.appendChild(r);
      }
      return c;
    };
    cell.participants=function(){
      var c=el("td","n r");
      var full=x.participants.length>=x.capacity;
      var chip=el("span","chip "+(full?"warnc":(x.participants.length?"ok":"neutral")));
      chip.style.cursor="pointer";
      var ic=el("span"); ic.style.cssText="display:inline-block;vertical-align:-2px;margin-left:0";
      ic.innerHTML='<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" '+
        'aria-hidden="true"><circle cx="12" cy="7.5" r="3.6"/>'+
        '<path d="M4.5 21c0-4.1 3.4-6.8 7.5-6.8s7.5 2.7 7.5 6.8z"/></svg>';
      chip.appendChild(ic);
      chip.appendChild(document.createTextNode(" "+x.participants.length+" / "+x.capacity));
      chip.addEventListener("click",function(){participantsForm(x);});
      c.appendChild(chip);
      return c;
    };
    shown.forEach(function(c){ r.appendChild(cell[c.k]()); });
    var act=el("td"); act.style.width="34px";
    act.appendChild(rowMenu(sessionRowMenu(x)));
    r.appendChild(act);
    tb.appendChild(r);

    /* the people in this session, shown under it rather than hidden in a dialog.
       Compact and simple keep the row count down and leave them out. */
    if(planView==="details" && x.participants.length){
      var sub=el("tr");
      var subCell=el("td"); subCell.colSpan=shown.length+2;
      subCell.style.cssText="padding:0 13px 10px 17px;background:var(--panel-2)";
      var chips=el("div");
      chips.style.cssText="display:flex;gap:6px;flex-wrap:wrap;align-items:center";
      chips.appendChild(el("span","eyebrow","In this session"));
      x.participants.forEach(function(ref){
        var si=seatInfo(ref);
        var ch=el("span","chip "+(si.missing?"critc":"neutral"),si.name);
        if(si.clientId){
          ch.style.cursor="pointer"; ch.title="Open client";
          ch.addEventListener("click",function(){
            var c=by(si.clientId,DB.clients); if(c) clientCard(c);});
        }
        chips.appendChild(ch);
      });
      subCell.appendChild(chips); sub.appendChild(subCell); tb.appendChild(sub);
    }
  });
  t.appendChild(tb); w.appendChild(t);
  return w;
}

/* Fourteen days at a glance: the same rows, day by day, so a week's shape is
   visible without stepping through it. */
function fortnight(){
  var box=el("div");
  var base=new Date(schedDate+"T12:00:00");
  var empty=0;
  for(var i=0;i<14;i++){
    (function(off){
      var d=new Date(base.getTime()+off*864e5), k=iso(d);
      var rows=applyPlanFilter(DB.sessions.filter(function(x){return x.date===k;})
        .sort(function(a,b){return a.time<b.time?-1:1;}));
      if(!rows.length){ empty++; return; }
      var h=el("div","day-h"); h.style.marginTop=off?"16px":"12px";
      var t=el("h3",null,dowOf(k)+" "+dm(k));
      h.appendChild(t);
      h.appendChild(el("span","chip neutral",rows.length+" session"+(rows.length===1?"":"s")));
      var go=el("button","btn sm","Open day"); go.style.marginLeft="auto";
      go.addEventListener("click",function(){schedDate=k;planRange="day";renderSchedule();});
      h.appendChild(go);
      box.appendChild(h);
      var save2=schedDate; schedDate=k;
      box.appendChild(planTable(rows));
      schedDate=save2;
    })(i);
  }
  if(empty===14) box.appendChild(el("div","note",
    "Nothing scheduled in the fortnight from "+dm(schedDate)+"."));
  else if(empty) box.appendChild(el("div","note",
    empty+" of the 14 days have nothing on them."));
  return box;
}

/* Who is sleeping where. Beds come from bookings whose products carry
   accommodation and nights, so this is read off the bookings rather than
   kept as a second set of numbers that can drift. */
function staysOn(dateStr){
  var out=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    (bk.lines||[]).forEach(function(l){
      var p=product(l.productId);
      if(!p||!p.accomId) return;
      var nights=Number(l.nights)||Number(p.nights)||0;
      if(nights<=0) return;
      var from=bk.checkIn||bk.date;
      if(!from) return;
      var end=iso(new Date(new Date(from+"T12:00:00").getTime()+nights*864e5));
      if(dateStr<from||dateStr>=end) return;
      out.push({accomId:p.accomId,booking:bk,product:p,
                pax:(Number(l.pax)||1)*(Number(l.qty)||1),from:from,to:end});
    });
  });
  return out;
}
function accomBoard(dateStr){
  var box=el("div");
  if(!DB.accommodations.length){
    box.appendChild(el("div","note",
      "No accommodation is set up. Add beds in the back office and put them on a product, and who is staying shows here."));
    return box;
  }
  var stays=staysOn(dateStr);
  var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");
  ["Accommodation","Capacity","Occupied","Free","Staying"].forEach(function(h,i){
    tr.appendChild(el("th",(i>=1&&i<=3)?"r":null,h));});
  th.appendChild(tr); t.appendChild(th);
  var tb=el("tbody");
  DB.accommodations.forEach(function(a){
    var mine=stays.filter(function(s){return s.accomId===a.id;});
    var used=mine.reduce(function(x,s){return x+s.pax;},0);
    var cap=(Number(a.units)||0)*(Number(a.maxPax)||1);
    var r=el("tr");
    r.appendChild(el("td","strong",a.name));
    r.appendChild(el("td","n r",String(cap)));
    r.appendChild(el("td","n r",String(used)));
    var free=el("td","n r",String(Math.max(0,cap-used)));
    if(used>cap){ free.textContent="over by "+(used-cap); free.style.color="var(--crit)"; }
    r.appendChild(free);
    var who=el("td");

/* Change one property across several sessions at once. Deliberately one
   property: a form that could rewrite everything would be a form nobody dares
   press, and their own dialog asks the same single question. */
function bulkEditForm(list){
  var b=el("div");
  b.appendChild(el("p","hint",
    list.length+" session"+(list.length===1?"":"s")+" selected on "+dm(schedDate)+"."));
  var prop=select([{v:"name",l:"Session title"},{v:"category",l:"Activity"},
    {v:"staff",l:"Instructor"},{v:"hour",l:"Starting hour"},
    {v:"capacity",l:"Capacity"},{v:"spot",l:"Spot"}],"name");
  b.appendChild(field("Property to update",prop));

  var valHost=el("div");
  b.appendChild(valHost);
  var control=null;
  function drawValue(){
    valHost.textContent="";
    if(prop.value==="name"){
      control=input("text","",{placeholder:"Session title"});
      valHost.appendChild(field("New title",control));
    } else if(prop.value==="category"){
      control=select([{v:"",l:"—"}].concat((cfg().kinds||[]).map(function(k){
        return {v:k.l,l:k.l};})),"");
      valHost.appendChild(field("New activity",control));
      valHost.appendChild(el("div","note",
        "Sessions with participants assigned keep them. Confirm you want to change the activity."));
    } else if(prop.value==="staff"){
      control=select([{v:"",l:"— unassigned —"}].concat(DB.staff.slice()
        .sort(function(a,b2){return a.name.localeCompare(b2.name);})
        .map(function(x){return {v:x.id,l:x.name};})),"");
      valHost.appendChild(field("New instructor",control,
        "Replaces whoever is on these sessions."));
    } else if(prop.value==="hour"){
      control=input("time","09:00");
      valHost.appendChild(field("New starting hour",control));
    } else if(prop.value==="capacity"){
      control=input("number","",{min:"1",step:"1"});
      valHost.appendChild(field("New capacity",control));
    } else {
      var opts=DB.spots.map(function(x){return {v:x.name,l:x.name};});
      control=select(opts.length?opts:[{v:"",l:"— add a spot first —"}],"");
      valHost.appendChild(field("New spot",control));
    }
  }
  prop.addEventListener("change",drawValue);
  drawValue();

  openModal("Bulk edit sessions",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      var v=control.value;
      if(prop.value==="name" && !v.trim()){ toast("Enter a title."); return; }
      if(prop.value==="capacity" && !(Number(v)>0)){ toast("Enter a capacity."); return; }
      if(prop.value==="hour" && !v){ toast("Pick an hour."); return; }
      var seated=list.filter(function(x){return x.participants.length;}).length;
      function apply(){
        list.forEach(function(x){
          if(prop.value==="name") x.title=v.trim();
          else if(prop.value==="category") x.category=v;
          else if(prop.value==="staff"){ x.staffIds=v?[v]:[]; delete x.staffId; }
          else if(prop.value==="hour") x.time=v;
          else if(prop.value==="capacity") x.capacity=Number(v);
          else x.spot=v;
        });
        planPicked={}; save(); closeModal(); render();
        toast(list.length+" session"+(list.length===1?"":"s")+" saved");
      }
      if(prop.value==="category" && seated){
        closeModal();
        confirmish("Change the activity?",
          seated+" of these sessions have participants assigned. Do you confirm you want to change the activity?",
          apply,"Change activity");
        return;
      }
      apply();
    }}
  ]);
}

    var w=el("div","panel tbl-wrap"),t=el("table"),th=el("thead"),tr=el("tr");

    [["name","Name"],["","Participants"],["","Staff"],["start","Starting time"],
     ["","Duration"]].forEach(function(c,i){

      r.appendChild(el("td",staffIdsOf(x).length?null:"muted",instructorNames(x)));

            save();render();toast("Session deleted");});}}

    t.appendChild(tb); w.appendChild(t); main.appendChild(w);
    if(all.length>PAGE) main.appendChild(el("div","note",

/* ============================ tides ============================
   Tide times are entered, never guessed. An empty day simply says so rather
   than drawing a curve that would be fiction. */
function tideFor(dateStr){
  for(var i=0;i<DB.tides.length;i++) if(DB.tides[i].date===dateStr) return DB.tides[i];
  return null;
}
/* "09:52 3.4, 22:14 3.08" -- the height is optional and comes after the time.
   Commas separate the turns; a space separates a turn from its height. */
function parseTideList(str){
  var times=[], heights=[];
  String(str||"").split(",").forEach(function(part){
    var bits=part.trim().split(/\s+/).filter(Boolean);
    if(!bits.length) return;
    if(!/^\d{1,2}:\d{2}$/.test(bits[0])) return;
    var p=bits[0].split(":");
    times.push(String(+p[0]).padStart(2,"0")+":"+p[1]);
    var h=bits[1]!=null ? parseFloat(String(bits[1]).replace("m","")) : NaN;
    heights.push(isFinite(h)?String(h):"");
  });
  return {times:times,heights:heights};
}
function parseTimes(str){ return parseTideList(str).times; }
/* The other way round, for the box: "09:52 3.4, 22:14 3.08". */
function tideListText(times,heights){
  return (times||[]).map(function(t,i){
    var h=(heights||[])[i];
    return t+(h?(" "+h):"");
  }).join(", ");
}
/* A high tide at 3.08 m is a different day's surf from one at 2.1, so the
   height goes next to the time wherever the table has it. */
function tideChips(host,t){
  /* in the order the day runs them, not highs then lows: the school reads this
     forwards from now */
  tidePoints(t).forEach(function(p){
    host.appendChild(el("span","chip "+(p.high?"pink":"neutral"),
      (p.high?"High ":"Low ")+p.t+(isFinite(p.h)?("  "+p.h+" m"):"")));
  });
}

function tideForm(dateStr){
  var t=tideFor(dateStr)||{date:dateStr,highs:[],lows:[]};
  var b=el("div");
  b.appendChild(el("p","hint",

    "commas, with the height in metres after each one: 09:52 3.4, 22:14 3.08. "+
    "The height is what sizes the curve on the board, so it is worth typing."));
  var hi=input("text",tideListText(t.highs,(t.heights||{}).high),
    {placeholder:"09:52 3.4, 22:14 3.08"});
  var lo=input("text",tideListText(t.lows,(t.heights||{}).low),
    {placeholder:"03:40 0.2, 16:08 -0.1"});
  b.appendChild(field("High tide",hi));
  b.appendChild(field("Low tide",lo));
  openModal("Tides",b,[
    {label:"Cancel",on:closeModal},
    {label:"Save",cls:"primary",on:function(){
      var rec=tideFor(dateStr);
      if(!rec){ rec={date:dateStr}; DB.tides.push(rec); }
      var H=parseTideList(hi.value), L=parseTideList(lo.value);
      rec.highs=H.times; rec.lows=L.times;
      rec.heights={high:H.heights,low:L.heights};
      save(); closeModal(); render(); toast("Tides saved");
    }}
  ]);
}

/* ============================ board ============================
   The timeline: rows are activity calendars or instructors, columns are hours,
   and a session is a block you can drag onto another row or another time. */
var boardDate=todayISO(), boardGroup="category";
/* Their scheduler shows a week at a time, each day with its own axis and its
   own tide, stacked. One day is the exception, not the default. */
var boardSpan=7, boardTab="activities";
var BOARD_FROM=6, BOARD_TO=20;
function minsOf(hhmmStr){
  var p=String(hhmmStr||"09:00").split(":");
  return (+p[0])*60+(+p[1]||0);
}
function toHHMM(mins){
  mins=Math.max(0,Math.min(24*60-1,Math.round(mins)));
  return String(Math.floor(mins/60)).padStart(2,"0")+":"+String(mins%60).padStart(2,"0");
}
/* their durations arrive as "01:30:00" */
function hhmmMins(str){
  if(!str) return 0;
  var p=String(str).split(":");
  return (+p[0]||0)*60+(+p[1]||0);
}
/* How long a session runs, in their order of authority: the activity calendar
   says how long one of its sessions is, and that is where Bloowatch takes it
   from. A product whose name states the hours -- "2 HOUR FOIL TOW", "SUP
   LESSON 1.5 HOUR" -- is more specific than the calendar it runs on, and this
   reads that too. Theirs does not: their calendar is the only source, which is
   why a two-hour tow opens as an hour and a half over there. */
function kindMins(label){
  var k=(cfg().kinds||[]).filter(function(x){return x.l===label;})[0];
  return (k&&Number(k.mins))||0;
}
function namedMins(name){
  var s=String(name||"").toUpperCase();
  var m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:-|\s)?\s*HOURS?\b/);
  if(m) return Math.round(parseFloat(m[1].replace(",","."))*60);
  m=s.match(/(\d+)\s*(?:MIN|MINUTES?)\b/);
  if(m) return parseInt(m[1],10);
  return 0;
}
function productMins(p){
  if(!p) return 0;
  return namedMins(p.name) || kindMins(p.category||"");
}
function boardRows(){
  if(boardGroup==="staff"){
    /* unassigned sits at the top: it is the pile you are trying to clear */
    var rows=[{key:"",label:"Unassigned",color:""}];
    /* A crew member taken off the planning keeps a lane only while something
       of theirs is still on it -- otherwise the board fills with people the
       school has already parked. */
    return rows.concat(DB.staff.filter(function(x){
        return x.onPlanning!==false ||
          DB.sessions.some(function(se){return staffIdsOf(se).indexOf(x.id)>=0;});
      }).sort(crewOrder)
      .map(function(x){return {key:x.id,label:x.name,color:""};}));
  }
  var seen={},out=[];
  (cfg().kinds||[]).forEach(function(k){
    if(seen[k.l]) return; seen[k.l]=1;
    out.push({key:k.l,label:k.l,color:k.color||""});
  });
  out.push({key:"",label:"No calendar",color:""});
  return out;
}
function sessionInRow(x,row){
  if(boardGroup==="staff"){
    var ids=staffIdsOf(x);
    return row.key ? ids.indexOf(row.key)>=0 : ids.length===0;
  }
  return (x.category||"")===row.key;
}
/* what their row menu offers against a booking */

/* Who is on the water that day and not yet in a session.

/* ============================ the client list ============================
   Their people panel is not a list of names, it is a list of *slots*. Open a
   client and you get the product, then one row per session it bought:

       3X SURF LESSON COURSE 2024
         P1 nahum c   30/08  -  1/3
         P1 nahum c   31/08  -  2/3
         P1 nahum c   01/09  -  3/3

   Each of those is dragged onto a session on its own. One draggable per person
   is what a single lesson needs; a three-lesson course needs three, or it can
   only ever be scheduled once -- which is what was going wrong.

   Hires are not here. A board is not something a person attends, and it lives
   on the Rental tab with its return time. */
function isActivityProduct(p){
  if(!p) return false;
  return p.ptype!=="rental" && !p.gearId && p.kind!=="rental";
}
function activityLines(bk){
  return (bk.lines||[]).filter(function(l){
    return isActivityProduct(product(l.productId));});
}
/* The people a booking puts on the water: whoever is named, or the client who
   made it when nobody is. */
function bookingSeats(bk){
  var named=(bk.participants||[]).filter(function(pp){return pp.pid;});
  if(named.length){
    return named.map(function(pp,i){
      return {ref:seatRef("participant",bk.id,pp.pid),
              name:pp.name||("P"+(i+1)),
              clientId:pp.clientId||"",level:pp.level,wetsuit:pp.wetsuit};
    });
  }
  if(!bk.clientId) return [];
  return [{ref:seatRef("client",bk.clientId),name:clientName(bk.clientId),
           clientId:bk.clientId}];
}
/* Bloowatch hangs people off the line, not off the order: oria group put four
   names on the three-lesson course, a fifth on a single lesson and left the
   photo shoot to "P1 oria group". Seating them all on every line would put
   Ofek in a course he never bought. */
function lineSeats(bk,line){
  var pids=(line&&line.pids)||[];
  if(pids.length){
    var byPid={};
    (bk.participants||[]).forEach(function(pp){ byPid[pp.pid]=pp; });
    var out=[];
    pids.forEach(function(pid,i){
      var pp=byPid[pid];
      if(!pp) return;
      out.push({ref:seatRef("participant",bk.id,pid),
                name:pp.name||("P"+(i+1)),
                clientId:pp.clientId||"",level:pp.level,wetsuit:pp.wetsuit});
    });
    if(out.length) return out;
  }
  return bookingSeats(bk);
}
/* A foil tow is not a surf lesson. A slot belongs to the product it was sold
   on, and that product names the activity calendar it runs under, so it only
   drops on a session running that same activity. Either side may leave the
   calendar unsaid -- a product without one, a session put in the diary before
   it was decided -- and an unsaid activity is not a mismatch, so it goes
   anywhere rather than nowhere. */
function lineActivity(line){
  var p=line&&product(line.productId);
  return (p&&p.category)||"";
}
function slotFitsSession(line,se){
  var want=lineActivity(line), got=(se&&se.category)||"";
  if(!want||!got) return true;
  return got===want;
}
/* The same rule from the other direction: the participants list seats a person,
   not a slot, so ask what that person still owes. Somebody with nothing booked
   is a walk-in and goes wherever they are put. */
function seatActivities(ref){
  var out=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    activityLines(bk).forEach(function(l){
      var a=lineActivity(l);
      if(!a || out.indexOf(a)>=0) return;
      lineSlots(bk,l).forEach(function(s){
        if(s.ref===ref && !s.session && out.indexOf(a)<0) out.push(a);
      });
    });
  });
  return out;
}
function seatFitsSession(ref,se){
  var owed=seatActivities(ref), got=(se&&se.category)||"";
  if(!owed.length || !got) return true;
  return owed.indexOf(got)>=0;
}
function clearFitMarks(){
  [].forEach.call(document.querySelectorAll("[data-session-id]"),function(n){
    n.style.outline=""; n.style.opacity="";
  });
}
/* Where this session sits in one person's course: their second of three. The
   session remembers the lines it was filled from, so the answer is found by
   asking each of those lines where this session falls for that seat. */
function seatPlaceInSession(se,ref){
  var out=null;
  (se.fromLines||[]).forEach(function(lid){
    if(out) return;
    DB.bookings.forEach(function(bk){
      if(out) return;
      (bk.lines||[]).forEach(function(l){
        if(out || l.lid!==lid) return;
        var got=sessionsForSeat(l,ref).map(function(x){return x.id;});
        var i=got.indexOf(se.id);
        if(i>=0) out={idx:i+1,of:sessionsEach(l),line:l,booking:bk};
      });
    });
  });
  return out;
}
/* Which sessions a seat already sits in for one line, oldest first. The n-th
   is that seat's n-th of the course. */
function sessionsForSeat(line,ref){
  return DB.sessions.filter(function(se){
    return (se.fromLines||[]).indexOf(line.lid)>=0 &&
           se.participants.indexOf(ref)>=0;
  }).sort(function(a,b){return (a.date+a.time)<(b.date+b.time)?-1:1;});
}
/* Their order is by lesson, not by person: everyone's 1/3 first, then
   everyone's 2/3. That is how a school books a group -- the four of them go in
   the water together on Tuesday -- so the four rows you drag together sit
   together. */
/* sessionsOwed is what the school owes on the whole line -- four people on a
   three-lesson course is twelve lessons, and that is the number the till cares
   about. The panel counts per head, and a head always attends the course the
   product describes: oria's four rows read 1/3, not 1/12, and one person on a
   ten-lesson course still reads 1/10 however many other seats are on the line. */
function sessionsEach(line){
  var pr=product(line.productId);
  if(!pr) return 1;
  if(pr.sessionsAtBooking) return Math.max(1,Number(line.sessions)||1);
  return Math.max(1,Number(pr.sessions)||1);
}
function lineSlots(bk,line){
  var seats=lineSeats(bk,line);
  var owed=sessionsEach(line);
  var got={};
  seats.forEach(function(s){ got[s.ref]=sessionsForSeat(line,s.ref); });
  var out=[];
  for(var i=0;i<owed;i++){
    seats.forEach(function(seat){
      out.push({booking:bk,line:line,seat:seat,ref:seat.ref,
                idx:i+1,of:owed,session:got[seat.ref][i]||null});
    });
  }
  return out;
}
/* The time already in the water on this line, which their product row carries
   as "12h00 done". Only sessions that have actually happened count. */
function lineDone(bk,line){
  var mins=0, seen={};
  lineSlots(bk,line).forEach(function(s){
    if(!s.session) return;
    var k=s.session.id+"|"+s.ref;
    if(seen[k]) return; seen[k]=1;
    mins+=Math.max(0,Number(s.session.duration)||0);
  });
  return mins;
}
/* Every booking with an activity on it, newest first, with its slots. */
function assignmentRows(){
  var out=[];
  DB.bookings.forEach(function(bk){
    if(bk.status==="cancelled") return;
    var lines=activityLines(bk);
    if(!lines.length) return;
    var groups=lines.map(function(l){
      return {booking:bk,line:l,product:product(l.productId),slots:lineSlots(bk,l)};
    });
    var slots=groups.reduce(function(a,g){return a.concat(g.slots);},[]);
    var open=slots.filter(function(s){return !s.session;}).length;
    /* the headcount their row shows is the biggest line's, not the sum: a camp
       of thirty that also bought one photo shoot is a booking for thirty */
    var pax=lines.reduce(function(a,l){
      return Math.max(a,lineSeats(bk,l).length);},0);
    out.push({booking:bk,groups:groups,slots:slots,open:open,
      pax:pax,
      colours:groups.map(function(g){
        return g.product?posTileColour(g.product):"var(--text-3)";})
        .filter(function(c,i,a){return a.indexOf(c)===i;})});
  });
  return out.sort(function(a,b){
    /* anything still to place first, then most recent */
    if((b.open>0)-(a.open>0)) return (b.open>0)-(a.open>0);
    return a.booking.date<b.booking.date?1:-1;
  });
}

/* One card per client, not one per booking. moshe levy who bought a foil tow
   on Monday and two lessons on Tuesday is one person on this panel, with
   everything he bought inside his card under its own product heading -- not
   his name three times down the rail. A booking with no client on it keeps a
   card of its own, since there is nobody to gather it under. */
function clientCards(){
  var byKey={}, out=[];
  assignmentRows().forEach(function(r){
    var key=r.booking.clientId||("bk:"+r.booking.id);
    var card=byKey[key];
    if(!card){
      card=byKey[key]={key:key,clientId:r.booking.clientId||"",bookings:[],
        groups:[],slots:[],open:0,pax:0,colours:[],date:""};
      out.push(card);
    }
    card.bookings.push(r.booking);
    card.groups=card.groups.concat(r.groups);
    card.slots=card.slots.concat(r.slots);
    card.open+=r.open;
    card.pax=Math.max(card.pax,r.pax);
    r.colours.forEach(function(c){
      if(card.colours.indexOf(c)<0) card.colours.push(c);});
    if(r.booking.date>card.date) card.date=r.booking.date;
  });
  out.forEach(function(card){
    /* newest purchase first inside the card, as the rail is ordered outside it */
    card.groups.sort(function(a,b){
      return a.booking.date===b.booking.date ? 0
           : (a.booking.date<b.booking.date?1:-1);});
  });
  return out.sort(function(a,b){
    if((b.open>0)-(a.open>0)) return (b.open>0)-(a.open>0);
    return a.date<b.date?1:-1;
  });
}

/* what their ⋮ offers against a session, wherever the session is shown */
function sessionRowMenu(x){

function sessionPop(anchor,se){

  /* the instructor, changed here rather than in the form */

  var who=select([{v:"",l:pool.length?"Unassigned"
      :("Nobody set up for "+(se.category||"this"))}].concat(pool.sort(crewOrder)
    .map(function(x){return {v:x.id,l:x.name};})),staffIdsOf(se)[0]||"");

  document.body.appendChild(p);
  var r=anchor.getBoundingClientRect();
  var w=p.offsetWidth, h=p.offsetHeight;
  var left=Math.max(8,Math.min(window.innerWidth-w-8,r.left));
  var top=r.bottom+6;
  if(top+h>window.innerHeight-8) top=Math.max(8,r.top-h-6);
  p.style.left=left+"px";
  p.style.top=top+"px";
  sessPop=p;
}

/* One session of one person's course: ticked when it has a session, showing
   the date it landed on, and draggable onto the board when it has not. */
function slotRow(s){
  var row=el("div","cl-slot"+(s.session?" on":""));
  row.style.borderLeftColor=s.line&&product(s.line.productId)
    ? posTileColour(product(s.line.productId)) : "var(--text-3)";
  /* a box that fills when the slot is placed, the way theirs does */
  var tick=el("span","tick"+(s.session?" on":""));
  tick.textContent=s.session?"✓":"";
  row.appendChild(tick);
  /* The name is shown as it is stored. Bloowatch writes "P1 nahum c" itself
     when nobody typed a name, so prefixing our own P1 would say it twice. */
  var nm=el("span","who",s.seat.name);
  row.appendChild(nm);
  row.appendChild(el("span","when",s.session?dmy(s.session.date):"—"));
  row.appendChild(el("span","idx",s.idx+"/"+s.of));

  if(s.session){
    row.title=s.session.title+" · "+s.session.time+
      (staffIdsOf(s.session).length?(" · "+instructorNames(s.session)):"");
    var off=el("button","cl-x","×");
    off.type="button";
    off.title="Take them out of this session";
    off.addEventListener("click",function(ev){
      ev.stopPropagation();
      var se=s.session;
      se.participants=se.participants.filter(function(x){return x!==s.ref;});
      save(); renderBoard(); toast("Unassigned");
    });
    row.appendChild(off);
    return row;
  }

  /* not placed yet: drag it onto a session */
  row.dataset.seatRef=s.ref;
  row.style.cursor="grab";
  row.style.touchAction="none";
  var ghost=null,moved=false;
  row.addEventListener("pointerdown",function(e){
    if(e.button && e.button!==0) return;
    e.preventDefault();
    moved=false;
    row.setPointerCapture(e.pointerId);
    row.style.opacity=".45";
    ghost=el("div",null,s.seat.name+"  "+s.idx+"/"+s.of);
    ghost.style.cssText="position:fixed;z-index:80;pointer-events:none;"+
      "background:var(--accent);color:var(--accent-ink);padding:6px 11px;"+
      "border-radius:8px;font-size:12.5px;font-weight:600;"+
      "box-shadow:0 8px 22px rgba(0,0,0,.35);left:"+(e.clientX+12)+"px;top:"+
      (e.clientY-14)+"px";
    document.body.appendChild(ghost);
  });
  row.addEventListener("pointermove",function(e){
    if(!ghost) return;
    moved=true;
    ghost.style.left=(e.clientX+12)+"px";
    ghost.style.top=(e.clientY-14)+"px";
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var blk=under&&under.closest?under.closest("[data-session-id]"):null;
    /* while it is in the air, every session says whether it would take it:
       the ones running this activity go solid, the rest go dashed and red */
    [].forEach.call(document.querySelectorAll("[data-session-id]"),function(n){
      var t=by(n.dataset.sessionId,DB.sessions);
      n.style.outline = (t && !slotFitsSession(s.line,t))
        ? "1px dashed var(--crit)" : "";
      n.style.opacity = (t && !slotFitsSession(s.line,t)) ? ".45" : "";
    });
    if(blk){
      var over=by(blk.dataset.sessionId,DB.sessions);
      blk.style.outline = (over && !slotFitsSession(s.line,over))
        ? "2px dashed var(--crit)" : "2px solid var(--text)";
    }
  });
  function drop(e){
    if(!ghost) return;
    ghost.remove(); ghost=null;
    row.style.opacity="";
    clearFitMarks();
    if(!moved) return;
    var under=document.elementFromPoint(e.clientX,e.clientY);
    var blk=under&&under.closest?under.closest("[data-session-id]"):null;
    if(!blk) return;
    var se=by(blk.dataset.sessionId,DB.sessions);
    if(!se) return;
    if(!slotFitsSession(s.line,se)){
      toast(lineActivity(s.line)+" only goes in a "+lineActivity(s.line)+
            " session"+(se.category?(" -- that one is "+se.category+"."):"."));
      return;
    }
    if(se.participants.indexOf(s.ref)>=0){
      toast(s.seat.name+" is already in that session.");
      return;
    }
    if(se.participants.length>=se.capacity){
      toast("That session is full ("+se.capacity+").");
      return;
    }
    se.participants.push(s.ref);
    se.fromLines=se.fromLines||[];
    if(se.fromLines.indexOf(s.line.lid)<0) se.fromLines.push(s.line.lid);
    save(); renderBoard();
    toast(s.seat.name+" → "+se.title+" "+se.time);
  }
  row.addEventListener("pointerup",drop);
  row.addEventListener("pointercancel",function(){
    if(ghost){ ghost.remove(); ghost=null; row.style.opacity=""; }
    clearFitMarks();
  });
  return row;
}


function laneRows(dayISO){
  /* One row per group, then split into lanes so overlapping sessions never sit
     on top of each other -- which is why SURF PACK shows six times on theirs. */
  var out=[];
  boardRows().forEach(function(row){
    var items=DB.sessions.filter(function(x){
      return x.date===(dayISO||boardDate) && sessionInRow(x,row);})
      .sort(function(a,b){return a.time<b.time?-1:1;});
    if(!items.length){
      out.push({row:row,lane:0,items:[],first:true});
      return;
    }
    /* Two different answers, because their two views ask different questions.
       Grouped by activity, a lane is a session: SURF PACK shows six times on a
       busy Friday because six of them ran, each with its own instructor and
       headcount, and packing them onto one line would hide exactly that.
       Grouped by staff, a lane is a person -- their whole day on one line --
       and a second line only appears when they are double-booked. */
    if(boardGroup!=="staff"){
      items.forEach(function(x,i){ out.push({row:row,lane:i,items:[x],first:i===0}); });
      return;
    }
    var lanes=[];
    items.forEach(function(x){
      var st=minsOf(x.time), en=st+Math.max(15,x.duration||60);
      var placed=false;
      for(var i=0;i<lanes.length;i++){
        var clash=lanes[i].some(function(y){
          var ys=minsOf(y.time), ye=ys+Math.max(15,y.duration||60);
          return st<ye && ys<en;
        });
        if(!clash){ lanes[i].push(x); placed=true; break; }
      }
      if(!placed) lanes.push([x]);
    });
    lanes.forEach(function(l,i){ out.push({row:row,lane:i,items:l,first:i===0}); });
  });
  return out;
}
/* One day's highs and lows in the order they happen, heights parsed. */
function tidePoints(tide){
  if(!tide) return [];
  var hh=(tide.heights&&tide.heights.high)||[],
      lh=(tide.heights&&tide.heights.low)||[];
  var pts=[];
  (tide.highs||[]).forEach(function(t,i){
    pts.push({m:minsOf(t),t:t,high:true,h:parseFloat(hh[i])});});
  (tide.lows||[]).forEach(function(t,i){
    pts.push({m:minsOf(t),t:t,high:false,h:parseFloat(lh[i])});});
  return pts.sort(function(a,b){return a.m-b.m;});
}
/* The tide across the day, drawn to the heights rather than to a fixed wave: a
   3.4 m high stands well above a 2.1 m one, which is the whole reason anyone
   looks. Each turn is labelled with its time and height, because "rising" on
   its own does not tell you whether the beach is there. */
function tideCurve(width,height,tide,nowMins){
  var NS="http://www.w3.org/2000/svg";
  var g=document.createElementNS(NS,"g");
  var pts=tidePoints(tide);
  if(!pts.length) return g;
  var TOP=13, BOT=height-26;
  var hs=pts.map(function(p){return p.h;})
            .filter(function(v){return isFinite(v);});
  var hi=hs.length?Math.max.apply(null,hs):1,
      lo=hs.length?Math.min.apply(null,hs):0;
  var pad=(hi-lo)*0.2 || 0.3;
  function Y(p){
    if(!isFinite(p.h)) return p.high?TOP:BOT;
    return BOT-((p.h-(lo-pad))/((hi+pad)-(lo-pad)))*(BOT-TOP);
  }
  var span=(BOARD_TO-BOARD_FROM)*60;
  function X(m){ return ((m-BOARD_FROM*60)/span)*width; }

  /* the run in and the run out: the curve carries on past both edges, because
     a 05:35 high still explains what 06:00 looks like */
  var xy=pts.map(function(p){return {x:X(p.m),y:Y(p),p:p};});
  var first=xy[0], last=xy[xy.length-1];
  var lead={x:first.x-150,y:first.p.high?BOT:TOP},
      tail={x:last.x+150,y:last.p.high?BOT:TOP};
  var all=[lead].concat(xy,[tail]);
  var d="M "+all[0].x+" "+all[0].y+" ";
  for(var i=1;i<all.length;i++){
    var a=all[i-1], b=all[i], mx=(a.x+b.x)/2;
    d+="C "+mx+" "+a.y+" "+mx+" "+b.y+" "+b.x+" "+b.y+" ";
  }
  var area=document.createElementNS(NS,"path");
  area.setAttribute("d",d+"L "+tail.x+" "+height+" L "+lead.x+" "+height+" Z");
  area.setAttribute("fill","var(--accent)");
  area.setAttribute("opacity",".13");
  g.appendChild(area);
  var path=document.createElementNS(NS,"path");
  path.setAttribute("d",d);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","var(--accent-hot)");
  path.setAttribute("stroke-width","1.7");
  path.setAttribute("opacity",".85");
  g.appendChild(path);

  xy.forEach(function(q){
    if(q.x<-6||q.x>width+6) return;
    var dot=document.createElementNS(NS,"circle");
    dot.setAttribute("cx",q.x); dot.setAttribute("cy",q.y); dot.setAttribute("r","2.6");
    dot.setAttribute("fill","var(--accent-hot)");
    g.appendChild(dot);
    var lab=document.createElementNS(NS,"text");
    lab.setAttribute("x",Math.min(width-34,Math.max(34,q.x)));
    lab.setAttribute("y",q.p.high?Math.max(9,q.y-7):Math.min(BOT+11,q.y+12));
    lab.setAttribute("text-anchor","middle");
    lab.setAttribute("font-size","9.5");
    lab.setAttribute("font-weight","600");
    lab.setAttribute("font-family","IBM Plex Mono, monospace");
    lab.setAttribute("fill","var(--text-2)");
    lab.textContent=(q.p.high?"▲ ":"▼ ")+q.p.t+
      (isFinite(q.p.h)?("  "+q.p.h.toFixed(1)+"m"):"");
    g.appendChild(lab);
  });

  if(nowMins!=null && nowMins>=BOARD_FROM*60 && nowMins<=BOARD_TO*60){
    var nx=X(nowMins);
    var now=document.createElementNS(NS,"line");
    now.setAttribute("x1",nx); now.setAttribute("x2",nx);
    now.setAttribute("y1","0"); now.setAttribute("y2",height);
    now.setAttribute("stroke","var(--accent-hot)");
    now.setAttribute("stroke-width","1");
    now.setAttribute("opacity",".55");
    g.appendChild(now);
  }
  return g;
}

    stack.appendChild(boardDay(day));

  wrap.appendChild(stack);
  shell.appendChild(wrap);
  shell.appendChild(assignRail(boardDate));

  if(!any) host.appendChild(el("div","note",
    boardSpan>1 ? ("Nothing scheduled between "+dm(boardDate)+" and "+
                   dm(addDays(boardDate,boardSpan-1))+".")
                : ("Nothing scheduled on "+dm(boardDate)+".")));

/* ===================== the day on a phone =====================
   A fourteen-hour grid on a four-inch screen is a grid nobody reads. The same
   day as a list is not a lesser version of it -- at the counter you want to
   see the shape of the day; on the beach you want to know what is next, who
   is in it and who is taking it. */
function narrow(){
  try{ return matchMedia("(max-width: 820px)").matches; }catch(e){ return false; }
}
/* The board is the board on every screen. The list is a second way of reading
   the same day -- useful on the beach with one hand -- so it is a choice that
   is remembered, not something a screen width decides for you. */
var boardLayout=(function(){
  try{ return localStorage.getItem("shokogi.boardLayout")==="list"?"list":"grid"; }
  catch(e){ return "grid"; }
})();
function setBoardLayout(v){
  boardLayout=v;
  try{ localStorage.setItem("shokogi.boardLayout",v); }catch(e){}
  renderBoard();
}
