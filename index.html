<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shokogi</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <span class="logo">Shokogi</span>
      <nav>
        <a href="#booking">הזמנה</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h1>Shokogi</h1>
        <p>הזמינו את הפעילות שלכם עכשיו</p>
        <a href="#booking" class="cta">להזמנה</a>
      </div>
    </section>

    <section id="booking" class="booking-section">
      <div class="container">
        <h2>הזמנת פעילות</h2>
        <div id="bloowatch-iframe">
          <iframe class="responsive-iframe" src="https://shokogi.bloowatch.com/booking"></iframe>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Shokogi</p>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
