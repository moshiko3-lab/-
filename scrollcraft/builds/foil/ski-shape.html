<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'Barlow Condensed';src:url('../shokogi-scrollcraft/fonts/BarlowCondensed-700.woff2') format('woff2');font-weight:700}
body{margin:0;background:#dcebec}
.scene{width:720px;height:360px;margin:30px auto;background:linear-gradient(180deg,#eef5f5 0%,#dcebec 60%,#c7dedf 100%);position:relative;overflow:hidden;border:1px solid #ccc}
svg{position:absolute;inset:0}
</style></head><body>
<div class="scene">
<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <!-- waterline -->

  <g transform="translate(360,236)">

             C560 217,610 226,650 236
             C690 246,700 252,690 258

             C560 217,610 226,650 236
             C620 224,560 218,500 216
             L380 216
             C345 217,318 212,300 214 Z" fill="#32494d"/>

    <path d="M96 214 C150 208,280 207,360 209 L360 214 C280 212,150 213,100 220 C92 217,92 215,96 214 Z" fill="#3c565a"/>

    <path d="M150 216

             L292 196
             C306 196,312 202,312 214

             L190 209

      <path d="M276 172 C292 172,312 180,322 190 L316 198 C306 190,290 184,274 184 Z"/>

    <!-- head + helmet -->
    <circle cx="292" cy="156" r="13" fill="#0d1312"/>
    <path d="M280 154 a12 12 0 0 1 24 0 Z" fill="#f46e95"/>

    <!-- CONSOLE + HANDLEBAR -->
    <path d="M312 196 C326 196,336 204,340 216 L316 216 C312 206,312 200,312 196 Z" fill="#1b2726"/>

    <!-- rear exhaust / grab handle -->
    <rect x="64" y="222" width="20" height="7" rx="3" fill="#0d1312"/>

    <!-- badge -->
    <text x="180" y="236" font-family="'Barlow Condensed',sans-serif" font-weight="700" font-size="20" letter-spacing="1.5" fill="#eaf3f3">GTX 300</text>
    </g>
  </g>
</svg>
</div>
</body></html>
