<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:'Barlow Condensed';src:url('../shokogi-scrollcraft/fonts/BarlowCondensed-700.woff2') format('woff2');font-weight:700}
@font-face{font-family:'Figtree';src:url('../shokogi-scrollcraft/fonts/Figtree-400.woff2') format('woff2');font-weight:400}
@font-face{font-family:'Figtree';src:url('../shokogi-scrollcraft/fonts/Figtree-700.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:'Figtree',sans-serif;color:#191a1a}
.stage-wrap{max-width:1040px;margin:0 auto;padding:24px 20px 40px}
.kicker{text-align:center;font-weight:700;color:#f46e95;font-size:12px;letter-spacing:.26em;text-transform:uppercase;margin:4px 0 6px}
h2{font-family:'Barlow Condensed';font-weight:700;font-size:clamp(28px,4vw,42px);text-align:center;margin:0 0 4px;letter-spacing:-.01em}
.sub{text-align:center;color:#7c7b77;font-size:15px;margin:0 auto 10px;max-width:520px}
/* stage */
.stage{position:relative;width:100%;aspect-ratio:1040/660;margin:0 auto;
  background:radial-gradient(60% 55% at 50% 46%,#ffffff 0%,#fbfafa 55%,#f4f2ef 100%)}
.stage:before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:62%;height:16%;border-radius:50%;bottom:auto;
  background:radial-gradient(50% 50% at 50% 50%,rgba(244,110,149,.12),rgba(244,110,149,0) 70%);
  top:62%}
.piece{position:absolute;transform-origin:center;will-change:transform,opacity;opacity:0}
.piece img{width:100%;height:auto;display:block;filter:drop-shadow(0 16px 18px rgba(20,30,34,.16))}
/* final resting spots (centered via translate -50%,-50%) */
.ski  {left:50%;top:50%;width:54%}
.rope {left:24%;top:22%;width:30%}
.arch {left:80%;top:23%;width:13%}
.pylon{left:25%;top:78%;width:14%}
.board{left:75%;top:79%;width:22%}
/* fly-in: from an outward offset + small scale, to resting spot */
@keyframes flyin{from{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.55) rotate(var(--rot))}
  60%{opacity:1}
  to{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1) rotate(0deg)}}
@keyframes skiin{from{opacity:0;transform:translate(-50%,-50%) scale(.82)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.play .ski  {animation:skiin 1.2s cubic-bezier(.22,1,.32,1) .1s both}
.play .rope {--dx:-170px;--dy:-140px;--rot:-10deg;animation:flyin 1.3s cubic-bezier(.2,1.05,.3,1) .8s both}
.play .arch {--dx:180px;--dy:-130px;--rot:8deg;animation:flyin 1.3s cubic-bezier(.2,1.05,.3,1) 1.4s both}
.play .pylon{--dx:-160px;--dy:160px;--rot:-6deg;animation:flyin 1.3s cubic-bezier(.2,1.05,.3,1) 2.0s both}
.play .board{--dx:190px;--dy:160px;--rot:10deg;animation:flyin 1.3s cubic-bezier(.2,1.05,.3,1) 2.6s both}
/* gentle settle-float once assembled */
.settle .piece{animation:floaty 5s ease-in-out infinite}
.settle .rope{animation-delay:-1s}.settle .arch{animation-delay:-2s}
.settle .pylon{animation-delay:-3s}.settle .board{animation-delay:-4s}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%) translateY(0)}50%{transform:translate(-50%,-50%) translateY(-7px)}}
</style></head>
<body>
<div class="stage-wrap">
  <div class="kicker">the setup</div>
  <h2>Everything comes together</h2>
  <p class="sub">The full tow-in rig &mdash; ski, line, board, pylon and arch, dialed and ready.</p>
  <div class="stage" id="stage">
    <div class="piece ski"><img src="ski-cut.png" alt="Sea-Doo"></div>
    <div class="piece rope"><img src="rope-cut.png" alt="Armstrong rope"></div>
    <div class="piece arch"><img src="arch-cut.png" alt="JAIN arch"></div>
    <div class="piece pylon"><img src="pylon-cut.png" alt="BRP pylon"></div>
    <div class="piece board"><img src="board-cut.png" alt="JETTECH board"></div>
  </div>
</div>
<script>
  const s=document.getElementById('stage');
  s.classList.add('play');            // fly-in holds its final state (fill:both)
  window.__replay=()=>{ s.classList.remove('play'); void s.offsetWidth; s.classList.add('play'); };
</script>
</body></html>
